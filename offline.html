"春","parent":"time"},{"id":"summer","name":"夏","parent":"time"},{"id":"autumn","name":"秋","parent":"time"},{"id":"winter","name":"冬","parent":"time"},{"id":"night","name":"夜","parent":"time"},{"id":"lotusleaf","name":"荷叶","parent":"plants"}],"authors":{"wangwei":{"name":"王维","dynasty":"唐","life":"约701—761","bio":"字摩诘，唐代诗人、画家。曾任尚书右丞，后人称王右丞。他的山水诗善于从光色、声息与细微变化中写出幽静。晚年与终南山、辋川的生活联系密切，诗与画相互映照。"},"libai":{"name":"李白","dynasty":"唐","life":"701—762","bio":"字太白，号青莲居士。青年时期离蜀远游，一生行迹遍及多地，曾供奉翰林。他的诗想象丰沛，语言明快奔放，也有极为清澈、亲近人的短篇。"},"dufu":{"name":"杜甫","dynasty":"唐","life":"712—770","bio":"字子美。经历安史之乱及长期漂泊，诗中常关切普通人的生活。寓居成都时，留下许多描写草堂与四时景物的作品；沉重的忧思之外，也有细腻而真切的喜悦。"},"liuzongyuan":{"name":"柳宗元","dynasty":"唐","life":"773—819","bio":"字子厚，河东人。参与政治革新后被贬永州，后来任柳州刺史，是唐宋八大家之一。他的山水游记与诗歌常把幽微的感受寄托在具体景物中。"},"zhengxie":{"name":"郑燮","dynasty":"清","life":"1693—1765","bio":"字克柔，号板桥，清代书画家、诗人，扬州八怪之一。曾任县令，擅画兰、竹、石，常将诗、书、画结合，以寻常草木寄寓自身的性情。"},"sushi":{"name":"苏轼","dynasty":"宋","life":"1037—1101","bio":"字子瞻，号东坡居士，眉州眉山人。诗、词、文、书、画皆有成就。仕途屡经起落，曾谪居黄州、惠州、儋州；他的作品既有开阔的胸襟，也保留对亲友、日常风物的深情。"},"mayuan":{"name":"马致远","dynasty":"元","life":"约1250—约1321以后","bio":"号东篱，元代戏曲家、散曲家，生卒年存在不同说法。其散曲常写漂泊、人生感慨与归隐心绪。《天净沙·秋思》以极少文字构成鲜明的深秋画面。"},"zhaoshixiu":{"name":"赵师秀","dynasty":"宋","life":"1170—1219","bio":"字紫芝，号灵秀，又号天乐，南宋诗人，永嘉四灵之一。诗风清淡，善写日常小景；他常在细微动作和清幽景物中留下耐人寻味的情绪。"},"liuyuxi":{"name":"刘禹锡","dynasty":"唐","life":"772—842","bio":"字梦得，唐代文学家。曾参与永贞革新，之后长期辗转外任。诗文中常见鲜明的个性与自持的精神，也擅长向民歌汲取生动的语言。"},"yangwanli":{"name":"杨万里","dynasty":"宋","life":"1127—1206","bio":"字廷秀，号诚斋，南宋诗人。善于捕捉自然与日常生活中的细小变化，语言清新活泼，自成诚斋体。常见的雨、荷叶、儿童与行路风景，在他笔下都富有生趣。"},"taoyuanming":{"name":"陶渊明","dynasty":"东晋","life":"约365—427","bio":"一名潜，字元亮，东晋诗人。曾数次出仕，后来辞官归田，以耕读生活度日。他的作品关注田园、日常与人的本性，语言平淡自然，感受深厚。生年存在不同考证。"}},"topics":[{"id":"moonlight","name":"月色里的不同心事","subtitle":"一轮月，照见几种人生。","scene":"moon","works":["niaomingjian","jingyesi","shuidiaogetou","chengtian"],"tag":"moon"},{"id":"mountainlife","name":"把心放进山水里","subtitle":"循着水声，往幽静处走。","scene":"mountain","works":["shanju","shanzhong","zhuliguan","jiangxue"],"tag":"mountain"},{"id":"ordinary","name":"寻常日子，也有诗意","subtitle":"一场小雨，一朵初生的荷。","scene":"flower","works":["chunyu","xiaochi","yueke","yinhu"],"tag":"quiet"}],"works":[{"id":"guiyuan","title":"归园田居·其一","author":"taoyuanming","form":"五言古诗","stage":["高中"],"scene":"mountain","tags":["mountain","flower","quiet","hope","nature","pastoral","metaphor"],"lines":["少无适俗韵，","性本爱丘山。","误落尘网中，","一去三十年。","羁鸟恋旧林，","池鱼思故渊。","开荒南野际，","守拙归园田。","方宅十余亩，","草屋八九间。","榆柳荫后檐，","桃李罗堂前。","暧暧远人村，","依依墟里烟。","狗吠深巷中，","鸡鸣桑树颠。","户庭无尘杂，","虚室有余闲。","久在樊笼里，","复得返自然。"],"quote":[12,13,14,15],"intro":"人间的炊烟里，也有自在天地。","notes":[{"q":"适俗韵","text":"适应世俗的性情、气质。"},{"q":"羁鸟","text":"jī niǎo，被束缚、笼养的鸟。"},{"q":"守拙","text":"守住自己的朴拙本性，不随俗取巧。"},{"q":"暧暧","text":"ài ài，昏暗、模糊的样子。"},{"q":"依依","text":"轻柔缓慢地飘升的样子。"},{"q":"樊笼","text":"关鸟兽的笼子，诗中用来比喻受到束缚的生活。"}],"background":"一般认为写于陶渊明辞去彭泽令、归田之后。这是《归园田居》组诗的第一首。“一去三十年”存在“三十”与“十三”的版本讨论，此处采用常见的“三十年”文本，不用这一句直接推算任职年数。","reading":[{"quote":"羁鸟恋旧林，池鱼思故渊。","title":"用鸟与鱼说出归去的心愿","text":"被束缚的鸟、养在池中的鱼都思念旧日天地。比喻让人的归隐愿望有了具体形象。"},{"quote":"暧暧远人村，依依墟里烟。","title":"视线走远，生活仍在","text":"从近处的草屋、榆柳、桃李，望向远村和炊烟，再听见狗吠鸡鸣。田园的宁静里包含真实而平常的人间声息。"}],"thought":"诗人在田园中寻回与本性相合的生活。“自然”既可以指眼前天地，也包含不受扭曲、自在自持的人生态度。","sources":["陶渊明《归园田居五首》其一。","“一去三十年”另有异文，此处采用常见传诵文本。"],"related":[{"id":"shanju","reason":"都写安居的心意，王维的山中多了一场秋雨。"},{"id":"shanzhong","reason":"面对山居之问，李白会怎样回答。"}]},{"id":"niaomingjian","title":"鸟鸣涧","author":"wangwei","form":"五言绝句","stage":["小学"],"scene":"moon","tags":["moon","mountain","flower","quiet","nature","pastoral","motion","spring","night"],"lines":["人闲桂花落，","夜静春山空。","月出惊山鸟，","时鸣春涧中。"],"quote":[2,3],"intro":"听见山鸟，才知道夜有多静。","notes":[{"q":"人闲","text":"人的心境闲静。外界很轻微的变化，也能被留意到。"},{"q":"空","text":"这里写山中空寂、清幽的感觉，并非没有生命。"},{"q":"时鸣","text":"不时鸣叫。鸟声断续地穿过静夜。"}],"background":"《皇甫岳云溪杂题五首》中的一首。具体写作时间、地点有不同考证。诗的重心是一段春山夜景，不必先确定某个传说才能进入它。","reading":[{"quote":"人闲桂花落","title":"先有一颗安静的心","text":"开篇从“人闲”落笔。细微的落花进入感知，人的心境与山中的气息彼此相接。"},{"quote":"月出惊山鸟，时鸣春涧中。","title":"声音给寂静留下形状","text":"月亮升起、鸟被惊动，都是变化；断续的鸣叫让四周的幽静更可感。动与静并不冲突，而是相互显现。"}],"thought":"这首诗没有急于说明一种道理，而是邀请人放慢感知：在看似空寂的山中，仍有花落、月升与鸟鸣。","sources":["王维《皇甫岳云溪杂题五首》其一。","原文采用现代通行标点；赏读为本工具编写。"],"related":[{"id":"zhuliguan","reason":"同是王维的月夜，鸟声换成了琴声。"},{"id":"jingyesi","reason":"同一轮月，也会牵动对故乡的思念。"},{"id":"chengtian","reason":"沿着夜色，去看苏轼庭院里的竹柏影。"}]},{"id":"jingyesi","title":"静夜思","author":"libai","form":"五言绝句","stage":["小学"],"scene":"moon","tags":["moon","homesick","night","metaphor"],"lines":["床前明月光，","疑是地上霜。","举头望明月，","低头思故乡。"],"quote":[2,3],"intro":"抬头的一瞬，远方也来到眼前。","notes":[{"q":"疑","text":"以为、仿佛觉得。写初见清冷月色时的感觉。"},{"q":"霜","text":"月光令人联想到白霜，是比喻中的景象，并非说地上真的结霜。"},{"q":"故乡","text":"自己的家乡。诗没有写具体地名，反而使这种思念更容易被不同的人感受。"}],"background":"这首诗历来有不同文本传承，本篇采用“床前明月光”“举头望明月”的通行版本。具体创作时地的说法不一，阅读可从眼前月光与思乡之情入手。","reading":[{"quote":"疑是地上霜","title":"把月光写得能触摸","text":"用熟悉的霜色去感觉月光，视觉中也仿佛带出一丝凉意。"},{"quote":"举头望明月，低头思故乡。","title":"两个动作，一次远行","text":"“举头”与“低头”极平常，目光却从眼前转向故乡。思念没有铺陈，已经落在动作之间。"}],"thought":"清冷的月色触动了思乡。诗用人人都可能有过的动作与感受，让短短四句容纳了遥远的牵念。","sources":["李白《静夜思》；采用现代常见传诵本。","早期传本存在异文；本样例不作版本优劣判断。"],"related":[{"id":"shuidiaogetou","reason":"从思乡的月，读到祝愿亲人平安的月。"},{"id":"tianjingsha","reason":"月夜之外，黄昏也会让远行的人想家。"}]},{"id":"shanju","title":"山居秋暝","author":"wangwei","form":"五言律诗","stage":["小学"],"scene":"mountain","tags":["mountain","water","moon","bamboo","quiet","nature","pastoral","motion","autumn"],"lines":["空山新雨后，","天气晚来秋。","明月松间照，","清泉石上流。","竹喧归浣女，","莲动下渔舟。","随意春芳歇，","王孙自可留。"],"quote":[2,3],"intro":"月色与泉声之间，也住着人间。","notes":[{"q":"暝","text":"míng，日暮、天色将晚。"},{"q":"浣女","text":"洗衣的女子。“浣”读 huàn。"},{"q":"随意","text":"任凭。春日花草即使凋谢，眼前秋景仍值得停留。"},{"q":"王孙","text":"本指贵族子弟，后来也用来称隐居者或游人；这里联系结尾的归隐意味理解。"}],"background":"这是一首描写山居秋日暮景的作品。具体作年没有定论。结句化用《楚辞·招隐士》中有关“王孙”归留的语意，写出对山中生活的留恋。","reading":[{"quote":"明月松间照，清泉石上流。","title":"两行里有光，也有声音","text":"明月与清泉、松间与石上相互对举。静静的照映与流动的水声，让画面清澈而有层次。"},{"quote":"竹喧归浣女，莲动下渔舟。","title":"先听见，再看见","text":"先写竹林的声响、莲叶的摇动，再写归来的浣女和穿行的渔舟。山中并非无人，生活正从景物后面显现。"}],"thought":"诗写山水的清幽，也写平常生活的生机。对这样的天地与人间，诗人自然生出“自可留”的愿望。","sources":["王维《山居秋暝》。","结句语意可参读《楚辞·招隐士》。"],"related":[{"id":"niaomingjian","reason":"再看王维如何写山中另一种静。"},{"id":"shanzhong","reason":"李白也在山里，回答一个关于归属的问题。"}]},{"id":"chunyu","title":"春夜喜雨","author":"dufu","form":"五言律诗","stage":["小学"],"scene":"rain","tags":["rain","wind","flower","joy","spring","night","personification"],"lines":["好雨知时节，","当春乃发生。","随风潜入夜，","润物细无声。","野径云俱黑，","江船火独明。","晓看红湿处，","花重锦官城。"],"quote":[2,3],"intro":"有些欢喜，轻得像一场夜雨。","notes":[{"q":"发生","text":"这里指春雨降临、催发生长的意味，不是现代口语中“发生事情”的用法。"},{"q":"潜","text":"qián，悄悄地。"},{"q":"花重","text":"“重”读 zhòng，花朵带着雨水，显得沉甸甸。"},{"q":"锦官城","text":"成都的别称。"}],"background":"一般系于杜甫寓居成都草堂时期。春雨与草木、农事和生活息息相关，诗中的“喜”从一开始的“好”字便流露出来。","reading":[{"quote":"好雨知时节","title":"雨仿佛也懂得体贴","text":"“知”把人的体察赋予春雨。这种拟人不是热闹的赞美，而是对雨来得正好的珍惜。"},{"quote":"晓看红湿处，花重锦官城。","title":"从今夜望向明晨","text":"眼前还在夜里，诗却已经想到雨后的满城春花。想象将喜悦悄悄延长到天亮。"}],"thought":"诗人的欣喜来自雨水对万物的滋养。爱自然的细腻感受，也与关心生活的心意相通。","sources":["杜甫《春夜喜雨》。"],"related":[{"id":"yueke","reason":"另一场夜雨里，有人在灯下等待朋友。"},{"id":"xiaochi","reason":"雨后往前走，去看一枝刚露尖角的荷。"}]},{"id":"jiangxue","title":"江雪","author":"liuzongyuan","form":"五言绝句","stage":["小学"],"scene":"snow","tags":["snow","mountain","water","solitude","resolve","winter","contrast"],"lines":["千山鸟飞绝，","万径人踪灭。","孤舟蓑笠翁，","独钓寒江雪。"],"quote":[2,3],"intro":"天地留白，一人一舟。","notes":[{"q":"绝","text":"没有、断绝。"},{"q":"人踪","text":"人的踪迹。"},{"q":"蓑笠","text":"suō lì，蓑衣与斗笠，旧时用来遮雨雪。"}],"background":"通常联系柳宗元贬居永州后的处境来理解，具体写作时间不宜断定。渔翁形象常被读出孤独与自持，但也可以先把它看作一幅极简的寒江雪景。","reading":[{"quote":"千山鸟飞绝，万径人踪灭。","title":"先把世界铺开，再让它安静","text":"“千”“万”将空间推远，“绝”“灭”又抹去了飞鸟与行人的踪迹。辽阔的画面由此显得格外寂静。"},{"quote":"孤舟蓑笠翁","title":"留白中出现一个人","text":"大面积的空寂之后，一人一舟显得异常清晰。“孤”与“独”把视线收拢，也留下了不肯被环境淹没的意味。"}],"thought":"广阔而清寒的环境中，一个独钓者仍然存在。孤寂、自持与人与天地的关系，都能从这幅画面中被读到。","sources":["柳宗元《江雪》。","贬谪身世与渔翁象征之间的联系属于常见阐释，并非诗中明言。"],"related":[{"id":"zhushi","reason":"从寒江中的独钓者，读到岩石间的竹。"},{"id":"zhuliguan","reason":"另一个独坐的人，身边有琴与月光。"}]},{"id":"zhushi","title":"竹石","author":"zhengxie","form":"七言绝句","stage":["小学"],"scene":"bamboo","tags":["bamboo","mountain","wind","resolve","object","personification","aspiration"],"lines":["咬定青山不放松，","立根原在破岩中。","千磨万击还坚劲，","任尔东西南北风。"],"quote":[2,3],"intro":"一株竹，也有自己的站立方式。","notes":[{"q":"破岩","text":"裂开的岩石、岩缝。"},{"q":"坚劲","text":"坚韧有力。“劲”读 jìng。"},{"q":"任尔","text":"任凭你。“尔”指你。"}],"background":"这是一首题画诗，与郑燮擅画竹石的创作相联系。诗中竹的形象和人的精神相映照，具体题画时间未在本样例中确定。","reading":[{"quote":"咬定青山不放松","title":"一个“咬”字，让竹有了意志","text":"写竹根抓住岩石，用上带有力度的动作。竹不只是被观看的植物，也显得有主动站稳的力量。"},{"quote":"任尔东西南北风","title":"让风从各个方向来","text":"风向被逐一展开，竹的坚韧便不止属于一次考验。托物言志的意味由具体形象生长出来。"}],"thought":"岩缝中的竹经历风吹磨击仍然坚韧，寄托着对有根、有所坚守的品格的欣赏。","sources":["郑燮《竹石》，题画诗。"],"related":[{"id":"loushiming","reason":"从一株竹的坚守，读到一个人如何安放自己的生活。"},{"id":"jiangxue","reason":"风雪中的另一个身影，也保持着自己的姿态。"}]},{"id":"yinhu","title":"饮湖上初晴后雨·其二","author":"sushi","form":"七言绝句","stage":["小学"],"scene":"water","tags":["water","mountain","rain","joy","nature","metaphor"],"lines":["水光潋滟晴方好，","山色空蒙雨亦奇。","欲把西湖比西子，","淡妆浓抹总相宜。"],"quote":[0,1],"intro":"晴有晴的明丽，雨有雨的空蒙。","notes":[{"q":"潋滟","text":"liàn yàn，水波荡漾、波光闪动的样子。"},{"q":"空蒙","text":"迷茫缥缈的样子；也有版本作“空濛”。"},{"q":"西子","text":"西施，古代著名美女。"},{"q":"相宜","text":"合适、相称。"}],"background":"写于苏轼在杭州任职时期，是同题组诗中的第二首。题目已经提示天气的转变：游湖时先晴后雨，两种景致都被留在诗中。","reading":[{"quote":"晴方好，雨亦奇","title":"让两种天气各有位置","text":"一“好”一“奇”，没有让晴雨相争，而是分别看见它们的美。"},{"quote":"淡妆浓抹总相宜","title":"一个比喻，容纳变化","text":"用西子的妆容比西湖的晴雨，以熟悉的人物美感写自然。重心落在“总”字：景物变化，自有各自的动人之处。"}],"thought":"诗人欣赏西湖在不同天气中的姿态，也表现出一种善于发现、乐于容纳变化的眼光。","sources":["苏轼《饮湖上初晴后雨二首》其二。","“空蒙”另有“空濛”等写法，此处采用常见简体写法。"],"related":[{"id":"chunyu","reason":"换一种雨，听杜甫写春夜的滋润。"},{"id":"shanju","reason":"雨停以后，山中又是怎样的景象。"}]},{"id":"shanzhong","title":"山中问答","author":"libai","form":"七言绝句","stage":[],"scene":"flower","tags":["mountain","water","flower","quiet","hope","nature","spring"],"lines":["问余何意栖碧山，","笑而不答心自闲。","桃花流水窅然去，","别有天地非人间。"],"quote":[2,3],"intro":"有些回答，交给流水与桃花。","notes":[{"q":"余","text":"我。"},{"q":"栖","text":"qī，居住、停留。"},{"q":"窅然","text":"yǎo rán，深远的样子。"}],"background":"又题《山中答俗人》。写作时地有不同说法，诗中以问答展开，但真正的回答落在山水画面里。","reading":[{"quote":"笑而不答心自闲","title":"一句没有说出口的话","text":"面对发问，诗人先写笑与闲适。情态本身已透露了对山居的喜爱。"},{"quote":"桃花流水窅然去","title":"让风景接着回答","text":"桃花随水远去，视线被引向深处。“别有天地”的感受从眼前景物生出，保留了想象空间。"}],"thought":"山居的快乐可以是一种难以用解释穷尽的亲身感受。诗以笑容和景色表达对自在生活的向往。","sources":["李白《山中问答》，另题《山中答俗人》。"],"related":[{"id":"shanju","reason":"王维也愿意留在山里，却写出了不同的人间气息。"},{"id":"zengwanglun","reason":"李白笔下的水，也能丈量朋友的情意。"}]},{"id":"zhuliguan","title":"竹里馆","author":"wangwei","form":"五言绝句","stage":["初中"],"scene":"bamboo","tags":["bamboo","moon","quiet","solitude","nature","pastoral","night"],"lines":["独坐幽篁里，","弹琴复长啸。","深林人不知，","明月来相照。"],"quote":[2,3],"intro":"无人知晓的时候，还有月光。","notes":[{"q":"幽篁","text":"yōu huáng，幽深的竹林。"},{"q":"长啸","text":"撮口发出清越悠长的声音，是古人抒发情怀的一种方式。"},{"q":"相照","text":"照着我，仿佛明月前来作伴。"}],"background":"《辋川集》中的一首，与王维的辋川生活相关。竹里馆是组诗所写景点之一。","reading":[{"quote":"弹琴复长啸","title":"独处也有自己的声息","text":"琴声和长啸并未破坏竹林的幽深，反而让独坐的人显得自在、有所寄托。"},{"quote":"明月来相照","title":"月光像一位安静的朋友","text":"“来”与“相照”给明月添了亲近感。无人知晓的独处，因月光而显得温柔。"}],"thought":"诗写独处，却未必等于寂寞难耐。与竹林、琴声和月色相处，也可以自得而充实。","sources":["王维《辋川集·竹里馆》。"],"related":[{"id":"niaomingjian","reason":"循着声音，再听王维山中的鸟鸣。"},{"id":"chengtian","reason":"另一处竹柏影中，还有一位可以相伴夜游的朋友。"}]},{"id":"zengwanglun","title":"赠汪伦","author":"libai","form":"七言绝句","stage":["小学"],"scene":"water","tags":["water","friendship","farewell","metaphor"],"lines":["李白乘舟将欲行，","忽闻岸上踏歌声。","桃花潭水深千尺，","不及汪伦送我情。"],"quote":[2,3],"intro":"舟要远去，歌声把情意留住。","notes":[{"q":"踏歌","text":"一边唱歌、一边用脚踏地打节拍的歌唱方式。"},{"q":"深千尺","text":"用夸张写潭水之深，进而衬出情谊更深。"},{"q":"桃花潭","text":"地名，在今安徽泾县。"}],"background":"写李白将离开时，汪伦以踏歌相送的情景。关于二人相识的故事有后世传说，此处以诗中能够确认的送别画面为主。","reading":[{"quote":"忽闻岸上踏歌声","title":"送别先从声音抵达","text":"“忽闻”写出意外与惊喜。尚未说明朋友深情，歌声已经来到舟边。"},{"quote":"不及汪伦送我情","title":"用看得见的深，写看不见的情","text":"潭水深浅可以想象，情谊却难测量。夸张与比较将抽象情意变得鲜明而可感。"}],"thought":"朴素的送别方式，因为真挚情谊而值得记住。诗用明快的语气写出了对朋友的珍惜。","sources":["李白《赠汪伦》。"],"related":[{"id":"yueke","reason":"朋友将至时，也有另一种静静等待的心情。"},{"id":"shuidiaogetou","reason":"不能相聚时，情意还能寄给一轮明月。"}]},{"id":"tianjingsha","title":"天净沙·秋思","author":"mayuan","form":"散曲·小令","stage":["初中"],"scene":"mountain","tags":["wind","water","homesick","solitude","travel","autumn"],"lines":["枯藤老树昏鸦，","小桥流水人家，","古道西风瘦马。","夕阳西下，","断肠人在天涯。"],"quote":[3,4],"intro":"一路风景，落在一个远行人的心上。","notes":[{"q":"天净沙","text":"曲牌名。“秋思”是题目。"},{"q":"昏鸦","text":"黄昏时归巢的乌鸦。"},{"q":"断肠","text":"形容极度悲伤。"}],"background":"这是一首元代散曲小令。具体写作时地难以确定，作品集中描绘深秋黄昏的羁旅景象。","reading":[{"quote":"枯藤老树昏鸦","title":"把景物一件件放到眼前","text":"前三句以密集的名词性意象并置，少用解释，却迅速构成可见可感的画面。"},{"quote":"小桥流水人家","title":"温暖的所在，照出漂泊","text":"“人家”带来安居的意味，与古道上的远行者相映，乡愁因此更加具体。"}],"thought":"深秋景色与漂泊心绪层层相接，最后才点出天涯之人。眼前世界看似由景物组成，处处却带着人的感受。","sources":["马致远《天净沙·秋思》。"],"related":[{"id":"jingyesi","reason":"黄昏的乡愁，到了月夜又有另一种表达。"},{"id":"shanju","reason":"同一个秋天，在山居者眼里却清澈可亲。"}]},{"id":"yueke","title":"约客","author":"zhaoshixiu","form":"七言绝句","stage":["初中"],"scene":"rain","tags":["rain","friendship","quiet","summer","night","motion"],"lines":["黄梅时节家家雨，","青草池塘处处蛙。","有约不来过夜半，","闲敲棋子落灯花。"],"quote":[2,3],"intro":"等一个人，连时间都有了声音。","notes":[{"q":"黄梅时节","text":"梅子成熟的初夏时节，江南常多雨。"},{"q":"灯花","text":"灯芯燃烧后结成的花状物。"},{"q":"闲敲","text":"随手、无意地敲着，也透露出等待中的心绪。"}],"background":"诗写雨夜约客未至的生活片刻。具体作年未详，阅读的线索就在雨声、蛙声与敲棋子的动作之中。","reading":[{"quote":"家家雨，处处蛙","title":"把等待放进一整个雨季","text":"重复的“家家”“处处”使雨声与蛙鸣遍布四周，读者也仿佛进入湿润的夜。"},{"quote":"闲敲棋子落灯花","title":"一个小动作，让心情显影","text":"诗没有直接说焦急或无聊，只写敲棋子。表面闲散的动作里，等待的漫长渐渐可感。"}],"thought":"雨夜等友，既有清幽的环境，也有客人迟迟未到的怅惘。细小的日常动作，足以容纳复杂心情。","sources":["赵师秀《约客》。"],"related":[{"id":"chunyu","reason":"同是夜雨，杜甫听见的是滋养万物的欢喜。"},{"id":"zengwanglun","reason":"等待之外，也看看朋友意外出现的瞬间。"}]},{"id":"shuidiaogetou","title":"水调歌头·明月几时有","author":"sushi","form":"词","stage":["初中"],"scene":"moon","tags":["moon","homesick","hope","night","autumn","bold"],"preface":"丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。","lines":["明月几时有？把酒问青天。","不知天上宫阙，今夕是何年。","我欲乘风归去，又恐琼楼玉宇，高处不胜寒。","起舞弄清影，何似在人间。","转朱阁，低绮户，照无眠。","不应有恨，何事长向别时圆？","人有悲欢离合，月有阴晴圆缺，此事古难全。","但愿人长久，千里共婵娟。"],"quote":[7],"intro":"相隔很远的人，也能拥有同一片月光。","notes":[{"q":"子由","text":"苏轼的弟弟苏辙，字子由。"},{"q":"不胜寒","text":"承受不住寒冷。“胜”读 shèng。"},{"q":"绮户","text":"qǐ hù，有雕饰的窗户。"},{"q":"婵娟","text":"chán juān，原形容美好，这里指明月。"}],"background":"作于宋神宗熙宁九年（1076）中秋，苏轼任职密州时。小序明确写出“兼怀子由”，词中对月的思索也与兄弟分离的牵念相连。","reading":[{"quote":"我欲乘风归去，又恐琼楼玉宇","title":"在向往与迟疑之间","text":"“欲”与“恐”使想象产生波折。天上与人间的往返，也表现了心绪的展开。"},{"quote":"人有悲欢离合，月有阴晴圆缺","title":"从一人的离别，望向共同的人生","text":"人与月并列，把个人遭际放进更广阔的变化之中。理解不圆满，并没有抹去牵挂，而是为祝愿留出位置。"}],"thought":"词经历发问、向往、犹疑与体认，最终落在对人的祝福。旷达之中始终有情，愿相隔的人仍可共享月色。","sources":["苏轼《水调歌头》（明月几时有），小序为作品原有文字。"],"related":[{"id":"jingyesi","reason":"另一位诗人，也曾举头望月。"},{"id":"chengtian","reason":"若换一个夜晚，苏轼会邀朋友一起走进月色。"}]},{"id":"chengtian","title":"记承天寺夜游","author":"sushi","form":"古文·记","stage":["初中"],"scene":"moon","tags":["moon","bamboo","friendship","hope","quiet","night","metaphor"],"lines":["元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。","念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。","庭下如积水空明，水中藻、荇交横，盖竹柏影也。","何夜无月？何处无竹柏？但少闲人如吾两人者耳。"],"quote":[2],"intro":"月色来敲门，便起身去找一个朋友。","notes":[{"q":"念","text":"想到、考虑到。"},{"q":"相与","text":"一起、共同。"},{"q":"藻、荇","text":"水生植物；荇读 xìng。这里以水草交错写竹柏的影子。"},{"q":"闲人","text":"闲暇的人，也含有作者处境与自我调侃的意味，不能只理解为无所事事。"}],"background":"记于元丰六年（1083），苏轼贬居黄州期间。张怀民也寓居当地。短文从夜间起身写起，记录一次有友人相伴的月下散步。","reading":[{"quote":"月色入户，欣然起行","title":"让一束光改变一个夜晚","text":"原本要睡，因月色而起。简练的动词写出一种仍能被美触动的心境。"},{"quote":"庭下如积水空明","title":"先看见水，再认出影子","text":"以清水比月光，以水草比竹柏影。末尾“盖”字点明实景，读者仿佛也经历一次凝视与辨认。"}],"thought":"月与竹柏本寻常，难得的是有时间、有心意，也有同行的人。悠闲中有自我宽解，清赏里仍能读到身世的余味。","sources":["苏轼《记承天寺夜游》，收入《东坡志林》。"],"related":[{"id":"zhuliguan","reason":"同样的月光与竹影，王维选择独坐。"},{"id":"shuidiaogetou","reason":"由眼前的朋友，读向苏轼对远方亲人的思念。"}]},{"id":"loushiming","title":"陋室铭","author":"liuyuxi","form":"古文·铭","stage":["初中"],"scene":"bamboo","tags":["resolve","quiet","aspiration","contrast"],"lines":["山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。","苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。","可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。","南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？"],"quote":[1],"intro":"屋子虽小，精神可以自有天地。","notes":[{"q":"铭","text":"古代刻在器物上用来称述功德或警戒自己的文字，后来成为一种文体。"},{"q":"德馨","text":"德行美好。馨原指散布很远的香气。"},{"q":"鸿儒","text":"学识渊博的人。"},{"q":"案牍","text":"àn dú，官府公文。"},{"q":"何陋之有","text":"有什么简陋的呢？语序相当于“有何陋”。"}],"background":"传统署名刘禹锡。围绕居室的题铭展开，具体写作情境与相关轶事并非都可确证，本样例不采用未经核实的迁居故事。","reading":[{"quote":"斯是陋室，惟吾德馨","title":"衡量生活的另一把尺","text":"房屋外在的简陋与人的品格相对照，立意由物转向人。"},{"quote":"苔痕上阶绿，草色入帘青","title":"两抹绿色，把居所写活","text":"“上”“入”使苔痕草色有了动态，整齐的句式中也有自然的生机。"}],"thought":"文章把居所与精神生活联系起来，表达对品格、志趣和自主生活的看重。对古文中的交游观念，也可以结合时代背景保持思考。","sources":["《陋室铭》，传统署名刘禹锡。"],"related":[{"id":"zhushi","reason":"同样借具体事物表达精神上的坚守。"},{"id":"zhuliguan","reason":"从室内的素琴，走到竹林里的琴声。"}]},{"id":"xiaochi","title":"小池","author":"yangwanli","form":"七言绝句","stage":["小学"],"scene":"flower","tags":["water","lotusleaf","joy","quiet","summer","personification"],"lines":["泉眼无声惜细流，","树阴照水爱晴柔。","小荷才露尖尖角，","早有蜻蜓立上头。"],"quote":[2,3],"intro":"一点点新生，已经有人留意。","notes":[{"q":"泉眼","text":"泉水涌出的出口。"},{"q":"晴柔","text":"晴天里柔和的风光。"},{"q":"小荷","text":"刚长出的嫩荷叶。"}],"background":"这首诗捕捉小池边初夏的细景，具体作年未在本样例中确定。泉水、树阴、荷叶和蜻蜓构成一个近在眼前的小世界。","reading":[{"quote":"惜细流，爱晴柔","title":"让景物有了轻轻的心意","text":"“惜”“爱”把人的感受赋予泉眼与树阴，使平常景物显得温柔可亲。"},{"quote":"才露……早有……","title":"抓住刚刚发生的一刻","text":"“才”与“早”相呼应，把初生荷叶与先到蜻蜓联系起来。小小的时间差，写出了发现的惊喜。"}],"thought":"诗把注意力交给细小的新生与变化。生活里可亲的美，常需要停下来才看得见。","sources":["杨万里《小池》。"],"related":[{"id":"chunyu","reason":"从初夏新荷，回望春雨怎样滋养万物。"},{"id":"niaomingjian","reason":"留意细小变化的人，也能听见山中花落鸟鸣。"}]}]}</script>

  }
  function about() {
    openModal('关于这本小集','<div class="about-copy"><div class="about-brand">山月</div><p>在字里行间，遇见天地。</p><p>从一轮月、一阵风、一份心情出发，读到文字，也读到写下它的人。把喜欢的一句制成卡片，送给今天，或送给一个想起的人。</p><p class="tiny">当前为 MVP 预览，收录 '+library.works.length+' 篇代表作品。原文采用通行文本；作者与背景的存疑处保留说明，赏读为本工具编写。完整收录范围与逐版校勘将在后续完善。</p><p class="tiny">可离线阅读、制卡。收藏和设置留在当前浏览器；分享朋友圈时，请先保存图片后自行发布。</p></div>',true);
  }

  function validateLibrary(input) {
    const error=message=>{throw new Error('内容校验：'+message);};
    const str=(v,label,max=6000)=>{if(typeof v!=='string'||v.length>max)error(label+'不是有效文本');return v;};
    const ident=(v,label)=>{if(typeof v!=='string'||!/^[a-z][a-z0-9_-]{0,63}$/.test(v)||['constructor','prototype','__proto__'].includes(v))error(label+'标识无效');return v;};
    const list=(v,label,max=5000)=>{if(!Array.isArray(v)||v.length>max)error(label+'不是有效列表');return v;};
    const unique=(items,label)=>{const ids=new Set();items.forEach(x=>{if(ids.has(x.id))error(label+'标识重复：'+x.id);ids.add(x.id);});};
    if(!input||typeof input!=='object'||input.version!==1)error('不支持的版本');
    if(!input.authors||typeof input.authors!=='object'||Array.isArray(input.authors))error('缺少作者资料');
    const authors={};Object.entries(input.authors).forEach(([key,a])=>{ident(key,'作者');if(!a||typeof a!=='object')error('作者资料无效');authors[key]={name:str(a.name,'作者名',100),dynasty:str(a.dynasty,'朝代',30),life:str(a.life||'','生卒年',100),bio:str(a.bio||'','作者简介')};});
    const tags=list(input.tags,'分类',1000).map(t=>({id:ident(t.id,'分类'),name:str(t.name,'分类名称',50),parent:t.parent?ident(t.parent,'上级分类'):null}));unique(tags,'分类');
    const tagMap=new Map(tags.map(t=>[t.id,t]));tags.forEach(t=>{const seen=new Set([t.id]);let p=t.parent;while(p){if(!tagMap.has(p))error('分类上级不存在');if(seen.has(p))error('分类存在循环');seen.add(p);p=tagMap.get(p).parent;if(seen.size>30)error('分类层级过深');}});
    const modules=list(input.modules,'模块',50).map(m=>({id:ident(m.id,'模块'),label:str(m.label,'模块名称',50),enabled:!!m.enabled}));unique(modules,'模块');
    const works=list(input.works,'作品',2000).map(w=>{
      const id=ident(w.id,'作品'),author=ident(w.author,'作者');if(!Object.prototype.hasOwnProperty.call(authors,author))error('作品作者不存在：'+id);
      const lines=list(w.lines,'原文',500).map(l=>str(l,'原文',2000));if(!lines.length||lines.some(l=>!l.trim()))error('原文不能留空');
      const quote=list(w.quote||[0],'选句',500);if(!quote.length||quote.some(i=>!Number.isInteger(i)||i<0||i>=lines.length))error('选句位置无效：'+id);
      const wt=list(w.tags||[],'作品标签',1000).map(t=>ident(t,'标签'));if(wt.some(t=>!tagMap.has(t)))error('作品引用了不存在的标签：'+id);
      const extra={};if(w.extra){if(typeof w.extra!=='object'||Array.isArray(w.extra))error('自定义模块无效');Object.entries(w.extra).forEach(([k,v])=>{extra[ident(k,'模块')]=str(v,'模块内容',12000);});}
      return {id,title:str(w.title,'篇名',160),author,form:str(w.form,'文体',60),stage:list(w.stage||[],'学段标签',3).filter(s=>['小学','初中','高中'].includes(s)),scene:['moon','mountain','water','rain','snow','bamboo','flower'].includes(w.scene)?w.scene:'mountain',tags:[...new Set(wt)],lines,quote:[...new Set(quote)],preface:str(w.preface||'','序文'),intro:str(w.intro||'','引言',500),notes:list(w.notes||[],'注释',500).map(n=>({q:str(n.q,'注释词语',200),text:str(n.text,'注释')})),background:str(w.background||'','背景',12000),reading:list(w.reading||[],'赏读',100).map(r=>({quote:str(r.quote||'','赏读引文',2000),title:str(r.title||'','赏读题名',200),text:str(r.text,'赏读内容',12000)})),thought:str(w.thought||'','思想情感',12000),sources:list(w.sources||[],'来源',100).map(s=>str(s,'来源',2000)),related:list(w.related||[],'关联作品',100).map(r=>({id:ident(r.id,'关联作品'),reason:str(r.reason,'关联理由',1000)})),extra};
    });unique(works,'作品');if(!works.length)error('至少需要一篇作品');
    const ids=new Set(works.map(w=>w.id));works.forEach(w=>{if(w.related.some(r=>!ids.has(r.id)))error('关联作品不存在：'+w.id);});
    const topics=list(input.topics||[],'专题',200).map(t=>({id:ident(t.id,'专题'),name:str(t.name,'专题名称',100),subtitle:str(t.subtitle||'','专题简介',500),scene:['moon','mountain','water','rain','snow','bamboo','flower'].includes(t.scene)?t.scene:'mountain',works:list(t.works,'专题作品',2000).map(id=>ident(id,'作品')),tag:t.tag||''}));unique(topics,'专题');topics.forEach(t=>{if(t.works.some(id=>!ids.has(id)))error('专题作品不存在：'+t.id);});
    return {version:1,name:str(input.name||'山月','内容库名称',50),authors,tags,modules,works,topics};
  }
  function normalizeState(raw) {
    if(!raw||typeof raw!=='object')raw={};
    const text=(v,max=10000)=>typeof v==='string'?v.slice(0,max):'';
    const arr=v=>Array.isArray(v)?v:[];
    const normalized={favorites:[...new Set(arr(raw.favorites).filter(x=>typeof x==='string'))].slice(0,2000),fontSize:Math.max(18,Math.min(30,Number(raw.fontSize)||23)),lastWork:text(raw.lastWork,64)||'niaomingjian',quotes:[],records:[]};
    normalized.quotes=arr(raw.quotes).filter(q=>q&&typeof q.text==='string'&&Number.isInteger(q.index)).slice(0,5000).map(q=>({id:text(q.id,140),workId:text(q.workId,64),index:q.index,text:text(q.text,2000),title:text(q.title,160),author:text(q.author,100),dynasty:text(q.dynasty,30)}));
    normalized.records=arr(raw.records).filter(r=>r&&Array.isArray(r.lines)&&r.lines.length&&r.lines.every(l=>typeof l==='string')&&Array.isArray(r.picked)&&r.picked.length&&r.picked.every(i=>Number.isInteger(i)&&i>=0&&i<r.lines.length)).slice(0,2000).map(r=>({id:text(r.id,80),workId:text(r.workId,64),title:text(r.title,160),author:text(r.author,100),dynasty:text(r.dynasty,30),lines:r.lines.slice(0,500).map(l=>text(l,2000)),picked:r.picked.filter(i=>i<500),text:text(r.text,20000),intro:text(r.intro,500),excerpt:!!r.excerpt,theme:['paper','night','botanic'].includes(r.theme)?r.theme:'paper',ratio:r.ratio==='square'?'square':'portrait',mode:['quote','whole','memory'].includes(r.mode)?r.mode:'quote',date:/^\d{4}-\d{2}-\d{2}$/.test(r.date)?r.date:localDate(),showDate:!!r.showDate,note:text(r.note,80),signature:text(r.signature,18),showIntro:!!r.showIntro}));
    return normalized;
  }
  function newId(prefix) {return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);}
  function filterChanged() {if(location.hash!=='#explore'){history.replaceState(null,'','#explore');previousRoute='#explore';lastListing='#explore';}updateResults();}
  function toggleFavorite(id) {
    const w=workById(id);if(!w)return;
    const has=state.favorites.includes(id);state.favorites=has?state.favorites.filter(x=>x!==id):[id,...state.favorites];persist();
    if(location.hash.startsWith('#saved'))refreshPage();
    else $$('[data-action="favorite"]').filter(b=>b.dataset.id===id).forEach(b=>{b.classList.toggle('is-saved',!has);b.classList.toggle('active',!has);b.setAttribute('aria-pressed',String(!has));b.setAttribute('aria-label',(has?'收藏':'取消收藏')+w.title);b.innerHTML=icon('heart')+(b.classList.contains('btn')?(has?'收藏':'已收藏'):'');});
    toast(has?'已移出收藏。':'已把这篇文字留在收藏里。');
  }
  function saveQuote(id,index) {
    const w=workById(id);if(!w||!w.lines[index])return;
    const existed=state.quotes.find(q=>q.workId===id&&q.index===index);
    if(existed)state.quotes=state.quotes.filter(q=>q.id!==existed.id);
    else state.quotes.push({id:id+'-'+index,workId:id,index,text:w.lines[index],title:w.title,author:authorOf(w).name,dynasty:authorOf(w).dynasty});
    persist();showLine(id,index);toast(existed?'已移出句子收藏。':'这一句，留下了。');
  }
  const recentHome=[currentHome];
  document.addEventListener('click',event=>{
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;
    const action=b.dataset.action,id=b.dataset.id;
    try {
      switch(action){
        case 'close-modal':closeModal();break;
        case 'about':about();break;
        case 'settings':settings();break;
        case 'search':if(location.hash.startsWith('#explore'))$('#search').focus();else{location.hash='#explore';setTimeout(()=>{if($('#search'))$('#search').focus();},80);}break;
        case 'shuffle':{let candidates=library.works.filter(w=>!recentHome.slice(-4).includes(w.id));if(!candidates.length)candidates=library.works;const w=candidates[Math.floor(Math.random()*candidates.length)];currentHome=w.id;state.lastWork=w.id;recentHome.push(w.id);persist();refreshPage();break;}
        case 'favorite':toggleFavorite(id);break;
        case 'tag':location.hash='#explore?tag='+encodeURIComponent(id);break;
        case 'filter':explore.tags=explore.tags.includes(id)?explore.tags.filter(x=>x!==id):[...explore.tags,id];filterChanged();break;
        case 'clear-topic':explore.topic='';filterChanged();break;
        case 'clear-filters':explore={search:'',tags:[],author:'',form:'',stage:'',topic:''};history.replaceState(null,'','#explore');previousRoute='';renderRoute();break;
        case 'line':showLine(id,Number(b.dataset.line));break;
        case 'save-quote':saveQuote(id,Number(b.dataset.line));break;
        case 'saved-tab':savedTab=id;refreshPage();break;
        case 'remove-quote':state.quotes=state.quotes.filter(q=>q.id!==id);persist();refreshPage();toast('已移出收藏。');break;
        case 'share':openShare(id);break;
        case 'share-line':openShare(id,Number(b.dataset.line));break;
        case 'share-saved-quote':{const q=state.quotes.find(q=>q.id===id);if(q)openShare(q.workId,null,null,q);break;}
        case 'share-mode':setShareChoice('mode',id);break;
        case 'share-theme':setShareChoice('theme',id);break;
        case 'share-ratio':setShareChoice('ratio',id);break;
        case 'download-image':saveShareImage();break;
        case 'edit-record':{const r=state.records.find(r=>r.id===id);if(r)openShare(r.workId,null,r);break;}
        case 'delete-record':confirmAction('删除这次阅读留念？','将移除这条记录，已经保存到设备的图片不受影响。','confirm-delete-record',id);break;
        case 'confirm-delete-record':state.records=state.records.filter(r=>r.id!==id);persist();closeModal();refreshPage();toast('已移除这次记录。');break;
        case 'module-up':{const i=library.modules.findIndex(m=>m.id===id);if(i>0){[library.modules[i-1],library.modules[i]]=[library.modules[i],library.modules[i-1]];persist();refreshSettings(0);refreshPage();}break;}
        case 'module-add':{const label=$('#new-module').value.trim();if(!label){toast('给新模块起个名字吧。');break;}library.modules.push({id:newId('module'),label,enabled:true});persist();refreshSettings(0);toast('已添加。点击“编辑”可为作品填写内容。');break;}
        case 'module-edit':editModule(id);break;
        case 'save-module':{const m=library.modules.find(m=>m.id===id),label=$('#edit-module-name').value.trim();if(!label){toast('模块名称不能为空。');break;}m.label=label;if($('#module-work')){const w=workById($('#module-work').value);w.extra=w.extra||{};w.extra[id]=$('#module-content').value;}persist();refreshSettings(0);refreshPage();toast('模块已保存。');break;}
        case 'module-delete':confirmAction('移除这个内容模块？','详情页将不再显示这个模块。原文和已有资料保留在内容包中，也可以先取消勾选来隐藏。','confirm-module-delete',id);break;
        case 'confirm-module-delete':library.modules=library.modules.filter(m=>m.id!==id);persist();refreshSettings(0);refreshPage();break;
        case 'tag-add':{const name=$('#new-tag').value.trim(),parent=$('#new-tag-parent').value||null;if(!name){toast('分类名称不能为空。');break;}if(library.tags.some(t=>t.name===name&&t.parent===parent)){toast('这个层级已有同名分类。');break;}library.tags.push({id:newId('tag'),name,parent});persist();refreshSettings(1);refreshPage();toast('分类已添加。');break;}
        case 'tag-edit':editTag(id);break;
        case 'save-tag':{const t=tagById(id),name=$('#edit-tag-name').value.trim(),parent=$('#edit-tag-parent').value||null;if(!name){toast('分类名称不能为空。');break;}if(parent&&descendant(parent,id)){toast('不能将分类移入自己的子分类。');break;}t.name=name;t.parent=parent;persist();refreshSettings(1);refreshPage();toast('分类已保存。');break;}
        case 'tag-delete':{const count=library.works.filter(w=>w.tags.includes(id)).length;confirmAction('移除这个分类？','将解除 '+count+' 篇作品的这个标签，子分类会移到上一层，作品正文不受影响。','confirm-tag-delete',id);break;}
        case 'confirm-tag-delete':{const t=tagById(id);library.tags.forEach(c=>{if(c.parent===id)c.parent=t.parent;});library.tags=library.tags.filter(t=>t.id!==id);library.works.forEach(w=>{w.tags=w.tags.filter(t=>t!==id);});explore.tags=explore.tags.filter(t=>t!==id);persist();refreshSettings(1);refreshPage();break;}
        case 'work-tags':editWorkTags($('#tag-work').value);break;
        case 'save-work-tags':{const w=workById(id);w.tags=$$('[data-work-tag]:checked').map(x=>x.dataset.workTag);persist();refreshSettings(1);refreshPage();toast('作品标签已保存。');break;}
        case 'export-backup':exportJson('backup');break;
        case 'export-content':exportJson('content');break;
        case 'export-html':exportHtml();break;
        case 'cancel-import':pendingImport=null;$('#import-preview').innerHTML='';$('#import-file').value='';break;
        case 'apply-import':if(pendingImport){library=pendingImport.library;state=pendingImport.state;state.favorites=state.favorites.filter(id=>workById(id));currentHome=workById(state.lastWork)?state.lastWork:library.works[0].id;explore.tags=explore.tags.filter(tagById);persist();serifSize();closeModal();previousRoute='';renderRoute();toast('导入完成。');}break;
      }
    }catch(error){toast('操作没有完成：'+error.message);console.error(error);}
  });
  document.addEventListener('input',event=>{
    const el=event.target;
    if(el.id==='search'){explore.search=el.value;filterChanged();}
    if(el.id==='font-size'){state.fontSize=Number(el.value);$('#font-output').textContent=el.value+' px';serifSize();persist();}
    if(share){const fields={'share-note':'note','share-signature':'signature','share-date':'date'};if(fields[el.id]){share[fields[el.id]]=el.value;renderShare();}}
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(['author-filter','form-filter','stage-filter'].includes(el.id)){explore[el.id.split('-')[0]]=el.value;filterChanged();}
    if(el.dataset.moduleToggle){const m=library.modules.find(m=>m.id===el.dataset.moduleToggle);m.enabled=el.checked;persist();refreshPage();}
    if(el.id==='module-work'){$('#module-content').value=(workById(el.value).extra||{})[el.dataset.module]||'';}
    if(el.id==='import-file')previewImport(el.files[0]);
    if(share){
      if(el.dataset.quoteIndex!==undefined){const i=Number(el.dataset.quoteIndex);share.picked=el.checked?[...share.picked,i].sort((a,b)=>a-b):share.picked.filter(j=>j!==i);renderShare();}
      const flags={'share-show-date':'showDate','share-intro':'showIntro','share-record':'keepRecord'};
      if(flags[el.id]){share[flags[el.id]]=el.checked;renderShare();}
    }
  });
  window.addEventListener('hashchange',()=>{if(dialog.open)closeModal();renderRoute();});
  serifSize();renderRoute();
  if(!storageAvailable)setTimeout(()=>toast('本地记录暂时无法读取，可以先阅读，并在设置中导出备份。'),500);

})();
</script>

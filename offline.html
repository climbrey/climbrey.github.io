姿态。"}],"extra":{}},{"id":"yueyanglouji","title":"岳阳楼记","author":"fanzhongyan","form":"古文·记","stage":["初中"],"scene":"moon","tags":["water","moon","rain","reflection","compassion","contrast","geo_dongting","geo_xiaoxiang","geo_threegorges"],"lines":["庆历四年春，滕子京谪守巴陵郡。","越明年，政通人和，百废具兴，乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。","予观夫巴陵胜状，在洞庭一湖。","衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千，此则岳阳楼之大观也，前人之述备矣。","然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？","若夫霪雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐耀，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。","登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。","至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。","而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！","登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。","嗟夫！","予尝求古仁人之心，或异二者之为，何哉？","不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。","是进亦忧，退亦忧。","然则何时而乐耶？","其必曰“先天下之忧而忧，后天下之乐而乐”","乎！","噫！","微斯人，吾谁与归？","时六年九月十五日。"],"quote":[4],"preface":"","intro":"同一座楼，可以看见两种天气，也可以想到更多人的生活。","notes":[{"q":"谪守","text":"被贬去任地方长官"},{"q":"属","text":"同“嘱”，嘱托"},{"q":"胜状","text":"优美景色"},{"q":"汤汤","text":"水势浩大貌，读shāng"},{"q":"去国","text":"离开国都"},{"q":"景","text":"日光"},{"q":"微斯人","text":"如果没有这样的人"}],"background":"范仲淹应滕宗谅之请，为重修岳阳楼作记。写作时不在岳阳，文中的洞庭景象结合想象与既有见闻材料，不宜视作当天游记。","reading":[{"quote":"览物之情，得无异乎","title":"先提出一个阅读问题","text":"文章由修楼和湖景转入登临者心情，阴雨与晴朗两段成为对这一问题的展开，为议论铺路。"},{"quote":"不以物喜，不以己悲","title":"从个人际遇转向公共关怀","text":"作者提出不完全受外物与得失支配的理想，再以忧民忧国说明心有所系，并非要求人没有感情。"}],"thought":"文章把欣赏山水引向承担责任。所谓先忧后乐，重在愿意把他人的安危纳入自己的关心，而不是消除个人快乐。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_f3d6556dbcad.aspx","对照页所列异文或通假：具 通：俱；隐耀 一作：隐曜；霪雨 一作：淫雨。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8C%83%E4%BB%B2%E6%B7%B9","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zuiwengtingji","reason":"从一场登临或游宴读到心境的转折，比较共同之乐与公共关怀。"},{"id":"chibifu","reason":"从一场登临或游宴读到心境的转折，比较共同之乐与公共关怀。"}],"extra":{"places":"巴陵、岳阳楼、洞庭湖｜巴陵约当今湖南岳阳；岳阳楼临洞庭湖。“洞庭一湖”是文章展开景象的中心。\n\n这篇文章是应滕子京之请而作，不能误读为范仲淹当时站在岳阳楼上亲眼记录阴晴变化。北通巫峡、南极潇湘写的是水路联系与广阔区域。"}},{"id":"zuiwengtingji","title":"醉翁亭记","author":"ouyangxiu","form":"古文·记","stage":["初中"],"scene":"water","tags":["mountain","water","nature","joy","wine","narrative","geo_chuzhou"],"lines":["环滁皆山也。","其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。","山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。","峰回路转，有亭翼然临于泉上者，醉翁亭也。","作亭者谁？","山之僧智仙也。","名之者谁？","太守自谓也。","太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。","醉翁之意不在酒，在乎山水之间也。","山水之乐，得之心而寓之酒也。","若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。","野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。","朝而往，暮而归，四时之景不同，而乐亦无穷也。","至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。","临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。","宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。","苍颜白发，颓然乎其间者，太守醉也。","已而夕阳在山，人影散乱，太守归而宾客从也。","树林阴翳，鸣声上下，游人去而禽鸟乐也。","然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。","醉能同其乐，醒能述以文者，太守也。","太守谓谁？","庐陵欧阳修也。"],"quote":[3],"preface":"","intro":"山水的快乐，因有人一起分享而更加丰厚。","notes":[{"q":"蔚然","text":"草木繁盛貌"},{"q":"翼然","text":"像鸟展翅的样子"},{"q":"林霏","text":"林间雾气"},{"q":"野蔌","text":"野菜"},{"q":"觥筹","text":"酒杯与酒筹"},{"q":"阴翳","text":"枝叶茂密成荫"},{"q":"乐其乐","text":"以众人的快乐为快乐"}],"background":"欧阳修被贬任滁州知州期间作。文章围绕醉翁亭游宴，把四时景色、百姓出游与太守心情层层联结。","reading":[{"quote":"峰回路转","title":"跟着路线逐渐走近","text":"从环滁群山写到琅琊、酿泉，最后才见亭，文章像引人步行，空间一层层收拢。"},{"quote":"太守之乐其乐","title":"快乐在结尾多了一层","text":"禽鸟、人、太守各有所乐，递进使太守的快乐与众人相连，回应了前文共同出游的热闹。"}],"thought":"自然之乐与相伴之乐彼此滋养。文章的温暖在于，个人的失意没有切断他与当地生活的联系。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_5cbf5b7be38f.aspx","对照页所列异文或通假：山之僧智仙也 一作：山之僧曰智仙也。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%AC%A7%E9%98%B3%E4%BF%AE","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chibifu","reason":"从一场登临或游宴读到心境的转折，比较共同之乐与公共关怀。"},{"id":"yueyanglouji","reason":"从一场登临或游宴读到心境的转折，比较共同之乐与公共关怀。"},{"id":"kezhi","reason":"从重逢、清游与款待读人与环境的关系，热闹和安静各有情味。"},{"id":"tiposhansihouchanyuan","reason":"从重逢、清游与款待读人与环境的关系，热闹和安静各有情味。"}],"extra":{"places":"滁、琅琊山、醉翁亭｜均联系今安徽滁州。文章从“环滁皆山”逐步走近琅琊山、酿泉、醉翁亭，再由一亭之乐展开到滁人之乐。"}},{"id":"chouletianyangzhouchufengxishangjianzeng","title":"酬乐天扬州初逢席上见赠","author":"liuyuxi","form":"七言律诗","stage":["初中"],"scene":"mountain","tags":["friendship","hope","sadness","allusion","contrast","timepassing","geo_yangzhou","geo_bashu"],"lines":["巴山楚水凄凉地，","二十三年弃置身。","怀旧空吟闻笛赋，","到乡翻似烂柯人。","沉舟侧畔千帆过，","病树前头万木春。","今日听君歌一曲，","暂凭杯酒长精神。"],"quote":[3,4],"preface":"","intro":"承认失去，也把目光交给正在生长的世界。","notes":[{"q":"酬","text":"以诗作答"},{"q":"闻笛赋","text":"用向秀怀念嵇康等人的典故"},{"q":"烂柯人","text":"用王质看棋、世事已变的传说"},{"q":"侧畔","text":"旁边"},{"q":"长精神","text":"振作精神，长读zhǎng"}],"background":"刘禹锡结束长期外任、途经扬州时与白居易相逢，席上酬答白氏赠诗。“乐天”为白居易字。","reading":[{"quote":"到乡翻似烂柯人","title":"时间的伤痕由典故说出","text":"旧友凋零与人事全非分别由两个典故承载，个人经历与古老故事相接，惆怅因此有纵深。"},{"quote":"病树前头万木春","title":"痛感没有消失，视野却打开","text":"沉舟病树仍在，千帆万木也在。新生景象带来振作的可能，并不是轻率否定自己的受伤。"}],"thought":"诗允许失意与希望并存。朋友的理解和世界继续向前的生命力，使人获得重新抬头的力量。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_f6c40e3d4893.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%88%98%E7%A6%B9%E9%94%A1","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zaofabaidicheng","reason":"一起读受挫之后的舒展：轻舟、飞鹤与新生草木各有回应。"},{"id":"qiuci","reason":"一起读受挫之后的舒展：轻舟、飞鹤与新生草木各有回应。"}],"extra":{"places":"扬州｜题目点出的酬赠宴席所在，即今江苏扬州。\n\n巴山楚水｜回顾多年贬谪经历的地域概称，联系巴蜀、荆楚等广大地区；“二十三年”并非说一直住在某一座巴山下的城中。"}},{"id":"yueyeyishedi","title":"月夜忆舍弟","author":"dufu","form":"五言律诗","stage":["初中"],"scene":"moon","tags":["moon","autumn","family","war","homesick","sound","geo_tianshui"],"lines":["戍鼓断人行，","边秋一雁声。","露从今夜白，","月是故乡明。","有弟皆分散，","无家问死生。","寄书长不达，","况乃未休兵。"],"quote":[3,4],"preface":"","intro":"月亮照着同一片天地，亲人却散落在消息之外。","notes":[{"q":"舍弟","text":"对自己弟弟的谦称"},{"q":"戍鼓","text":"驻军报时或戒严的鼓声"},{"q":"断人行","text":"夜间行人断绝"},{"q":"况乃","text":"何况"},{"q":"未休兵","text":"战事仍未停止"}],"background":"杜甫安史之乱期间寓居秦州时所作，思念分散各地的弟弟。边城夜景与战时通信困难共同构成忧思。","reading":[{"quote":"月是故乡明","title":"情感改变了月色的尺度","text":"并非测量各地月亮明暗，而是思乡者把熟悉之地感得更亲切，主观感受因此格外真实。"},{"quote":"寄书长不达","title":"由想念落到现实阻隔","text":"乡思并不只停在月色，末联点明书信难达与战乱未止，牵挂含着对亲人生死的忧惧。"}],"thought":"诗写战乱中最朴素也最迫切的愿望：知道家人还平安。故乡的明月背后，是对重新团聚的渴望。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_ad6f7cfa10c2.aspx","对照页所列异文或通假：边秋 一作:秋边。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chenqingbiao","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"},{"id":"shier","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"}],"extra":{"places":"秦州 → 天水｜通行编年中的写作地点，今甘肃天水。“故乡”“有弟皆分散”没有列明兄弟所在的每一城，不据作者籍贯替这些地点补坐标。"}},{"id":"changshaguojiayizhai","title":"长沙过贾谊宅","author":"liuchangqing","form":"七言律诗","stage":["初中"],"scene":"mountain","tags":["history","autumn","solitude","sadness","allusion","contrast","geo_changsha"],"lines":["三年谪宦此栖迟，","万古惟留楚客悲。","秋草独寻人去后，","寒林空见日斜时。","汉文有道恩犹薄，","湘水无情吊岂知？","寂寂江山摇落处，","怜君何事到天涯！"],"quote":[2,3],"preface":"","intro":"走进古人的旧宅，也遇见自己的失意。","notes":[{"q":"谪宦","text":"贬官在外"},{"q":"栖迟","text":"停留"},{"q":"楚客","text":"指贾谊"},{"q":"吊","text":"凭吊"},{"q":"摇落","text":"草木凋落"},{"q":"天涯","text":"遥远之处"}],"background":"刘长卿被贬途中经过长沙贾谊故宅所作，具体系年有讨论。借吊古寄托自身遭际，将唐人的处境与汉代贾谊相照。","reading":[{"quote":"秋草独寻人去后","title":"人不在，荒凉还在","text":"“独”“空”分别落在寻访与所见上，秋草寒林使历史遗迹成为当下孤独的回声。"},{"quote":"汉文有道恩犹薄","title":"赞语里含着追问","text":"即使被称为有道之君，仍未充分理解贾谊；借古议今的意味藏在转折中，含蓄而不平。"}],"thought":"诗通过古人的遭际安放自己的失落。跨越时代的同情，使一处旧宅成为理解生命处境的地方。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_a9a0b6b0eede.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%88%98%E9%95%BF%E5%8D%BF","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jiangchengzi","reason":"同写抱负与处境的距离，比较期待任用、怀古与梦中驰骋。"},{"id":"dengyouzhoutaige","reason":"同写抱负与处境的距离，比较期待任用、怀古与梦中驰骋。"}],"extra":{"places":"长沙、贾谊宅｜今湖南长沙一带。诗人经过贾谊故居，以两人的贬谪遭遇相互映照；“湘水”即湘江，流经今湖南。"}},{"id":"zuoqianzhilanguanshizhisunxiang","title":"左迁至蓝关示侄孙湘","author":"hanyu","form":"七言律诗","stage":["初中"],"scene":"snow","tags":["snow","cloud","mountain","family","resolve","sadness","geo_xian","geo_lantian","geo_qinling","geo_chaozhou"],"lines":["一封朝奏九重天，","夕贬潮州路八千。","欲为圣明除弊事，","肯将衰朽惜残年！","云横秦岭家何在？","雪拥蓝关马不前。","知汝远来应有意，","好收吾骨瘴江边。"],"quote":[0,1],"preface":"","intro":"风雪挡住去路，挡不住一句不肯收回的话。","notes":[{"q":"九重天","text":"借指皇帝宫阙"},{"q":"弊事","text":"这里指迎佛骨之事"},{"q":"衰朽","text":"自谦年老"},{"q":"瘴江","text":"旧指南方被认为有瘴气的江边"},{"q":"示","text":"写给看"}],"background":"韩愈因谏迎佛骨获罪，于元和十四年贬赴潮州，途中在蓝关遇侄孙韩湘而作。诗中的韩湘不等同于后世仙人传说的全部叙述。","reading":[{"quote":"一封朝奏九重天","title":"一天之间陡然翻转","text":"“朝”“夕”和“九重天”“路八千”形成时间与空间的强烈对照，政治命运的骤变尽在句中。"},{"quote":"雪拥蓝关马不前","title":"身体的阻隔与心事相叠","text":"云横、雪拥是旅途实景，也使前路艰难、家园难见的情绪得到形象表达。"}],"thought":"诗既有坚持进谏的骨气，也有对家人的不舍与对死亡的忧惧。勇敢的人同样会感到寒冷和伤心。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_076cedfce20c.aspx","对照页所列异文或通假：欲为 一作：本为；圣明 一作：圣朝；肯将 一作：敢将。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%9F%A9%E6%84%88","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"manjianghong","reason":"把历史、风雨与个人处境相联，比较坚持中的昂扬和沉痛。"},{"id":"shiyiyuesirifengyudazuo","reason":"把历史、风雨与个人处境相联，比较坚持中的昂扬和沉痛。"}],"extra":{"places":"朝廷、秦岭、蓝关｜从长安（今陕西西安）被贬南行，过秦岭蓝田关一带，今陕西西安蓝田。\n\n潮州、潮阳｜贬谪目的地方向，联系今广东潮州。“潮阳”在诗中用于潮州区域称呼，不能直接缩成今天汕头市潮阳区的边界。"}},{"id":"shangshanzaoxing","title":"商山早行","author":"wentingyun","form":"五言律诗","stage":["初中"],"scene":"moon","tags":["travel","homesick","moon","flower","sound","night","geo_shangshan","geo_xian"],"lines":["晨起动征铎，","客行悲故乡。","鸡声茅店月，","人迹板桥霜。","槲叶落山路，","枳花明驿墙。","因思杜陵梦，","凫雁满回塘。"],"quote":[2,3],"preface":"","intro":"天还没亮，桥上的霜已经记下了赶路人的脚印。","notes":[{"q":"征铎","text":"行车或马具上的铃声"},{"q":"槲","text":"落叶乔木"},{"q":"枳","text":"一种开白花的灌木或小乔木"},{"q":"驿墙","text":"驿站的墙"},{"q":"凫","text":"野鸭"},{"q":"回塘","text":"曲折水塘"}],"background":"温庭筠写商山旅途早行。商山在今陕西东南部，诗中杜陵指向思念的长安生活。具体作年有不同推定。","reading":[{"quote":"鸡声茅店月","title":"不用动词也能铺开旅途","text":"鸡声、茅店、月与人迹、板桥、霜并列，声音和物象自行连接成清冷早行的画面。"},{"quote":"凫雁满回塘","title":"梦里的热闹回应现实的冷清","text":"结尾忽然回到梦中故园，水鸟满塘的鲜活与眼前霜路相照，使乡思有了具体形状。"}],"thought":"漂泊时最想念的可能只是日常一景。诗把旅途的清冷和心中家园的温暖放在同一次清晨里。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_8d18260838e2.aspx","对照页所列异文或通假：明驿墙 一作：照驿墙。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%B8%A9%E5%BA%AD%E7%AD%A0","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"fengqiaoyepo","reason":"循着夜里的钟声、笛声与清晨铃声，看旅途怎样触动故园之思。"},{"id":"chunyeluochengwendi","reason":"循着夜里的钟声、笛声与清晨铃声，看旅途怎样触动故园之思。"}],"extra":{"places":"商山｜途中的山地，在今陕西商洛一带。\n\n杜陵｜梦中所思的长安附近居处，在今陕西西安。鸡声、茅店是途中近景，凫雁、回塘则是对远方的怀想。"}},{"id":"xianyangchengdonglou","title":"咸阳城东楼","author":"xuhun","form":"七言律诗","stage":["初中"],"scene":"rain","tags":["wind","rain","history","autumn","sadness","water","geo_xianyang","geo_weishui"],"lines":["一上高城万里愁，","蒹葭杨柳似汀洲。","溪云初起日沉阁，","山雨欲来风满楼。","鸟下绿芜秦苑夕，","蝉鸣黄叶汉宫秋。","行人莫问当年事，","故国东来渭水流。"],"quote":[3,4],"preface":"","intro":"楼上风雨将至，楼下江水仍流过旧王朝。","notes":[{"q":"汀洲","text":"水边或水中平地"},{"q":"芜","text":"丛生的草"},{"q":"秦苑","text":"秦代宫苑旧址"},{"q":"故国","text":"昔日都城"},{"q":"行人","text":"旅人，也含诗人自指"}],"background":"许浑登咸阳城楼怀古之作。秦汉宫苑的遗迹与眼前天气相连，登临引发对历史兴亡的感慨。","reading":[{"quote":"山雨欲来风满楼","title":"还未发生，却已处处可感","text":"云起、日沉、风满构成连续变化，雨尚未来，紧迫气氛已充满空间。"},{"quote":"故国东来渭水流","title":"以流动之物收住兴亡之问","text":"昔日宫苑只余草木鸟蝉，渭水仍流。末句不直接议论，让历史的消逝在自然延续中显现。"}],"thought":"登高远望可以同时看见眼前天气与时间深处。诗以风雨和流水承载兴亡感，不把历史化成简单结论。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_65bc4719e0b1.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%AE%B8%E6%B5%91","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"nanxiangzi","reason":"借历史照见当下，比较凭吊、议论与对行动的期待。"},{"id":"yongyule","reason":"借历史照见当下，比较凭吊、议论与对行动的期待。"}],"extra":{"places":"咸阳｜登楼之地，今陕西咸阳。\n\n渭水｜今渭河，流经甘肃、陕西。“秦苑”“汉宫”把眼前荒凉与秦汉旧迹叠在一起；诗中“故国”是思归的情感方向，并未点出其精确地址。"}},{"id":"wuti","title":"无题·相见时难别亦难","author":"lishangyin","form":"七言律诗","stage":["初中"],"scene":"moon","tags":["love","flower","moon","sadness","metaphor","allusion","geo_penglai"],"lines":["相见时难别亦难，","东风无力百花残。","春蚕到死丝方尽，","蜡炬成灰泪始干。","晓镜但愁云鬓改，","夜吟应觉月光寒。","蓬山此去无多路，","青鸟殷勤为探看。"],"quote":[2,3],"preface":"","intro":"有些思念说不尽，只好交给蚕丝和烛泪。","notes":[{"q":"蜡炬","text":"蜡烛"},{"q":"云鬓","text":"如云的鬓发"},{"q":"蓬山","text":"传说中仙山，借指所思者居处"},{"q":"青鸟","text":"神话中西王母使者，此处寄托传信愿望"}],"background":"李商隐无题诗中的名篇。诗写相见与离别之苦，具体寄托对象无定论，不据猜测给人物安排名姓。","reading":[{"quote":"春蚕到死丝方尽","title":"两种物象托住绵长心意","text":"蚕丝的“丝”谐“思”，烛泪又与人的泪互映，把难以量度的牵念写成可见的过程。"},{"quote":"夜吟应觉月光寒","title":"隔着距离想象对方","text":"“应”显出推想，自己的思念延伸为对对方心境的体察，使离愁具有双向回声。"}],"thought":"诗极写深情中的执着与无奈。欣赏其强烈表达时，也可保留对自我照顾的理解，不把消耗自己作为爱的尺度。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_1a4c484f9364.aspx","对照页所列异文或通假：蓬山 一作：蓬莱。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E5%95%86%E9%9A%90","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jingnv","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"},{"id":"jianjia","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"}],"extra":{"places":"蓬山 → 蓬莱仙山｜传说中的海上仙境，诗里借它写相会之难。它不等同于今天山东蓬莱城区的实际位置；“青鸟”也属于传信的神话意象。"}},{"id":"xingxiangzi","title":"行香子·树绕村庄","author":"qinguan","form":"词","stage":["初中"],"scene":"water","tags":["spring","flower","water","animal","joy","nature"],"lines":["树绕村庄，水满陂塘。","倚东风、豪兴徜徉。","小园几许，收尽春光。","有桃花红，李花白，菜花黄。","远远围墙，隐隐茅堂。","飏青旗、流水桥旁。","偶然乘兴，步过东冈。","正莺儿啼，燕儿舞，蝶儿忙。"],"quote":[3],"preface":"","intro":"跟着脚步，数一数村边的颜色和声音。","notes":[{"q":"陂塘","text":"池塘，陂读bēi"},{"q":"徜徉","text":"悠闲行走"},{"q":"几许","text":"多少，这里写小园不大"},{"q":"青旗","text":"酒旗"},{"q":"东冈","text":"东边山冈"},{"q":"飏","text":"yáng，飞扬。“飏青旗”写酒旗随风飘动，亦常写作“扬”。"}],"background":"通行署秦观，也有明代张綖作者说。词写春日村行，景物随散步展开；本篇保留通行署名，并在资料中注明归属争议。","reading":[{"quote":"有桃花红，李花白，菜花黄","title":"像指给同行的人看","text":"三组短句逐一报出花名和颜色，语气明快自然，繁盛春光因此易于亲近。"},{"quote":"正莺儿啼，燕儿舞，蝶儿忙","title":"由静态颜色走向活泼动作","text":"与上片三种花对应，结尾又列三种生灵；声音和动作接续花色，把春景写成有节奏的生活。"}],"thought":"村庄的普通景物足以令人兴致盎然。词中的快乐来自缓慢行走时，对颜色、声响与生命活动的细心发现。","sources":["原文对照：https://zh.wikisource.org/wiki/%E8%A1%8C%E9%A6%99%E5%AD%90_%28%E6%A8%B9%E7%B9%9E%E6%9D%91%E8%8E%8A%29","通行署秦观，另有张綖作者说。对照页作“坡塘”，本篇取通行“陂塘”；保留“飏青旗”（亦常写“扬”）。","作者资料参阅：https://zh.wikisource.org/wiki/%E4%BD%9C%E8%80%85%3A%E7%A7%A6%E8%A7%80","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"guiqulaixicibingxu","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"},{"id":"youshanxicun","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"}],"extra":{}},{"id":"chounuer","title":"丑奴儿·书博山道中壁","author":"xinqiji","form":"词","stage":["初中"],"scene":"mountain","tags":["sadness","reflection","autumn","contrast","repetition","geo_boshan"],"lines":["少年不识愁滋味，爱上层楼。","爱上层楼，为赋新词强说愁。","而今识尽愁滋味，欲说还休。","欲说还休，却道“天凉好个秋”！"],"quote":[0],"preface":"","intro":"真正难说的心事，有时只说成一句天气。","notes":[{"q":"层楼","text":"高楼"},{"q":"强说愁","text":"勉强装作有愁，强读qiǎng"},{"q":"识尽","text":"充分经历、深知"},{"q":"欲说还休","text":"想说又停住"}],"background":"辛弃疾闲居带湖时期所作，博山在今江西广丰一带。词以少年与而今对照，写人生经验怎样改变表达。","reading":[{"quote":"爱上层楼","title":"重复让刻意表达显形","text":"少年两次说爱上层楼，继而点出为写词而说愁，使当年的姿态显得轻巧甚至带些自嘲。"},{"quote":"却道天凉好个秋","title":"转移话题也是一种表达","text":"下片重复“欲说还休”，最后忽谈天气，省去的内容比直说更重，读者能感到语言的限度。"}],"thought":"经历增加后，人未必更容易开口。词理解那些说不明、不能说或不愿说的情绪，让沉默也成为文学的一部分。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_2ee36eb2ccf7.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%BE%9B%E5%BC%83%E7%96%BE","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"lantingjixu","reason":"同读时间留下的感受，比较回忆、沉默与难以概括的愁绪。"},{"id":"shengshengman","reason":"同读时间留下的感受，比较回忆、沉默与难以概括的愁绪。"}],"extra":{"places":"博山｜题中行经、题壁的地点，在今江西上饶广丰一带。词把“少年”与“而今”放在同一个愁字前后，山路只是人生回望的触发处。"}},{"id":"yujiaao","title":"渔家傲·秋思","author":"fanzhongyan","form":"词","stage":["初中"],"scene":"mountain","tags":["frontier","autumn","homesick","war","sadness","sound","geo_hengyang","geo_yanran"],"lines":["塞下秋来风景异，衡阳雁去无留意。","四面边声连角起，千嶂里，长烟落日孤城闭。","浊酒一杯家万里，燕然未勒归无计。","羌管悠悠霜满地，人不寐，将军白发征夫泪。"],"quote":[1],"preface":"","intro":"城门关上之后，守边的人仍在各自的乡思里醒着。","notes":[{"q":"边声","text":"边地的风声、笛声等"},{"q":"角","text":"军中号角"},{"q":"嶂","text":"屏障般的山峰"},{"q":"燕然未勒","text":"用窦宪勒石燕然山典故，指战功未成"},{"q":"羌管","text":"羌笛"}],"background":"范仲淹经略西北边防时期所作，具体作年有不同意见。词将边塞景象与将士心情相联，具有苍凉开阔的风格。","reading":[{"quote":"长烟落日孤城闭","title":"一个“闭”字显出紧张","text":"高山、长烟、落日先展开辽远空间，孤城随即关门，壮阔中含着戒备与孤立。"},{"quote":"将军白发征夫泪","title":"把不同身份放在同一种牵挂里","text":"年老将军与普通士兵共同不眠，守边责任没有抹去他们对家的想念。"}],"thought":"词呈现职责与归心之间的拉扯。边塞的壮阔并不遮蔽人的疲惫，苍凉因此具有温度。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_76a124fc2fb8.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8C%83%E4%BB%B2%E6%B7%B9","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"liangzhouci","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"},{"id":"yeshangshouxiangchengwendi","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"}],"extra":{"places":"衡阳｜雁向南去的方向，今湖南衡阳一带，关联雁止回雁峰的传统说法，不是作者当时驻守的地点。\n\n燕然 → 杭爱山｜今蒙古国境内；“燕然未勒”引用东汉窦宪勒石记功的典故，表示功业未成，不能理解为词人正站在燕然山上。"}},{"id":"jiangchengzi","title":"江城子·密州出猎","author":"sushi","form":"词","stage":["初中"],"scene":"mountain","tags":["resolve","war","bold","allusion","action","boldstyle","geo_zhucheng"],"lines":["老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。","为报倾城随太守，亲射虎，看孙郎。","酒酣胸胆尚开张。","鬓微霜，又何妨！","持节云中，何日遣冯唐？","会挽雕弓如满月，西北望，射天狼。"],"quote":[0],"preface":"","intro":"一次出猎，让久藏的壮心重新拉满弓。","notes":[{"q":"黄","text":"黄犬"},{"q":"苍","text":"苍鹰"},{"q":"孙郎","text":"孙权，此用其射虎故事"},{"q":"持节","text":"持朝廷使者凭证"},{"q":"冯唐","text":"汉代为魏尚申辩的人"},{"q":"天狼","text":"星名，此处象征敌方威胁"}],"background":"苏轼任密州知州期间写出猎。由狩猎场面转向希望受朝廷信任、守卫边疆的愿望，是苏词豪放风格的代表篇目。","reading":[{"quote":"千骑卷平冈","title":"一个动词带起整个场面","text":"“卷”把众骑奔驰写成席卷山冈的势头，上片短句密集，读来有迅疾的行动感。"},{"quote":"鬓微霜，又何妨","title":"承认年岁，仍保留勇气","text":"白发并未被否认，反问却将顾虑推开；后接典故，将个人豪情落实为愿获任用的期待。"}],"thought":"词写人在年龄与处境限制中仍愿有所担当的心情。豪迈不仅是声势大，也包含对信任与机会的渴望。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_85b8792a66ac.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8B%8F%E8%BD%BC","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"pozhenzi","reason":"同写抱负与处境的距离，比较期待任用、怀古与梦中驰骋。"},{"id":"changshaguojiayizhai","reason":"同写抱负与处境的距离，比较期待任用、怀古与梦中驰骋。"}],"extra":{"places":"密州 → 诸城｜词题点出的出猎地点，今山东诸城一带。\n\n云中｜“持节云中”用汉文帝遣冯唐赦免魏尚的典故，汉云中郡约在今内蒙古中部一带。这里是盼望被信任重用的用典，不是此次出猎的目的地。"}},{"id":"pozhenzi","title":"破阵子·为陈同甫赋壮词以寄之","author":"xinqiji","form":"词","stage":["初中"],"scene":"mountain","tags":["war","resolve","sadness","bold","imagination","contrast"],"lines":["醉里挑灯看剑，梦回吹角连营。","八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。","马作的卢飞快，弓如霹雳弦惊。","了却君王天下事，赢得生前身后名。","可怜白发生！"],"quote":[1],"preface":"","intro":"梦里已经冲上沙场，醒来的白发却没有回答。","notes":[{"q":"八百里","text":"用牛名典故，借指牛肉"},{"q":"麾下","text":"部下"},{"q":"炙","text":"烤肉"},{"q":"五十弦","text":"泛指军中乐器"},{"q":"的卢","text":"骏马名"},{"q":"了却","text":"完成"},{"q":"可怜","text":"可惜、可叹"}],"background":"辛弃疾寄给友人陈亮的词，陈亮字同甫。二人关切恢复中原，词借军旅想象表达壮志与现实落差。","reading":[{"quote":"沙场秋点兵","title":"先让壮志充分展开","text":"分肉、奏乐、点兵、驰马、发弓连成紧凑场面，读者仿佛进入将士共同出征的想象。"},{"quote":"可怜白发生","title":"最后五字突然改写前文","text":"昂扬场景在白发面前骤然收束，原来胜利与功名仍是愿景。此前越壮阔，此刻越显沉痛。"}],"thought":"词保存理想的热度，也直面理想未能实现的遗憾。激越与悲凉相互支撑，是这篇“壮词”的深处。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_9822debcdc64.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%BE%9B%E5%BC%83%E7%96%BE","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"mashi","reason":"同写抱负与处境的距离，比较期待任用、怀古与梦中驰骋。"},{"id":"jiangchengzi","reason":"同写抱负与处境的距离，比较期待任用、怀古与梦中驰骋。"}],"extra":{}},{"id":"manjianghong","title":"满江红·小住京华","author":"qiujin","form":"词","stage":["初中"],"scene":"mountain","tags":["resolve","solitude","sadness","freedom","allusion","boldstyle","geo_beijing_city","geo_shaoxing"],"lines":["小住京华，早又是中秋佳节。","为篱下黄花开遍，秋容如拭。","四面歌残终破楚，八年风味徒思浙。","苦将侬、强派作蛾眉，殊未屑！","身不得，男儿列，心却比，男儿烈。","算平生肝胆，因人常热。","俗子胸襟谁识我？","英雄末路当磨折。","莽红尘、何处觅知音？","青衫湿！"],"quote":[3],"preface":"","intro":"不愿被一种身份安排一生，也渴望有人听懂。","notes":[{"q":"京华","text":"京城"},{"q":"蛾眉","text":"借指女子身份"},{"q":"侬","text":"我"},{"q":"殊未屑","text":"很不愿接受、不以为意"},{"q":"因人常热","text":"因他人之事而热心"},{"q":"青衫湿","text":"用白居易《琵琶行》典故写落泪"}],"background":"秋瑾在北京生活时期所作，通常系于1903年前后。词写摆脱旧式家庭与性别束缚的心情，并表达寻求知音的愿望。","reading":[{"quote":"苦将侬、强派作蛾眉","title":"一个“强”字指出束缚","text":"词中的不满并非否定女性自身，而是拒绝社会借性别安排狭窄的生活道路。"},{"quote":"何处觅知音","title":"激烈宣言之后仍有柔软处","text":"末尾由刚烈转向求知音的孤独，使人物不只是昂扬的声音，也有无人理解的痛楚。"}],"thought":"词争取自主选择生活与承担公共事务的可能。坚决与脆弱并存，让追求自由的心更真实可感。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_2a4e8dfccc72.aspx","对照页所列异文或通假：徒思浙 一作：独思浙。正文与旁注分开呈现，异文不混入原文。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"xiarijueju","reason":"把历史、风雨与个人处境相联，比较坚持中的昂扬和沉痛。"},{"id":"zuoqianzhilanguanshizhisunxiang","reason":"把历史、风雨与个人处境相联，比较坚持中的昂扬和沉痛。"}],"extra":{"places":"京华 → 北京｜“小住京华”点明暂住的都城。\n\n浙｜今浙江，寄托作者对故乡、亲人的牵挂，秋瑾的故乡背景可联系绍兴。“四面歌残”借用楚歌典故，不能按字面理解为身在古战场。"}},{"id":"caoguilunzhan","title":"曹刿论战","author":"zuozhuan","form":"古文·历史叙事","stage":["初中"],"scene":"mountain","tags":["war","reflection","narrative","contrast","dialogue","geo_qilu"],"lines":["十年春，齐师伐我。","公将战，曹刿请见。","其乡人曰：“肉食者谋之，又何间焉？”","刿曰：“肉食者鄙，未能远谋。”","乃入见。","问：“何以战？”","公曰：“衣食所安，弗敢专也，必以分人。”","对曰：“小惠未遍，民弗从也。”","公曰：“牺牲玉帛，弗敢加也，必以信。”","对曰：“小信未孚，神弗福也。”","公曰：“小大之狱，虽不能察，必以情。”","对曰：“忠之属也。","可以一战。","战则请从。”","公与之乘，战于长勺。","公将鼓之。","刿曰：“未可。”","齐人三鼓。","刿曰：“可矣。”","齐师败绩。","公将驰之。","刿曰：“未可。”","下视其辙，登轼而望之，曰：“可矣。”","遂逐齐师。","既克，公问其故。","对曰：“夫战，勇气也。","一鼓作气，再而衰，三而竭。","彼竭我盈，故克之。","夫大国，难测也，惧有伏焉。","吾视其辙乱，望其旗靡，故逐之。”"],"quote":[5],"preface":"","intro":"决定胜负的，有时是先问清缘由，再等准时机。","notes":[{"q":"肉食者","text":"居高位、享厚禄的人"},{"q":"间","text":"参与，读jiàn"},{"q":"鄙","text":"见识浅陋"},{"q":"牺牲","text":"祭祀用的牲畜"},{"q":"狱","text":"诉讼案件"},{"q":"忠","text":"尽心尽力"},{"q":"鼓","text":"击鼓进军"},{"q":"靡","text":"倒下"}],"background":"节选自《左传·庄公十年》，记鲁庄公十年齐鲁长勺之战。文章突出曹刿的判断，战斗过程本身着墨很少。","reading":[{"quote":"何以战","title":"在谈战术前先谈人心","text":"曹刿逐项追问出战依据，直到听见按实情处理案件才认可，将政治基础放在军事行动之前。"},{"quote":"未可","title":"克制也是行动的一部分","text":"两次“未可”与“可矣”构成紧张节奏，战后才说明士气与防伏原因，人物的审慎由叙事显示。"}],"thought":"文章重视民众支持、具体观察与判断时机。它呈现一种不被眼前冲动牵着走的思考方式。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_0c4d9d86a850.aspx","对照页所列异文或通假：遍 一作：徧。正文与旁注分开呈现，异文不混入原文。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zoujifengqiwangnajian","reason":"留意叙事中的观察：转身、细看和追问怎样改变对事情的判断。"},{"id":"hezhouji","reason":"留意叙事中的观察：转身、细看和追问怎样改变对事情的判断。"}],"extra":{"places":"齐、鲁、长勺｜故事发生在春秋齐鲁两国之间，主要联系今山东一带。长勺之战的具体地点有考订，通常联系今济南莱芜一带；古国的边界与现代市、省界不同。"}},{"id":"zoujifengqiwangnajian","title":"邹忌讽齐王纳谏","author":"zhanguoce","form":"古文·历史叙事","stage":["初中"],"scene":"mountain","tags":["reflection","dialogue","narrative","contrast","analogy","geo_linzi","geo_qilu"],"lines":["邹忌修八尺有余，而形貌昳丽。","朝服衣冠，窥镜，谓其妻曰：“我孰与城北徐公美？”","其妻曰：“君美甚，徐公何能及君也？”","城北徐公，齐国之美丽者也。","忌不自信，而复问其妾曰：“吾孰与徐公美？”","妾曰：“徐公何能及君也？”","旦日，客从外来，与坐谈，问之客曰：“吾与徐公孰美？”","客曰：“徐公不若君之美也。”","明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。","暮寝而思之，曰：“吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。”","于是入朝见威王，曰：“臣诚知不如徐公美。","臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。","今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。”","王曰：“善。”","乃下令：“群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤议于市朝，闻寡人之耳者，受下赏。”","令初下，群臣进谏，门庭若市；数月之后，时时而间进；期年之后，虽欲言，无可进者。","燕、赵、韩、魏闻之，皆朝于齐。","此所谓战胜于朝廷。"],"quote":[9],"preface":"","intro":"从一次照镜子开始，学会辨认好听话背后的理由。","notes":[{"q":"修","text":"身长、高"},{"q":"昳丽","text":"光艳美丽"},{"q":"私","text":"偏爱"},{"q":"服衣冠","text":"穿戴衣帽"},{"q":"讽","text":"委婉劝说"},{"q":"面刺","text":"当面指出"},{"q":"谤议","text":"公开议论批评"},{"q":"期年","text":"满一年，期读jī"}],"background":"选自《战国策·齐策一》。以邹忌比较容貌、反思赞美的家庭小事，引出劝齐威王听取不同意见的政治故事。","reading":[{"quote":"暮寝而思之","title":"答案相同，原因却不同","text":"妻妾客都夸赞邹忌，他没有停在悦耳结论，而追问偏爱、畏惧与求助怎样影响表达。"},{"quote":"王之蔽甚矣","title":"由小事推向更大的关系","text":"以家庭处境类比君王处境，让难以直说的批评变得可理解；故事也写出愿意听谏的重要。"}],"thought":"自省与倾听可以帮助人看见被赞美遮住的事实。真正有用的对话，需要说者的智慧，也需要听者留下空间。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_1bba692e2e4c.aspx","对照页所列异文或通假：谤议 一作：谤讥。正文与旁注分开呈现，异文不混入原文。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"lang","reason":"留意叙事中的观察：转身、细看和追问怎样改变对事情的判断。"},{"id":"caoguilunzhan","reason":"留意叙事中的观察：转身、细看和追问怎样改变对事情的判断。"}],"extra":{"places":"齐国、临淄｜故事所处的战国齐国，国都临淄在今山东淄博。燕、赵、韩、魏是文中朝见齐王的列国名称，范围随时局变化，不能当作现代省名替换。"}},{"id":"chushibiao","title":"出师表","author":"zhugeliang","form":"古文·表","stage":["初中"],"scene":"mountain","tags":["resolve","history","reflection","gratitude","dialogue","geo_nanyang","geo_yizhou","geo_luoyang"],"lines":["先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。","然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。","诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。","宫中府中，俱为一体，陟罚臧否，不宜异同。","若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。","侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。","愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。","将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。","愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。","亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。","先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。","侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。","臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。","先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。","后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。","先帝知臣谨慎，故临崩寄臣以大事也。","受命以来，夙夜忧叹，恐托付不效，以伤先帝之明；故五月渡泸，深入不毛。","今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。","此臣所以报先帝而忠陛下之职分也。","至于斟酌损益，进尽忠言，则攸之、祎、允之任也。","愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。","若无兴德之言，则责攸之、祎、允等之慢，以彰其咎；陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。","臣不胜受恩感激。","今当远离，临表涕零，不知所言。"],"quote":[9],"preface":"","intro":"临行前最放不下的，是嘱托，也是曾经得到的信任。","notes":[{"q":"崩殂","text":"帝王去世"},{"q":"秋","text":"时候"},{"q":"陟罚臧否","text":"奖惩善恶"},{"q":"裨补阙漏","text":"弥补缺失"},{"q":"卑鄙","text":"地位低微、见识浅陋"},{"q":"驱驰","text":"奔走效力"},{"q":"夙夜","text":"早晚"},{"q":"咨诹","text":"询问"}],"background":"诸葛亮于蜀汉建兴五年北伐前上表后主刘禅，通常称《前出师表》。既提出治国建议，也陈述受托以来的心志。","reading":[{"quote":"亲贤臣，远小人","title":"议论先给出具体方向","text":"开篇危局之后，文章围绕纳谏、法度、用人逐层展开，再用汉代兴亡作对照，建议并非空泛表忠。"},{"quote":"受任于败军之际","title":"公共责任背后有个人记忆","text":"回忆三顾与危难受命，使政治嘱托获得情感基础。末尾涕零呼应这份长期承受的信任。"}],"thought":"文章的动人处在于责任、感激与忧虑交织。理解古代君臣语境，也能读到一个人努力不负所托的真诚。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_8bc0871fe00b.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%AF%B8%E8%91%9B%E4%BA%AE","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"baorenanshu","reason":"同读未竟的心志，比较责任、著述、人格选择与寻求同道。"},{"id":"duangexing","reason":"同读未竟的心志，比较责任、著述、人格选择与寻求同道。"}],"extra":{"places":"南阳｜诸葛亮回述躬耕经历的古郡，范围跨今河南、湖北部分地区，具体躬耕地有不同考订。\n\n益州｜蜀汉所据的西南地域，主要涉及今四川盆地及周边，范围大于今天的四川省。\n\n旧都｜“还于旧都”通常解释为东汉都城洛阳，今河南洛阳，是北伐理想中的归向。"}},{"id":"shiwucongjunzheng","title":"十五从军征","author":"guyuefu","form":"乐府民歌","stage":["初中"],"scene":"mountain","tags":["war","family","sadness","compassion","narrative","contrast"],"lines":["十五从军征，","八十始得归。","道逢乡里人，","家中有阿谁？","遥看是君家，","松柏冢累累。","兔从狗窦入，","雉从梁上飞。","中庭生旅谷，","井上生旅葵。","舂谷持作饭，","采葵持作羹。","羹饭一时熟，","不知饴阿谁。","出门东向看，","泪落沾我衣。"],"quote":[0,1],"preface":"","intro":"终于回到家，饭做好了，却再没有人一起吃。","notes":[{"q":"阿谁","text":"谁"},{"q":"冢","text":"坟墓"},{"q":"狗窦","text":"墙脚供狗出入的洞"},{"q":"旅谷","text":"野生谷物"},{"q":"舂","text":"捣去谷壳"},{"q":"羹","text":"菜汤"},{"q":"饴","text":"同“贻”，给人吃"}],"background":"古乐府民歌，收入《乐府诗集》，通常归入汉乐府传统，具体成篇年代有讨论。诗写老兵归乡，以生活细节呈现长期征役的创伤。","reading":[{"quote":"十五从军征","title":"漫长一生被压缩成两个数字","text":"十五出征、八十始归，开头骤然越过几十年，让长期役使的沉重无需铺叙便显现。"},{"quote":"不知饴阿谁","title":"归家的动作遇见空缺","text":"做饭本是重建日常的努力，饭熟却无人可赠，家庭消失的痛苦在最普通的动作中达到深处。"}],"thought":"诗让战争的后果延续到归来之后。老兵需要的不只是回乡的路，更是本应与他共享生活的人。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_5f6efd08156d.aspx","对照页所列异文或通假：遥看 一作：遥望；东向看 一作：东向望。正文与旁注分开呈现，异文不混入原文。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"wuyi","reason":"同读古代征役歌辞，比较共同出发的昂扬与归家后的不同遭际。"},{"id":"mulanshi","reason":"同读古代征役歌辞，比较共同出发的昂扬与归家后的不同遭际。"},{"id":"caiwei","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"},{"id":"maowuweiqiufengsuopoge","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"}],"extra":{}},{"id":"baixuegesongwupanguanguijing","title":"白雪歌送武判官归京","author":"cencan","form":"七言古诗","stage":["初中"],"scene":"snow","tags":["snow","wind","friendship","farewell","frontier","metaphor","frontier_school","geo_tang_luntai","geo_tianshan","geo_xian"],"lines":["北风卷地白草折，","胡天八月即飞雪。","忽如一夜春风来，","千树万树梨花开。","散入珠帘湿罗幕，","狐裘不暖锦衾薄。","将军角弓不得控，","都护铁衣冷难着。","瀚海阑干百丈冰，","愁云惨淡万里凝。","中军置酒饮归客，","胡琴琵琶与羌笛。","纷纷暮雪下辕门，","风掣红旗冻不翻。","轮台东门送君去，","去时雪满天山路。","山回路转不见君，","雪上空留马行处。"],"quote":[3,4],"preface":"","intro":"漫天雪开成梨花，送别的路却越走越空。","notes":[{"q":"白草","text":"西北草名"},{"q":"控","text":"拉开弓"},{"q":"瀚海","text":"大沙漠"},{"q":"阑干","text":"纵横交错"},{"q":"中军","text":"主帅军帐"},{"q":"掣","text":"牵动、拉扯"},{"q":"冻不翻","text":"旗被冻住，难以飘动"}],"background":"岑参在西域军幕任职时送武判官归京之作。奇寒边地风物与军中饯别相连，末尾留下雪中行迹。","reading":[{"quote":"千树万树梨花开","title":"把奇寒转换为惊艳","text":"春风梨花的比喻与北地飞雪形成反差，写出突然降雪的繁盛，也显出诗人的新鲜感。"},{"quote":"雪上空留马行处","title":"视线比友人多停一会儿","text":"人已被山路遮住，目光仍留在雪上马迹；“空留”让热闹宴席后的不舍无声显现。"}],"thought":"边塞奇景与朋友情谊共同构成记忆。诗既能惊叹冰雪，也能在宏大风景中保留细微的离情。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_444df93c9bdf.aspx","对照页所列异文或通假：难着 一作：犹著。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%B2%91%E5%8F%82","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"cibeigushanxia","reason":"同在远行途中，比较江上乡书、马上口信与雪中送别如何表达牵挂。"},{"id":"fengrujingshi","reason":"同在远行途中，比较江上乡书、马上口信与雪中送别如何表达牵挂。"}],"extra":{"places":"轮台｜这里是唐轮台，通常定位在今新疆乌鲁木齐米东区一带；它与汉代轮台、今天巴音郭楞的轮台县不是同一地点。\n\n天山｜横跨今新疆及中亚的山系。题中“归京”所指为返回长安，即今陕西西安；朋友雪中远去的具体每一站并未列明。"}},{"id":"nanxiangzi","title":"南乡子·登京口北固亭有怀","author":"xinqiji","form":"词","stage":["初中"],"scene":"water","tags":["history","water","patriotism","bold","question","allusion","geo_zhenjiang"],"lines":["何处望神州？","满眼风光北固楼。","千古兴亡多少事？","悠悠。","不尽长江滚滚流。","年少万兜鍪，坐断东南战未休。","天下英雄谁敌手？","曹刘。","生子当如孙仲谋。"],"quote":[2],"preface":"","intro":"望着长江，问一问古人的胆识与今人的选择。","notes":[{"q":"神州","text":"这里指中原地区"},{"q":"兜鍪","text":"头盔，借指兵士"},{"q":"坐断","text":"占据、据守"},{"q":"曹刘","text":"曹操、刘备"},{"q":"孙仲谋","text":"孙权，字仲谋"}],"background":"辛弃疾任镇江知府期间登北固亭所作。借孙权在京口一带建立功业的历史，寄托对南宋局势的思考。","reading":[{"quote":"千古兴亡多少事","title":"提问让历史进入风景","text":"上片两问由眼前山河转向千古兴亡，长江不尽的流水成为时间感的回应。"},{"quote":"生子当如孙仲谋","title":"借古人的赞叹说自己的期待","text":"引曹操赞孙权的话收束，称赏敢于担当的年轻英雄，也隐含对当时执政者的期望。"}],"thought":"怀古并非只为追忆成功人物，也是借历史追问眼前的行动。词在山河与问答之间维持昂扬而深沉的关切。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_3cfc9856b57a.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%BE%9B%E5%BC%83%E7%96%BE","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"guoqinlun","reason":"借历史照见当下，比较凭吊、议论与对行动的期待。"},{"id":"xianyangchengdonglou","reason":"借历史照见当下，比较凭吊、议论与对行动的期待。"}],"extra":{"places":"京口、北固亭｜今江苏镇江北固山一带。词人从此处望江山，追问历史兴亡；所用孙权典故引入三国往事，不等于这座亭曾见证词中所有事件。"}},{"id":"quanxue","title":"劝学（节选）","author":"xunzi","form":"古文·论说","stage":["高中"],"scene":"mountain","tags":["learning","reflection","resolve","metaphor","contrast","analogy"],"lines":["君子曰：学不可以已。","青，取之于蓝，而青于蓝；冰，水为之，而寒于水。","木直中绳，𫐓以为轮，其曲中规。","虽有槁暴，不复挺者，𫐓使之然也。","故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。","吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。","登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。","假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。","君子生非异也，善假于物也。","积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。","故不积跬步，无以至千里；不积小流，无以成江海。","骐骥一跃，不能十步；驽马十驾，功在不舍。","锲而舍之，朽木不折；锲而不舍，金石可镂。","蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。","蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。"],"quote":[8],"preface":"","intro":"从染料、车轮到小溪，看改变怎样一点点发生。","notes":[{"q":"已","text":"停止"},{"q":"中绳","text":"合乎墨线，读zhòng"},{"q":"𫐓","text":"用火烘木使其弯曲"},{"q":"砺","text":"磨刀石"},{"q":"假","text":"借助"},{"q":"生","text":"同“性”，禀赋"},{"q":"跬步","text":"半步"},{"q":"锲","text":"雕刻"},{"q":"黄泉","text":"地下泉水"}],"background":"选自《荀子·劝学》，为常见节选，由“学不可以已”起，至“用心躁也”止，按公开选文保留四段；并非原篇全文。","reading":[{"quote":"善假于物也","title":"能力也来自人与工具的关系","text":"登高、顺风、车马、舟楫层层举例，把抽象的学习价值变为人人可理解的经验：不必独自完成一切。"},{"quote":"锲而不舍","title":"积累、坚持与专注互相支撑","text":"后段从积土积水写到骐骥驽马、雕刻与蚯蚓，以正反比喻反复论证，不将成长归结为一次天赋表现。"}],"thought":"文章相信人能够通过学习与实践改变自己。古代物类比喻服务于论证，如“蟹六跪”不宜当作现代生物知识。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_9b5ed8061abe.aspx","采用所列公开页的四段选文，自“君子曰：学不可以已”至“用心躁也”；不是《荀子·劝学》全文。“𫐓”为“輮”的简化字形，保留对照页写法。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8D%80%E5%AD%90","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shishuo","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"},{"id":"jiezishu","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"}],"extra":{}},{"id":"shishuo","title":"师说","author":"hanyu","form":"古文·说","stage":["高中"],"scene":"mountain","tags":["learning","reflection","dialogue","contrast","analogy"],"lines":["古之学者必有师。","师者，所以传道受业解惑也。","人非生而知之者，孰能无惑？","惑而不从师，其为惑也，终不解矣。","生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。","吾师道也，夫庸知其年之先后生于吾乎？","是故无贵无贱，无长无少，道之所存，师之所存也。","嗟乎！","师道之不传也久矣！","欲人之无惑也难矣！","古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。","是故圣益圣，愚益愚。","圣人之所以为圣，愚人之所以为愚，其皆出于此乎？","爱其子，择师而教之；于其身也，则耻师焉，惑矣。","彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。","句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。","巫医乐师百工之人，不耻相师。","士大夫之族，曰师曰弟子云者，则群聚而笑之。","问之，则曰：“彼与彼年相若也，道相似也，位卑则足羞，官盛则近谀。”","呜呼！","师道之不复，可知矣。","巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！","圣人无常师。","孔子师郯子、苌弘、师襄、老聃。","郯子之徒，其贤不及孔子。","孔子曰：三人行，则必有我师。","是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。","李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。","余嘉其能行古道，作《师说》以贻之。"],"quote":[6],"preface":"","intro":"承认有所不知，也就为相互学习打开了门。","notes":[{"q":"学者","text":"求学的人"},{"q":"所以","text":"用来……的"},{"q":"受业","text":"传授学业，受同“授”"},{"q":"庸","text":"岂、难道"},{"q":"句读","text":"文章断句"},{"q":"不必","text":"不一定"},{"q":"六艺经传","text":"六经及解释经文的著作"}],"background":"韩愈为李蟠作《师说》，批评当时士大夫耻于从师的风气。以古文表达对“道”与师承的看法，并为后学的选择辩护。","reading":[{"quote":"道之所存，师之所存也","title":"把选择老师的依据说清楚","text":"年龄、地位不应成为唯一尺度，关键是对方有可学习之处。开篇定义为后文批评提供依据。"},{"quote":"术业有专攻","title":"师生关系可以随所学而变化","text":"闻道先后与专长不同，使弟子未必处处不如老师。这一转折打破了固定高下的想象。"}],"thought":"文章鼓励正视疑惑、向人请教。其时代中的“道”有特定含义，而尊重专长、保持开放仍能启发今天的交流。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_178197fd7202.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%9F%A9%E6%84%88","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"songdongyangmashengxu","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"},{"id":"quanxue","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"}],"extra":{}},{"id":"chibifu","title":"赤壁赋","author":"sushi","form":"古文·赋","stage":["高中"],"scene":"moon","tags":["moon","water","wind","reflection","hope","dialogue","geo_huangzhou","geo_wuhan","geo_ezhou","geo_jiangling"],"lines":["壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。","清风徐来，水波不兴。","举酒属客，诵明月之诗，歌窈窕之章。","少焉，月出于东山之上，徘徊于斗牛之间。","白露横江，水光接天。","纵一苇之所如，凌万顷之茫然。","浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。","于是饮酒乐甚，扣舷而歌之。","歌曰：“桂棹兮兰桨，击空明兮溯流光。","渺渺兮予怀，望美人兮天一方。”","客有吹洞箫者，倚歌而和之。","其声呜呜然，如怨如慕，如泣如诉；余音袅袅，不绝如缕。","舞幽壑之潜蛟，泣孤舟之嫠妇。","苏子愀然，正襟危坐而问客曰：“何为其然也？”","客曰：“‘月明星稀，乌鹊南飞’，此非曹孟德之诗乎？","西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？","方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？","况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏樽以相属。","寄蜉蝣于天地，渺沧海之一粟。","哀吾生之须臾，羡长江之无穷。","挟飞仙以遨游，抱明月而长终。","知不可乎骤得，托遗响于悲风。”","苏子曰：“客亦知夫水与月乎？","逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。","盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！","且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。","惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭。","是造物者之无尽藏也，而吾与子之所共适。”","客喜而笑，洗盏更酌。","肴核既尽，杯盘狼籍。","相与枕藉乎舟中，不知东方之既白。"],"quote":[19],"preface":"","intro":"江上的月色，能不能回答人生短暂的疑问。","notes":[{"q":"既望","text":"农历十六"},{"q":"属","text":"劝酒，读zhǔ"},{"q":"一苇","text":"比喻小舟"},{"q":"冯虚","text":"凌空，冯同“凭”"},{"q":"愀然","text":"神色忧愁"},{"q":"蜉蝣","text":"生命短暂的昆虫"},{"q":"无尽藏","text":"无穷宝藏"},{"q":"枕藉","text":"相互枕着靠着"}],"background":"苏轼贬居黄州期间于元丰五年作，又称《前赤壁赋》。所游黄州赤壁与三国战场并非同一地点，文中借古迹联想展开主客问答。","reading":[{"quote":"哀吾生之须臾","title":"悲声把快乐推向深处","text":"箫声引出客人的历史联想，英雄也会消逝，个体更显渺小；文章认真容纳这一疑问才转入宽解。"},{"quote":"惟江上之清风","title":"从占有转向共同感受","text":"水月之辩改变观察尺度，清风明月则提供可实践的安顿：不必占有，也能共享眼前的美。"}],"thought":"旷达不是从未悲伤，而是经过追问后重新与世界相处。文章让短暂生命在自然、友情和当下感受中找到宽阔位置。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4cac23b07849.aspx","对照页所列异文或通假：共适 一作：共食。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8B%8F%E8%BD%BC","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yueyanglouji","reason":"从一场登临或游宴读到心境的转折，比较共同之乐与公共关怀。"},{"id":"zuiwengtingji","reason":"从一场登临或游宴读到心境的转折，比较共同之乐与公共关怀。"},{"id":"tengwanggexu","reason":"同望水月与江天，比较写景、生命追问与朋友相伴的乐趣。"},{"id":"wangdongting","reason":"同望水月与江天，比较写景、生命追问与朋友相伴的乐趣。"}],"extra":{"places":"赤壁｜苏轼游览的黄州赤壁，在今湖北黄冈黄州，通常不认作三国赤壁大战的实际战场。作品由眼前江景引出历史联想。\n\n夏口、武昌｜古夏口联系今武汉，文中三国时期的武昌联系今鄂州；这里的武昌不能直接等同今天武汉市武昌区。\n\n江陵｜曹操顺流东下的历史叙述中的地点，在今湖北荆州一带，并非苏轼这次夜游的目的地。"}},{"id":"dengtaishanji","title":"登泰山记","author":"yaonai","form":"古文·游记","stage":["高中"],"scene":"snow","tags":["mountain","snow","light","travel","narrative","space","tongcheng","geo_taishan","geo_beijing_city"],"lines":["泰山之阳，汶水西流；其阴，济水东流。","阳谷皆入汶，阴谷皆入济。","当其南北分者，古长城也。","最高日观峰，在长城南十五里。","余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。","是月丁未，与知府朱孝纯子颍由南麓登。","四十五里，道皆砌石为磴，其级七千有余。","泰山正南面有三谷。","中谷绕泰安城下，郦道元所谓环水也。","余始循以入，道少半，越中岭，复循西谷，遂至其巅。","古时登山，循东谷入，道有天门。","东谷者，古谓之天门溪水，余所不至也。","今所经中岭及山巅，崖限当道者，世皆谓之天门云。","道中迷雾冰滑，磴几不可登。","及既上，苍山负雪，明烛天南。","望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。","戊申晦，五鼓，与子颍坐日观亭，待日出。","大风扬积雪击面。","亭东自足下皆云漫。","稍见云中白若樗蒱数十立者，山也。","极天云一线异色，须臾成五采。","日上，正赤如丹，下有红光动摇承之。","或曰，此东海也。","回视日观以西峰，或得日，或否，绛皓驳色，而皆若偻。","亭西有岱祠，又有碧霞元君祠。","皇帝行宫在碧霞元君祠东。","是日观道中石刻，自唐显庆以来，其远古刻尽漫失。","僻不当道者，皆不及往。","山多石，少土。","石苍黑色，多平方，少圜。","少杂树，多松，生石罅，皆平顶。","冰雪，无瀑水，无鸟兽音迹。","至日观数里内无树，而雪与人膝齐。","桐城姚鼐记。"],"quote":[14],"preface":"","intro":"顶着风雪登山，只为等云边亮起那一道颜色。","notes":[{"q":"阳","text":"山南为阳，山北为阴。"},{"q":"磴","text":"石阶"},{"q":"限","text":"阻隔"},{"q":"晦","text":"农历月末一天"},{"q":"樗蒱","text":"古代博戏用具，借比云中山峰"},{"q":"绛皓","text":"红与白"},{"q":"漫失","text":"模糊磨灭"},{"q":"罅","text":"裂缝"}],"background":"姚鼐于乾隆三十九年岁末与朱孝纯登泰山后作。文章兼记地理、登临路线、日出和山中物候，体现桐城散文的简洁。","reading":[{"quote":"苍山负雪，明烛天南","title":"山像背着光走来","text":"“负”赋雪山以体态，“烛”将雪色写成照亮天空的光，极少文字构成鲜明画面。"},{"quote":"须臾成五采","title":"等待中的颜色有次序","text":"从一线异色到五彩、再到赤日，观察按时间推进；回望群峰则补足空间层次，使日出过程清晰可感。"}],"thought":"文章珍惜实地观看，也坦言未到之处。简练的记录并不冷淡，风雪、光色与攀登的身体感共同保存一次相遇。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_8bf5847fffd5.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%A7%9A%E9%BC%90","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"dengguanquelou","reason":"沿着仰望、登临与换位观看，体会山怎样打开人的视野。"},{"id":"dengfeilaifeng","reason":"沿着仰望、登临与换位观看，体会山怎样打开人的视野。"}],"extra":{"places":"泰山、泰安｜今山东泰安，是本文登山与观日出的地方；“京师”指作者启程的北京。\n\n汶水、济水、徂徕｜汶水联系今大汶河，济水为历史水系、古河道多已改变，徂徕山在泰安一带。“古长城”指齐长城遗迹，不是明长城。"}},{"id":"shizuo","title":"子路、曾皙、冉有、公西华侍坐","author":"lunyu","form":"古文·语录","stage":["高中"],"scene":"water","tags":["spring","water","reflection","dialogue","contrast","learning","geo_qufu"],"lines":["子路、曾皙、冉有、公西华侍坐。","子曰：“以吾一日长乎尔，毋吾以也。","居则曰：‘不吾知也！’","如或知尔，则何以哉？”","子路率尔而对曰：“千乘之国，摄乎大国之间，加之以师旅，因之以饥馑；由也为之，比及三年，可使有勇，且知方也。”","夫子哂之。","“求！","尔何如？”","对曰：“方六七十，如五六十，求也为之，比及三年，可使足民。","如其礼乐，以俟君子。”","“赤！","尔何如？”","对曰：“非曰能之，愿学焉。","宗庙之事，如会同，端章甫，愿为小相焉。”","“点！","尔何如？”","鼓瑟希，铿尔，舍瑟而作，对曰：“异乎三子者之撰。”","子曰：“何伤乎？","亦各言其志也。”","曰：“莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。”","夫子喟然叹曰：“吾与点也！”","三子者出，曾皙后。","曾皙曰：“夫三子者之言何如？”","子曰：“亦各言其志也已矣。”","曰：“夫子何哂由也？”","曰：“为国以礼，其言不让，是故哂之。”","“唯求则非邦也与？”","“安见方六七十如五六十而非邦也者？”","“唯赤则非邦也与？”","“宗庙会同，非诸侯而何？","赤也为之小，孰能为之大？”"],"quote":[16],"preface":"","intro":"几个人谈理想，有人谈治国，有人想在春风里唱着歌回家。","notes":[{"q":"侍坐","text":"陪坐于尊长旁"},{"q":"率尔","text":"轻率、急切貌"},{"q":"哂","text":"微笑"},{"q":"俟","text":"等待"},{"q":"端章甫","text":"穿礼服、戴礼帽"},{"q":"希","text":"同“稀”，瑟声渐稀"},{"q":"莫春","text":"暮春"},{"q":"与","text":"赞许"}],"background":"选自《论语·先进》。孔子请四位弟子谈志向，人物性情由回答与动作显现，结尾补充对前三人的评价。","reading":[{"quote":"鼓瑟希，铿尔，舍瑟而作","title":"一个人先由动作登场","text":"曾皙的回答来得较晚，瑟声渐稀、放下乐器、起身说话的细节，使其从容与子路的急切相对。"},{"quote":"咏而归","title":"理想变成可以生活的画面","text":"曾皙不先列治理措施，而呈现成年人和孩子共游的场景。其与礼治、太平生活的关系，历来有多种解释。"}],"thought":"这场对话让不同理想同时发声，也提醒人关注表达志向时的态度。具体生活的和乐，可以与宏大的公共理想相互照亮。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_736e296de7fd.aspx","对照页所列异文或通假：何伤 一作：何妨；莫 通：暮。正文与旁注分开呈现，异文不混入原文。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"pipaxingbingxu","reason":"从对话与艺术场景进入内心，看看动作、声音和细节怎样替人传情。"},{"id":"pusaman","reason":"从对话与艺术场景进入内心，看看动作、声音和细节怎样替人传情。"}],"extra":{"places":"沂、舞雩｜曾皙想象中的暮春出游地点。这里的沂水通常指鲁国都城附近、今山东曲阜境内的沂河；舞雩是祭天求雨的台。不要直接与今天临沂、沂水县所涉的沂河混为同一处游览地点。"}},{"id":"baorenanshu","title":"报任安书（节选）","author":"simaqian","form":"古文·书","stage":["高中"],"scene":"mountain","tags":["resolve","reflection","history","writing","allusion"],"lines":["古者富贵而名摩灭，不可胜记，唯倜傥非常之人称焉。","盖文王拘而演周易；仲尼厄而作春秋；屈原放逐，乃赋离骚；左丘失明，厥有国语；孙子膑脚，兵法修列；不韦迁蜀，世传吕览；韩非囚秦，说难、孤愤。","诗三百篇，大底圣贤发愤之所为作也。","此人皆意有所郁结，不得通其道，故述往事，思来者。","乃如左丘无目，孙子断足，终不可用，退而论书策以舒其愤，思垂空文以自见。","仆窃不逊，近自托于无能之辞，网罗天下放失旧闻，略考其行事，综其终始，稽其成败兴坏之纪，上计轩辕，下至于兹，为十表，本纪十二，书八章，世家三十，列传七十，凡百三十篇。","亦欲以究天人之际，通古今之变，成一家之言。","草创未就，会遭此祸，惜其不成，是以就极刑而无愠色。","仆诚以著此书，藏之名山，传之其人通邑大都，则仆偿前辱之责，虽万被戮，岂有悔哉！"],"quote":[3],"preface":"","intro":"有些话要写下来，才能越过眼前的误解。","notes":[{"q":"摩灭","text":"磨灭、消失"},{"q":"倜傥","text":"卓异洒脱"},{"q":"厥","text":"才、于是"},{"q":"大底","text":"大抵"},{"q":"放失","text":"散失"},{"q":"稽","text":"考察"},{"q":"天人之际","text":"自然与人事之间的关系"},{"q":"责","text":"债，此指先前耻辱所负的重担"}],"background":"司马迁答友人任安的书信，又称《报任少卿书》。此处选“古者富贵而名摩灭”至“岂有悔哉”两段，集中写受辱后坚持完成《史记》的原因。","reading":[{"quote":"故述往事，思来者","title":"把写作的时间指向后来","text":"列举困厄中著述的古人，是为解释文字如何承载不能在当世实现的心志，让后来的读者成为可能的知音。"},{"quote":"成一家之言","title":"忍耐背后有明确的工作","text":"作者并非笼统赞美苦难，而具体列出书的结构与目标。尚未完成的著述，构成继续生活的理由。"}],"thought":"文章珍惜表达与传承的力量。困厄不值得被美化，动人的是人在不公中仍努力保存经验、理解历史并向未来说话。","sources":["原文对照：https://zh.wikisource.org/wiki/%E5%A0%B1%E4%BB%BB%E5%B0%91%E5%8D%BF%E6%9B%B8","连续节选自“古者富贵而名摩灭”至“岂有悔哉”，不含全信其他段落。对照页繁体转为简体，保留“以著此书”等底本文字。","作者资料参阅：https://zh.wikisource.org/wiki/%E4%BD%9C%E8%80%85%3A%E5%8F%B8%E9%A6%AC%E9%81%B7；司马迁生卒年有不同考订，简介采用约数。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"lisao","reason":"同读未竟的心志，比较责任、著述、人格选择与寻求同道。"},{"id":"chushibiao","reason":"同读未竟的心志，比较责任、著述、人格选择与寻求同道。"}],"extra":{}},{"id":"guoqinlun","title":"过秦论·上篇","author":"jiayi","form":"古文·论","stage":["高中"],"scene":"mountain","tags":["history","reflection","contrast","analogy","politics","geo_sanqin","geo_bashu","geo_xianyang","geo_huashan","geo_yellowriver"],"lines":["秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。","当是时也，商君佐之，内立法度，务耕织，修守战之具，外连衡而斗诸侯。","于是秦人拱手而取西河之外。","孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。","诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。","当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。","此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、楚、齐、赵、宋、卫、中山之众。","于是六国之士，有甯越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。","尝以十倍之地，百万之众，叩关而攻秦。","秦人开关延敌，九国之师，逡巡而不敢进。","秦无亡矢遗镞之费，而天下诸侯已困矣。","于是从散约败，争割地而赂秦。","秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹；因利乘便，宰割天下，分裂山河。","强国请服，弱国入朝。","延及孝文王、庄襄王，享国之日浅，国家无事。","及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。","南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。","乃使蒙恬北筑长城而守藩篱，却匈奴七百余里；胡人不敢南下而牧马，士不敢弯弓而报怨。","于是废先王之道，焚百家之言，以愚黔首；隳名城，杀豪杰；收天下之兵，聚之咸阳，销锋镝，铸以为金人十二，以弱天下之民。","然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。","良将劲弩守要害之处，信臣精卒陈利兵而谁何。","天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。","始皇既没，余威震于殊俗。","然陈涉瓮牖绳枢之子，","氓隶之人，","而迁徙之徒也；","才能不及中人，","非有仲尼、墨翟之贤，","陶朱、猗顿之富；","蹑足行伍之间，","而倔起阡陌之中，","率疲弊之卒，","将数百之众，","转而攻秦；","斩木为兵，","揭竿为旗，","天下云集响应，","赢粮而景从。","山东豪俊遂并起而亡秦族矣。","且夫天下非小弱也，雍州之地，崤函之固，自若也。","陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄櫌棘矜，非铦于钩戟长铩也；谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及乡时之士也。","然而成败异变，功业相反，何也？","试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。","然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；一夫作难而七庙隳，身死人手，为天下笑者，何也？","仁义不施而攻守之势异也。"],"quote":[0],"preface":"","intro":"极强盛的帝国，为什么会在短时间里失去根基。","notes":[{"q":"过秦","text":"指出秦的过失"},{"q":"崤函","text":"崤山、函谷关"},{"q":"连衡","text":"连横"},{"q":"合从","text":"合纵"},{"q":"黔首","text":"百姓"},{"q":"瓮牖绳枢","text":"以破瓮作窗、绳子系门轴，形容贫寒"},{"q":"景从","text":"如影跟随"},{"q":"七庙","text":"宗庙，代指政权"}],"background":"贾谊《过秦论》有上中下三篇，本篇收上篇全文。写于西汉初年，以秦的兴亡为汉朝提供政治借鉴；史事铺陈服务于论证，并非逐年实录。","reading":[{"quote":"有席卷天下","title":"铺陈先把秦的力量推到极高","text":"连续近义短语和历代扩张，形成强盛不可阻的势头，前文越充分，后文骤亡越值得追问。"},{"quote":"仁义不施而攻守之势异也","title":"最后一句回应全部反差","text":"陈涉弱小与秦国强大反复比较，最终将原因指向统治方式：夺取天下与治理天下需要不同的基础。"}],"thought":"文章以历史盛衰思考权力与民心。它是一种鲜明的政治解释，阅读时可欣赏论证气势，也保留对历史复杂性的认识。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_166993e31db3.aspx","收《过秦论》上篇全文；原候选清单仅写“节选”，这里明确为上篇，不含中、下篇。","对照页所列异文或通假：乡时 一作：向时。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%B4%BE%E8%B0%8A","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shuxiang","reason":"借历史照见当下，比较凭吊、议论与对行动的期待。"},{"id":"nanxiangzi","reason":"借历史照见当下，比较凭吊、议论与对行动的期待。"}],"extra":{"places":"崤函、雍州、关中｜秦国据守的山川区域：崤山在今河南西部，函谷关有不同时期的关址；雍州、关中主要联系今陕西及周边，范围随历史变化。\n\n巴、蜀、咸阳｜巴蜀涉及今四川、重庆等地；咸阳是秦都所在，今陕西咸阳一带。\n\n华、河、山东｜“践华为城，因河为池”以华山和黄河写天然险要；“山东豪俊”指崤山以东的诸侯区域，不是现代山东省。桂林、象郡等秦代郡名也不能直接套用今天的市界。"}},{"id":"chenqingbiao","title":"陈情表","author":"limi","form":"古文·表","stage":["高中"],"scene":"mountain","tags":["family","gratitude","sadness","dialogue","contrast"],"lines":["臣密言：臣以险衅，夙遭闵凶。","生孩六月，慈父见背；行年四岁，舅夺母志。","祖母刘愍臣孤弱，躬亲抚养。","臣少多疾病，九岁不行，零丁孤苦，至于成立。","既无伯叔，终鲜兄弟，门衰祚薄，晚有儿息。","外无期功强近之亲，内无应门五尺之僮，茕茕孑立，形影相吊。","而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。","逮奉圣朝，沐浴清化。","前太守臣逵察臣孝廉；后刺史臣荣举臣秀才。","臣以供养无主，辞不赴命。","诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。","猥以微贱，当侍东宫，非臣陨首所能上报。","臣具以表闻，辞不就职。","诏书切峻，责臣逋慢；郡县逼迫，催臣上道；州司临门，急于星火。","臣欲奉诏奔驰，则刘病日笃，欲苟顺私情，则告诉不许：臣之进退，实为狼狈。","伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。","且臣少仕伪朝，历职郎署，本图宦达，不矜名节。","今臣亡国贱俘，至微至陋，过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀。","但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。","臣无祖母，无以至今日，祖母无臣，无以终余年。","母、孙二人，更相为命，是以区区不能废远。","臣密今年四十有四，祖母今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。","乌鸟私情，愿乞终养。","臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土实所共鉴。","愿陛下矜愍愚诚，听臣微志，庶刘侥幸，保卒余年。","臣生当陨首，死当结草。","臣不胜犬马怖惧之情，谨拜表以闻。"],"quote":[19],"preface":"","intro":"被祖母抚养长大的人，想先陪她走完最后一段路。","notes":[{"q":"险衅","text":"坎坷不幸"},{"q":"闵凶","text":"忧患丧事"},{"q":"见背","text":"长辈去世"},{"q":"成立","text":"长大成人"},{"q":"茕茕","text":"孤独貌"},{"q":"婴","text":"缠绕"},{"q":"洗马","text":"太子属官，洗读xiǎn"},{"q":"告诉","text":"申诉"},{"q":"日薄西山","text":"太阳迫近西山，比喻生命将尽"}],"background":"李密在蜀汉灭亡后受晋朝征召，向晋武帝上表陈述暂缓赴任、奉养祖母的请求。政治处境使其措辞格外谨慎。","reading":[{"quote":"臣无祖母，无以至今日","title":"将亲情写成互相成全","text":"两句回环，先说祖母养育自己，再说自己照护祖母。请求因此有了共同生活的事实基础。"},{"quote":"报养刘之日短也","title":"把难题转成时间安排","text":"作者不直接对抗征召，而比较尽忠与尽孝的时间，争取先终养再任职的可能，情理相互支持。"}],"thought":"文章表达照护者对亲情与责任的珍惜。真挚感情与审慎说理并行，让私人生活的需要获得可被理解的声音。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_f84986dafb2d.aspx","对照页所列异文或通假：愍 一作：悯；孑立 一作：独立；矜愍 一作：矜悯。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%A5%BF%E6%99%8B%C2%B7%E6%9D%8E%E5%AF%86","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"huixiangoushu","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"},{"id":"yueyeyishedi","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"}],"extra":{}},{"id":"lantingjixu","title":"兰亭集序","author":"wangxizhi","form":"古文·序","stage":["高中"],"scene":"water","tags":["spring","water","bamboo","joy","reflection","timepassing","geo_shaoxing"],"lines":["永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。","群贤毕至，少长咸集。","此地有崇山峻岭，茂林修竹；又有清流激湍，映带左右，引以为流觞曲水，列坐其次。","虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。","是日也，天朗气清，惠风和畅。","仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。","夫人之相与，俯仰一世，或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。","虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至。","及其所之既倦，情随事迁，感慨系之矣。","向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀。","况修短随化，终期于尽。","古人云：“死生亦大矣。”","岂不痛哉！","每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。","固知一死生为虚诞，齐彭殇为妄作。","后之视今，亦犹今之视昔，悲夫！","故列叙时人，录其所述，虽世殊事异，所以兴怀，其致一也。","后之览者，亦将有感于斯文。"],"quote":[5],"preface":"","intro":"快乐的一天，也会让人忽然想到时间。","notes":[{"q":"修禊","text":"临水祓除不祥的古俗"},{"q":"流觞曲水","text":"酒杯随曲水漂流的宴饮方式"},{"q":"修竹","text":"高竹"},{"q":"游目骋怀","text":"放眼观看、舒展胸怀"},{"q":"趣舍","text":"取舍"},{"q":"彭殇","text":"长寿者与夭折者"},{"q":"契","text":"契合的凭证"}],"background":"王羲之为永和九年兰亭修禊聚会所作诗集序。先记山水宴集之乐，再思生命有限与后世读者的共感。","reading":[{"quote":"信可乐也","title":"快乐先被充分承认","text":"群贤、山水、天朗气清与一觞一咏构成真实的欢愉，后来的感伤并不抹去这一天的美好。"},{"quote":"后之视今，亦犹今之视昔","title":"把此刻交给未来的读者","text":"由今昔推到后世，序文自身也成为保存相遇的方式；时间使人分离，文字又使感受相通。"}],"thought":"正因为生命会流逝，相遇与欢娱才值得记录。文章不轻率抹平生死差异，而在有限中珍惜真实经历。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_af279f0cdd95.aspx","对照页所列异文或通假：悟 一作：晤；趣 一作：曲；快 一作：怏。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E7%BE%B2%E4%B9%8B","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"denggao","reason":"同读时间留下的感受，比较回忆、沉默与难以概括的愁绪。"},{"id":"chounuer","reason":"同读时间留下的感受，比较回忆、沉默与难以概括的愁绪。"}],"extra":{"places":"会稽山阴、兰亭｜雅集地点在今浙江绍兴一带。会稽为古郡名，山阴为古县名，兰亭为聚会之所；三者是不同层级的地点，而非三个相隔很远的城市。"}},{"id":"guiqulaixicibingxu","title":"归去来兮辞并序","author":"taoyuanming","form":"古文·辞","stage":["高中"],"scene":"mountain","tags":["nature","family","quiet","freedom","reflection","contrast","geo_pengze","geo_jiujiang","geo_ezhou"],"lines":["归去来兮，田园将芜胡不归？","既自以心为形役，奚惆怅而独悲？","悟已往之不谏，知来者之可追。","实迷途其未远，觉今是而昨非。","舟遥遥以轻飏，风飘飘而吹衣。","问征夫以前路，恨晨光之熹微。","乃瞻衡宇，载欣载奔。","僮仆欢迎，稚子候门。","三径就荒，松菊犹存。","携幼入室，有酒盈樽。","引壶觞以自酌，眄庭柯以怡颜。","倚南窗以寄傲，审容膝之易安。","园日涉以成趣，门虽设而常关。","策扶老以流憩，时矫首而遐观。","云无心以出岫，鸟倦飞而知还。","景翳翳以将入，抚孤松而盘桓。","归去来兮，请息交以绝游。","世与我而相违，复驾言兮焉求？","悦亲戚之情话，乐琴书以消忧。","农人告余以春及，将有事于西畴。","或命巾车，或棹孤舟。","既窈窕以寻壑，亦崎岖而经丘。","木欣欣以向荣，泉涓涓而始流。","善万物之得时，感吾生之行休。","已矣乎！","寓形宇内复几时？","曷不委心任去留？","胡为乎遑遑欲何之？","富贵非吾愿，帝乡不可期。","怀良辰以孤往，或植杖而耘耔。","登东皋以舒啸，临清流而赋诗。","聊乘化以归尽，乐夫天命复奚疑！"],"quote":[2],"preface":"余家贫，耕植不足以自给。幼稚盈室，瓶无储粟，生生所资，未见其术。亲故多劝余为长吏，脱然有怀，求之靡途。会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。故便求之。及少日，眷然有归欤之情。何则？质性自然，非矫厉所得。饥冻虽切，违己交病。尝从人事，皆口腹自役。于是怅然慷慨，深愧平生之志。犹望一稔，当敛裳宵逝。寻程氏妹丧于武昌，情在骏奔，自免去职。仲秋至冬，在官八十余日。因事顺心，命篇曰《归去来兮》。乙巳岁十一月也。","intro":"回家这件事，也可以是一场重新选择生活的出发。","notes":[{"q":"谏","text":"挽回"},{"q":"衡宇","text":"简陋房屋"},{"q":"三径","text":"隐居者庭院路径"},{"q":"寄傲","text":"寄托自得之情"},{"q":"扶老","text":"手杖"},{"q":"岫","text":"山穴、山峰间"},{"q":"耘耔","text":"除草培土"},{"q":"乘化","text":"顺应自然变化"}],"background":"陶渊明辞去彭泽县令后作，序中自述在官八十余日及辞官缘由。正文含归途、家居与未来田园生活的想象，并非全为同日实录。","reading":[{"quote":"知来者之可追","title":"承认过去，同时给未来留路","text":"文章不反复惩罚自己，而以“未远”判断仍能调整方向，归去由此成为主动选择。"},{"quote":"云无心以出岫","title":"自然的动作回应内心愿望","text":"云舒展、鸟归还，既是庭园所见，也投射摆脱拘束、顺应本性的心境，景与情不着痕迹地相合。"}],"thought":"作品珍惜与本性相安的生活，也承认生计与选择的张力。归田不是放之四海皆准的答案，而是作者寻找内在一致的方式。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_987458864738.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%99%B6%E6%B8%8A%E6%98%8E","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"guiyuan","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"},{"id":"xingxiangzi","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"}],"extra":{"places":"彭泽｜序文中辞去的县令任所，在今江西九江彭泽一带；归田后的家园联系浔阳柴桑，今九江一带。\n\n武昌｜序中“寻程氏妹丧于武昌”所涉的晋代武昌，今湖北鄂州，不是今天武汉市武昌区。“西畴”是家乡西边田地的方位说法，不是县名。"}},{"id":"tengwanggexu","title":"滕王阁序（节选）","author":"wangbo","form":"古文·骈文","stage":["高中"],"scene":"water","tags":["autumn","water","light","animal","space","parallel","geo_nanchang","geo_poyang","geo_hengyang"],"lines":["时维九月，序属三秋。","潦水尽而寒潭清，烟光凝而暮山紫。","俨骖騑于上路，访风景于崇阿。","临帝子之长洲，得天人之旧馆。","层峦耸翠，上出重霄；飞阁流丹，下临无地。","鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。","披绣闼，俯雕甍。","山原旷其盈视，川泽纡其骇瞩。","闾阎扑地，钟鸣鼎食之家；舸舰弥津，青雀黄龙之舳。","云销雨霁，彩彻区明。","落霞与孤鹜齐飞，秋水共长天一色。","渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。"],"quote":[1],"preface":"","intro":"让目光从山峦移到江天，再听见远处的渔歌。","notes":[{"q":"序属三秋","text":"秋季的第三个月，即农历九月；与“时维九月”相应。"},{"q":"潦水","text":"积水"},{"q":"骖騑","text":"驾车的马"},{"q":"绣闼","text":"装饰华美的门"},{"q":"甍","text":"屋脊"},{"q":"舸舰","text":"大船"},{"q":"鹜","text":"野鸭"},{"q":"彭蠡","text":"鄱阳湖"}],"background":"王勃《滕王阁序》中的写景段，选“时维九月”至“声断衡阳之浦”。原文为洪州滕王阁宴集序，写作年龄有不同说法，不据传说确定。","reading":[{"quote":"潦水尽而寒潭清","title":"用变化写出秋的清明","text":"水退、潭清、烟凝、山紫，紧凑对句同时调动色彩和状态，秋景从动态转成澄澈。"},{"quote":"落霞与孤鹜齐飞","title":"在同一视野里安放动静与远近","text":"飞霞孤鸟有运动，秋水长天成一色；上下两句对偶，使局部生命与辽阔空间彼此衬托。"}],"thought":"片段呈现观看世界的丰沛能力。整齐骈句并非只有装饰，它能安排视线与声音，使辽远秋景层层展开。","sources":["原文对照：https://zh.wikisource.org/wiki/%E6%BB%95%E7%8E%8B%E9%96%A3%E5%BA%8F","连续节选自“时维九月”至“声断衡阳之浦”。对照页正文作“层台耸翠”、列“峦”异文，本篇取通行“层峦耸翠”；“骖𬴂”采用字形“骖騑”。其余采用该页正文。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chunjianghuayueye","reason":"同望水月与江天，比较写景、生命追问与朋友相伴的乐趣。"},{"id":"chibifu","reason":"同望水月与江天，比较写景、生命追问与朋友相伴的乐趣。"}],"extra":{"places":"滕王阁｜题中的宴集地点，在今江西南昌。\n\n彭蠡 → 鄱阳湖｜“渔舟唱晚”的声景向这里延展；湖名、湖岸与历史水域范围有变化。\n\n衡阳之浦｜雁阵所向的南方远景，联系今湖南衡阳及雁止于此的文学传统；并非从阁上能直接望见衡阳。"}},{"id":"chunjianghuayueye","title":"春江花月夜","author":"zhangruoxu","form":"七言古诗","stage":["高中"],"scene":"moon","tags":["moon","water","flower","love","reflection","timepassing","geo_jieshi","geo_xiaoxiang"],"lines":["春江潮水连海平，","海上明月共潮生。","滟滟随波千万里，","何处春江无月明。","江流宛转绕芳甸，","月照花林皆似霰。","空里流霜不觉飞，","汀上白沙看不见。","江天一色无纤尘，","皎皎空中孤月轮。","江畔何人初见月？","江月何年初照人？","人生代代无穷已，","江月年年望相似。","不知江月待何人，","但见长江送流水。","白云一片去悠悠，","青枫浦上不胜愁。","谁家今夜扁舟子？","何处相思明月楼？","可怜楼上月裴回，","应照离人妆镜台。","玉户帘中卷不去，","捣衣砧上拂还来。","此时相望不相闻，","愿逐月华流照君。","鸿雁长飞光不度，","鱼龙潜跃水成文。","昨夜闲潭梦落花，","可怜春半不还家。","江水流春去欲尽，","江潭落月复西斜。","斜月沉沉藏海雾，","碣石潇湘无限路。","不知乘月几人归，","落月摇情满江树。"],"quote":[10,11],"preface":"","intro":"月亮升起又落下，江边的人仍在问，也仍在想念。","notes":[{"q":"芳甸","text":"芳草丰茂的原野"},{"q":"霰","text":"小冰粒，此处比喻月照花林"},{"q":"纤尘","text":"细微尘埃"},{"q":"扁舟子","text":"舟中游子"},{"q":"捣衣砧","text":"捶洗衣物的石板"},{"q":"月华","text":"月光"}],"background":"张若虚沿用乐府旧题写成歌行。具体创作时地无确证，诗以春江月夜贯穿景物、生命追问与游子思妇的相思。","reading":[{"quote":"江畔何人初见月","title":"由风景打开时间的深处","text":"澄澈月夜引出人与月谁先相遇的追问，诗不急于回答，而让代代人生与年年江月相照。"},{"quote":"玉户帘中卷不去","title":"月光像无法排遣的思念","text":"卷帘、拂砧本是动作，月色却处处仍在。看不见的牵念借无处不在的月光获得形体。"}],"thought":"诗让个人相思与人类共同的时间感相遇。月色既照见生命有限，也将分隔两地的人放进同一个温柔空间。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_3aed26d1fa99.aspx","对照页所列异文或通假：望相似 一作：只相似；裴回 一作：徘徊；落月 一作：落花。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%BC%A0%E8%8B%A5%E8%99%9A","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chengtian","reason":"同望水月与江天，比较写景、生命追问与朋友相伴的乐趣。"},{"id":"tengwanggexu","reason":"同望水月与江天，比较写景、生命追问与朋友相伴的乐趣。"}],"extra":{"places":"碣石、潇湘｜诗中分处南北的地域意象。碣石常联系今河北海滨，古地望有讨论；潇湘是今湖南湘江、潇水及相关区域的称谓。两地写游子与思妇相隔遥远，不据此推定作者的唯一写作现场。"}},{"id":"jingnv","title":"静女","author":"shijing","form":"四言诗","stage":["高中"],"scene":"mountain","tags":["love","joy","folk","narrative","repetition"],"lines":["静女其姝，","俟我于城隅。","爱而不见，","搔首踟蹰。","静女其娈，","贻我彤管。","彤管有炜，","说怿女美。","自牧归荑，","洵美且异。","匪女之为美，","美人之贻。"],"quote":[3,4],"preface":"","intro":"一件普通小礼物，因为送它的人而发亮。","notes":[{"q":"静女","text":"娴雅的女子"},{"q":"姝","text":"美好"},{"q":"俟","text":"等待"},{"q":"爱","text":"同“薆”，隐藏"},{"q":"彤管","text":"红色管状物，具体所指有争论"},{"q":"说怿","text":"喜悦"},{"q":"归荑","text":"赠送初生白茅，归通“馈”"},{"q":"洵","text":"确实"}],"background":"《诗经·邶风》篇章，以第一人称写约会等待与接受赠物。人物身份不详，传统解释多样，此处从诗中的相悦情境阅读。","reading":[{"quote":"搔首踟蹰","title":"等待的焦急藏在小动作里","text":"对方暂不现身，叙述者抓头徘徊，短短四字比直接说心急更生动，也带着年轻的趣味。"},{"quote":"美人之贻","title":"礼物的价值来自关系","text":"结尾解释自己为何珍爱荑草：美好并非只在物本身，而在相赠者的心意。"}],"thought":"诗记录爱慕中轻微的紧张与喜悦。被珍惜的普通物件，也能成为人与人之间独有的记忆。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_87e447468c9e.aspx","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"mang","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"},{"id":"wuti","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"}],"extra":{}},{"id":"wuyi","title":"无衣·岂曰无衣","author":"shijing","form":"四言诗","stage":["高中"],"scene":"mountain","tags":["war","friendship","resolve","folk","repetition","dialogue"],"lines":["岂曰无衣？","与子同袍。","王于兴师，","修我戈矛，","与子同仇！","岂曰无衣？","与子同泽。","王于兴师，","修我矛戟，","与子偕作！","岂曰无衣？","与子同裳。","王于兴师，","修我甲兵，","与子偕行！"],"quote":[0,1],"preface":"","intro":"“与你一起”反复响起，成为整首诗的力量。","notes":[{"q":"袍","text":"长袍"},{"q":"泽","text":"同“襗”，贴身衣物"},{"q":"兴师","text":"起兵"},{"q":"甲兵","text":"铠甲和兵器"},{"q":"偕作","text":"一起行动"},{"q":"偕行","text":"一同出发"}],"background":"《诗经·秦风》篇章，以同袍相约的口吻写共同出征。具体对应哪次战争尚难确定，不作唯一历史事件指认。","reading":[{"quote":"岂曰无衣","title":"用问答建立共同立场","text":"开头反问立刻接“与子”，把困乏转成相互支持；三章重复，使声音像众人应和。"},{"quote":"与子偕行","title":"每一章都向行动推进","text":"同仇、偕作、偕行由情绪共鸣走向实际出发，少量换字形成递进的动员节奏。"}],"thought":"诗突出共同承担与互相支持的情感。理解其战争语境，也能听见人在艰难处境中不愿让同伴孤立的承诺。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4830155d39b2.aspx","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"mulanshi","reason":"同读古代征役歌辞，比较共同出发的昂扬与归家后的不同遭际。"},{"id":"shiwucongjunzheng","reason":"同读古代征役歌辞，比较共同出发的昂扬与归家后的不同遭际。"}],"extra":{}},{"id":"mang","title":"氓","author":"shijing","form":"四言诗","stage":["高中"],"scene":"mountain","tags":["love","sadness","resolve","family","narrative","contrast","geo_qishui"],"lines":["氓之蚩蚩，","抱布贸丝。","匪来贸丝，","来即我谋。","送子涉淇，","至于顿丘。","匪我愆期，","子无良媒。","将子无怒，","秋以为期。","乘彼垝垣，","以望复关。","不见复关，","泣涕涟涟。","既见复关，","载笑载言。","尔卜尔筮，","体无咎言。","以尔车来，","以我贿迁。","桑之未落，","其叶沃若。","于嗟鸠兮，","无食桑葚！","于嗟女兮，","无与士耽！","士之耽兮，","犹可说也。","女之耽兮，","不可说也。","桑之落矣，","其黄而陨。","自我徂尔，","三岁食贫。","淇水汤汤，","渐车帷裳。","女也不爽，","士贰其行。","士也罔极，","二三其德。","三岁为妇，","靡室劳矣。","夙兴夜寐，","靡有朝矣。","言既遂矣，","至于暴矣。","兄弟不知，","咥其笑矣。","静言思之，","躬自悼矣。","及尔偕老，","老使我怨。","淇则有岸，","隰则有泮。","总角之宴，","言笑晏晏。","信誓旦旦，","不思其反。","反是不思，","亦已焉哉！"],"quote":[20,21],"preface":"","intro":"回望曾经的誓言，一个人终于把自己的经历说清。","notes":[{"q":"氓","text":"男子，此处指诗中男方"},{"q":"蚩蚩","text":"忠厚或笑嘻嘻的样子"},{"q":"愆期","text":"延误日期"},{"q":"贿","text":"财物"},{"q":"说","text":"通“脱”，脱身"},{"q":"爽","text":"差错"},{"q":"隰","text":"低湿之地"},{"q":"泮","text":"同“畔”，边岸"}],"background":"《诗经·卫风》篇章，以女子口吻回顾恋爱、婚变与决绝。人物没有可考姓名，诗中的自述构成对不平等处境的有力呈现。","reading":[{"quote":"桑之未落，其叶沃若","title":"草木盛衰与生命经历互映","text":"桑叶由润泽到黄落，连接恋爱时的希望与婚后的受伤。比兴把时间变化写得可感。"},{"quote":"亦已焉哉","title":"叙述之后作出自己的决定","text":"结尾不再等待对方履约，而在回忆誓言后表示止息。痛苦仍在，叙述者却重新获得判断与发声的位置。"}],"thought":"诗让女性经验成为中心，揭示变心、劳作与暴力带来的伤害。它值得被读作对尊重和自主的要求，而非对受伤者的责备。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_c7a0f08d98cd.aspx","对照页所列异文或通假：尔 一作：尓。正文与旁注分开呈现，异文不混入原文。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shejiangcaifurong","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"},{"id":"jingnv","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"}],"extra":{"places":"淇水｜女子往返叙事中的河流，联系今河南鹤壁、淇县一带的淇河。\n\n顿丘、复关｜爱情与婚姻叙述中的地点。“顿丘”的古县沿革、具体地望有考订；“复关”也可借指居于彼处的男子，不宜仅凭今天同名地名作唯一定位。"}},{"id":"lisao","title":"离骚（节选）","author":"quyuan","form":"楚辞","stage":["高中"],"scene":"flower","tags":["resolve","flower","solitude","aspiration","imagination","symbol"],"lines":["长太息以掩涕兮，","哀民生之多艰。","余虽好修姱以鞿羁兮，","謇朝谇而夕替。","既替余以蕙纕兮，","又申之以揽茝。","亦余心之所善兮，","虽九死其犹未悔。","怨灵修之浩荡兮，","终不察夫民心。","众女嫉余之蛾眉兮，","谣诼谓余以善淫。","固时俗之工巧兮，","偭规矩而改错。","背绳墨以追曲兮，","竞周容以为度。","忳郁邑余侘傺兮，","吾独穷困乎此时也。","宁溘死以流亡兮，","余不忍为此态也。","鸷鸟之不群兮，","自前世而固然。","何方圜之能周兮，","夫孰异道而相安？","屈心而抑志兮，","忍尤而攘诟。","伏清白以死直兮，","固前圣之所厚。","悔相道之不察兮，","延伫乎吾将反。","回朕车以复路兮，","及行迷之未远。","步余马于兰皋兮，","驰椒丘且焉止息。","进不入以离尤兮，","退将复修吾初服。","制芰荷以为衣兮，","集芙蓉以为裳。","不吾知其亦已兮，","苟余情其信芳。","高余冠之岌岌兮，","长余佩之陆离。","芳与泽其杂糅兮，","唯昭质其犹未亏。","忽反顾以游目兮，","将往观乎四荒。","佩缤纷其繁饰兮，","芳菲菲其弥章。","民生各有所乐兮，","余独好修以为常。","虽体解吾犹未变兮，","岂余心之可惩？"],"quote":[6,7],"preface":"","intro":"把不愿放弃的品格，佩在香草与衣裳之间。","notes":[{"q":"修姱","text":"修洁美好"},{"q":"谇","text":"进谏、责告，此处常释进谏"},{"q":"替","text":"废弃"},{"q":"蕙纕","text":"佩戴的蕙草"},{"q":"谣诼","text":"造谣毁谤"},{"q":"侘傺","text":"失意貌"},{"q":"初服","text":"原先服饰，象征本初志向"},{"q":"惩","text":"因受挫而改变或止息"}],"background":"选自屈原《离骚》“长太息以掩涕兮”至“岂余心之可惩”连续段落。诗以自述、象征与想象表达受挫后的坚持，全篇远长于本节选。","reading":[{"quote":"亦余心之所善兮","title":"价值选择成为反复的支点","text":"外界的贬弃与内心认同相对，诗不是无痛的宣言，而是在委屈、怨愤中反复确认所珍惜之物。"},{"quote":"制芰荷以为衣兮","title":"用可以想象的形象写人格","text":"荷衣、芙蓉裳与芳香佩饰组成象征系统，将清洁自守的心志化为可见可闻的美。"}],"thought":"诗珍重不随流俗改变的自我，也诚实呈现孤独与动摇。激烈誓言属于诗性表达，核心在于保存内心认同的价值。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_921fd7b1875a.aspx","连续节选自“长太息以掩涕兮”至“岂余心之可惩”。所列对照页还收原作开头另一段；本篇不将两处不相连的选段拼作连续原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%B1%88%E5%8E%9F","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"duangexing","reason":"同读未竟的心志，比较责任、著述、人格选择与寻求同道。"},{"id":"baorenanshu","reason":"同读未竟的心志，比较责任、著述、人格选择与寻求同道。"}],"extra":{}},{"id":"shejiangcaifurong","title":"涉江采芙蓉","author":"gushi19","form":"五言古诗","stage":["高中"],"scene":"water","tags":["flower","water","love","homesick","sadness","question"],"lines":["涉江采芙蓉，","兰泽多芳草。","采之欲遗谁？","所思在远道。","还顾望旧乡，","长路漫浩浩。","同心而离居，","忧伤以终老。"],"quote":[2,3],"preface":"","intro":"花已经采在手里，想送的人却在远方。","notes":[{"q":"芙蓉","text":"荷花"},{"q":"兰泽","text":"生有兰草的水泽"},{"q":"遗","text":"赠送，读wèi"},{"q":"还顾","text":"回头望"},{"q":"漫浩浩","text":"路途遥远无边"},{"q":"同心","text":"彼此相爱、心意相通"}],"background":"《古诗十九首》之一，收入《文选》，一般认为形成于东汉文人五言诗传统。叙述视角有不同解释，不必强行固定男女身份。","reading":[{"quote":"采之欲遗谁","title":"一个问题改变花的意味","text":"开头芳草鲜花明丽，转问赠谁后，景物立即与远方所思相连，快乐中显出无法送达的缺憾。"},{"quote":"同心而离居","title":"心近与路远彼此拉扯","text":"内心相通并不能缩短现实距离，结尾以简洁对立写出长期分离的忧伤。"}],"thought":"赠物的愿望承载关心，也暴露距离。诗让一束尚未送出的花，成为无法相聚者共同的心事。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_c72d94b49cc6.aspx","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"kongquedongnanfeibingxu","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"},{"id":"mang","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"}],"extra":{}},{"id":"duangexing","title":"短歌行","author":"caocao","form":"四言乐府诗","stage":["高中"],"scene":"moon","tags":["wine","moon","resolve","history","allusion","metaphor"],"lines":["对酒当歌，","人生几何！","譬如朝露，","去日苦多。","慨当以慷，","忧思难忘。","何以解忧？","唯有杜康。","青青子衿，","悠悠我心。","但为君故，","沉吟至今。","呦呦鹿鸣，","食野之苹。","我有嘉宾，","鼓瑟吹笙。","明明如月，","何时可掇？","忧从中来，","不可断绝。","越陌度阡，","枉用相存。","契阔谈宴，","心念旧恩。","月明星稀，","乌鹊南飞。","绕树三匝，","何枝可依？","山不厌高，","海不厌深。","周公吐哺，","天下归心。"],"quote":[2,3],"preface":"","intro":"感叹时间短暂，也是在急切寻找同行的人。","notes":[{"q":"杜康","text":"传说中造酒者，借指酒"},{"q":"子衿","text":"衣领，借《诗经》句表达思慕贤才"},{"q":"掇","text":"拾取"},{"q":"枉用相存","text":"屈尊来问候我"},{"q":"三匝","text":"绕三圈"},{"q":"吐哺","text":"周公为接待贤士中断进食的典故"}],"background":"曹操沿用乐府旧题所作。诗中求贤与忧时相联，具体作年及“赤壁横槊赋诗”的故事不能仅据后世小说坐实。","reading":[{"quote":"譬如朝露","title":"短暂感带来紧迫，也带来追寻","text":"人生像晨露的比喻引出忧思，后文转向思贤、待客，忧并未停在消沉中。"},{"quote":"何枝可依","title":"把人才的徘徊写成鸟的选择","text":"月下乌鹊绕树，与末尾海纳众流、周公礼贤相接，形成向来者打开位置的姿态。"}],"thought":"诗以生命有限为起点，表达建功与求贤的迫切。它既有政治抱负，也有希望得到回应、获得同道的情感。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_35000de73cdb.aspx","对照页所列异文或通假：唯 一作：惟；明明 一作：皎皎；谈宴 一作：谈讌/谈䜩；海不厌深 一作：水不厌深。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9B%B9%E6%93%8D","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chushibiao","reason":"同读未竟的心志，比较责任、著述、人格选择与寻求同道。"},{"id":"lisao","reason":"同读未竟的心志，比较责任、著述、人格选择与寻求同道。"}],"extra":{}},{"id":"kongquedongnanfeibingxu","title":"孔雀东南飞并序","author":"guyuefu","form":"乐府叙事诗","stage":["高中"],"scene":"mountain","tags":["love","family","sadness","freedom","narrative","dialogue","geo_lujiang"],"lines":["孔雀东南飞，","五里一徘徊。","“十三能织素，","十四学裁衣。","十五弹箜篌，","十六诵诗书。","十七为君妇，","心中常苦悲。","君既为府吏，","守节情不移。","贱妾留空房，","相见常日稀。","鸡鸣入机织，","夜夜不得息。","三日断五匹，","大人故嫌迟。","非为织作迟，","君家妇难为！","妾不堪驱使，","徒留无所施。","便可白公姥，","及时相遣归。”","府吏得闻之，","堂上启阿母：“儿已薄禄相，","幸复得此妇。","结发同枕席，","黄泉共为友。","共事二三年，","始尔未为久。","女行无偏斜，","何意致不厚。”","阿母谓府吏：“何乃太区区！","此妇无礼节，","举动自专由。","吾意久怀忿，","汝岂得自由！","东家有贤女，","自名秦罗敷。","可怜体无比，","阿母为汝求。","便可速遣之，","遣去慎莫留！”","府吏长跪告，","伏惟启阿母：“今若遣此妇，","终老不复取！”","阿母得闻之，","槌床便大怒：“小子无所畏，","何敢助妇语！","吾已失恩义，","会不相从许！”","府吏默无声，","再拜还入户。","举言谓新妇，","哽咽不能语：“我自不驱卿，","逼迫有阿母。","卿但暂还家，","吾今且报府。","不久当归还，","还必相迎取。","以此下心意，","慎勿违吾语。”","新妇谓府吏：“勿复重纷纭。","往昔初阳岁，","谢家来贵门。","奉事循公姥，","进止敢自专？","昼夜勤作息，","伶俜萦苦辛。","谓言无罪过，","供养卒大恩；","仍更被驱遣，","何言复来还！","妾有绣腰襦，","葳蕤自生光；","红罗复斗帐，","四角垂香囊；","箱帘六七十，","绿碧青丝绳，","物物各自异，","种种在其中。","人贱物亦鄙，","不足迎后人，","留待作遗施，","于今无会因。","时时为安慰，","久久莫相忘！”","鸡鸣外欲曙，","新妇起严妆。","著我绣夹裙，","事事四五通。","足下蹑丝履，","头上玳瑁光。","腰若流纨素，","耳著明月珰。","指如削葱根，","口如含朱丹。","纤纤作细步，","精妙世无双。","上堂拜阿母，","阿母怒不止。","“昔作女儿时，","生小出野里。","本自无教训，","兼愧贵家子。","受母钱帛多，","不堪母驱使。","今日还家去，","念母劳家里。","”却与小姑别，","泪落连珠子。","“新妇初来时，","小姑始扶床；","今日被驱遣，","小姑如我长。","勤心养公姥，","好自相扶将。","初七及下九，","嬉戏莫相忘。","”出门登车去，","涕落百余行。","府吏马在前，","新妇车在后。","隐隐何甸甸，","俱会大道口。","下马入车中，","低头共耳语：“誓不相隔卿，","且暂还家去。","吾今且赴府，","不久当还归。","誓天不相负！”","新妇谓府吏：“感君区区怀！","君既若见录，","不久望君来。","君当作磐石，","妾当作蒲苇。","蒲苇纫如丝，","磐石无转移。","我有亲父兄，","性行暴如雷，","恐不任我意，","逆以煎我怀。","”举手长劳劳，","二情同依依。","入门上家堂，","进退无颜仪。","阿母大拊掌，","不图子自归：“十三教汝织，","十四能裁衣，","十五弹箜篌，","十六知礼仪，","十七遣汝嫁，","谓言无誓违。","汝今何罪过，","不迎而自归？","”兰芝惭阿母：“儿实无罪过。","”阿母大悲摧。","还家十余日，","县令遣媒来。","云有第三郎，","窈窕世无双。","年始十八九，","便言多令才。","阿母谓阿女：“汝可去应之。”","阿女含泪答：“兰芝初还时，","府吏见丁宁，","结誓不别离。","今日违情义，","恐此事非奇。","自可断来信，","徐徐更谓之。”","阿母白媒人：“贫贱有此女，","始适还家门。","不堪吏人妇，","岂合令郎君？","幸可广问讯，","不得便相许。”","媒人去数日，","寻遣丞请还，","说有兰家女，","承籍有宦官。","云有第五郎，","娇逸未有婚。","遣丞为媒人，","主簿通语言。","直说太守家，","有此令郎君，","既欲结大义，","故遣来贵门。","阿母谢媒人：“女子先有誓，","老姥岂敢言！”","阿兄得闻之，","怅然心中烦。","举言谓阿妹：“作计何不量！","先嫁得府吏，","后嫁得郎君。","否泰如天地，","足以荣汝身。","不嫁义郎体，","其往欲何云？”","兰芝仰头答：“理实如兄言。","谢家事夫婿，","中道还兄门。","处分适兄意，","那得自任专！","虽与府吏要，","渠会永无缘。","登即相许和，","便可作婚姻。","”媒人下床去。","诺诺复尔尔。","还部白府君：“下官奉使命，","言谈大有缘。","”府君得闻之，","心中大欢喜。","视历复开书，","便利此月内，","六合正相应。","良吉三十日，","今已二十七，","卿可去成婚。","交语速装束，","络绎如浮云。","青雀白鹄舫，","四角龙子幡。","婀娜随风转，","金车玉作轮。","踯躅青骢马，","流苏金镂鞍。","赍钱三百万，","皆用青丝穿。","杂彩三百匹，","交广市鲑珍。","从人四五百，","郁郁登郡门。","阿母谓阿女：“适得府君书，","明日来迎汝。","何不作衣裳？","莫令事不举！”","阿女默无声，","手巾掩口啼，","泪落便如泻。","移我琉璃榻，","出置前窗下。","左手持刀尺，","右手执绫罗。","朝成绣夹裙，","晚成单罗衫。","晻晻日欲暝，","愁思出门啼。","府吏闻此变，","因求假暂归。","未至二三里，","摧藏马悲哀。","新妇识马声，","蹑履相逢迎。","怅然遥相望，","知是故人来。","举手拍马鞍，","嗟叹使心伤：“自君别我后，","人事不可量。","果不如先愿，","又非君所详。","我有亲父母，","逼迫兼弟兄。","以我应他人，","君还何所望！”","府吏谓新妇：“贺卿得高迁！","磐石方且厚，","可以卒千年；","蒲苇一时纫，","便作旦夕间。","卿当日胜贵，","吾独向黄泉！”","新妇谓府吏：“何意出此言！","同是被逼迫，","君尔妾亦然。","黄泉下相见，","勿违今日言！","”执手分道去，","各各还家门。","生人作死别，","恨恨那可论？","念与世间辞，","千万不复全！","府吏还家去，","上堂拜阿母：“今日大风寒，","寒风摧树木，","严霜结庭兰。","儿今日冥冥，","令母在后单。","故作不良计，","勿复怨鬼神！","命如南山石，","四体康且直！”","阿母得闻之，","零泪应声落：“汝是大家子，","仕宦于台阁。","慎勿为妇死，","贵贱情何薄！","东家有贤女，","窈窕艳城郭，","阿母为汝求，","便复在旦夕。”","府吏再拜还，","长叹空房中，","作计乃尔立。","转头向户里，","渐见愁煎迫。","其日牛马嘶，","新妇入青庐。","奄奄黄昏后，","寂寂人定初。","“我命绝今日，","魂去尸长留！","”揽裙脱丝履，","举身赴清池。","府吏闻此事，","心知长别离。","徘徊庭树下，","自挂东南枝。","两家求合葬，","合葬华山傍。","东西植松柏，","左右种梧桐。","枝枝相覆盖，","叶叶相交通。","中有双飞鸟，","自名为鸳鸯。","仰头相向鸣，","夜夜达五更。","行人驻足听，","寡妇起彷徨。","多谢后世人，","戒之慎勿忘。"],"quote":[133,134],"preface":"汉末建安中，庐江府小吏焦仲卿妻刘氏，为仲卿母所遣，自誓不嫁。其家逼之，乃投水而死。仲卿闻之，亦自缢于庭树。时人伤之，为诗云尔。","intro":"在众人的安排里，两个人努力守住自己的心意。","notes":[{"q":"遣","text":"休弃后送回娘家"},{"q":"公姥","text":"公婆，此处主要指婆婆"},{"q":"伶俜","text":"孤单辛苦"},{"q":"纫","text":"同“韧”，坚韧"},{"q":"见录","text":"记着我，见表对自己"},{"q":"处分","text":"处置安排"},{"q":"鲑珍","text":"鱼类珍味"},{"q":"交通","text":"互相交错相接"}],"background":"长篇乐府叙事诗，早见于徐陵编《玉台新咏》，原题《古诗为焦仲卿妻作》。序将故事置于汉末建安，成篇过程有讨论；本篇收全文及序，不截断结局。","reading":[{"quote":"君当作磐石，妾当作蒲苇","title":"同一比喻随情节改变","text":"初别时磐石蒲苇表达坚定，后来仲卿又用它责问兰芝。重复意象承载了信任、误解与重新理解。"},{"quote":"枝枝相覆盖","title":"以想象回应现实中的剥夺","text":"结尾连枝双鸟使二人获得象征性相依，反衬生前不能自主的处境，悲剧也因此指向社会关系。"}],"thought":"诗同情被家庭权力压迫的恋人，珍惜婚姻中的自主与相互尊重。悲剧是对伤害的控诉，不是要求以死亡证明感情。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_294ee4bb68a3.aspx","收全诗并序，补足原候选清单所称“节选”的前后叙事。序写汉末建安故事，诗的最终成篇与流传年代另有讨论。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yulinling","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"},{"id":"shejiangcaifurong","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"}],"extra":{"places":"庐江｜序文交代的故事背景，为汉代郡名，联系今安徽及邻近区域，郡治通常系于今安徽潜山一带，不能只对应今天的庐江县。\n\n交广、华山｜“交广”泛涉交州、广州的南方区域，反映文本流传中的时代层次；结尾“华山傍”的山名地望有讨论，不应直接认定为陕西西岳华山。"}},{"id":"shudaonan","title":"蜀道难","author":"libai","form":"七言古诗","stage":["高中"],"scene":"water","tags":["mountain","water","travel","imagination","hyperbole","repetition","geo_bashu","geo_jiange","geo_chengdu","geo_qinling","geo_qingni"],"lines":["噫吁嚱，","危乎高哉！","蜀道之难，","难于上青天！","蚕丛及鱼凫，","开国何茫然！","尔来四万八千岁，","不与秦塞通人烟。","西当太白有鸟道，","可以横绝峨眉巅。","地崩山摧壮士死，","然后天梯石栈相钩连。","上有六龙回日之高标，","下有冲波逆折之回川。","黄鹤之飞尚不得过，","猿猱欲度愁攀援。","青泥何盘盘，","百步九折萦岩峦。","扪参历井仰胁息，","以手抚膺坐长叹。","问君西游何时还？","畏途巉岩不可攀。","但见悲鸟号古木，","雄飞雌从绕林间。","又闻子规啼夜月，","愁空山。","蜀道之难，","难于上青天，","使人听此凋朱颜！","连峰去天不盈尺，","枯松倒挂倚绝壁。","飞湍瀑流争喧豗，","砯崖转石万壑雷。","其险也如此，","嗟尔远道之人胡为乎来哉！","剑阁峥嵘而崔嵬，","一夫当关，","万夫莫开。","所守或匪亲，","化为狼与豺。","朝避猛虎，","夕避长蛇，","磨牙吮血，","杀人如麻。","锦城虽云乐，","不如早还家。","蜀道之难，","难于上青天，","侧身西望长咨嗟！"],"quote":[2,3],"preface":"","intro":"沿着夸张与想象，走一条高过天空的蜀道。","notes":[{"q":"危","text":"高"},{"q":"蚕丛、鱼凫","text":"传说中的古蜀王"},{"q":"鸟道","text":"仅容鸟飞的险路"},{"q":"扪参历井","text":"仿佛触及星宿，写山高"},{"q":"巉岩","text":"险峻山石"},{"q":"喧豗","text":"轰响"},{"q":"咨嗟","text":"叹息"}],"background":"李白以乐府旧题写蜀道险难，融古蜀传说、山川景象与对险要局势的警觉。具体作年和寄托对象有多种说法。","reading":[{"quote":"蜀道之难，难于上青天","title":"反复的主句每次都加深意味","text":"先叹山高，继写道路惊险，末又关涉人事与归路，反复并非原地重复，而是组织全篇的情感支点。"},{"quote":"连峰去天不盈尺","title":"夸张让身体感觉到险峻","text":"近天山峰、倒挂枯松、雷鸣急流共同冲击视觉听觉，读者仿佛亲身面对难以通行的空间。"}],"thought":"诗的奇崛来自想象力，也含对远行者的担忧。山川之险最终连到人的处境，使壮观不只是奇景陈列。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_d59ec5d6c91c.aspx","对照页所列异文或通假：也如此 一作：也若此。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"wanglushanpubu","reason":"同看江山的力量，留意夸张、移动视角与神话想象怎样改变尺度。"},{"id":"langtaosha","reason":"同看江山的力量，留意夸张、移动视角与神话想象怎样改变尺度。"}],"extra":{"places":"蜀道、剑阁｜蜀道是连接关中与蜀地的交通路径群，剑阁、剑门在今四川广元一带，是诗中特别突出的险要关隘。\n\n太白、青泥｜太白山属陕西秦岭；青泥岭通常联系今甘肃陇南徽县一带。诗以地名、神话与夸张交织蜀道之难，不是逐站行路指南。\n\n锦城 → 成都｜诗中富丽而令人警醒的蜀地都会；“早还家”关照的是远行者的处境。"}},{"id":"shuxiang","title":"蜀相","author":"dufu","form":"七言律诗","stage":["高中"],"scene":"mountain","tags":["history","resolve","sadness","allusion","contrast","grass","geo_chengdu"],"lines":["丞相祠堂何处寻？","锦官城外柏森森。","映阶碧草自春色，","隔叶黄鹂空好音。","三顾频烦天下计，","两朝开济老臣心。","出师未捷身先死，","长使英雄泪满襟。"],"quote":[3,4],"preface":"","intro":"祠堂春色依旧，那份未竟之志仍令人停步。","notes":[{"q":"蜀相","text":"诸葛亮"},{"q":"锦官城","text":"成都"},{"q":"三顾","text":"刘备三顾茅庐"},{"q":"两朝","text":"刘备、刘禅两朝"},{"q":"开济","text":"开创、扶助"},{"q":"捷","text":"胜利"}],"background":"杜甫居成都时访诸葛亮祠堂所作。借蜀相生平寄托敬仰，也回应作者自身关切时局、愿有作为的心情。","reading":[{"quote":"隔叶黄鹂空好音","title":"美景为何带着寂寞","text":"“自”“空”使草色鸟声虽美，却像无人回应；祠堂的春天映衬人物已逝的空缺。"},{"quote":"两朝开济老臣心","title":"将一生收拢到一个“心”字","text":"对偶概括功业与忠勤，下一联再写未捷先死，使敬仰转成跨越时代的悲惜。"}],"thought":"诗怀念尽心担当却未能完成理想的人。英雄之泪不只因失败，也因懂得愿望背后长久付出的心力。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_625762a4b089.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"niannujiao","reason":"借历史照见当下，比较凭吊、议论与对行动的期待。"},{"id":"guoqinlun","reason":"借历史照见当下，比较凭吊、议论与对行动的期待。"}],"extra":{"places":"锦官城、武侯祠｜锦官城即成都。诗人到成都的诸葛亮祠庙寻访，前半写祠堂景象，后半转向对其功业与遗憾的追思。"}},{"id":"kezhi","title":"客至","author":"dufu","form":"七言律诗","stage":["高中"],"scene":"water","tags":["water","friendship","joy","wine","narrative","spring","geo_chengdu"],"lines":["舍南舍北皆春水，","但见群鸥日日来。","花径不曾缘客扫，","蓬门今始为君开。","盘飧市远无兼味，","樽酒家贫只旧醅。","肯与邻翁相对饮，","隔篱呼取尽余杯。"],"quote":[3,4],"preface":"","intro":"菜不算丰盛，门却真心为你打开。","notes":[{"q":"缘客扫","text":"为客人打扫"},{"q":"蓬门","text":"简陋门户的谦称"},{"q":"盘飧","text":"盘中的饭菜"},{"q":"兼味","text":"多种菜肴"},{"q":"旧醅","text":"未过滤的陈酒"},{"q":"余杯","text":"剩下的酒"}],"background":"杜甫居成都草堂时迎客之作，题下注有“喜崔明府相过”。诗将平日幽居与朋友到访的喜悦写成亲切日常。","reading":[{"quote":"蓬门今始为君开","title":"门的开合写出人的亲近","text":"花径未扫与今日开门相对，不是失礼的声明，而是强调客人的特殊与主人难掩的欢喜。"},{"quote":"隔篱呼取尽余杯","title":"把邻人也拉进这份快乐","text":"末句由席间转向篱外，呼邻同饮的动作让场面活起来，款待不靠排场而靠心意。"}],"thought":"友谊能使简朴生活变得丰盛。诗的热情藏在开门、劝酒与呼邻的举动里，读来像一次真实的相聚。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_2dfd92e6cd5b.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jiangnanfengliguinian","reason":"从重逢、清游与款待读人与环境的关系，热闹和安静各有情味。"},{"id":"zuiwengtingji","reason":"从重逢、清游与款待读人与环境的关系，热闹和安静各有情味。"}],"extra":{"places":"成都草堂｜通行编年所系的作诗地点，今四川成都浣花溪一带。“舍南舍北皆春水”写住所周围的水乡景色，正文没有另点一处水域专名。"}},{"id":"denggao","title":"登高","author":"dufu","form":"七言律诗","stage":["高中"],"scene":"water","tags":["autumn","water","wind","solitude","sadness","contrast","geo_fengjie"],"lines":["风急天高猿啸哀，","渚清沙白鸟飞回。","无边落木萧萧下，","不尽长江滚滚来。","万里悲秋常作客，","百年多病独登台。","艰难苦恨繁霜鬓，","潦倒新停浊酒杯。"],"quote":[2,3],"preface":"","intro":"长江仍滚滚向前，登台的人却感到一生都压在此刻。","notes":[{"q":"渚","text":"水中小洲"},{"q":"落木","text":"飘落的树叶"},{"q":"百年","text":"一生，也指晚年"},{"q":"苦恨","text":"极为遗憾"},{"q":"霜鬓","text":"白发"},{"q":"潦倒","text":"衰颓失意"}],"background":"杜甫晚年寓居夔州时作。秋江景象与长期漂泊、多病、孤独的个人处境交织，形成沉郁而严整的律诗。","reading":[{"quote":"无边落木萧萧下","title":"两个方向写出时间的力量","text":"落叶向下，江水奔来；无边、不尽扩展空间，叠词又延长动作，秋景因而有不可阻的气势。"},{"quote":"百年多病独登台","title":"多重处境压入一句","text":"长年作客、晚景多病、独自登高层层叠加，前文宏大景色与个体脆弱形成强烈相照。"}],"thought":"诗直面衰老、漂泊与时代艰难。它的庄重来自不回避痛感，也让有限生命在辽阔天地中获得清晰的声音。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_eeb217f8cb2d.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jinse","reason":"同读时间留下的感受，比较回忆、沉默与难以概括的愁绪。"},{"id":"lantingjixu","reason":"同读时间留下的感受，比较回忆、沉默与难以概括的愁绪。"}],"extra":{"places":"夔州 → 奉节｜通常系于杜甫居夔州时所作，约当今重庆奉节一带。长江、峡风与秋日登台的环境可由此理解；诗未交代唯一的登台原址。"}},{"id":"pipaxingbingxu","title":"琵琶行并序","author":"baijuyi","form":"七言古诗","stage":["高中"],"scene":"moon","tags":["sound","moon","water","sadness","compassion","narrative","geo_jiujiang","geo_fuliang","geo_xian"],"lines":["浔阳江头夜送客，","枫叶荻花秋瑟瑟。","主人下马客在船，","举酒欲饮无管弦。","醉不成欢惨将别，","别时茫茫江浸月。","忽闻水上琵琶声，","主人忘归客不发。","寻声暗问弹者谁，","琵琶声停欲语迟。","移船相近邀相见，","添酒回灯重开宴。","千呼万唤始出来，","犹抱琵琶半遮面。","转轴拨弦三两声，","未成曲调先有情。","弦弦掩抑声声思，","似诉平生不得志。","低眉信手续续弹，","说尽心中无限事。","轻拢慢捻抹复挑，","初为《霓裳》后《六幺》。","大弦嘈嘈如急雨，","小弦切切如私语。","嘈嘈切切错杂弹，","大珠小珠落玉盘。","间关莺语花底滑，","幽咽泉流冰下难。","冰泉冷涩弦凝绝，","凝绝不通声暂歇。","别有幽愁暗恨生，","此时无声胜有声。","银瓶乍破水浆迸，","铁骑突出刀枪鸣。","曲终收拨当心画，","四弦一声如裂帛。","东船西舫悄无言，","唯见江心秋月白。","沉吟放拨插弦中，","整顿衣裳起敛容。","自言本是京城女，","家在虾蟆陵下住。","十三学得琵琶成，","名属教坊第一部。","曲罢曾教善才服，","妆成每被秋娘妒。","五陵年少争缠头，","一曲红绡不知数。","钿头银篦击节碎，","血色罗裙翻酒污。","今年欢笑复明年，","秋月春风等闲度。","弟走从军阿姨死，","暮去朝来颜色故。","门前冷落鞍马稀，","老大嫁作商人妇。","商人重利轻别离，","前月浮梁买茶去。","去来江口守空船，","绕船月明江水寒。","夜深忽梦少年事，","梦啼妆泪红阑干。","我闻琵琶已叹息，","又闻此语重唧唧。","同是天涯沦落人，","相逢何必曾相识！","我从去年辞帝京，","谪居卧病浔阳城。","浔阳地僻无音乐，","终岁不闻丝竹声。","住近湓江地低湿，","黄芦苦竹绕宅生。","其间旦暮闻何物？","杜鹃啼血猿哀鸣。","春江花朝秋月夜，","往往取酒还独倾。","岂无山歌与村笛，","呕哑嘲哳难为听。","今夜闻君琵琶语，","如听仙乐耳暂明。","莫辞更坐弹一曲，","为君翻作《琵琶行》。","感我此言良久立，","却坐促弦弦转急。","凄凄不似向前声，","满座重闻皆掩泣。","座中泣下谁最多？","江州司马青衫湿。"],"quote":[25,26],"preface":"元和十年，予左迁九江郡司马。明年秋，送客湓浦口，闻舟中夜弹琵琶者，听其音，铮铮然有京都声。问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，委身为贾人妇。遂命酒，使快弹数曲。曲罢悯然，自叙少小时欢乐事，今漂沦憔悴，转徙于江湖间。予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。","intro":"先听懂一段琴声，再听懂一个人的一生。","notes":[{"q":"善才","text":"乐师称谓"},{"q":"贾人","text":"商人，贾读gǔ"},{"q":"嘈嘈","text":"粗重声音"},{"q":"切切","text":"细促声音"},{"q":"间关","text":"鸟声婉转"},{"q":"敛容","text":"收整神情"},{"q":"缠头","text":"赠给艺人的财物"},{"q":"沦落","text":"失意漂泊"}],"background":"白居易贬任江州司马后，在次年秋夜送客时遇琵琶女，写下长篇歌行。序文与正文分别保存交代缘起与铺陈叙事的不同节奏。","reading":[{"quote":"大珠小珠落玉盘","title":"把声音变成可感的质地","text":"急雨、私语、珠玉、泉流等比喻连续变化，对应强弱快慢与停顿，让音乐获得触觉和画面。"},{"quote":"相逢何必曾相识","title":"聆听改变了陌生人的关系","text":"技艺先吸引听者，身世再引出共鸣；诗人由欣赏音乐走向理解演奏者，两条人生线索在此相接。"}],"thought":"文学与音乐能够使被忽略的人获得理解。作品的核心不只是身世相似，更是愿意认真听另一个人讲述自己。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_0581b0ba8bb4.aspx","对照页所列异文或通假：六幺 一作：绿腰；暂歇 一作：渐歇；服 一作：伏；银篦 一作：云篦。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%99%BD%E5%B1%85%E6%98%93","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"lipingkonghouyin","reason":"从对话与艺术场景进入内心，看看动作、声音和细节怎样替人传情。"},{"id":"shizuo","reason":"从对话与艺术场景进入内心，看看动作、声音和细节怎样替人传情。"}],"extra":{"places":"浔阳、江州、湓浦｜叙事发生在今江西九江一带；江州是当时行政地名，浔阳江为附近长江江段的称谓，湓浦口为湓水入江处。\n\n长安、虾蟆陵｜琵琶女回忆的京城生活，联系今陕西西安。\n\n浮梁｜商人买茶前往的地方，今江西景德镇浮梁；几处地名连接眼前江夜、旧日繁华与离别生活。"}},{"id":"lipingkonghouyin","title":"李凭箜篌引","author":"lihe","form":"七言古诗","stage":["高中"],"scene":"mountain","tags":["sound","art","imagination","metaphor","synesthesia","autumn","geo_xian","geo_kunlun"],"lines":["吴丝蜀桐张高秋，","空山凝云颓不流。","江娥啼竹素女愁，","李凭中国弹箜篌。","昆山玉碎凤凰叫，","芙蓉泣露香兰笑。","十二门前融冷光，","二十三丝动紫皇。","女娲炼石补天处，","石破天惊逗秋雨。","梦入神山教神妪，","老鱼跳波瘦蛟舞。","吴质不眠倚桂树，","露脚斜飞湿寒兔。"],"quote":[5,6],"preface":"","intro":"一曲箜篌，连神话里的天空也听得震动。","notes":[{"q":"吴丝蜀桐","text":"制琴弦与琴身的良材，借指箜篌"},{"q":"中国","text":"国都之中，这里指长安"},{"q":"紫皇","text":"天上神灵"},{"q":"逗","text":"引出"},{"q":"神妪","text":"神话中的老妇"},{"q":"吴质","text":"此处常解作月中吴刚"},{"q":"寒兔","text":"月中玉兔"}],"background":"李贺写乐工李凭演奏箜篌的歌行。作品着重音乐激发的奇幻感受，并非按现实演奏顺序作记录。","reading":[{"quote":"芙蓉泣露香兰笑","title":"声音越过感官的边界","text":"花的泣露与笑容让哀婉、明快的乐声成为可见形象，通感把听觉转成色泽与姿态。"},{"quote":"石破天惊逗秋雨","title":"让神话世界也成为听众","text":"补天石被震破、秋雨被引出，夸张并非赞音量大，而在表现音乐激发想象的强烈力量。"}],"thought":"诗展示艺术如何改变感知。听一曲音乐，可以像经历一场穿越天地与神话的梦。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_77b08ab3153f.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E8%B4%BA","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"pusaman","reason":"从对话与艺术场景进入内心，看看动作、声音和细节怎样替人传情。"},{"id":"pipaxingbingxu","reason":"从对话与艺术场景进入内心，看看动作、声音和细节怎样替人传情。"}],"extra":{"places":"中国｜“李凭中国弹箜篌”中指国都长安，即今陕西西安，不是按今天国名、国界理解。\n\n昆山｜联系传说中的昆仑玉山，属于音乐引发的神话想象，不是今江苏昆山市。“神山”“月宫”同样不作为现实地点定位。"}},{"id":"pusaman","title":"菩萨蛮·小山重叠金明灭","author":"wentingyun","form":"词","stage":["高中"],"scene":"flower","tags":["flower","love","solitude","art","contrast","graceful","huajian"],"lines":["小山重叠金明灭，鬓云欲度香腮雪。","懒起画蛾眉，弄妆梳洗迟。","照花前后镜，花面交相映。","新帖绣罗襦，双双金鹧鸪。"],"quote":[1],"preface":"","intro":"妆容越精细，镜子里的人却越显得独自一人。","notes":[{"q":"小山","text":"所指有眉妆、屏山等说法"},{"q":"鬓云","text":"如云的鬓发"},{"q":"香腮雪","text":"形容面颊白皙"},{"q":"蛾眉","text":"细长弯美的眉"},{"q":"罗襦","text":"丝罗短衣"},{"q":"金鹧鸪","text":"金线绣成的鹧鸪纹样"}],"background":"温庭筠《菩萨蛮》组词之一，收入《花间集》。写闺中梳妆情景，人物身份与“小山”的具体所指均有不同解释。","reading":[{"quote":"懒起画蛾眉","title":"华丽画面里出现迟缓动作","text":"开头色泽浓丽，接着却写懒起、梳洗迟缓，外在美与内心兴致不足形成微妙反差。"},{"quote":"双双金鹧鸪","title":"用成双之物写未说出的孤单","text":"结尾不直言怀人，只让衣上双鸟进入视线。人物独处与纹样成双彼此映照，情意留在画外。"}],"thought":"精美物象并不等于快乐生活。词以细腻而含蓄的方式，让读者察觉美丽表面之下未被说出的心情。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_91843a09f605.aspx","对照页所列异文或通假：帖 一作：贴。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%B8%A9%E5%BA%AD%E7%AD%A0","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shizuo","reason":"从对话与艺术场景进入内心，看看动作、声音和细节怎样替人传情。"},{"id":"lipingkonghouyin","reason":"从对话与艺术场景进入内心，看看动作、声音和细节怎样替人传情。"}],"extra":{}},{"id":"jinse","title":"锦瑟","author":"lishangyin","form":"七言律诗","stage":["高中"],"scene":"moon","tags":["moon","sound","sadness","reflection","allusion","timepassing","geo_lantian"],"lines":["锦瑟无端五十弦，","一弦一柱思华年。","庄生晓梦迷蝴蝶，","望帝春心托杜鹃。","沧海月明珠有泪，","蓝田日暖玉生烟。","此情可待成追忆，","只是当时已惘然。"],"quote":[1,2],"preface":"","intro":"有些往事，当时没有看清，回望时仍带着光和雾。","notes":[{"q":"无端","text":"无缘无故，含怅惘语气"},{"q":"华年","text":"美好年华"},{"q":"庄生梦蝶","text":"出自《庄子》的梦与身份之问"},{"q":"望帝","text":"传说托魂杜鹃的蜀帝"},{"q":"蓝田","text":"产玉地名"},{"q":"惘然","text":"迷惘失落"}],"background":"李商隐晚期名篇，题取首二字。悼亡、身世自伤、诗艺寄托等解释并存，缺乏证据将它限定为一件确切事件。","reading":[{"quote":"一弦一柱思华年","title":"让器物成为记忆的触发点","text":"瑟的繁弦引出一重重往事，诗随即进入梦蝶、啼鹃等意象，并不按事件顺序叙述。"},{"quote":"只是当时已惘然","title":"回忆也未能消除迷惘","text":"结尾说当时已有难言之感，使追忆不再是找到标准答案，而是再次触摸复杂经验。"}],"thought":"诗容纳无法彻底说明的失落与珍惜。典故共同构成情绪的层次，读者可以感受其关联，而不必强配一套唯一隐义。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_1921957e6e83.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E5%95%86%E9%9A%90","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yumeiren","reason":"同读时间留下的感受，比较回忆、沉默与难以概括的愁绪。"},{"id":"denggao","reason":"同读时间留下的感受，比较回忆、沉默与难以概括的愁绪。"}],"extra":{"places":"蓝田｜正文“蓝田日暖玉生烟”的所指，在今陕西西安蓝田，以产玉闻名。这里主要借玉与烟的意象表达难以把握的感受，不是作者正在蓝田实地观测的记录。"}},{"id":"yumeiren","title":"虞美人·春花秋月何时了","author":"liyu","form":"词","stage":["高中"],"scene":"moon","tags":["flower","moon","water","sadness","history","metaphor","geo_nanjing","geo_kaifeng"],"lines":["春花秋月何时了？","往事知多少。","小楼昨夜又东风，故国不堪回首月明中。","雕栏玉砌应犹在，只是朱颜改。","问君能有几多愁，恰似一江春水向东流。"],"quote":[2],"preface":"","intro":"春天年年回来，有些往事却再也回不去了。","notes":[{"q":"了","text":"终了"},{"q":"故国","text":"旧日南唐国土与生活"},{"q":"雕栏玉砌","text":"昔日宫殿建筑"},{"q":"朱颜","text":"红润容颜，也关联旧时人物"},{"q":"恰似","text":"正像"}],"background":"李煜亡国入宋后所作，通常视为晚期词篇。其确切写作日及致死传闻须谨慎看待，词中故国之思则十分鲜明。","reading":[{"quote":"小楼昨夜又东风","title":"一个“又”字变成伤口","text":"春风往常意味着新生，此处却提醒岁月照常流转，故国生活不能重来，常景因处境而变色。"},{"quote":"一江春水向东流","title":"让无形的愁拥有容量和方向","text":"江水的丰沛、不断与难以挽回，一同承载愁绪。设问在先，比喻作答，情感遂有奔流之势。"}],"thought":"失去后的世界仍然美丽，正可能加重人的悲伤。词把私人痛感写得深长，使读者理解时间无法替代的丧失。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_3574610d74e0.aspx","对照页所列异文或通假：栏 一作：阑。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%85%9C","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shengshengman","reason":"同读时间留下的感受，比较回忆、沉默与难以概括的愁绪。"},{"id":"jinse","reason":"同读时间留下的感受，比较回忆、沉默与难以概括的愁绪。"}],"extra":{"places":"故国 → 南唐｜亡国后的回望，南唐都城金陵即今江苏南京，是故国记忆的中心。\n\n汴京 → 开封｜李煜入宋后生活的背景，在今河南开封。“一江春水”是愁绪的比喻，不能据此确定眼前正在看哪一条河。"}},{"id":"wanghaichao","title":"望海潮·东南形胜","author":"liuyong","form":"词","stage":["高中"],"scene":"water","tags":["water","flower","willow","joy","city","parallel","wanyue","geo_hangzhou"],"lines":["东南形胜，三吴都会，钱塘自古繁华。","烟柳画桥，风帘翠幕，参差十万人家。","云树绕堤沙，怒涛卷霜雪，天堑无涯。","市列珠玑，户盈罗绮，竞豪奢。","重湖叠𪩘清嘉，有三秋桂子，十里荷花。","羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。","千骑拥高牙，乘醉听箫鼓，吟赏烟霞。","异日图将好景，归去凤池夸。"],"quote":[1],"preface":"","intro":"走进一幅会发声的杭州长卷。","notes":[{"q":"形胜","text":"地势优越、景色壮美"},{"q":"三吴","text":"泛指江南吴地"},{"q":"天堑","text":"天然屏障，此指钱塘江"},{"q":"珠玑","text":"珠宝"},{"q":"叠𪩘","text":"重叠山峰"},{"q":"三秋","text":"秋季，也可指秋季第三月"},{"q":"高牙","text":"主帅大旗"},{"q":"凤池","text":"代指朝廷中枢"}],"background":"柳永咏杭州繁华与湖山之美的词，常被认为与赠当地官员有关，具体作年和传闻不作定论。作品以铺叙拓展词的城市视野。","reading":[{"quote":"参差十万人家","title":"城市由许多层生活构成","text":"桥、帘、屋舍、堤岸、市肆依次展开，数字夸张与铺排让繁华不止是一个形容词。"},{"quote":"菱歌泛夜","title":"风景中住着具体的人","text":"桂子荷花之后又有吹笛、采菱、垂钓者，晴昼与夜晚都带着声音，城市因生活而鲜活。"}],"thought":"词欣赏湖山，也赞叹人间营造的繁盛。它包含颂扬与理想化的视角，可以作为文学长卷来读，而非人口与生活的统计实录。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_a52ca0ee5a22.aspx","对照页所列异文或通假：三吴 一作：江吴。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9F%B3%E6%B0%B8","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yijiangnan","reason":"同写江南，比较记忆里的春色、历史中的烟雨与城市生活的繁华。"},{"id":"jiangnanchun","reason":"同写江南，比较记忆里的春色、历史中的烟雨与城市生活的繁华。"}],"extra":{"places":"钱塘 → 杭州｜词中描绘的东南都会。“三吴”是江南吴地的区域概称，不等于杭州一城。\n\n钱塘江、西湖｜“怒涛卷霜雪”写江潮，“重湖叠巘”“十里荷花”转向西湖山水，城市、江潮、湖景共同铺成钱塘的繁华。"}},{"id":"yulinling","title":"雨霖铃·寒蝉凄切","author":"liuyong","form":"词","stage":["高中"],"scene":"moon","tags":["rain","willow","moon","love","farewell","imagination","wanyue","geo_kaifeng"],"lines":["寒蝉凄切，对长亭晚，骤雨初歇。","都门帐饮无绪，留恋处，兰舟催发。","执手相看泪眼，竟无语凝噎。","念去去，千里烟波，暮霭沉沉楚天阔。","多情自古伤离别，更那堪，冷落清秋节！","今宵酒醒何处？","杨柳岸，晓风残月。","此去经年，应是良辰好景虚设。","便纵有千种风情，更与何人说？"],"quote":[1],"preface":"","intro":"还没离开，已经想到今夜无人可以说话。","notes":[{"q":"帐饮","text":"设帐饯饮"},{"q":"兰舟","text":"船的美称"},{"q":"凝噎","text":"哽咽说不出话"},{"q":"暮霭","text":"傍晚云雾"},{"q":"经年","text":"一年或多年"},{"q":"风情","text":"深情、情意"}],"background":"柳永的送别词，写都门离筵与离后想象。具体所别人物及确切写作经过不详，不据后世故事补定姓名。","reading":[{"quote":"兰舟催发","title":"主观留恋与客观催促相撞","text":"人想多停，船却将行，紧迫感使执手无语成为情绪顶点，环境推动着别离发生。"},{"quote":"杨柳岸，晓风残月","title":"先替未来安排一幅孤独风景","text":"从眼前长亭跳到酒醒之后，柳岸、晓风、残月组合成清冷画面，让尚未来临的离愁提前可感。"}],"thought":"离别的难处不仅在分开一刻，也在此后无人共享的日常。词细写这种预先到来的寂寞。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4d795944b856.aspx","对

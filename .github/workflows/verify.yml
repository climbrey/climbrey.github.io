name: Verify Shanyue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the homepage and standalone HTML
        run: npm run build
      - name: Verify content and delivery files
        run: npm test
      - name: Check committed site matches its sources
        run: git diff --exit-code -- index.html offline.html manifest.webmanifest pwa.js sw.js icons .nojekyll

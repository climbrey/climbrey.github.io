/* Small, finite gestures keep the reading surface quiet. */
.scene-leaves{transform-box:fill-box;transform-origin:90% 100%}
.scene-ripples,.scene-rain{transform-box:fill-box;transform-origin:center}
.poem-cover{transform-origin:12% 50%}
.motif-orb{transition:transform .35s,background-color .25s,box-shadow .25s}
.motif:focus-visible .motif-orb{transform:rotate(-8deg);background:#dce7d0}
.letter-room{position:relative;display:grid;grid-template-columns:1.1fr 1fr;margin-top:46px;background:#eeeee2;border:1px solid #e0e3d4;border-radius:20px;overflow:hidden}
.letter-desk{padding:30px 30px 35px;background:radial-gradient(ellipse at 20% 15%,#faf9f0,transparent 75%)}
.letter-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.letter-heading h2{font:28px/1.5 var(--serif);letter-spacing:2px}
.letter-heading .eyebrow{font-size:11px;letter-spacing:1px;margin-bottom:5px}
.letter-heading>.text-btn{white-space:nowrap;font-size:12px;gap:5px}
.letter-heading>.text-btn svg{width:16px;height:16px}
.letter-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:5px 2px}
.poem-letter{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;min-width:0;padding:35px 5px 16px;min-height:190px;border:1px solid #d7ddc9;border-radius:4px 4px 13px 4px;background:#f9f8ef;box-shadow:0 8px 16px -12px #536b4180;transform:rotate(-4deg);transition:transform .35s,box-shadow .35s,border-color .25s,background-color .25s}
.poem-letter:before{content:"";position:absolute;inset:0 0 auto;height:56px;z-index:-1;background:linear-gradient(165deg,#e1e7d4,#eef0e1);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .45s,opacity .45s}
.letter-1{transform:translateY(8px) rotate(1deg);background:#fcf7ee;border-color:#e0d7c8}
.letter-1:before{background:linear-gradient(165deg,#e9ddcb,#f3eadd)}
.letter-2{transform:rotate(4deg);background:#f1f6f0;border-color:#d2ded2}
.letter-2:before{background:linear-gradient(165deg,#d4e2d6,#e8f0e7)}
.letter-number{position:absolute;top:11px;left:12px;font:11px var(--serif);color:#68765d}
.letter-emblem{display:grid;place-items:center;width:45px;height:45px;margin:4px 0 13px;border:1px solid #a9b99a;border-radius:50%;color:#51724d;background:#f8f9ef}
.letter-emblem svg{width:22px;height:22px}
.letter-cue{font:17px/1.7 var(--serif);letter-spacing:1px;overflow-wrap:anywhere}
.letter-open{font-size:11px;color:var(--muted);margin-top:12px}
.poem-letter[aria-expanded=true]{transform:translateY(-5px) rotate(0);border-color:#80976c;background:#fffdf5;box-shadow:0 12px 20px -12px #536b4170}

  <script id="library-data" type="application/json">{"discovery":{"defaultWork":"niaomingjian","featuredMark":"月","motifs":[{"tag":"moon","label":"月","hint":"一轮清光","icon":"moon"},{"tag":"rain","label":"雨","hint":"听雨片刻","icon":"rain"},{"tag":"mountain","label":"山","hint":"山中有声","icon":"mountain"},{"tag":"flower","label":"花","hint":"花开有时","icon":"flower"},{"tag":"snow","label":"雪","hint":"天地留白","icon":"snow"},{"tag":"wind","label":"风","hint":"风起有声","icon":"wind"}],"landscape":[{"tag":"moon","label":"月","hint":"一轮清光","scene":"moon"},{"tag":"rain","label":"雨","hint":"听雨片刻","scene":"rain"},{"tag":"mountain","label":"山","hint":"山中有声","scene":"mountain"},{"tag":"flower","label":"花","hint":"花开有时","scene":"flower"},{"tag":"snow","label":"雪","hint":"天地留白","scene":"snow"},{"tag":"water","label":"水","hint":"循水而行","scene":"water"}],"feeling":[{"tag":"quiet","label":"闲适","hint":"让心停一停","scene":"mountain"},{"tag":"homesick","label":"思念","hint":"寄给远方","scene":"moon"},{"tag":"hope","label":"旷达","hint":"天地开阔","scene":"water"},{"tag":"friendship","label":"友情","hint":"相知有回声","scene":"flower"}],"places":[{"tag":"geo_chengdu","label":"成都","hint":"锦官城的花雨","scene":"rain"},{"tag":"geo_yangzhou","label":"扬州","hint":"广陵的烟花","scene":"flower"},{"tag":"geo_hangzhou","label":"杭州","hint":"钱塘的湖山","scene":"water"},{"tag":"geo_xian","label":"西安","hint":"长安的旧梦","scene":"moon"},{"tag":"geo_huangzhou","label":"黄州","hint":"赤壁的清风","scene":"bamboo"},{"tag":"geo_fengjie","label":"奉节","hint":"白帝城的轻舟","scene":"mountain"}]},"version":1,"name":"山月","authors":{"baijuyi":{"name":"白居易","dynasty":"唐","life":"772—846","bio":"字乐天，晚号香山居士，曾任江州司马、杭州和苏州刺史等职。与元稹倡导新乐府，重视诗歌对现实的回应。作品语言平易，既有社会关怀，也细写音乐、友情与闲居生活。"},"beichaominge":{"name":"北朝民歌·佚名","dynasty":"南北朝","life":"作者姓名不详","bio":"北朝民歌来自北方长期传唱的歌辞，常涉及草原生活、征战与亲情。今天所见文字经过记录与流传，不能简单归为某一位诗人的作品。宋代郭茂倩编《乐府诗集》是保存这些歌辞的重要文献。"},"caocao":{"name":"曹操","dynasty":"汉","life":"155—220","bio":"字孟德，东汉末年政治家、军事家与诗人。经历长期战乱，诗常写时局、人生与求贤，沿用乐府旧题而注入个人声音。其开阔而悲慨的风格是建安文学的重要组成部分。"},"cencan":{"name":"岑参","dynasty":"唐","life":"约715—770","bio":"曾两度出塞，进入西域军幕生活，与高适并称“高岑”。诗善写奇异边地景观，节奏奔放，也常在旅途中表达对亲友的牵挂，使雄奇与亲切并存。"},"changjian":{"name":"常建","dynasty":"唐","life":"生卒年不详，活动于八世纪","bio":"盛唐诗人，开元年间进士，曾任盱眙尉。生平资料较少，诗多写山林寺院与隐逸情怀，善以清晨光影、曲折路径和幽静声响表现心境。"},"chenziang":{"name":"陈子昂","dynasty":"唐","life":"661—702，卒年有异说","bio":"字伯玉，梓州射洪人，曾任右拾遗。主张恢复诗歌的风骨与兴寄，对初唐诗风转变有重要作用。作品常由历史与天地写到个人抱负，苍劲中含深沉孤独。"},"dufu":{"name":"杜甫","dynasty":"唐","life":"712—770","bio":"字子美，自号少陵野老，河南巩县人。经历安史之乱与长期漂泊，曾在成都居草堂，晚年辗转夔州、湖南。诗歌关切时代与百姓，也细写家人、朋友和草木鸟兽，语言锤炼精深而感情真切。"},"dumu":{"name":"杜牧","dynasty":"唐","life":"803—约852","bio":"字牧之，京兆万年人，曾任多地刺史，晚居樊川。长于七言绝句，也擅长政论与散文。诗中山水鲜明，常有历史意识和敏锐观察，与李商隐并称“小李杜”。"},"fanchengda":{"name":"范成大","dynasty":"宋","life":"1126—1193","bio":"字至能，号石湖居士，吴郡人。曾出使金国，在多地任官，晚年居石湖。诗歌关注农事、风俗与百姓生计，《四时田园杂兴》以季节组织乡村生活，风景中始终有人。"},"fanzhongyan":{"name":"范仲淹","dynasty":"宋","life":"989—1052","bio":"字希文，北宋政治家、文学家，谥文正。曾参与边防事务并推动庆历新政。传世诗词文不以数量取胜，却常将个人感受与公共责任相连，既有边塞苍凉，也有忧民情怀。"},"gaoding":{"name":"高鼎","dynasty":"清","life":"生卒年记载有异，活动于十九世纪","bio":"字象一，一字拙吾，浙江仁和人。生平可考资料不多，有《拙吾诗稿》等传世。《村居》以春日草木和儿童放风筝的场面，为普通乡村生活留下鲜活形象。"},"gaoshi":{"name":"高适","dynasty":"唐","life":"约704—765","bio":"字达夫，早年生活困顿，曾游历边地，后来从军任官。与岑参同为盛唐边塞诗的重要作者。诗风雄健，常将个人抱负、军旅现实和对普通人的关切放在一起。"},"gongzizhen":{"name":"龚自珍","dynasty":"清","life":"1792—1841","bio":"字璱人，号定盦，仁和人。兼治经史与文学，关切社会积弊，主张变革。诗歌感情强烈，意象常出人意外；辞官南归期间的《己亥杂诗》汇集了离情、思考与不息的关怀。"},"gushi19":{"name":"《古诗十九首》·佚名","dynasty":"汉","life":"一般认为形成于东汉，作者不详","bio":"《古诗十九首》由萧统编《文选》合收命名，并非同一作者自编的诗集。作品多写游子思妇、人生短暂和人情离合，语言看似平常，却能细写复杂感受，是文人五言诗成熟的重要标志。"},"guyuefu":{"name":"古乐府·佚名","dynasty":"汉","life":"成篇年代与传唱过程有讨论","bio":"古乐府歌辞常经过长期口头传唱与文字整理，题材涉及家庭、劳作、战争和爱情。此处按常见文学史归类标示“汉”，不表示每篇都能确定汉代作者或精确作年。具体来源与年代问题见作品资料。"},"hanyu":{"name":"韩愈","dynasty":"唐","life":"768—824","bio":"字退之，世称韩昌黎。与柳宗元提倡古文，重视文章的思想力量，曾因谏迎佛骨贬潮州。散文善辩，诗歌也多新奇构思，既有锋芒，也能从草芽春雪中写出幽默与生机。"},"hanyuefu":{"name":"汉乐府·佚名","dynasty":"汉","life":"作者姓名不详","bio":"乐府原为掌管音乐的机构名称，后也成为诗歌类别名。汉乐府民歌多在流传中形成，作者通常不可考。它们以朴素语言记录劳作、爱情、离别和人生感受，后世文人也不断沿用乐府旧题创作。"},"hezhizhang":{"name":"贺知章","dynasty":"唐","life":"659—744","bio":"字季真，晚年自号四明狂客，越州永兴人。曾在长安任职，与李白交往，晚年归乡。传世作品不多，写景抒怀常轻快自然，《咏柳》《回乡偶书》尤其为人熟悉。"},"hulingneng":{"name":"胡令能","dynasty":"唐","life":"生卒年记载有限，活动于中唐","bio":"生平资料较少，传说早年以修补器物为业，居圃田一带。现存诗篇不多，常以浅近语言写日常情景。《小儿垂钓》尤其善于借一个细小动作呈现人物心思。"},"jiadao":{"name":"贾岛","dynasty":"唐","life":"779—843","bio":"字浪仙，一作阆仙，早年曾为僧，后还俗求仕。作诗重推敲，长于五言近体，常写幽僻景物和清寒处境。后世“推敲”故事与其相联，但阅读作品不必依赖故事细节。"},"jiayi":{"name":"贾谊","dynasty":"汉","life":"前200—前168","bio":"洛阳人，西汉初年政论家、辞赋家。曾任太中大夫，后为长沙王太傅、梁怀王太傅。文章善于以历史经验议论现实，《过秦论》气势充沛，辞赋则多有身世感慨。"},"libai":{"name":"李白","dynasty":"唐","life":"701—762","bio":"字太白，号青莲居士，少年成长于蜀地，成年后广泛游历，曾供奉翰林。诗歌想象丰富，语言流动有力，既写山川与抱负，也写友谊、乡思和日常感受。其自由奔放的表达深刻影响后世。"},"lihe":{"name":"李贺","dynasty":"唐","life":"约790—约816，卒年有异说","bio":"字长吉，家居昌谷，青年时期曾任奉礼郎。生命短促，留下想象奇崛、色彩浓烈的诗篇。常将神话、声音与个人失意交织，使日常感官进入陌生而富有张力的世界。"},"limi":{"name":"李密","dynasty":"晋","life":"224—287","bio":"字令伯，犍为武阳人，幼年由祖母刘氏抚养。曾仕蜀汉，入晋后因奉养祖母暂辞征召，作《陈情表》。此李密为西晋文人，不是隋末瓦岗军领袖李密。"},"linjie":{"name":"林杰","dynasty":"唐","life":"831—847","bio":"字智周，福建人，早年即有诗名，年少去世。生平资料与传世作品都很有限。《乞巧》从星空传说转到人间风俗，保存了七夕节日的色彩与共同愿望。"},"liqiao":{"name":"李峤","dynasty":"唐","life":"约644—713","bio":"字巨山，赵州赞皇人，曾任宰相。诗歌重视声律与对偶，留下许多咏物篇章，对初唐近体诗的发展有影响。《风》以物象变化写出不可见之物，是其精巧构思的例子。"},"liqingzhao":{"name":"李清照","dynasty":"宋","life":"1084—约1155","bio":"号易安居士，济南一带人。与赵明诚共同整理金石书画，南渡后经历流离与丧偶。词作善写细微感受和生活情态，诗也有慷慨议论；不能用单一“婉约”概括其全部面貌。"},"lishangyin":{"name":"李商隐","dynasty":"唐","life":"约813—858","bio":"字义山，号玉谿生，怀州河内人。一生仕途失意，多在幕府任职。诗善用典故、象征与细密感受，既有历史反思，也有含蓄难尽的深情；其诗风不能等同于词的婉约派。"},"lishen":{"name":"李绅","dynasty":"唐","life":"772—846","bio":"字公垂，曾参与新乐府创作，与元稹、白居易交游，后来官至宰相。诗歌与其后期仕宦生涯不宜简单混为一谈。《悯农》以农人劳动和粮食来处触动读者。"},"liuchangqing":{"name":"刘长卿","dynasty":"唐","life":"生卒年有争议，活动于八世纪","bio":"字文房，曾任随州刺史，世称刘随州。一生经历贬谪与战乱，擅长五言诗。羁旅行役、暮景寒林与历史凭吊，常在其诗中带出孤独而克制的感情。"},"liuyong":{"name":"柳永","dynasty":"宋","life":"约984—约1053","bio":"原名三变，后名永，字耆卿，崇安人，曾任屯田员外郎。熟悉都市与音乐生活，大量创作慢词，善于铺叙。既写城市繁华，也细写羁旅、相思和离别时的心理过程。"},"liuyuxi":{"name":"刘禹锡","dynasty":"唐","life":"772—842","bio":"字梦得，参与政治革新受挫后长期外任，与柳宗元、白居易交谊深厚。诗文常显出清醒判断与不易消磨的精神，也善于吸收民歌声调。题材从历史山河延伸到日常风物。"},"liuzongyuan":{"name":"柳宗元","dynasty":"唐","life":"773—819","bio":"字子厚，世称柳河东。参与政治革新失败后贬居永州，后任柳州刺史。与韩愈共同推动古文写作，擅长寓言、论说与山水游记；冷峻清丽的风景中，常寄托孤独、关怀与坚持。"},"liyi":{"name":"李益","dynasty":"唐","life":"748—约829","bio":"字君虞，陇西姑臧人，曾在边地军幕任职。诗以边塞、军旅与羁愁见长，尤其善写夜间声音怎样唤起乡思，七言绝句多有传诵之作。"},"liyu":{"name":"李煜","dynasty":"五代","life":"937—978","bio":"字重光，南唐后主。国亡后被迁至汴京，其词由宫廷生活转向故国、失去与人生悲感。语言明白而情绪深切，将个人生命经验带入词中，影响后世甚大。"},"lulun":{"name":"卢纶","dynasty":"唐","life":"约739—799","bio":"字允言，河中蒲州人，为“大历十才子”之一。经历战乱，曾入军幕任职。诗中既有赠答与身世感慨，也有简短有力的军旅篇章，《塞下曲》组诗尤为著名。"},"lunyu":{"name":"《论语》记录者","dynasty":"先秦","life":"春秋战国之际编纂成书","bio":"《论语》主要记录孔子及其弟子的言行，由弟子及再传弟子等整理，不能视为孔子亲笔撰写的专著。孔子名丘，字仲尼，鲁国人，传统生卒为前551—前479年，其思想关注仁、礼、学习与人的相处。"},"luobinwang":{"name":"骆宾王","dynasty":"唐","life":"生卒年有争议，活动于七世纪","bio":"字观光，今浙江义乌人，与王勃、杨炯、卢照邻并称“初唐四杰”。擅长诗歌与骈文，曾为徐敬业起兵撰写檄文。生平后期去向记载不一；《咏鹅》让读者看见他明快传神的另一面。"},"luoyin":{"name":"罗隐","dynasty":"唐","life":"833—909，卒年公历换算有异说","bio":"字昭谏，今浙江杭州一带人。多次应试不第，晚年入钱镠幕府。诗文常以讽喻回应社会不平，咏物中也能写出对劳动、处境与利益分配的追问。"},"luyou":{"name":"陆游","dynasty":"宋","life":"1125—1210","bio":"字务观，号放翁，山阴人。中年入蜀，接触军旅，晚年退居故乡。作品数量丰富，既持续关切恢复中原，也细写田园、家人和饮食起居，深情与日常烟火气并存。"},"mayuan":{"name":"马致远","dynasty":"元","life":"约1250—约1321，生卒年有异说","bio":"号东篱，大都人，元代杂剧家、散曲家。散曲常写羁旅、山林与人生感慨，善用自然语言组合鲜明意象。《天净沙·秋思》使极短篇幅也能容纳深远空间与乡愁。"},"menghaoran":{"name":"孟浩然","dynasty":"唐","life":"689—740","bio":"襄阳人，盛唐山水田园诗的重要作者。曾赴长安求仕，更多时间游历或居乡，与王维等人交往。诗多取材于山水、田园、行旅和友谊，语言清淡自然，宁静中也有失意与牵挂。"},"mengjiao":{"name":"孟郊","dynasty":"唐","life":"751—814","bio":"字东野，湖州武康人，仕途较晚且多困顿。重视炼字与个人感受，常写贫苦、亲情与世态，与贾岛并称“郊岛”。《游子吟》以寻常针线写母爱，显示其深挚的一面。"},"ouyangxiu":{"name":"欧阳修","dynasty":"宋","life":"1007—1072","bio":"字永叔，号醉翁、六一居士，庐陵人。北宋文学家、史学家，倡导诗文革新，提携后进。文章平易流畅而富转折，能在山水游宴中写出个人情怀与对地方生活的关心。"},"pusongling":{"name":"蒲松龄","dynasty":"清","life":"1640—1715","bio":"字留仙，一字剑臣，号柳泉居士，淄川人。长期从事教书与写作，所著《聊斋志异》借鬼狐异事写人情世态。叙事精巧，常在简短篇章中安排悬念、转折与讽刺。"},"qinguan":{"name":"秦观","dynasty":"宋","life":"1049—1100","bio":"字少游，一字太虚，号淮海居士，高邮人，为苏门学士之一。词以细腻深婉著称，身世与离情常相交织，也写明丽山水。《行香子·树绕村庄》通行署其名，但另有张綖作者说，见作品说明。"},"qiujin":{"name":"秋瑾","dynasty":"清","life":"1875—1907","bio":"字璿卿，号竞雄，又号鉴湖女侠，浙江山阴人。曾留学日本，投身革命与女性教育，后遇害。诗词常表达自主、担当与寻找知音的愿望，刚烈之中也有孤独与伤怀。"},"quyuan":{"name":"屈原","dynasty":"先秦","life":"约前340—前278，生卒年有讨论","bio":"名平，字原，战国楚国诗人，传统传记记其曾参与政事，后遭放逐。作品以香草美人、神话远游等意象表达理想与受挫，是楚辞传统的核心作者，对中国文学的想象方式影响深远。"},"shijing":{"name":"《诗经》·佚名","dynasty":"先秦","life":"各篇作者多不可考","bio":"《诗经》收集西周初年至春秋中叶的诗歌，分为风、雅、颂。它不是一个人的创作，诗中有劳作、宴饮、祭祀、战争与男女情感。重章叠句、赋比兴等表达方式深刻影响了后来的中国文学。"},"simaqian":{"name":"司马迁","dynasty":"汉","life":"约前145—卒年不详，生年另有说法","bio":"字子长，夏阳人，承继父亲司马谈的史学志业，曾任太史令。因李陵事件受刑后继续著述，完成《史记》。善将历史结构与人物命运结合，其文字常含对复杂处境中个体的深切理解。"},"songlian":{"name":"宋濂","dynasty":"明","life":"1310—1381","bio":"字景濂，号潜溪，浦江人，生活跨元明。明初参与编修《元史》，并任文学侍从等职。散文兼长传记与赠序，常以个人经验和具体故事展开说理。"},"sushi":{"name":"苏轼","dynasty":"宋","life":"1037—1101","bio":"字子瞻，号东坡居士，眉州眉山人。诗、词、散文、书画均有重要成就，一生多次贬谪，曾居黄州、惠州、儋州。善于从日常风物打开思考，其旷达也常与真实的忧愁、亲情和幽默并存。"},"tansitong":{"name":"谭嗣同","dynasty":"清","life":"1865—1898","bio":"字复生，号壮飞，湖南浏阳人。青年游历多地，后参与戊戌变法，变法失败后遇害。诗文有鲜明的改革意识与开拓精神，常以雄奇山河写不愿受拘束的心气。"},"taoyuanming":{"name":"陶渊明","dynasty":"晋","life":"约365—427，生年有异说","bio":"名潜，字元亮，浔阳柴桑人，生活跨东晋与刘宋。曾短期任官，后归田耕作。诗文以平淡自然的语言写田园、亲情与自我选择，也坦言贫困和人生忧思。"},"wanganshi":{"name":"王安石","dynasty":"宋","life":"1021—1086","bio":"字介甫，号半山，临川人，北宋政治家、文学家。主持变法，也长期从事诗文写作。诗歌兼有议论的锋芒与细密的观察，晚年山水短章尤工；不宜因政治性格而把其全部作品归入“豪放词派”。"},"wangbo":{"name":"王勃","dynasty":"唐","life":"约650—676，生卒年有异说","bio":"字子安，绛州龙门人，为“初唐四杰”之一。少年显露文学才华，一生短促而仕途多折。诗与骈文都富有开阔气象，《送杜少府之任蜀州》《滕王阁序》尤其影响深远。"},"wangchangling":{"name":"王昌龄","dynasty":"唐","life":"约698—约757","bio":"字少伯，盛唐诗人，曾任江宁丞、龙标尉，生平经历贬谪。长于七言绝句，边塞、送别与闺情皆有名篇。善在简洁景象中容纳深情，清刚与含蓄相互支撑。"},"wanghan":{"name":"王翰","dynasty":"唐","life":"约687—726，具体年份有异说","bio":"字子羽，并州晋阳人。曾任地方及朝廷官职，以豪放性情和诗才见称。传世作品较少，《凉州词·葡萄美酒夜光杯》以宴饮场景写出边地军旅的激越与悲凉。"},"wangmian":{"name":"王冕","dynasty":"元","life":"1287—1359，生年有异说","bio":"字元章，号煮石山农等，诸暨人。兼擅诗画，尤其以墨梅著称。作品常将梅花的形态、画面的墨色与自身品格相联系，也留下关切民生的诗篇。"},"wangwan":{"name":"王湾","dynasty":"唐","life":"生卒年不详，活动于八世纪前期","bio":"洛阳人，开元初年进士，曾参与典籍整理并任地方官。传世诗篇有限，《次北固山下》以江行所见交织时序变化与乡思，为人熟知。"},"wangwei":{"name":"王维","dynasty":"唐","life":"约701—761，生年另有说法","bio":"字摩诘，河东蒲州人，曾官至尚书右丞。兼擅诗、画与音乐，长期往来于仕途和山林之间。诗中善写光影、声音与空间层次，山水田园篇章尤著，也留下深情的送别与怀人之作。"},"wangxizhi":{"name":"王羲之","dynasty":"晋","life":"生卒年有异说，常用303—361","bio":"字逸少，东晋书法家，曾任会稽内史、右军将军，世称王右军。与友人游宴、写诗，兼具书法与文学修养。《兰亭集序》既记一场聚会，也把生命感慨留给后来的读者。"},"wangzhihuan":{"name":"王之涣","dynasty":"唐","life":"688—742","bio":"字季凌，盛唐诗人，曾任地方小官。传世诗篇数量很少，却以边塞与登临名作影响深远。其诗常在短小篇幅中打开辽阔空间，兼有雄健气势与深长感慨。"},"weixueyi":{"name":"魏学洢","dynasty":"明","life":"约1596—约1625","bio":"字子敬，嘉善人，魏大中之子，生平短促，留下《茅檐集》。散文《核舟记》通过有次序的观察与细部描摹，让微雕艺术中的人物、动作和空间生动呈现。"},"wengjuan":{"name":"翁卷","dynasty":"宋","life":"生卒年不详，活动于十二至十三世纪","bio":"字续古，一字灵舒，乐清人，与徐照、徐玑、赵师秀并称“永嘉四灵”。多写山水田园与日常见闻，语言简净。《乡村四月》把春雨景色与紧密农事放在同一幅画面里。"},"wentingyun":{"name":"温庭筠","dynasty":"唐","life":"生卒年有争议，活动于九世纪","bio":"字飞卿，本名岐，诗词兼擅，仕途多蹇。诗善写精细物象，词作多收入《花间集》，以浓丽意象和含蓄情感影响后世。其作品既有华美闺情，也有清冷行旅。"},"xinqiji":{"name":"辛弃疾","dynasty":"宋","life":"1140—1207","bio":"字幼安，号稼轩，历城人。青年参加抗金活动，后南归任官，长期希望恢复中原，也有多年退居生活。词善融典故与口语，既雄健激烈，也能细写乡村与难言心事。"},"xuhun":{"name":"许浑","dynasty":"唐","life":"约791—约858","bio":"字用晦，丹阳人，晚居丁卯涧，世称许丁卯。擅长律诗，常写怀古与山水，雨云、暮色和江流等景物反复出现，对偶严整而富历史感。"},"xunzi":{"name":"荀子","dynasty":"先秦","life":"约前313—前238，生卒年有异说","bio":"名况，战国末期赵国思想家，曾游学齐国、任兰陵令。重视礼法、教育与人的后天实践。《荀子》善以日常经验和大量比喻展开论证，对后世思想及说理散文影响深远。"},"yangwanli":{"name":"杨万里","dynasty":"宋","life":"1127—1206","bio":"字廷秀，号诚斋，吉水人。形成清新活泼的“诚斋体”，善从儿童游戏、风雨草木等细节发现意趣。语言浅近而观察敏锐，也有关心时政与民生的作品。"},"yaonai":{"name":"姚鼐","dynasty":"清","life":"1731—1815","bio":"字姬传，一字梦谷，室名惜抱轩，桐城人。辞官后长期在书院讲学，是桐城派代表作家，编有《古文辞类纂》。散文讲究义理与辞章，游记尤其简洁、准确而富观察力。"},"yuanmei":{"name":"袁枚","dynasty":"清","life":"1716—1797","bio":"字子才，号简斋，晚号随园老人，钱塘人。辞官后居南京随园，倡导性灵说，重视个体感受与真情。诗文题材广泛，也愿从儿童、饮食和日常小事中发现趣味。"},"yuqian":{"name":"于谦","dynasty":"明","life":"1398—1457","bio":"字廷益，号节庵，钱塘人。土木堡之变后主持北京防守，后遭诬害，谥忠肃。诗文多见清正与担当，《石灰吟》因其生平而获得更深回响，但具体写作传说仍应审慎看待。"},"zengji":{"name":"曾几","dynasty":"宋","life":"1085—1166","bio":"字吉甫，号茶山居士，曾任地方与朝廷官职，是陆游的诗学前辈。诗歌讲究自然对仗与生活观察，常在清淡景色中呈现出游、读书和友朋往来的兴味。"},"zhangji":{"name":"张继","dynasty":"唐","life":"生卒年不详，活动于八世纪","bio":"字懿孙，襄州人，天宝年间进士，曾在地方任职。生平记载有限，传世诗多写行旅与景物。《枫桥夜泊》以月落、钟声和客船，把一个夜晚写成深远的羁旅记忆。"},"zhangruoxu":{"name":"张若虚","dynasty":"唐","life":"生卒年不详，活动于七世纪末至八世纪初","bio":"扬州人，曾任兖州兵曹，与贺知章、张旭、包融合称“吴中四士”。传世诗很少，《春江花月夜》以月色贯穿景物、相思和生命追问，成为唐诗中独特的长篇。"},"zhanguoce":{"name":"《战国策》编纂者","dynasty":"先秦至汉","life":"多种战国史料汇编，西汉刘向整理定名","bio":"《战国策》记录战国时期政治、外交和游说故事，原材料出自不同记录者。西汉刘向加以校订编次并定名，不应将各篇都当作刘向个人创作。文章善用寓言、类比与层层推进的说理。"},"zhangzhihe":{"name":"张志和","dynasty":"唐","life":"约732—774，卒年有异说","bio":"字子同，号玄真子。早年任官，后隐居江湖，兼通诗词与绘画。《渔歌子》系列以渔父生活寄托自在心境，语言明丽简练，对早期词的发展有影响。"},"zhaoshixiu":{"name":"赵师秀","dynasty":"宋","life":"1170—1219","bio":"字紫芝，号灵秀、天乐等，永嘉人，“永嘉四灵”之一。诗多取材于日常与山水，语言精简，善在雨声、灯花和小动作中捕捉微妙心境。"},"zhengxie":{"name":"郑燮","dynasty":"清","life":"1693—1765，卒日公历另作1766年初","bio":"字克柔，号板桥，兴化人，“扬州八怪”之一。曾任县令，后以书画自给，擅画竹兰石。常用题画诗表达自守与民生关怀，诗、书、画彼此贯通。"},"zhoudunyi":{"name":"周敦颐","dynasty":"宋","life":"1017—1073","bio":"字茂叔，号濂溪，道州营道人。北宋思想家，曾任地方官，重视修养与道德实践。《爱莲说》以植物形态寄寓人格理想，是其清简而有寄托的文学表达。"},"zhugeliang":{"name":"诸葛亮","dynasty":"三国","life":"181—234","bio":"字孔明，琅琊阳都人，早年寓居荆州，后辅佐刘备建立蜀汉，任丞相。文章多服务于军政与教诫，《出师表》《诫子书》显示其审慎说理与深切责任感。"},"zuozhuan":{"name":"《左传》编纂者","dynasty":"先秦","life":"传统署左丘明，成书与作者有争议","bio":"《左传》是以编年方式叙述春秋历史的著作，传统认为与左丘明有关，现代研究对作者和成书过程仍有讨论。其长于战争、外交与人物言谈的叙述，使历史事件呈现出复杂的人事关系。"}},"tags":[{"id":"landscape","name":"景物","parent":null},{"id":"sky","name":"天象气象","parent":"landscape"},{"id":"moon","name":"月","parent":"sky"},{"id":"wind","name":"风","parent":"sky"},{"id":"rain","name":"雨","parent":"sky"},{"id":"snow","name":"雪","parent":"sky"},{"id":"earth","name":"山川水域","parent":"landscape"},{"id":"mountain","name":"山","parent":"earth"},{"id":"water","name":"水","parent":"earth"},{"id":"plants","name":"草木","parent":"landscape"},{"id":"flower","name":"花","parent":"plants"},{"id":"bamboo","name":"竹","parent":"plants"},{"id":"feeling","name":"情感","parent":null},{"id":"quiet","name":"闲适","parent":"feeling"},{"id":"homesick","name":"思念","parent":"feeling"},{"id":"solitude","name":"孤独","parent":"feeling"},{"id":" e","name":"长江","parent":"geo_region_regions"},{"id":"geo_threegorges","name":"三峡","parent":"geo_region_regions"},{"id":"geo_tianshan","name":"天山","parent":"geo_region_regions"},{"id":"geo_yanran","name":"蒙古国杭爱山 · 燕然山","parent":"geo_region_regions"},{"id":"geo_qinling","name":"秦岭 · 太白山","parent":"geo_region_regions"},{"id":"geo_weishui","name":"渭河 · 渭水","parent":"geo_region_regions"},{"id":"geo_region_uncertain","name":"地望有待辨析","parent":"geography"},{"id":"geo_xisai","name":"西塞山","parent":"geo_region_uncertain"},{"id":"geo_xinghua","name":"杏花村","parent":"geo_region_uncertain"},{"id":"geo_yanshan","name":"燕山","parent":"geo_region_uncertain"},{"id":"geo_jieshi","name":"碣石","parent":"geo_region_uncertain"},{"id":"geo_shouxiang","name":"受降城 · 回乐烽","parent":"geo_region_uncertain"},{"id":"geo_feilai","name":"飞来峰","parent":"geo_region_uncertain"},{"id":"geo_region_imagined","name":"想象中的天地","parent":"geography"},{"id":"geo_penglai","name":"蓬山 · 蓬莱","parent":"geo_region_imagined"},{"id":"geo_taoyuan","name":"桃花源 · 武陵源","parent":"geo_region_imagined"},{"id":"geo_kunlun","name":"昆仑 · 昆山","parent":"geo_region_imagined"},{"id":"geo_xiaoxiang","name":"湘江、潇水 · 潇湘","parent":"geo_region_hunan"}],"modules":[{"id":"notes","label":"字词之间","enabled":true},{"id":"author","label":"认识作者","enabled":true},{"id":"places","label":"字里的山河","enabled":true},{"id":"background","label":"写作缘起","enabled":true},{"id":"reading","label":"细读片刻","enabled":true},{"id":"thought","label":"诗里的心意","enabled":true},{"id":"sources","label":"出处与资料","enabled":true}],"works":[{"id":"guiyuan","title":"归园田居·其一","author":"taoyuanming","form":"五言古诗","stage":["高中"],"scene":"mountain","tags":["mountain","flower","quiet","hope","nature","pastoral","metaphor","geo_jiujiang"],"lines":["少无适俗韵，","性本爱丘山。","误落尘网中，","一去三十年。","羁鸟恋旧林，","池鱼思故渊。","开荒南野际，","守拙归园田。","方宅十余亩，","草屋八九间。","榆柳荫后檐，","桃李罗堂前。","暧暧远人村，","依依墟里烟。","狗吠深巷中，","鸡鸣桑树颠。","户庭无尘杂，","虚室有余闲。","久在樊笼里，","复得返自然。"],"quote":[12,13,14,15],"preface":"","intro":"人间的炊烟里，也有自在天地。","notes":[{"q":"适俗韵","text":"适应世俗的性情、气质。"},{"q":"羁鸟","text":"jī niǎo，被束缚、笼养的鸟。"},{"q":"守拙","text":"守住自己的朴拙本性，不随俗取巧。"},{"q":"暧暧","text":"ài ài，昏暗、模糊的样子。"},{"q":"依依","text":"轻柔缓慢地飘升的样子。"},{"q":"樊笼","text":"关鸟兽的笼子，诗中用来比喻受到束缚的生活。"}],"background":"一般认为写于陶渊明辞去彭泽令、归田之后。这是《归园田居》组诗的第一首。“一去三十年”存在“三十”与“十三”的版本讨论，此处采用常见的“三十年”文本，不用这一句直接推算任职年数。","reading":[{"quote":"羁鸟恋旧林，池鱼思故渊。","title":"用鸟与鱼说出归去的心愿","text":"被束缚的鸟、养在池中的鱼都思念旧日天地。比喻让人的归隐愿望有了具体形象。"},{"quote":"暧暧远人村，依依墟里烟。","title":"视线走远，生活仍在","text":"从近处的草屋、榆柳、桃李，望向远村和炊烟，再听见狗吠鸡鸣。田园的宁静里包含真实而平常的人间声息。"}],"thought":"诗人在田园中寻回与本性相合的生活。“自然”既可以指眼前天地，也包含不受扭曲、自在自持的人生态度。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_a537ff195683.aspx","陶渊明《归园田居五首》其一。","“一去三十年”另有异文，此处采用常见传诵文本。","对照页所列异文或通假：误落 一作：误入。正文与旁注分开呈现，异文不混入原文。","“三十年”另有“十三年”文本，沿用现有“三十年”，不据此推定实际任职年数。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%99%B6%E6%B8%8A%E6%98%8E","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shanju","reason":"都写安居的心意，王维的山中多了一场秋雨。"},{"id":"shanzhong","reason":"面对山居之问，李白会怎样回答。"}],"extra":{"places":"柴桑 → 九江一带｜陶渊明辞官归田后的居处背景，联系今江西九江。诗写的是田园生活整体，方宅、草屋、村落并无足够信息对应到唯一现代院落。"}},{"id":"niaomingjian","title":"鸟鸣涧","author":"wangwei","form":"五言绝句","stage":["小学"],"scene":"moon","tags":["moon","mountain","flower","quiet","nature","pastoral","motion","spring","night"],"lines":["人闲桂花落，","夜静春山空。","月出惊山鸟，","时鸣春涧中。"],"quote":[2,3],"preface":"","intro":"听见山鸟，才知道夜有多静。","notes":[{"q":"人闲","text":"人的心境闲静。外界很轻微的变化，也能被留意到。"},{"q":"空","text":"这里写山中空寂、清幽的感觉，并非没有生命。"},{"q":"时鸣","text":"不时鸣叫。鸟声断续地穿过静夜。"}],"background":"《皇甫岳云溪杂题五首》中的一首。具体写作时间、地点有不同考证。诗的重心是一段春山夜景，不必先确定某个传说才能进入它。","reading":[{"quote":"人闲桂花落","title":"先有一颗安静的心","text":"开篇从“人闲”落笔。细微的落花进入感知，人的心境与山中的气息彼此相接。"},{"quote":"月出惊山鸟，时鸣春涧中。","title":"声音给寂静留下形状","text":"月亮升起、鸟被惊动，都是变化；断续的鸣叫让四周的幽静更可感。动与静并不冲突，而是相互显现。"}],"thought":"这首诗没有急于说明一种道理，而是邀请人放慢感知：在看似空寂的山中，仍有花落、月升与鸟鸣。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_8ec950bd1395.aspx","王维《皇甫岳云溪杂题五首》其一。","原文采用现代通行标点；赏读为本工具编写。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E7%BB%B4","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zhuliguan","reason":"同是王维的月夜，鸟声换成了琴声。"},{"id":"jingyesi","reason":"同一轮月，也会牵动对故乡的思念。"},{"id":"chengtian","reason":"沿着夜色，去看苏轼庭院里的竹柏影。"}],"extra":{}},{"id":"jingyesi","title":"静夜思","author":"libai","form":"五言绝句","stage":["小学"],"scene":"moon","tags":["moon","homesick","night","metaphor"],"lines":["床前明月光，","疑是地上霜。","举头望明月，","低头思故乡。"],"quote":[2,3],"preface":"","intro":"抬头的一瞬，远方也来到眼前。","notes":[{"q":"疑","text":"以为、仿佛觉得。写初见清冷月色时的感觉。"},{"q":"霜","text":"月光令人联想到白霜，是比喻中的景象，并非说地上真的结霜。"},{"q":"故乡","text":"自己的家乡。诗没有写具体地名，反而使这种思念更容易被不同的人感受。"}],"background":"这首诗历来有不同文本传承，本篇采用“床前明月光”“举头望明月”的通行版本。具体创作时地的说法不一，阅读可从眼前月光与思乡之情入手。","reading":[{"quote":"疑是地上霜","title":"把月光写得能触摸","text":"用熟悉的霜色去感觉月光，视觉中也仿佛带出一丝凉意。"},{"quote":"举头望明月，低头思故乡。","title":"两个动作，一次远行","text":"“举头”与“低头”极平常，目光却从眼前转向故乡。思念没有铺陈，已经落在动作之间。"}],"thought":"清冷的月色触动了思乡。诗用人人都可能有过的动作与感受，让短短四句容纳了遥远的牵念。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_c35a60c1a8e2.aspx","李白《静夜思》；采用现代常见传诵本。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shuidiaogetou","reason":"从思乡的月，读到祝愿亲人平安的月。"},{"id":"tianjingsha","reason":"月夜之外，黄昏也会让远行的人想家。"}],"extra":{}},{"id":"shanju","title":"山居秋暝","author":"wangwei","form":"五言律诗","stage":["小学"],"scene":"mountain","tags":["mountain","water","moon","bamboo","quiet","nature","pastoral","motion","autumn"],"lines":["空山新雨后，","天气晚来秋。","明月松间照，","清泉石上流。","竹喧归浣女，","莲动下渔舟。","随意春芳歇，","王孙自可留。"],"quote":[2,3],"preface":"","intro":"月色与泉声之间，也住着人间。","notes":[{"q":"暝","text":"míng，日暮、天色将晚。"},{"q":"浣女","text":"洗衣的女子。“浣”读 huàn。"},{"q":"随意","text":"任凭。春日花草即使凋谢，眼前秋景仍值得停留。"},{"q":"王孙","text":"本指贵族子弟，后来也用来称隐居者或游人；这里联系结尾的归隐意味理解。"}],"background":"这是一首描写山居秋日暮景的作品。具体作年没有定论。结句化用《楚辞·招隐士》中有关“王孙”归留的语意，写出对山中生活的留恋。","reading":[{"quote":"明月松间照，清泉石上流。","title":"两行里有光，也有声音","text":"明月与清泉、松间与石上相互对举。静静的照映与流动的水声，让画面清澈而有层次。"},{"quote":"竹喧归浣女，莲动下渔舟。","title":"先听见，再看见","text":"先写竹林的声响、莲叶的摇动，再写归来的浣女和穿行的渔舟。山中并非无人，生活正从景物后面显现。"}],"thought":"诗写山水的清幽，也写平常生活的生机。对这样的天地与人间，诗人自然生出“自可留”的愿望。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_44ba4afb80db.aspx","王维《山居秋暝》。","结句语意可参读《楚辞·招隐士》。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E7%BB%B4","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"niaomingjian","reason":"再看王维如何写山中另一种静。"},{"id":"shanzhong","reason":"李白也在山里，回答一个关于归属的问题。"}],"extra":{}},{"id":"chunyu","title":"春夜喜雨","author":"dufu","form":"五言律诗","stage":["小学"],"scene":"rain","tags":["rain","wind","flower","joy","spring","night","personification","geo_chengdu"],"lines":["好雨知时节，","当春乃发生。","随风潜入夜，","润物细无声。","野径云俱黑，","江船火独明。","晓看红湿处，","花重锦官城。"],"quote":[2,3],"preface":"","intro":"有些欢喜，轻得像一场夜雨。","notes":[{"q":"发生","text":"萌发、生长。句中说春雨正当万物萌发生长的时节到来。"},{"q":"潜","text":"qián，悄悄地。"},{"q":"花重","text":"“重”读 zhòng，花朵带着雨水，显得沉甸甸。"},{"q":"锦官城","text":"成都的别称。"}],"background":"一般系于杜甫寓居成都草堂时期。春雨与草木、农事和生活息息相关，诗中的“喜”从一开始的“好”字便流露出来。","reading":[{"quote":"好雨知时节","title":"雨仿佛也懂得体贴","text":"“知”把人的体察赋予春雨。这种拟人不是热闹的赞美，而是对雨来得正好的珍惜。"},{"quote":"晓看红湿处，花重锦官城。","title":"从今夜望向明晨","text":"眼前还在夜里，诗却已经想到雨后的满城春花。想象将喜悦悄悄延长到天亮。"}],"thought":"诗人的欣喜来自雨水对万物的滋养。爱自然的细腻感受，也与关心生活的心意相通。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_d48451f00541.aspx","杜甫《春夜喜雨》。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yueke","reason":"另一场夜雨里，有人在灯下等待朋友。"},{"id":"xiaochi","reason":"雨后往前走，去看一枝刚露尖角的荷。"}],"extra":{"places":"锦官城 → 成都｜正文明确写到的城市。锦官城是成都的别称，诗通常系于杜甫居成都草堂时期。诗人从夜雨想到明晨满城湿润的花，把一场雨写成对整座城的祝愿。"}},{"id":"jiangxue","title":"江雪","author":"liuzongyuan","form":"五言绝句","stage":["小学"],"scene":"snow","tags":["snow","mountain","water","solitude","resolve","winter","contrast","geo_yongzhou"],"lines":["千山鸟飞绝，","万径人踪灭。","孤舟蓑笠翁，","独钓寒江雪。"],"quote":[2,3],"preface":"","intro":"天地留白，一人一舟。","notes":[{"q":"绝","text":"没有、断绝。"},{"q":"人踪","text":"人的踪迹。"},{"q":"蓑笠","text":"suō lì，蓑衣与斗笠，旧时用来遮雨雪。"}],"background":"通常联系柳宗元贬居永州后的处境来理解，具体写作时间不宜断定。渔翁形象常被读出孤独与自持，但也可以先把它看作一幅极简的寒江雪景。","reading":[{"quote":"千山鸟飞绝，万径人踪灭。","title":"先把世界铺开，再让它安静","text":"“千”“万”将空间推远，“绝”“灭”又抹去了飞鸟与行人的踪迹。辽阔的画面由此显得格外寂静。"},{"quote":"孤舟蓑笠翁","title":"留白中出现一个人","text":"大面积的空寂之后，一人一舟显得异常清晰。“孤”与“独”把视线收拢，也留下了不肯被环境淹没的意味。"}],"thought":"广阔而清寒的环境中，一个独钓者仍然存在。孤寂、自持与人与天地的关系，都能从这幅画面中被读到。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_58313be2d918.aspx","柳宗元《江雪》。","贬谪身世与渔翁象征之间的联系属于常见阐释，并非诗中明言。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9F%B3%E5%AE%97%E5%85%83","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zhushi","reason":"从寒江中的独钓者，读到岩石间的竹。"},{"id":"zhuliguan","reason":"另一个独坐的人，身边有琴与月光。"}],"extra":{"places":"永州｜通常将本诗联系柳宗元被贬永州时期，即今湖南永州。正文未点明江名或垂钓位置，不应把“寒江”固定为某一景点。"}},{"id":"zhushi","title":"竹石","author":"zhengxie","form":"七言绝句","stage":["小学"],"scene":"bamboo","tags":["bamboo","mountain","wind","resolve","object","personification","aspiration"],"lines":["咬定青山不放松，","立根原在破岩中。","千磨万击还坚劲，","任尔东西南北风。"],"quote":[2,3],"preface":"","intro":"一株竹，也有自己的站立方式。","notes":[{"q":"破岩","text":"裂开的岩石、岩缝。"},{"q":"坚劲","text":"坚韧有力。“劲”读 jìng。"},{"q":"任尔","text":"任凭你。“尔”指你。"}],"background":"这是一首题画诗，与郑燮擅画竹石的创作相联系。诗中竹的形象和人的精神相映照，具体题画时间未在本样例中确定。","reading":[{"quote":"咬定青山不放松","title":"一个“咬”字，让竹有了意志","text":"写竹根抓住岩石，用上带有力度的动作。竹不只是被观看的植物，也显得有主动站稳的力量。"},{"quote":"任尔东西南北风","title":"让风从各个方向来","text":"风向被逐一展开，竹的坚韧便不止属于一次考验。托物言志的意味由具体形象生长出来。"}],"thought":"岩缝中的竹经历风吹磨击仍然坚韧，寄托着对有根、有所坚守的品格的欣赏。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_e5c9337524b7.aspx","郑燮《竹石》，题画诗。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%83%91%E6%9D%BF%E6%A1%A5","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"loushiming","reason":"从一株竹的坚守，读到一个人如何安放自己的生活。"},{"id":"jiangxue","reason":"风雪中的另一个身影，也保持着自己的姿态。"}],"extra":{}},{"id":"yinhu","title":"饮湖上初晴后雨·其二","author":"sushi","form":"七言绝句","stage":["小学"],"scene":"water","tags":["water","mountain","rain","joy","nature","metaphor","geo_hangzhou"],"lines":["水光潋滟晴方好，","山色空蒙雨亦奇。","欲把西湖比西子，","淡妆浓抹总相宜。"],"quote":[0,1],"preface":"","intro":"晴有晴的明丽，雨有雨的空蒙。","notes":[{"q":"潋滟","text":"liàn yàn，水波荡漾、波光闪动的样子。"},{"q":"空蒙","text":"迷茫缥缈的样子；也有版本作“空濛”。"},{"q":"西子","text":"西施，古代著名美女。"},{"q":"相宜","text":"合适、相称。"}],"background":"写于苏轼在杭州任职时期，是同题组诗中的第二首。题目已经提示天气的转变：游湖时先晴后雨，两种景致都被留在诗中。","reading":[{"quote":"水光潋滟晴方好，山色空蒙雨亦奇。","title":"让两种天气各有位置","text":"一“好”一“奇”，没有让晴雨相争，而是分别看见它们的美。"},{"quote":"淡妆浓抹总相宜","title":"一个比喻，容纳变化","text":"用西子的妆容比西湖的晴雨，以熟悉的人物美感写自然。重心落在“总”字：景物变化，自有各自的动人之处。"}],"thought":"诗人欣赏西湖在不同天气中的姿态，也表现出一种善于发现、乐于容纳变化的眼光。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_8949464433f0.aspx","苏轼《饮湖上初晴后雨二首》其二。","“空蒙”另有“空濛”等写法，此处采用常见简体写法。","对照页所列异文或通假：蒙一作：濛。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8B%8F%E8%BD%BC","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chunyu","reason":"换一种雨，听杜甫写春夜的滋润。"},{"id":"shanju","reason":"雨停以后，山中又是怎样的景象。"}],"extra":{"places":"西湖｜正文“西湖”的所指，在今浙江杭州，也称钱塘湖。“西子”是西施的称谓，属于人物比喻，不是另一个地名。"}},{"id":"shanzhong","title":"山中问答","author":"libai","form":"七言绝句","stage":[],"scene":"flower","tags":["mountain","water","flower","quiet","hope","nature","spring"],"lines":["问余何意栖碧山，","笑而不答心自闲。","桃花流水窅然去，","别有天地非人间。"],"quote":[2,3],"preface":"","intro":"有些回答，交给流水与桃花。","notes":[{"q":"余","text":"我。"},{"q":"栖","text":"qī，居住、停留。"},{"q":"窅然","text":"yǎo rán，深远的样子。"}],"background":"又题《山中答俗人》。写作时地有不同说法，诗中以问答展开，但真正的回答落在山水画面里。","reading":[{"quote":"笑而不答心自闲","title":"一句没有说出口的话","text":"面对发问，诗人先写笑与闲适。情态本身已透露了对山居的喜爱。"},{"quote":"桃花流水窅然去","title":"让风景接着回答","text":"桃花随水远去，视线被引向深处。“别有天地”的感受从眼前景物生出，保留了想象空间。"}],"thought":"山居的快乐可以是一种难以用解释穷尽的亲身感受。诗以笑容和景色表达对自在生活的向往。","sources":["原文对照：https://zh.wikisource.org/wiki/%E8%90%AC%E9%A6%96%E5%94%90%E4%BA%BA%E7%B5%B6%E5%8F%A5_%28%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E6%9C%AC%29/%E4%B8%83%E8%A8%80%E5%8D%B702","李白《山中问答》，另题《山中答俗人》。","《萬首唐人絶句》七言卷二“山中問荅”可对读；繁体及“荅”等字形转为通行简体。沿用既有李白《山中问答》的标识，不与王维《山中》混同。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shanju","reason":"王维也愿意留在山里，却写出了不同的人间气息。"},{"id":"zengwanglun","reason":"李白笔下的水，也能丈量朋友的情意。"}],"extra":{}},{"id":"zhuliguan","title":"竹里馆","author":"wangwei","form":"五言绝句","stage":["初中"],"scene":"bamboo","tags":["bamboo","moon","quiet","solitude","nature","pastoral","night","geo_lantian"],"lines":["独坐幽篁里，","弹琴复长啸。","深林人不知，","明月来相照。"],"quote":[2,3],"preface":"","intro":"无人知晓的时候，还有月光。","notes":[{"q":"幽篁","text":"yōu huáng，幽深的竹林。"},{"q":"长啸","text":"撮口发出清越悠长的声音，是古人抒发情怀的一种方式。"},{"q":"相照","text":"照着我，仿佛明月前来作伴。"}],"background":"《辋川集》中的一首，与王维的辋川生活相关。竹里馆是组诗所写景点之一。","reading":[{"quote":"弹琴复长啸","title":"独处也有自己的声息","text":"琴声和长啸并未破坏竹林的幽深，反而让独坐的人显得自在、有所寄托。"},{"quote":"明月来相照","title":"月光像一位安静的朋友","text":"“来”与“相照”给明月添了亲近感。无人知晓的独处，因月光而显得温柔。"}],"thought":"诗写独处，却未必等于寂寞难耐。与竹林、琴声和月色相处，也可以自得而充实。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4809b5e7a16a.aspx","王维《辋川集·竹里馆》。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E7%BB%B4","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"niaomingjian","reason":"循着声音，再听王维山中的鸟鸣。"},{"id":"chengtian","reason":"另一处竹柏影中，还有一位可以相伴夜游的朋友。"}],"extra":{"places":"竹里馆、辋川｜竹里馆为《辋川集》中的景点，辋川在今陕西蓝田一带。竹林中的弹琴、长啸与明月，写的是此处幽居体验。"}},{"id":"zengwanglun","title":"赠汪伦","author":"libai","form":"七言绝句","stage":["小学"],"scene":"water","tags":["water","friendship","farewell","metaphor","geo_jingxian"],"lines":["李白乘舟将欲行，","忽闻岸上踏歌声。","桃花潭水深千尺，","不及汪伦送我情。"],"quote":[2,3],"preface":"","intro":"舟要远去，歌声把情意留住。","notes":[{"q":"踏歌","text":"一边唱歌、一边用脚踏地打节拍的歌唱方式。"},{"q":"深千尺","text":"用夸张写潭水之深，进而衬出情谊更深。"},{"q":"桃花潭","text":"地名，在今安徽泾县。"}],"background":"写李白将离开时，汪伦以踏歌相送的情景。关于二人相识的故事有后世传说，此处以诗中能够确认的送别画面为主。","reading":[{"quote":"忽闻岸上踏歌声","title":"送别先从声音抵达","text":"“忽闻”写出意外与惊喜。尚未说明朋友深情，歌声已经来到舟边。"},{"quote":"不及汪伦送我情","title":"用看得见的深，写看不见的情","text":"潭水深浅可以想象，情谊却难测量。夸张与比较将抽象情意变得鲜明而可感。"}],"thought":"朴素的送别方式，因为真挚情谊而值得记住。诗用明快的语气写出了对朋友的珍惜。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_ca9eaf40a6ce.aspx","李白《赠汪伦》。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yueke","reason":"朋友将至时，也有另一种静静等待的心情。"},{"id":"shuidiaogetou","reason":"不能相聚时，情意还能寄给一轮明月。"}],"extra":{"places":"桃花潭｜诗中以水深比友情的地点，在今安徽宣城泾县。诗没有详细记述渡口路线，重点是潭水之深仍不及相送之情。"}},{"id":"tianjingsha","title":"天净沙·秋思","author":"mayuan","form":"散曲·小令","stage":["初中"],"scene":"mountain","tags":["wind","water","homesick","solitude","travel","autumn"],"lines":["枯藤老树昏鸦，","小桥流水人家，","古道西风瘦马。","夕阳西下，","断肠人在天涯。"],"quote":[3,4],"preface":"","intro":"一路风景，落在一个远行人的心上。","notes":[{"q":"天净沙","text":"曲牌名。“秋思”是题目。"},{"q":"昏鸦","text":"黄昏时归巢的乌鸦。"},{"q":"断肠","text":"形容极度悲伤。"}],"background":"这是一首元代散曲小令。具体写作时地难以确定，作品集中描绘深秋黄昏的羁旅景象。","reading":[{"quote":"枯藤老树昏鸦","title":"把景物一件件放到眼前","text":"前三句以密集的名词性意象并置，少用解释，却迅速构成可见可感的画面。"},{"quote":"小桥流水人家","title":"温暖的所在，照出漂泊","text":"“人家”带来安居的意味，与古道上的远行者相映，乡愁因此更加具体。"}],"thought":"深秋景色与漂泊心绪层层相接，最后才点出天涯之人。眼前世界看似由景物组成，处处却带着人的感受。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_9dcf133d25cc.aspx","马致远《天净沙·秋思》。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%A9%AC%E8%87%B4%E8%BF%9C","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jingyesi","reason":"黄昏的乡愁，到了月夜又有另一种表达。"},{"id":"shanju","reason":"同一个秋天，在山居者眼里却清澈可亲。"}],"extra":{}},{"id":"yueke","title":"约客","author":"zhaoshixiu","form":"七言绝句","stage":["初中"],"scene":"rain","tags":["rain","friendship","quiet","summer","night","motion"],"lines":["黄梅时节家家雨，","青草池塘处处蛙。","有约不来过夜半，","闲敲棋子落灯花。"],"quote":[2,3],"preface":"","intro":"等一个人，连时间都有了声音。","notes":[{"q":"黄梅时节","text":"梅子成熟的初夏时节，江南常多雨。"},{"q":"灯花","text":"灯芯燃烧后结成的花状物。"},{"q":"闲敲","text":"随手、无意地敲着，也透露出等待中的心绪。"}],"background":"诗写雨夜约客未至的生活片刻。具体作年未详，阅读的线索就在雨声、蛙声与敲棋子的动作之中。","reading":[{"quote":"黄梅时节家家雨，青草池塘处处蛙。","title":"把等待放进一整个雨季","text":"重复的“家家”“处处”使雨声与蛙鸣遍布四周，读者也仿佛进入湿润的夜。"},{"quote":"闲敲棋子落灯花","title":"一个小动作，让心情显影","text":"诗没有直接说焦急或无聊，只写敲棋子。表面闲散的动作里，等待的漫长渐渐可感。"}],"thought":"雨夜等友，既有清幽的环境，也有客人迟迟未到的怅惘。细小的日常动作，足以容纳复杂心情。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_c1537124e930.aspx","赵师秀《约客》。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%B5%B5%E5%B8%88%E7%A7%80","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chunyu","reason":"同是夜雨，杜甫听见的是滋养万物的欢喜。"},{"id":"zengwanglun","reason":"等待之外，也看看朋友意外出现的瞬间。"}],"extra":{}},{"id":"shuidiaogetou","title":"水调歌头·明月几时有","author":"sushi","form":"词","stage":["初中"],"scene":"moon","tags":["moon","homesick","hope","night","autumn","bold","geo_zhucheng"],"lines":["明月几时有？把酒问青天。","不知天上宫阙，今夕是何年。","我欲乘风归去，又恐琼楼玉宇，高处不胜寒。","起舞弄清影，何似在人间。","转朱阁，低绮户，照无眠。","不应有恨，何事长向别时圆？","人有悲欢离合，月有阴晴圆缺，此事古难全。","但愿人长久，千里共婵娟。"],"quote":[7],"preface":"丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。","intro":"相隔很远的人，也能拥有同一片月光。","notes":[{"q":"子由","text":"苏轼的弟弟苏辙，字子由。"},{"q":"不胜寒","text":"承受不住寒冷。“胜”读 shèng。"},{"q":"绮户","text":"qǐ hù，有雕饰的窗户。"},{"q":"婵娟","text":"chán juān，原形容美好，这里指明月。"}],"background":"作于宋神宗熙宁九年（1076）中秋，苏轼任职密州时。小序明确写出“兼怀子由”，词中对月的思索也与兄弟分离的牵念相连。","reading":[{"quote":"我欲乘风归去，又恐琼楼玉宇","title":"在向往与迟疑之间","text":"“欲”与“恐”使想象产生波折。天上与人间的往返，也表现了心绪的展开。"},{"quote":"人有悲欢离合，月有阴晴圆缺","title":"从一人的离别，望向共同的人生","text":"人与月并列，把个人遭际放进更广阔的变化之中。理解不圆满，并没有抹去牵挂，而是为祝愿留出位置。"}],"thought":"词经历发问、向往、犹疑与体认，最终落在对人的祝福。旷达之中始终有情，愿相隔的人仍可共享月色。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_632c5beb84eb.aspx","苏轼《水调歌头》（明月几时有），小序为作品原有文字。","对照页所列异文或通假：何似 一作：何时；又恐 一作：惟 / 唯恐；长向 一作：偏向。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8B%8F%E8%BD%BC","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jingyesi","reason":"另一位诗人，也曾举头望月。"},{"id":"chengtian","reason":"若换一个夜晚，苏轼会邀朋友一起走进月色。"}],"extra":{"places":"密州 → 诸城｜通常系于苏轼知密州时所作，今山东诸城一带。正文没有城名；这一背景说明身在何处，却不限制“千里共婵娟”所表达的普遍思念。"}},{"id":"chengtian","title":"记承天寺夜游","author":"sushi","form":"古文·记","stage":["初中"],"scene":"moon","tags":["moon","bamboo","friendship","hope","quiet","night","metaphor","geo_huangzhou"],"lines":["元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。","念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。","庭下如积水空明，水中藻、荇交横，盖竹柏影也。","何夜无月？何处无竹柏？但少闲人如吾两人者耳。"],"quote":[2],"preface":"","intro":"月色来敲门，便起身去找一个朋友。","notes":[{"q":"念","text":"想到、考虑到。"},{"q":"相与","text":"一起、共同。"},{"q":"藻、荇","text":"水生植物；荇读 xìng。这里以水草交错写竹柏的影子。"},{"q":"闲人","text":"闲暇的人，也含有作者处境与自我调侃的意味，不能只理解为无所事事。"}],"background":"记于元丰六年（1083），苏轼贬居黄州期间。张怀民也寓居当地。短文从夜间起身写起，记录一次有友人相伴的月下散步。","reading":[{"quote":"月色入户，欣然起行","title":"让一束光改变一个夜晚","text":"原本要睡，因月色而起。简练的动词写出一种仍能被美触动的心境。"},{"quote":"庭下如积水空明","title":"先看见水，再认出影子","text":"以清水比月光，以水草比竹柏影。末尾“盖”字点明实景，读者仿佛也经历一次凝视与辨认。"}],"thought":"月与竹柏本寻常，难得的是有时间、有心意，也有同行的人。悠闲中有自我宽解，清赏里仍能读到身世的余味。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_221828a8f12d.aspx","苏轼《记承天寺夜游》，收入《东坡志林》。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8B%8F%E8%BD%BC","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zhuliguan","reason":"同样的月光与竹影，王维选择独坐。"},{"id":"shuidiaogetou","reason":"由眼前的朋友，读向苏轼对远方亲人的思念。"}],"extra":{"places":"黄州、承天寺｜今湖北黄冈黄州。苏轼夜访张怀民的地点，由“至承天寺寻张怀民”直接点明；寺院中庭的小片月色因此有了可感的生活位置。"}},{"id":"loushiming","title":"陋室铭","author":"liuyuxi","form":"古文·铭","stage":["初中"],"scene":"bamboo","tags":["resolve","quiet","aspiration","contrast","geo_nanyang","geo_chengdu"],"lines":["山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。","苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。","可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。","南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？"],"quote":[1],"preface":"","intro":"屋子虽小，精神可以自有天地。","notes":[{"q":"铭","text":"古代刻在器物上用来称述功德或警戒自己的文字，后来成为一种文体。"},{"q":"德馨","text":"德行美好。馨原指散布很远的香气。"},{"q":"鸿儒","text":"学识渊博的人。"},{"q":"案牍","text":"àn dú，官府公文。"},{"q":"何陋之有","text":"有什么简陋的呢？语序相当于“有何陋”。"}],"background":"传统署名刘禹锡。围绕居室的题铭展开，具体写作情境与相关轶事并非都可确证，本样例不采用未经核实的迁居故事。","reading":[{"quote":"斯是陋室，惟吾德馨","title":"衡量生活的另一把尺","text":"房屋外在的简陋与人的品格相对照，立意由物转向人。"},{"quote":"苔痕上阶绿，草色入帘青","title":"两抹绿色，把居所写活","text":"“上”“入”使苔痕草色有了动态，整齐的句式中也有自然的生机。"}],"thought":"文章把居所与精神生活联系起来，表达对品格、志趣和自主生活的看重。对古文中的交游观念，也可以结合时代背景保持思考。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_6c1ea9b7dd44.aspx","《陋室铭》，传统署名刘禹锡。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%88%98%E7%A6%B9%E9%94%A1","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zhushi","reason":"同样借具体事物表达精神上的坚守。"},{"id":"zhuliguan","reason":"从室内的素琴，走到竹林里的琴声。"}],"extra":{"places":"南阳诸葛庐｜引用诸葛亮躬耕旧居的典故。汉代南阳郡的范围跨今河南、湖北部分地区，具体躬耕地存在南阳、隆中等讨论，不能用现代市界直接裁定。\n\n西蜀子云亭｜引用扬雄读书著述的典故，通常联系今四川成都。两处均用于比照陋室主人的志趣，不是作者的游览路线。"}},{"id":"xiaochi","title":"小池","author":"yangwanli","form":"七言绝句","stage":["小学"],"scene":"flower","tags":["water","lotusleaf","joy","quiet","summer","personification"],"lines":["泉眼无声惜细流，","树阴照水爱晴柔。","小荷才露尖尖角，","早有蜻蜓立上头。"],"quote":[2,3],"preface":"","intro":"一点点新生，已经有人留意。","notes":[{"q":"泉眼","text":"泉水涌出的出口。"},{"q":"晴柔","text":"晴天里柔和的风光。"},{"q":"小荷","text":"刚长出的嫩荷叶。"}],"background":"这首诗捕捉小池边初夏的细景，具体作年未在本样例中确定。泉水、树阴、荷叶和蜻蜓构成一个近在眼前的小世界。","reading":[{"quote":"泉眼无声惜细流，树阴照水爱晴柔。","title":"让景物有了轻轻的心意","text":"“惜”“爱”把人的感受赋予泉眼与树阴，使平常景物显得温柔可亲。"},{"quote":"小荷才露尖尖角，早有蜻蜓立上头。","title":"抓住刚刚发生的一刻","text":"“才”与“早”相呼应，把初生荷叶与先到蜻蜓联系起来。小小的时间差，写出了发现的惊喜。"}],"thought":"诗把注意力交给细小的新生与变化。生活里可亲的美，常需要停下来才看得见。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_31dd7d07323c.aspx","杨万里《小池》。","对照页所列异文或通假：阴 一作：荫。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%A8%E4%B8%87%E9%87%8C","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chunyu","reason":"从初夏新荷，回望春雨怎样滋养万物。"},{"id":"niaomingjian","reason":"留意细小变化的人，也能听见山中花落鸟鸣。"}],"extra":{}},{"id":"jiangnan","title":"江南","author":"hanyuefu","form":"乐府民歌","stage":["小学"],"scene":"water","tags":["joy","nature","water","lotusleaf","repetition","geo_jiangnan"],"lines":["江南可采莲，","莲叶何田田。","鱼戏莲叶间。","鱼戏莲叶东，","鱼戏莲叶西，","鱼戏莲叶南，","鱼戏莲叶北。"],"quote":[1,2],"preface":"","intro":"跟着游鱼，绕荷叶唱一圈。","notes":[{"q":"田田","text":"形容莲叶繁盛、相连的样子。"},{"q":"戏","text":"嬉游，写鱼在水中轻快地穿行。"}],"background":"汉代乐府古辞，后收入郭茂倩《乐府诗集》。它保留了民歌适合反复歌唱的节奏，具体作者不可考。","reading":[{"quote":"莲叶何田田","title":"先赞叹，再看见","text":"“何”把赞叹放进句子，满塘荷叶先铺开，游鱼随后出现，景物因运动而鲜活。"},{"quote":"鱼戏莲叶东","title":"方向也能成为节奏","text":"东、西、南、北依次变换，同一句式反复出现，读起来像歌声在水面往复回荡。"}],"thought":"采莲时节的水乡生机与劳动生活的欢悦，寄托在莲叶和游鱼的画面中。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_ef9cd9ba44bb.aspx","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chishang","reason":"同看一池荷叶：从游鱼与小艇，读到荷花和尖角上的蜻蜓。"},{"id":"xiaochi","reason":"同看一池荷叶：从游鱼与小艇，读到荷花和尖角上的蜻蜓。"}],"extra":{"places":"江南｜题目所指的采莲水乡。这里是长江以南的文化地理区域，范围随时代和语境变化，可联系今天江苏、浙江、安徽、江西等地的水乡，不对应一座固定的城市。"}},{"id":"zhanggexing","title":"长歌行","author":"hanyuefu","form":"五言古诗","stage":["小学"],"scene":"water","tags":["timepassing","reflection","plants","water","spring","contrast"],"lines":["青青园中葵，","朝露待日晞。","阳春布德泽，","万物生光辉。","常恐秋节至，","焜黄华叶衰。","百川东到海，","何时复西归？","少壮不努力，","老大徒伤悲！"],"quote":[2,3],"preface":"","intro":"一株葵菜，把清晨和一生连起来。","notes":[{"q":"晞","text":"读 xī，晒干；露水随日光渐渐消散。"},{"q":"焜黄","text":"读 kūn huáng，形容草木枯黄。"},{"q":"徒","text":"白白地，只能留下无益的感叹。"}],"background":"汉乐府古辞，收入《乐府诗集·相和歌辞》。作品借自然盛衰谈时间，不是某位名人留下的个人日记。","reading":[{"quote":"阳春布德泽","title":"从露珠写到万物","text":"镜头从园中葵菜展开到春天的整个世界，生命的繁盛也使后来衰败的转折更鲜明。"},{"quote":"百川东到海","title":"用流水提出问题","text":"流水不能回头，与青春不能重来的意思相通；设问让结尾的劝勉有了具体形象。"}],"thought":"惜时的提醒来自对生命盛衰的观察，珍惜眼前可以行动的时光。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_183d69f50755.aspx","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"lunyushierzhang","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"},{"id":"songdongyangmashengxu","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"}],"extra":{}},{"id":"chileige","title":"敕勒歌","author":"beichaominge","form":"乐府民歌","stage":["小学"],"scene":"mountain","tags":["nature","grass","wind","mountain","joy","folk","geo_yinshan"],"lines":["敕勒川，","阴山下。","天似穹庐，","笼盖四野。","天苍苍，","野茫茫，","风吹草低见牛羊。"],"quote":[2,3],"preface":"","intro":"风把草原深处的牛羊带到眼前。","notes":[{"q":"敕勒","text":"读 chì lè，古代北方族名。"},{"q":"穹庐","text":"读 qióng lú，毡帐；用来比喻笼罩四野的天空。"},{"q":"见","text":"这里同“现”，显露出来。"}],"background":"北朝民歌，传世文本见《乐府诗集》。敕勒川一般指阴山一带的草原；歌曲的流传与译写过程不宜当作某个人的确定创作经历。","reading":[{"quote":"天似穹庐","title":"天空是一顶大帐篷","text":"以牧民熟悉的毡帐写天空，既交代开阔的空间，也让比喻带着草原生活的气息。"},{"quote":"风吹草低见牛羊","title":"最后一阵风让画面活起来","text":"此前是天与地的远景，末句用草伏、牛羊显现的瞬间，把静态全景变成有生命的现场。"}],"thought":"草原的辽阔丰美与人对生活土地的亲近，在质朴而响亮的歌声中相遇。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_f996111bff75.aspx","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"guancanghai","reason":"同样面对辽阔天地，比较民歌的亲切、观海的雄心与山河的奔放。"},{"id":"tongguan","reason":"同样面对辽阔天地，比较民歌的亲切、观海的雄心与山河的奔放。"}],"extra":{"places":"敕勒川、阴山｜正文中的草原与群山。敕勒川通常联系今内蒙古阴山南麓、土默川及河套一带，历史称谓范围并不固定；阴山山脉主要在今内蒙古境内。"}},{"id":"yonge","title":"咏鹅","author":"luobinwang","form":"杂言古诗","stage":["小学"],"scene":"water","tags":["joy","water","animal","motion","contrast"],"lines":["鹅，","鹅，","鹅，","曲项向天歌。","白毛浮绿水，","红掌拨清波。"],"quote":[0,1,2],"preface":"","intro":"先听鹅叫，再看它划开的水。","notes":[{"q":"曲项","text":"弯着脖颈；“曲”读 qū。"},{"q":"拨","text":"划动水波，是鹅掌游水的动作。"}],"background":"骆宾王的咏物诗。传统有他幼年作此诗的说法，具体年龄属于后世传述；欣赏时可先观察诗中的声音、颜色和动作。","reading":[{"quote":"鹅，鹅，鹅","title":"呼唤从声音开始","text":"三次重复像孩子发现鹅时的呼喊，紧接“向天歌”，把普通鸣叫听出了歌唱的意味。"},{"quote":"白毛浮绿水","title":"颜色随动作展开","text":"白与绿、红与清形成鲜明对照，“浮”写身体轻稳，“拨”写鹅掌用力，一静一动相互配合。"}],"thought":"从身边动物中发现可爱与生机，观察本身就能成为诗。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_eeb3869b6242.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%AA%86%E5%AE%BE%E7%8E%8B","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"xiaoerchuidiao","reason":"留意孩子与动物的动作，看看几笔白描怎样写出生活的趣味。"},{"id":"cunju","reason":"留意孩子与动物的动作，看看几笔白描怎样写出生活的趣味。"}],"extra":{}},{"id":"feng","title":"风","author":"liqiao","form":"五言绝句","stage":["小学"],"scene":"water","tags":["wind","flower","bamboo","water","motion","object"],"lines":["解落三秋叶，","能开二月花。","过江千尺浪，","入竹万竿斜。"],"quote":[0,1],"preface":"","intro":"看不见的风，留下四种形状。","notes":[{"q":"解落","text":"能使树叶脱落；“解”可理解为能够。"},{"q":"三秋","text":"这里指秋季，也有解作深秋的说法。"},{"q":"二月","text":"农历二月，指春天。"}],"background":"李峤写有不少咏物诗。这首围绕风的作用组织画面，作品的具体写作时地不宜仅凭内容推定。","reading":[{"quote":"解落三秋叶","title":"不写风的模样","text":"诗中没有直接描绘风的颜色和形体，而用落叶、花开让人认识风的力量。"},{"quote":"入竹万竿斜","title":"尺度忽然放大","text":"“千尺”“万竿”带有夸张意味，江浪与竹林从两种方向表现风，读者能想见而难以握住它。"}],"thought":"借自然变化表现风无形却有力的特点，激发对日常景物的细察。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_8bc9e1cc2b8f.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E5%B3%A4","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yongliu","reason":"风雪与草木也像有了性情，循着拟人与想象读春天。"},{"id":"wanchun","reason":"风雪与草木也像有了性情，循着拟人与想象读春天。"}],"extra":{}},{"id":"yongliu","title":"咏柳","author":"hezhizhang","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["willow","wind","spring","metaphor","object"],"lines":["碧玉妆成一树高，","万条垂下绿丝绦。","不知细叶谁裁出，","二月春风似剪刀。"],"quote":[1,2],"preface":"","intro":"春风剪出了千万条新柳。","notes":[{"q":"碧玉","text":"青绿色的玉，这里借指柳树鲜润的绿色。"},{"q":"绦","text":"读 tāo，用丝编成的带子。"}],"background":"贺知章的咏春之作，通行题名为《咏柳》，又题《柳枝词》。诗人把眼前新柳与想象中的春风相连。","reading":[{"quote":"万条垂下绿丝绦","title":"树木像有了衣饰","text":"柳树以碧玉妆点，柳条化为丝带，比喻让柔软下垂的姿态更容易被看见。"},{"quote":"二月春风似剪刀","title":"问题把想象引出来","text":"先问细叶是谁剪成，再让春风成为巧手，抽象的季节变化被写成一次精细的制作。"}],"thought":"赞美新春的生机与自然的创造力，咏物中带着发现之乐。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_9936770100ef.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%B4%BA%E7%9F%A5%E7%AB%A0","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chunxue","reason":"风雪与草木也像有了性情，循着拟人与想象读春天。"},{"id":"feng","reason":"风雪与草木也像有了性情，循着拟人与想象读春天。"}],"extra":{}},{"id":"huixiangoushu","title":"回乡偶书·其一","author":"hezhizhang","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["homesick","timepassing","child","contrast","geo_hangzhou"],"lines":["少小离家老大回，","乡音无改鬓毛衰。","儿童相见不相识，","笑问客从何处来。"],"quote":[0,1],"preface":"","intro":"回到故乡，却先成为一个客人。","notes":[{"q":"偶书","text":"因眼前触动随手写下。"},{"q":"乡音","text":"故乡的口音。"},{"q":"衰","text":"这里写鬓发稀疏、衰老的状态。"}],"background":"《回乡偶书二首》中的第一首。贺知章晚年辞官归乡，诗写归来后的相遇；“偶书”是偶有所感而写。","reading":[{"quote":"少小离家老大回","title":"一行诗容纳一生","text":"“少小”与“老大”、“离”与“回”两组对照，让几十年的离别在开头迅速展开。"},{"quote":"笑问客从何处来","title":"笑声里的复杂滋味","text":"儿童的好奇没有恶意，却使归人被当作客人；亲切的场面里同时浮出岁月与陌生。"}],"thought":"归乡之喜与年华流逝交织，故乡仍在，人与故乡的关系却已改变。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_f459f8ed8d23.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%B4%BA%E7%9F%A5%E7%AB%A0","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jiuyuejiuriyishandongxiongdi","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"},{"id":"chenqingbiao","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"}],"extra":{"places":"越州永兴 → 杭州萧山｜创作背景中的归处。贺知章晚年告老返回故乡越州永兴，即今浙江杭州萧山一带；古越州的辖境不能直接等同今天绍兴市的范围。诗中没有点出具体村名，“儿童相见不相识”写的是归乡的陌生感。"}},{"id":"liangzhouci","title":"凉州词·黄河远上白云间","author":"wangzhihuan","form":"七言绝句","stage":["小学"],"scene":"water","tags":["frontier","homesick","wind","mountain","water","solitude","sound","frontier_school","geo_dunhuang","geo_yellowriver"],"lines":["黄河远上白云间，","一片孤城万仞山。","羌笛何须怨杨柳，","春风不度玉门关。"],"quote":[1,2],"preface":"","intro":"笛声把一座孤城带向远方的春天。","notes":[{"q":"仞","text":"古代长度单位，“万仞”极写山高。"},{"q":"羌笛","text":"古代西北地区的管乐器。"},{"q":"度","text":"越过、到达。"}],"background":"王之涣《凉州词二首》其一。凉州词是依曲调写作的歌词；“杨柳”关联《折杨柳》曲，不等于画面中一定长着柳树。","reading":[{"quote":"一片孤城万仞山","title":"用广大空间衬出孤独","text":"黄河、白云、高山铺成大背景，城只剩“一片”，边塞生活的孤寂因此格外醒目。"},{"quote":"羌笛何须怨杨柳","title":"把人的怨转交笛声","text":"“怨”不是笛子的情感，而是人的心事借曲声说出；春风不到，也回应边地遥远的处境。"}],"thought":"雄阔景象中藏着戍边者的思乡和寂寞，语气克制而情绪深长。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_3963afd966bc.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E4%B9%8B%E6%B6%A3","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"liangzhouci-11","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"},{"id":"yujiaao","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"}],"extra":{"places":"玉门关｜诗中的边关，在今甘肃敦煌西北一带，古关位置与沿革需结合时代理解。“春风不度”也让它成为远离中原的边地象征。\n\n黄河｜正文中的大河，今仍沿用此名，流经多个省区。诗把黄河、白云、孤城并置，不宜按写实地图拼出一处唯一观景点。"}},{"id":"dengguanquelou","title":"登鹳雀楼","author":"wangzhihuan","form":"五言绝句","stage":["小学"],"scene":"water","tags":["mountain","water","hope","reflection","space","geo_yongji","geo_yellowriver"],"lines":["白日依山尽，","黄河入海流。","欲穷千里目，","更上一层楼。"],"quote":[0,1],"preface":"","intro":"再上一层，眼前的世界就变了。","notes":[{"q":"依","text":"靠着、沿着；日光向山后隐去。"},{"q":"穷","text":"尽，看到最远处。"}],"background":"通行本署王之涣。鹳雀楼在今山西永济一带，诗写登楼所见；古代文献另有作者归属异说，本文采用通行署名。","reading":[{"quote":"白日依山尽","title":"视线在天地间移动","text":"落日向山边收拢，黄河向远处铺开；近景与远势互相牵引，形成开阔的空间。"},{"quote":"更上一层楼","title":"道理从行动中生长","text":"诗没有抽象讲解，而让登高这一动作回答如何看得更远，感悟与真实观景紧紧相连。"}],"thought":"对更远视野的向往，在一个朴素的登楼动作里表达出来。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_c90ff9ea5a71.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E4%B9%8B%E6%B6%A3","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"tixilinbi","reason":"沿着仰望、登临与换位观看，体会山怎样打开人的视野。"},{"id":"dengtaishanji","reason":"沿着仰望、登临与换位观看，体会山怎样打开人的视野。"}],"extra":{"places":"鹳雀楼｜题中的登临之处，古楼在今山西运城永济的蒲州一带，临近黄河。今天的楼为重建建筑。\n\n黄河｜登楼所见向远方延展；“入海流”包含由眼前河流推向大海的想象，并非站在楼上看见海口。"}},{"id":"chunxiao","title":"春晓","author":"menghaoran","form":"五言绝句","stage":["小学"],"scene":"rain","tags":["spring","rain","wind","flower","animal","timepassing"],"lines":["春眠不觉晓，","处处闻啼鸟。","夜来风雨声，","花落知多少。"],"quote":[1,2],"preface":"","intro":"醒来时，昨夜的风雨还在耳边。","notes":[{"q":"晓","text":"天刚亮的时候。"},{"q":"啼鸟","text":"鸟的鸣叫；“啼”是动词。"}],"background":"孟浩然的春日小诗。具体写作年月不详，诗以醒来后的听觉和回想展开，并非按时间顺序记录全部景色。","reading":[{"quote":"处处闻啼鸟","title":"看不见的春天也很热闹","text":"没有先写花色，而从四处传来的鸟声感知春意，读者像与诗人一起刚刚醒来。"},{"quote":"花落知多少","title":"疑问留下惜春的余味","text":"由眼前鸟声想到夜间风雨，再想到可能落下的花；没有给出数量，牵挂反而更长。"}],"thought":"春日的欣悦中有轻微惜花之情，明快与惋惜在短诗中相伴。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_ccee5691ba93.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%AD%9F%E6%B5%A9%E7%84%B6","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jueju","reason":"同读春夏的鸟声与暖意，留意景物怎样表现明快的心情。"},{"id":"sanqudaozhong","reason":"同读春夏的鸟声与暖意，留意景物怎样表现明快的心情。"}],"extra":{}},{"id":"liangzhouci-11","title":"凉州词·葡萄美酒夜光杯","author":"wanghan","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["frontier","wine","death","boldstyle","contrast","frontier_school"],"lines":["葡萄美酒夜光杯，","欲饮琵琶马上催。","醉卧沙场君莫笑，","古来征战几人回？"],"quote":[1,2],"preface":"","intro":"酒杯刚举起，琵琶声已经催来。","notes":[{"q":"夜光杯","text":"精美的酒杯，传统解释为玉制。"},{"q":"沙场","text":"战场。"},{"q":"君","text":"对同席者的称呼。"}],"background":"王翰的边塞诗，采用凉州曲调。写的是征战生活中的宴饮场景，不宜把诗中说话者直接等同于诗人本人的经历。","reading":[{"quote":"欲饮琵琶马上催","title":"欢乐带着急促的节拍","text":"酒与乐原本属于欢宴，“催”却使气氛有了紧迫感；它既可助兴，也让人想到军旅的不安定。"},{"quote":"古来征战几人回","title":"豪语里藏着沉重","text":"“君莫笑”的放达与少有人归的现实并列，不能只把它读成痛快，也不能抹去它的昂扬。"}],"thought":"以豪迈口吻面对战争中的生死无常，热烈场面背后有深沉悲意。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_9312f5349cd7.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E7%BF%B0","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chusai","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"},{"id":"liangzhouci","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"}],"extra":{}},{"id":"chusai","title":"出塞·其一","author":"wangchangling","form":"七言绝句","stage":["小学"],"scene":"moon","tags":["frontier","moon","mountain","war","patriotism","allusion","frontier_school","geo_yinshan"],"lines":["秦时明月汉时关，","万里长征人未还。","但使龙城飞将在，","不教胡马度阴山。"],"quote":[0,1],"preface":"","intro":"同一轮月，照过多少未归的人。","notes":[{"q":"但使","text":"只要、倘若能有。"},{"q":"教","text":"让，使。"},{"q":"阴山","text":"北方山脉，也是诗中的边防屏障。"}],"background":"王昌龄《出塞二首》其一。诗借古代边塞与将领典故议论当时的战争，“龙城飞将”的具体所指历来有不同解释。","reading":[{"quote":"秦时明月汉时关","title":"把漫长历史压进边塞","text":"“秦”“汉”互相交错地指向久远年代，明月与关塞都延续至今，征战的苦难也未停止。"},{"quote":"万里长征人未还","title":"愿望从未归者出发","text":"对良将的期待源于征人的不归，诗既写保卫边地的愿望，也把人的处境置于历史背景中。"}],"thought":"希望有能守边安民的将领，使长期战争中的征人得以归来。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_b9e14c6e09aa.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E6%98%8C%E9%BE%84","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"saixiaqu","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"},{"id":"liangzhouci-11","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"}],"extra":{"places":"阴山｜正文所写的边地山脉，主要在今内蒙古境内。“不教胡马度阴山”把山脉写成守护边境的屏障。\n\n龙城｜“龙城飞将”涉及汉代将领的典故与不同解读，龙城地望也有争议，不能直接当作诗人实地到访的城市。"}},{"id":"furonglousongxinjian","title":"芙蓉楼送辛渐·其一","author":"wangchangling","form":"七言绝句","stage":["小学"],"scene":"rain","tags":["farewell","friendship","resolve","rain","water","mountain","metaphor","geo_zhenjiang","geo_luoyang"],"lines":["寒雨连江夜入吴，","平明送客楚山孤。","洛阳亲友如相问，","一片冰心在玉壶。"],"quote":[1,2],"preface":"","intro":"送别的话，最终落在一片冰心上。","notes":[{"q":"平明","text":"天刚亮的时候。"},{"q":"冰心","text":"像冰一样澄澈的心，用来比喻纯洁品格。"},{"q":"玉壶","text":"洁净的玉制器物，与冰心相配成比喻。"}],"background":"王昌龄《芙蓉楼送辛渐二首》其一，送友人辛渐离去。诗以吴地江雨与楚山为背景，托朋友向洛阳亲友转达心意。","reading":[{"quote":"平明送客楚山孤","title":"景物分担离情","text":"冷雨与孤山没有直接诉说不舍，却使离别的清冷气氛进入画面，“孤”也照见送行者。"},{"quote":"一片冰心在玉壶","title":"问候变成自我表白","text":"结尾不报行程和际遇，而说内心的澄明；形象鲜洁，语气却坚定，寄情中见品格。"}],"thought":"送别与自守相连，愿亲友理解自己坚持清白的心志。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_f433a64dd504.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E6%98%8C%E9%BE%84","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"songyuanershianxi","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"},{"id":"songyouren","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"}],"extra":{"places":"芙蓉楼、吴｜送别地点通常系于唐润州，即今江苏镇江；“吴”是这一带的历史地域称呼。\n\n洛阳｜今河南洛阳，是诗中托辛渐向亲友转达心意的方向。“楚山”则是送别画面中的地域意象，未指明一座可唯一定位的山。"}},{"id":"luchai","title":"鹿柴","author":"wangwei","form":"五言绝句","stage":["小学"],"scene":"mountain","tags":["mountain","quiet","nature","light","motion","pastoral","geo_lantian"],"lines":["空山不见人，","但闻人语响。","返景入深林，","复照青苔上。"],"quote":[1,2],"preface":"","intro":"几声人语，让深林显得更静。","notes":[{"q":"返景","text":"夕阳返照的光，“景”古义可指日光。"},{"q":"复","text":"又，再。"},{"q":"青苔","text":"生在湿润阴处的苔藓。"}],"background":"王维《辋川集》中的一首。“鹿柴”是辋川的一处地名，“柴”在这里读 zhài，指围栅。","reading":[{"quote":"但闻人语响","title":"声音不必打破寂静","text":"看不见人，只听见声音的回响，空山有了深度；人在场又不入画，使幽静更可感。"},{"quote":"复照青苔上","title":"一束光落到极小处","text":"从空山转入深林，再落在青苔，视线逐层收束，微亮使大片幽暗得到衬托。"}],"thought":"捕捉山林中声音与斜光的瞬间，表现宁静、幽深的自然境界。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_e9b1a8b4def0.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E7%BB%B4","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"xunyinzhebuyu","reason":"走进山林的不同深处，比较独处、寻找与自然相伴的心境。"},{"id":"shanju","reason":"走进山林的不同深处，比较独处、寻找与自然相伴的心境。"}],"extra":{"places":"鹿柴、辋川｜鹿柴是王维辋川别业的一处景点，辋川在今陕西西安蓝田一带。诗属于《辋川集》，具体山林的幽静由声音、返照与青苔共同呈现。"}},{"id":"songyuanershianxi","title":"送元二使安西","author":"wangwei","form":"七言绝句","stage":["小学"],"scene":"rain","tags":["farewell","friendship","rain","willow","wine","geo_xianyang","geo_dunhuang","geo_anxi"],"lines":["渭城朝雨浥轻尘，","客舍青青柳色新。","劝君更尽一杯酒，","西出阳关无故人。"],"quote":[1,2],"preface":"","intro":"多劝一杯，是因为前路少了熟人。","notes":[{"q":"浥","text":"读 yì，沾湿。"},{"q":"更尽","text":"再喝完。"},{"q":"阳关","text":"古代通向西域的关口，在今甘肃敦煌附近。"}],"background":"又题《渭城曲》，后谱入歌辞，广为传唱。诗写在渭城送元二出使安西，安西是唐代西域行政机构所在地。","reading":[{"quote":"客舍青青柳色新","title":"清新的景也能写离别","text":"雨洗尘土，柳色一新，明净春景与将要远行的处境并置，离愁没有化为灰暗的色调。"},{"quote":"西出阳关无故人","title":"一句实话抵得过铺陈","text":"劝酒的理由只是前路少故人，关心便从眼前一杯延伸到漫长旅途，朴素而动人。"}],"thought":"以劝酒的日常动作表达送别的不舍与对朋友远行的关切。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_12a2295aa76b.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E7%BB%B4","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zengwanglun","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"},{"id":"furonglousongxinjian","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"}],"extra":{"places":"渭城｜送别的起点，在今陕西咸阳一带，原为秦咸阳城所在地。\n\n阳关｜友人西行将经过的关塞，在今甘肃敦煌西南一带。\n\n安西｜元二出使的目的地，指唐代安西都护府。其治所与辖区曾变动，此诗所涉时期通常联系龟兹，即今新疆库车一带；不能将整个安西辖区缩成今天的一座县城。"}},{"id":"jiuyuejiuriyishandongxiongdi","title":"九月九日忆山东兄弟","author":"wangwei","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["homesick","family","autumn","mountain","imagination","geo_yongji","geo_xian"],"lines":["独在异乡为异客，","每逢佳节倍思亲。","遥知兄弟登高处，","遍插茱萸少一人。"],"quote":[1,2],"preface":"","intro":"想到亲人时，也想象他们正想着你。","notes":[{"q":"异客","text":"身在他乡的旅人。"},{"q":"茱萸","text":"读 zhū yú，重阳习俗中佩带的一种植物。"},{"q":"遍插","text":"每个人都佩带。"}],"background":"“九月九日”是重阳节。“山东”在此指华山以东、诗人故乡一带，不是今天的山东省。诗写离乡者逢节怀亲。","reading":[{"quote":"每逢佳节倍思亲","title":"节日放大了距离","text":"“独”“异”先写处境，节日的团聚气氛又把孤身在外的感受放大。"},{"quote":"遍插茱萸少一人","title":"从对方的位置写自己","text":"诗不止于说我想念他们，而想象兄弟登高时发现少了自己，两边的思念由此接通。"}],"thought":"节日思亲通过换位想象变得具体，亲情跨越空间仍相互牵连。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_d75a706935de.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E7%BB%B4","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"youziyin","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"},{"id":"huixiangoushu","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"}],"extra":{"places":"山东｜题目中思念兄弟所在的故乡区域，指华山以东。王维家居蒲州，约当今山西运城永济一带；这里的“山东”不是今天的山东省。\n\n长安｜通常认为诗人当时客居长安，今陕西西安；这是写作背景，正文只称“异乡”。"}},{"id":"gulangyuexing","title":"古朗月行（节选）","author":"libai","form":"五言绝句","stage":["小学"],"scene":"moon","tags":["moon","child","metaphor","imagination","joy"],"lines":["小时不识月，","呼作白玉盘。","又疑瑶台镜，","飞在青云端。"],"quote":[1,2],"preface":"","intro":"童年给月亮起了两个名字。","notes":[{"q":"瑶台","text":"传说中神仙所居的华美楼台。"},{"q":"青云端","text":"高高的云层上。"}],"background":"节取李白《古朗月行》开头四句。全诗后来还有神话想象与忧思，本卡只呈现童年辨月的一段，不以此概括全篇。","reading":[{"quote":"呼作白玉盘","title":"用熟悉的东西认识远方","text":"月亮被唤作玉盘，圆形、洁白与明亮一起进入比喻，也保留了儿童朴素的判断。"},{"quote":"又疑瑶台镜","title":"想象还在继续变化","text":"一个解释还不够，又把月亮想成飞到云端的镜子，“又疑”让好奇心继续向外伸展。"}],"thought":"保留初见世界时的惊奇，借儿童视角展现月亮的明丽与想象的自由。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_8616581bb564.aspx","节选范围：原作开头“小时不识月”至“飞在青云端”，共四句。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"pochuanguazhou","reason":"沿着月光读下去，看同一意象怎样容纳童心、乡思与祝愿。"},{"id":"jingyesi","reason":"沿着月光读下去，看同一意象怎样容纳童心、乡思与祝愿。"}],"extra":{}},{"id":"wanglushanpubu","title":"望庐山瀑布","author":"libai","form":"七言绝句","stage":["小学"],"scene":"water","tags":["mountain","water","light","hyperbole","imagination","geo_lushan"],"lines":["日照香炉生紫烟，","遥看瀑布挂前川。","飞流直下三千尺，","疑是银河落九天。"],"quote":[1,2],"preface":"","intro":"一条瀑布，仿佛从银河垂下来。","notes":[{"q":"香炉","text":"庐山香炉峰。"},{"q":"遥看","text":"从远处看。"},{"q":"九天","text":"极高的天空。"}],"background":"《望庐山瀑布二首》其二，写庐山香炉峰附近的瀑布。这里的“紫烟”是日照水汽的诗意描写，不是香炉真的燃香。","reading":[{"quote":"遥看瀑布挂前川","title":"远望时，奔流像静止","text":"“挂”把持续落下的水写成悬在山前的白练，远距离观看产生了动中见静的效果。"},{"quote":"疑是银河落九天","title":"先有高度，再有想象","text":"“三千尺”夸张瀑布的落差，银河之喻把实景推向宇宙，惊叹由尺度变化自然生出。"}],"thought":"以夸张和大胆想象写自然的壮美，也表现观看者开阔而昂扬的感受。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_62802abab937.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"wangtianmenshan","reason":"同看江山的力量，留意夸张、移动视角与神话想象怎样改变尺度。"},{"id":"shudaonan","reason":"同看江山的力量，留意夸张、移动视角与神话想象怎样改变尺度。"}],"extra":{"places":"庐山、香炉峰｜题目与正文中的山，在今江西九江庐山一带。瀑布的具体观赏点有研究讨论；“银河落九天”是比喻和想象，不是另一处地面水系。"}},{"id":"huanghelousongmenghaoranzhiguangling","title":"黄鹤楼送孟浩然之广陵","author":"libai","form":"七言绝句","stage":["小学"],"scene":"water","tags":["farewell","friendship","water","spring","space","geo_wuhan","geo_yangzhou","geo_yangtze"],"lines":["故人西辞黄鹤楼，","烟花三月下扬州。","孤帆远影碧空尽，","唯见长江天际流。"],"quote":[1,2],"preface":"","intro":"船已经远了，目光还在江面上。","notes":[{"q":"烟花","text":"春日花柳繁盛、烟雾迷蒙的景象。"},{"q":"西辞","text":"从西边辞别；黄鹤楼在广陵上游。"},{"q":"碧空尽","text":"帆影消失在碧空尽头。"}],"background":"李白送孟浩然从黄鹤楼往广陵，即今江苏扬州。“之”是往、到；诗题清楚交代送别地点、友人和去向。","reading":[{"quote":"烟花三月下扬州","title":"繁华春景中的送别","text":"诗没有用萧瑟景色写离愁，而以美好春光想见友人的旅途，祝愿与留恋可以同时存在。"},{"quote":"唯见长江天际流","title":"不说不舍，只写久久望着","text":"帆影由孤到远，再到看不见，最后只剩江流，目光停留的时间便是情意的长度。"}],"thought":"以持续远望表达送友之情，开阔江景中留着深深的牵挂。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_d3f231047aef.aspx","对照页所列异文或通假：唯 通：惟。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"biedongda","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"},{"id":"zengwanglun","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"}],"extra":{"places":"黄鹤楼｜送别的出发处，在今湖北武汉；历代楼址、建筑有变迁。\n\n广陵｜孟浩然前往的地方，即今江苏扬州。“下扬州”是沿长江顺流而下；长江连接送别者的目光与友人的远行。"}},{"id":"zaofabaidicheng","title":"早发白帝城","author":"libai","form":"七言绝句","stage":["小学"],"scene":"water","tags":["water","mountain","joy","hope","motion","geo_fengjie","geo_jiangling","geo_threegorges"],"lines":["朝辞白帝彩云间，","千里江陵一日还。","两岸猿声啼不住，","轻舟已过万重山。"],"quote":[1,2],"preface":"","intro":"一路猿声，还追不上归船。","notes":[{"q":"朝","text":"读 zhāo，早晨。"},{"q":"江陵","text":"今湖北荆州一带。"},{"q":"啼不住","text":"叫声不断。"}],"background":"通常系于李白流放夜郎途中遇赦、由白帝城东下江陵之时，也有不同系年意见。诗中的迅疾感与轻快心情相互呼应。","reading":[{"quote":"千里江陵一日还","title":"距离很长，时间很短","text":"“千里”与“一日”并置，不仅写水程，也让压抑忽然舒展的轻快变得可感。"},{"quote":"轻舟已过万重山","title":"声音未停，船已向前","text":"“已”使视线追不上行程，连续猿声与迅速后退的山势，共同组织出飞驰的节奏。"}],"thought":"写归途的明快与舒展，山水的速度带出心情的轻盈。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_0f81015a040c.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"qiuci","reason":"一起读受挫之后的舒展：轻舟、飞鹤与新生草木各有回应。"},{"id":"chouletianyangzhouchufengxishangjianzeng","reason":"一起读受挫之后的舒展：轻舟、飞鹤与新生草木各有回应。"}],"extra":{"places":"白帝城｜清晨辞别之处，在今重庆奉节。\n\n江陵｜行船目的地，在今湖北荆州一带。诗中从白帝城顺长江东下，经过三峡；“千里”“一日”共同写出遇赦后轻快的感受，不是现代行程表。"}},{"id":"wangtianmenshan","title":"望天门山","author":"libai","form":"七言绝句","stage":["小学"],"scene":"water","tags":["water","mountain","light","nature","motion","geo_tianmen","geo_yangtze"],"lines":["天门中断楚江开，","碧水东流至此回。","两岸青山相对出，","孤帆一片日边来。"],"quote":[1,2],"preface":"","intro":"船在前行，两岸青山迎面而来。","notes":[{"q":"中断","text":"山势被江水从中分开。"},{"q":"楚江","text":"流经古楚地的长江。"},{"q":"回","text":"回旋，写水流受到山势影响。"}],"background":"天门山在今安徽长江两岸，由东西两山夹江形成。诗从行舟视角写景，观察位置在移动，景物也因此不断变换。","reading":[{"quote":"碧水东流至此回","title":"把山水写成相互作用","text":"江水冲开山势，山又使水回旋，景物不是互不相干的背景，而有力量的往来。"},{"quote":"两岸青山相对出","title":"移动的是船，出现的是山","text":"“出”把行舟时两山渐入眼帘的感受写出，最后的孤帆也让观看者进入画面。"}],"thought":"写长江山水的雄奇与旅行中的新鲜感，视角变化使静景充满动势。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_97e6296bfb8d.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"langtaosha","reason":"同看江山的力量，留意夸张、移动视角与神话想象怎样改变尺度。"},{"id":"wanglushanpubu","reason":"同看江山的力量，留意夸张、移动视角与神话想象怎样改变尺度。"}],"extra":{"places":"天门山｜长江两岸相对的东西梁山，在今安徽芜湖、马鞍山一带。“楚江”在这里指流经古楚地的长江，不是另一条名叫楚江的河。"}},{"id":"biedongda","title":"别董大·其一","author":"gaoshi","form":"七言绝句","stage":["小学"],"scene":"snow","tags":["farewell","friendship","snow","wind","hope","contrast","frontier_school"],"lines":["千里黄云白日曛，","北风吹雁雪纷纷。","莫愁前路无知己，","天下谁人不识君。"],"quote":[1,2],"preface":"","intro":"漫天风雪里，送你一句敞亮的话。","notes":[{"q":"曛","text":"读 xūn，日色昏暗。"},{"q":"知己","text":"理解、赏识自己的人。"},{"q":"君","text":"这里指董大。"}],"background":"高适《别董大二首》其一。董大通常指琴师董庭兰；诗以送别时的苍茫景象衬出对友人的信任与鼓励。","reading":[{"quote":"北风吹雁雪纷纷","title":"不回避眼前的寒意","text":"黄云、暗日、北风与飞雪构成艰难环境，劝慰因此不是不知处境的空话。"},{"quote":"天下谁人不识君","title":"把离别转成信任","text":"后两句用反问推开阴沉气氛，称许朋友的才华，也给尚未到来的旅程留下希望。"}],"thought":"在困顿与离别中给朋友坚定的信任，情意表现为开阔而有力的鼓励。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4b3ccba01be6.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%AB%98%E9%80%82","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"songdushaofuzhirenshuzhou","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"},{"id":"huanghelousongmenghaoranzhiguangling","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"}],"extra":{}},{"id":"jueju","title":"绝句·两个黄鹂鸣翠柳","author":"dufu","form":"七言绝句","stage":["小学"],"scene":"snow","tags":["spring","animal","willow","snow","mountain","water","space","geo_chengdu","geo_wudi"],"lines":["两个黄鹂鸣翠柳，","一行白鹭上青天。","窗含西岭千秋雪，","门泊东吴万里船。"],"quote":[0,1],"preface":"","intro":"一扇窗，装下山雪与万里船。","notes":[{"q":"西岭","text":"成都以西的雪山。"},{"q":"千秋雪","text":"经年不化的积雪，极写久远。"},{"q":"泊","text":"停靠。"}],"background":"杜甫《绝句四首》中的第三首，通常系于成都草堂生活时期。画面把草堂近景与通向远方的水路联系起来。","reading":[{"quote":"两个黄鹂鸣翠柳","title":"颜色和声音一同来到","text":"黄、翠、白、青交错，又有鸟鸣与飞行，前半首是活泼明净的近景。"},{"quote":"窗含西岭千秋雪","title":"窗框改变了空间","text":"“含”使远山进入眼前窗景，“千秋”与“万里”又把时间和距离打开，小屋也能连接广大世界。"}],"thought":"写草堂生活中明朗开阔的感受，近处生机与远方天地彼此照映。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_549473b5211c.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jueju-27","reason":"同读春夏的鸟声与暖意，留意景物怎样表现明快的心情。"},{"id":"chunxiao","reason":"同读春夏的鸟声与暖意，留意景物怎样表现明快的心情。"}],"extra":{"places":"成都、西岭｜通常系于成都草堂时期。窗外“西岭”是成都以西雪山的远景称呼，不宜仅凭诗句锁定今天某一景区的单独山峰。\n\n东吴｜船只远行所联系的长江下游吴地，约今江苏、浙江等地；诗用门前船只打开遥远水路的想象。"}},{"id":"jueju-27","title":"绝句·迟日江山丽","author":"dufu","form":"五言绝句","stage":["小学"],"scene":"water","tags":["spring","flower","animal","water","motion","joy","geo_chengdu"],"lines":["迟日江山丽，","春风花草香。","泥融飞燕子，","沙暖睡鸳鸯。"],"quote":[1,2],"preface":"","intro":"燕子忙着筑巢，鸳鸯安静地睡着。","notes":[{"q":"迟日","text":"春天渐长的白昼。"},{"q":"泥融","text":"泥土因春暖而湿软。"},{"q":"鸳鸯","text":"水鸟，常成对活动。"}],"background":"杜甫《绝句二首》其一，通常联系其成都时期的生活。诗围绕春日温暖组织感官和动物活动。","reading":[{"quote":"春风花草香","title":"春天不只有颜色","text":"江山可见，香气可闻，春风可感，短短两句调动不同感官，形成整体的温暖气息。"},{"quote":"泥融飞燕子","title":"各有各的春日节奏","text":"燕子忙碌，鸳鸯闲静；两种动作都由春暖引出，动静之间显出自然生活的和谐。"}],"thought":"表现春日万物各得其所的生机，也传达安宁、舒展的心境。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_e5e7911da1d2.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"huichongchunjiangwanjing","reason":"同读春夏的鸟声与暖意，留意景物怎样表现明快的心情。"},{"id":"jueju","reason":"同读春夏的鸟声与暖意，留意景物怎样表现明快的心情。"}],"extra":{"places":"成都｜通行编年将这首诗系于成都草堂生活时期，是写作背景中的地点。诗本身没有写地名，江山、泥燕、沙鸳鸯共同构成春日近景。"}},{"id":"jiangpandubuxunhua","title":"江畔独步寻花·其五","author":"dufu","form":"七言绝句","stage":["小学"],"scene":"flower","tags":["flower","wind","spring","joy","nature","geo_chengdu"],"lines":["黄师塔前江水东，","春光懒困倚微风。","桃花一簇开无主，","可爱深红爱浅红？"],"quote":[1,2],"preface":"","intro":"花开没有主人，赏花不必急着选择。","notes":[{"q":"懒困","text":"春日温暖中有些倦怠。"},{"q":"簇","text":"丛聚的样子。"},{"q":"可爱","text":"这里的“可”带问意，可解作究竟爱哪一种。"}],"background":"杜甫《江畔独步寻花七绝句》其五。本次采用“黄师塔前江水东”一首，与常见的“黄四娘家花满蹊”其六分开辨认。","reading":[{"quote":"春光懒困倚微风","title":"闲步者也在画面中","text":"诗先交代江边位置，再写人在微风中的姿态，赏花成了一段可感的日常经历。"},{"quote":"可爱深红爱浅红","title":"问题没有标准答案","text":"诗人似乎在深红浅红之间犹豫，实际上两种都让他欢喜，设问把沉醉花色的心情说活。"}],"thought":"写独自寻花的自在与喜悦，让寻常春景成为值得停步的发现。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_85e46c4b3dbc.aspx","本篇为七首组诗的第五首“黄师塔前江水东”，不是第六首“黄四娘家花满蹊”。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yugezi","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"},{"id":"shanzhong","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"}],"extra":{"places":"江畔、黄师塔｜成都草堂附近的寻花路线；黄师塔通常解释为一位僧人的墓塔，确址不宜仅凭诗句认定。这里的江畔可联系成都浣花溪、锦江一带的环境。"}},{"id":"youziyin","title":"游子吟","author":"mengjiao","form":"五言古诗","stage":["小学"],"scene":"mountain","tags":["family","homesick","grass","spring","metaphor","geo_liyang"],"lines":["慈母手中线，","游子身上衣。","临行密密缝，","意恐迟迟归。","谁言寸草心，","报得三春晖。"],"quote":[2,3],"preface":"","intro":"密密的针脚，缝着对远行人的牵挂。","notes":[{"q":"游子","text":"离家远行的人。"},{"q":"寸草心","text":"小草的心意，比喻子女微薄的报答。"},{"q":"三春晖","text":"春天的阳光，比喻母亲的恩情。"}],"background":"孟郊以乐府旧题写母子之情。通行题下注有“迎母溧上作”，与他在溧阳迎母的经历相联系；诗中的场景具有普遍亲情意味。","reading":[{"quote":"临行密密缝","title":"把担忧写进手的动作","text":"诗不直接铺陈母亲如何思念，而写针脚越来越密，并用“迟迟归”点出动作中的牵挂。"},{"quote":"报得三春晖","title":"小草与春光的分量","text":"小小草心与温暖万物的阳光相对照，表达感恩，也承认亲情难以用等量交换偿还。"}],"thought":"歌咏母爱与游子的感恩，以贴身衣物写出远行仍带着的亲情。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_161d06b0b556.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%AD%9F%E9%83%8A","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shier","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"},{"id":"jiuyuejiuriyishandongxiongdi","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"}],"extra":{"places":"溧上 → 溧阳｜通行题下注“迎母溧上作”，联系今江苏常州溧阳。这个地点来自题注与创作背景；诗的核心画面是母亲在临行前缝衣。"}},{"id":"xunyinzhebuyu","title":"寻隐者不遇","author":"jiadao","form":"五言绝句","stage":["小学"],"scene":"mountain","tags":["mountain","cloud","quiet","nature","dialogue"],"lines":["松下问童子，","言师采药去。","只在此山中，","云深不知处。"],"quote":[1,2],"preface":"","intro":"没有见到的人，藏在一片云里。","notes":[{"q":"言","text":"说；这里承接童子的回答。"},{"q":"深","text":"云雾浓密，也使山中路径难以辨认。"}],"background":"贾岛的访隐者诗。传本亦有不同署名意见，本文采用通行署名；诗题说“不遇”，正文却由问答逐步显出隐居生活。","reading":[{"quote":"言师采药去","title":"省掉问句，留下回答","text":"连续几次询问没有写出，童子的回答使它们自然浮现，短诗因此像一段完整对话。"},{"quote":"云深不知处","title":"结尾让寻找停在想象里","text":"知道就在山中，却不知道确切位置，云把答案遮住，也留下清幽高远的隐者形象。"}],"thought":"写寻访未遇的惆怅与向往，缺席的人物通过山林和对话获得存在感。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_40954072f541.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%B4%BE%E5%B2%9B","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"duzuojingtingshan","reason":"走进山林的不同深处，比较独处、寻找与自然相伴的心境。"},{"id":"luchai","reason":"走进山林的不同深处，比较独处、寻找与自然相伴的心境。"}],"extra":{}},{"id":"fengqiaoyepo","title":"枫桥夜泊","author":"zhangji","form":"七言绝句","stage":["小学"],"scene":"moon","tags":["moon","water","night","homesick","solitude","sound","geo_suzhou"],"lines":["月落乌啼霜满天，","江枫渔火对愁眠。","姑苏城外寒山寺，","夜半钟声到客船。"],"quote":[0,1],"preface":"","intro":"夜半钟声，抵达江上的一条客船。","notes":[{"q":"姑苏","text":"苏州的旧称。"},{"q":"对愁眠","text":"伴着旅愁，面对江边景色难以安眠。"},{"q":"客船","text":"旅人乘坐或暂宿的船。"}],"background":"张继夜泊苏州枫桥时的羁旅诗。江枫等地景有不同解释，本文保留通行文字，重点看夜景如何围绕船中人展开。","reading":[{"quote":"月落乌啼霜满天","title":"不同感受叠成一夜","text":"月色渐落、乌鸦啼叫、寒气弥漫，视觉听觉与冷意相叠，愁绪融在景中。"},{"quote":"夜半钟声到客船","title":"一个“到”连接远近","text":"寺院在城外，客人在船中，钟声跨过距离抵达听者，结尾使整幅夜景有了中心。"}],"thought":"表现夜泊旅人的孤清与愁绪，也让遥远钟声成为人与外界的联系。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_6fb73f607ad3.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%BC%A0%E7%BB%A7","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chunyeluochengwendi","reason":"循着夜里的钟声、笛声与清晨铃声，看旅途怎样触动故园之思。"},{"id":"shangshanzaoxing","reason":"循着夜里的钟声、笛声与清晨铃声，看旅途怎样触动故园之思。"}],"extra":{"places":"姑苏 → 苏州｜正文点出的城市，在今江苏。枫桥、寒山寺位于苏州城西一带；夜半钟声从寺院传到客船，连接岸上的古寺与旅人的不眠之夜。"}},{"id":"yugezi","title":"渔歌子·西塞山前白鹭飞","author":"zhangzhihe","form":"词","stage":["小学"],"scene":"rain","tags":["water","mountain","flower","rain","wind","quiet","geo_xisai"],"lines":["西塞山前白鹭飞，桃花流水鳜鱼肥。","青箬笠，绿蓑衣，斜风细雨不须归。"],"quote":[0],"preface":"","intro":"细雨斜风中，渔人说不必回去。","notes":[{"q":"箬笠","text":"读 ruò lì，用竹叶编成的斗笠。"},{"q":"蓑衣","text":"用草或棕制成的雨衣。"},{"q":"鳜鱼","text":"读 guì yú，淡水鱼。"}],"background":"张志和的渔歌子词，以西塞山附近水乡春景构成渔隐生活的图景。“不须归”带有主动选择的意味。","reading":[{"quote":"桃花流水鳜鱼肥","title":"春天可看，也可生活","text":"白鹭、桃花、流水和肥鱼不是抽象山水，它们共同构成可居、可游的水乡生活。"},{"quote":"斜风细雨不须归","title":"风雨改变了角色","text":"风雨在这里没有驱赶人，反而衬出渔人的从容；帽与衣的颜色也使人物自然融入景中。"}],"thought":"借渔人形象寄托亲近自然、自由安闲的生活意趣。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_ee72baa043c8.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%BC%A0%E5%BF%97%E5%92%8C","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shuhuyinxianshengbi","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"},{"id":"jiangpandubuxunhua","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"}],"extra":{"places":"西塞山｜正文地点，通行注释多指今浙江湖州一带，也有联系湖北黄石西塞山的解释。此处保留地望辨析，不将同名山简单合并；白鹭、桃花流水与渔人的画面是阅读的中心。"}},{"id":"saixiaqu","title":"塞下曲·月黑雁飞高","author":"lulun","form":"五言绝句","stage":["小学"],"scene":"moon","tags":["frontier","snow","moon","animal","war","motion"],"lines":["月黑雁飞高，","单于夜遁逃。","欲将轻骑逐，","大雪满弓刀。"],"quote":[0,1],"preface":"","intro":"追兵还未出发，雪已落满弓刀。","notes":[{"q":"单于","text":"读 chán yú，古代匈奴首领称号，这里代指敌方首领。"},{"q":"轻骑","text":"轻装骑兵。"},{"q":"将","text":"率领。"}],"background":"卢纶《和张仆射塞下曲六首》其三。诗写雪夜敌军逃遁与骑兵准备追击，着力呈现战场的瞬间。","reading":[{"quote":"月黑雁飞高","title":"先用异常声景制造紧张","text":"月暗与惊起的雁暗示夜中有人行动，敌军逃走便接着揭示出来。"},{"quote":"大雪满弓刀","title":"把战斗停在出发之前","text":"没有描写交锋，而以兵器积雪收尾，人物姿态、严寒和临战的力量留给读者想象。"}],"thought":"通过夜雪中的追击准备表现军人的果断与勇气，语言简短而张力充足。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_9a9463173105.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%8D%A2%E7%BA%B6","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yeshangshouxiangchengwendi","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"},{"id":"chusai","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"}],"extra":{}},{"id":"wangdongting","title":"望洞庭","author":"liuyuxi","form":"七言绝句","stage":["小学"],"scene":"moon","tags":["water","moon","mountain","quiet","metaphor","geo_dongting"],"lines":["湖光秋月两相和，","潭面无风镜未磨。","遥望洞庭山水翠，","白银盘里一青螺。"],"quote":[1,2],"preface":"","intro":"远望洞庭，山像盘中的一枚青螺。","notes":[{"q":"和","text":"协调、融合。"},{"q":"镜未磨","text":"未磨光的铜镜，比喻平静而略显朦胧的湖面。"},{"q":"青螺","text":"青色的螺，用以比喻君山。"}],"background":"刘禹锡望洞庭湖而作。诗的观察点在远处，以月色中湖面与君山的形态组织比喻。","reading":[{"quote":"潭面无风镜未磨","title":"平静中仍有朦胧","text":"湖面像镜，却不是光亮照人的新镜，“未磨”保留夜色中的柔和与不清晰。"},{"quote":"白银盘里一青螺","title":"把巨大景物放在掌心","text":"湖化为银盘，山化为青螺，大小关系清楚而精巧，远景因此有了亲切可赏玩的形状。"}],"thought":"以清丽想象描绘月夜洞庭，表达对宁静、和谐自然景色的欣赏。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_880912218fc8.aspx","对照页所列异文或通假：山水翠 一作：山水色。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%88%98%E7%A6%B9%E9%94%A1","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chibifu","reason":"同望水月与江天，比较写景、生命追问与朋友相伴的乐趣。"},{"id":"chengtian","reason":"同望水月与江天，比较写景、生命追问与朋友相伴的乐趣。"}],"extra":{"places":"洞庭湖、君山｜正文所写的湖与湖中山，在今湖南岳阳一带。“白银盘里一青螺”把远望中的君山写得小巧，湖泊的实际范围和水岸也随历史发生变化。"}},{"id":"langtaosha","title":"浪淘沙·九曲黄河万里沙","author":"liuyuxi","form":"七言绝句","stage":["小学"],"scene":"water","tags":["water","hope","hyperbole","imagination","geo_yellowriver"],"lines":["九曲黄河万里沙，","浪淘风簸自天涯。","如今直上银河去，","同到牵牛织女家。"],"quote":[1,2],"preface":"","intro":"黄河的浪，像能把人送到银河。","notes":[{"q":"九曲","text":"形容河道弯曲众多。"},{"q":"簸","text":"读 bǒ，颠簸、冲荡。"},{"q":"牵牛织女","text":"星宿及相关神话人物。"}],"background":"刘禹锡《浪淘沙九首》其一。浪淘沙在此为组诗题，不应直接按后世同名词牌判断文体。","reading":[{"quote":"浪淘风簸自天涯","title":"河流有了漫长来路","text":"九曲、万里、天涯层层扩展尺度，风与浪的动词让黄河显得奔涌有力。"},{"quote":"同到牵牛织女家","title":"现实顺流进入神话","text":"从黄河联想到天河，把向上的愿望写成一次邀约，宏大的景象中又有轻快的口吻。"}],"thought":"赞叹黄河的雄浑气势，以神话想象表现昂扬而自由的精神。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_857567307e6a.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%88%98%E7%A6%B9%E9%94%A1","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shudaonan","reason":"同看江山的力量，留意夸张、移动视角与神话想象怎样改变尺度。"},{"id":"wangtianmenshan","reason":"同看江山的力量，留意夸张、移动视角与神话想象怎样改变尺度。"}],"extra":{"places":"黄河｜正文中的现实大河，流经今青海、四川、甘肃、宁夏、内蒙古、陕西、山西、河南、山东等省区。“到牵牛织女家”则把河水接向天河，是神话想象，不能当作地理路线。"}},{"id":"fudeguyuancaosongbie","title":"赋得古原草送别","author":"baijuyi","form":"五言律诗","stage":["小学"],"scene":"mountain","tags":["grass","spring","farewell","resolve","contrast"],"lines":["离离原上草，","一岁一枯荣。","野火烧不尽，","春风吹又生。","远芳侵古道，","晴翠接荒城。","又送王孙去，","萋萋满别情。"],"quote":[2,3],"preface":"","intro":"春草年年回来，送别又发生一次。","notes":[{"q":"离离","text":"草木繁盛的样子。"},{"q":"王孙","text":"古诗中可用来称远游的人。"},{"q":"萋萋","text":"草长得茂盛的样子。"}],"background":"白居易按“古原草送别”题意写作的五言律诗，本次收录全篇八句。常见节选只到“春风吹又生”，后半的送别语境也值得读到。","reading":[{"quote":"野火烧不尽","title":"生长与毁灭形成回环","text":"枯荣是季节更替，野火与春风又让它成为强烈对照，草的生命力由两种力量相衬而显。"},{"quote":"又送王孙去","title":"草色终于落到人的心事","text":"芳草一直延伸到古道与荒城，空间的延展也连接送行目光，结尾使咏草与送别合在一起。"}],"thought":"咏叹草的顽强生机，同时借连绵春草寄托送别之情。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_b7820a12ebaa.aspx","收录全诗八句，保留后半送别语境。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%99%BD%E5%B1%85%E6%98%93","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shanxing","reason":"从草木的枯荣到秋叶与落花，读自然变化怎样引出希望。"},{"id":"jihaizashi","reason":"从草木的枯荣到秋叶与落花，读自然变化怎样引出希望。"}],"extra":{}},{"id":"chishang","title":"池上·小娃撑小艇","author":"baijuyi","form":"五言绝句","stage":["小学"],"scene":"water","tags":["child","water","lotusleaf","joy","motion"],"lines":["小娃撑小艇，","偷采白莲回。","不解藏踪迹，","浮萍一道开。"],"quote":[1,2],"preface":"","intro":"想藏住小艇，却留下了一道浮萍。","notes":[{"q":"撑","text":"用篙推船前行。"},{"q":"解","text":"懂得。"},{"q":"踪迹","text":"行动留下的痕迹。"}],"background":"白居易《池上二绝》其二，写儿童偷采白莲归来的小事。这里的“偷”带着童趣，不宜扩写成诗中没有的训诫故事。","reading":[{"quote":"偷采白莲回","title":"动作里带着小心思","text":"“小娃”“小艇”先写轻小，“偷采”又点出孩子想悄悄完成一件事的心理。"},{"quote":"浮萍一道开","title":"水面替孩子说出了秘密","text":"孩子不知道掩藏，船划开的浮萍却清楚记录来路，诗人的观察带着温柔的会意。"}],"thought":"以自然留下的痕迹表现儿童的天真与活泼，趣味藏在极小的生活细节中。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_a8f44614071a.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%99%BD%E5%B1%85%E6%98%93","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"xiaochujingcisisonglinzifang","reason":"同看一池荷叶：从游鱼与小艇，读到荷花和尖角上的蜻蜓。"},{"id":"jiangnan","reason":"同看一池荷叶：从游鱼与小艇，读到荷花和尖角上的蜻蜓。"}],"extra":{}},{"id":"yijiangnan","title":"忆江南·江南好","author":"baijuyi","form":"词","stage":["小学"],"scene":"water","tags":["water","flower","spring","homesick","contrast","geo_jiangnan"],"lines":["江南好，风景旧曾谙。","日出江花红胜火，春来江水绿如蓝。","能不忆江南？"],"quote":[1],"preface":"","intro":"记忆中的江南，被春日照得更鲜亮。","notes":[{"q":"谙","text":"读 ān，熟悉。"},{"q":"胜","text":"超过。"},{"q":"蓝","text":"蓝草，可提取青蓝色染料，不只是现代色名。"}],"background":"白居易《忆江南三首》其一。诗人曾在杭州、苏州任职，词以亲历的江南景物组织回忆。","reading":[{"quote":"日出江花红胜火","title":"记忆把色彩推得更浓","text":"花红、水绿以火与蓝草为比，比喻与对比相配，使春景鲜明而饱满。"},{"quote":"能不忆江南","title":"前面的风景就是回答","text":"开头说好，随后给出理由，最后以反问收束；不必另写思念，画面本身已带着眷恋。"}],"thought":"回望熟悉的江南春色，表达喜爱与怀念，情感在明丽景物中自然流露。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_6ad0636b01a9.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%99%BD%E5%B1%85%E6%98%93","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jiangnanchun","reason":"同写江南，比较记忆里的春色、历史中的烟雨与城市生活的繁华。"},{"id":"wanghaichao","reason":"同写江南，比较记忆里的春色、历史中的烟雨与城市生活的繁华。"}],"extra":{"places":"江南｜词题与正文中追忆的区域，通常联系长江下游以南的水乡文化。此首只写江花、江水与春色，没有将回忆固定在杭州或苏州某一城。"}},{"id":"xiaoerchuidiao","title":"小儿垂钓","author":"hulingneng","form":"七言绝句","stage":["小学"],"scene":"water","tags":["child","water","grass","joy","action"],"lines":["蓬头稚子学垂纶，","侧坐莓苔草映身。","路人借问遥招手，","怕得鱼惊不应人。"],"quote":[1,2],"preface":"","intro":"有人问路，小钓手只敢远远招手。","notes":[{"q":"蓬头","text":"头发散乱。"},{"q":"稚子","text":"小孩子。"},{"q":"莓苔","text":"苔藓一类的低矮植物。"}],"background":"胡令能的生活小诗，写儿童垂钓时遇到路人。故事短小，却有外貌、姿态和心理的连续刻画。","reading":[{"quote":"侧坐莓苔草映身","title":"先让人看见孩子的样子","text":"蓬头、侧坐、草映身不是整齐摆好的姿态，反而保留了专注玩耍时的自然。"},{"quote":"怕得鱼惊不应人","title":"不回答有自己的理由","text":"招手与沉默看似矛盾，末句点出怕惊鱼的心思，细小动作因此变得可爱而可信。"}],"thought":"表现儿童初学垂钓的认真与天真，生活里的专注可以成为诗意。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_200d28227643.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%83%A1%E4%BB%A4%E8%83%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zhizinongbing","reason":"留意孩子与动物的动作，看看几笔白描怎样写出生活的趣味。"},{"id":"yonge","reason":"留意孩子与动物的动作，看看几笔白描怎样写出生活的趣味。"}],"extra":{}},{"id":"minnong","title":"悯农·其一","author":"lishen","form":"五言绝句","stage":["小学"],"scene":"mountain","tags":["labor","compassion","contrast","spring","autumn","newyuefu"],"lines":["春种一粒粟，","秋收万颗子。","四海无闲田，","农夫犹饿死。"],"quote":[0,1],"preface":"","intro":"丰收的田野旁，农人为什么仍挨饿。","notes":[{"q":"粟","text":"谷物，特指粟米。"},{"q":"犹","text":"仍然。"},{"q":"四海","text":"泛指天下。"}],"background":"李绅《悯农二首》之一。诗将农业收成与农民处境相对照，题中的“悯”是悲悯、同情。","reading":[{"quote":"春种一粒粟","title":"数量增加，期待也在增加","text":"从一粒到万颗，再到没有闲田，前三句把丰收铺陈得充足，为结尾构成强烈反差。"},{"quote":"农夫犹饿死","title":"转折追问收成归谁","text":"产出丰盛却不能养活耕者，结尾揭开社会分配的不合理，不能只读成节约粮食的提醒。"}],"thought":"同情劳作者的困苦，以丰收与饥饿的矛盾表达对不公现实的关注。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4859914a4e16.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%BB%85","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"minnong-42","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"},{"id":"maitanweng","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"}],"extra":{}},{"id":"minnong-42","title":"悯农·其二","author":"lishen","form":"五言绝句","stage":["小学"],"scene":"mountain","tags":["labor","compassion","heat","contrast","newyuefu"],"lines":["锄禾日当午，","汗滴禾下土。","谁知盘中餐，","粒粒皆辛苦。"],"quote":[1,2],"preface":"","intro":"一碗饭，可以看见烈日下的田地。","notes":[{"q":"禾","text":"谷物作物，这里指庄稼。"},{"q":"餐","text":"饭食。"},{"q":"辛苦","text":"这里着重指劳作的艰难。"}],"background":"李绅《悯农二首》之一。作品把田间劳动与日常饮食连接起来，具体写作时地不必凭传说确定。","reading":[{"quote":"汗滴禾下土","title":"把劳动的重量落在一点汗上","text":"正午的热与滴落的汗形成直接感受，诗不抽象列举困难，而让人看到身体的付出。"},{"quote":"粒粒皆辛苦","title":"从田野回到餐桌","text":"设问把视线带到读者面前的一餐，“粒粒”把平常食物与远处劳动一一相连。"}],"thought":"提醒人理解粮食背后的劳动，珍惜食物也应包含对劳作者的尊重。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_6e878b858e01.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%BB%85","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"feng-46","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"},{"id":"minnong","reason":"让目光从食物与田野回到劳

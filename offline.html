作者，比较童趣、忙碌与现实关怀。"}],"extra":{}},{"id":"shanxing","title":"山行","author":"dumu","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["mountain","autumn","leaf","joy","contrast"],"lines":["远上寒山石径斜，","白云生处有人家。","停车坐爱枫林晚，","霜叶红于二月花。"],"quote":[1,2],"preface":"","intro":"停下车，是因为秋叶比春花更红。","notes":[{"q":"寒山","text":"深秋时节的山。"},{"q":"坐","text":"因为，并非坐下。"},{"q":"于","text":"比。"}],"background":"杜牧的山行诗，沿石径、白云、人家、枫林展开。采用“白云生处”通行文本，另有“深处”异文。","reading":[{"quote":"白云生处有人家","title":"山路通向有人生活的地方","text":"山并不荒凉，云气间的住家给远景添上温度，也让向上的路有了想象中的去处。"},{"quote":"霜叶红于二月花","title":"把秋色放在春色之上","text":"对比改变了秋天常被写成衰败的惯例，停车这一动作又证明眼前景色值得停留。"}],"thought":"表达对深秋山林的热爱，以明艳色彩发现成熟季节的生命力。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_3c36881bd247.aspx","对照页所列异文或通假：生处 一作：深处。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%89%A7","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jihaizashi","reason":"从草木的枯荣到秋叶与落花，读自然变化怎样引出希望。"},{"id":"fudeguyuancaosongbie","reason":"从草木的枯荣到秋叶与落花，读自然变化怎样引出希望。"}],"extra":{}},{"id":"qingming","title":"清明","author":"dumu","form":"七言绝句","stage":["小学"],"scene":"rain","tags":["rain","spring","travel","sadness","dialogue","geo_xinghua"],"lines":["清明时节雨纷纷，","路上行人欲断魂。","借问酒家何处有？","牧童遥指杏花村。"],"quote":[1,2],"preface":"","intro":"细雨中问一句路，远处就有了方向。","notes":[{"q":"清明","text":"节气，也与祭扫等习俗相连。"},{"q":"欲断魂","text":"极写愁苦、迷惘的心情。"},{"q":"遥指","text":"指向远处。"}],"background":"通行署杜牧，早期著录与作者归属有讨论。本文沿用常见署名，不把关于酒家具体地点的传说当作定论。","reading":[{"quote":"路上行人欲断魂","title":"天气与心境互相浸染","text":"细雨连绵，行人心绪低落，但诗没有说明唯一原因，节令、旅途与个人感受留有理解空间。"},{"quote":"牧童遥指杏花村","title":"用动作完成一次回答","text":"问句之后没有长篇对白，只一个远指动作，画面由眼前雨路伸向可以歇脚的地方。"}],"thought":"写清明雨中的旅途愁绪，也以人与人的短暂交流带出一点慰藉。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_d3e3283daac5.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%89%A7","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yuanri","reason":"循节日读日常：风俗相近，人的心境却可能十分不同。"},{"id":"qiqiao","reason":"循节日读日常：风俗相近，人的心境却可能十分不同。"}],"extra":{"places":"杏花村｜诗中牧童指向的地方。后世安徽池州、山西汾阳等地都有相关解释或文化传说，诗本身不足以确定唯一地点；也可从杏花掩映的村庄意象理解。"}},{"id":"jiangnanchun","title":"江南春","author":"dumu","form":"七言绝句","stage":["小学"],"scene":"rain","tags":["spring","flower","rain","water","history","space","geo_jiangnan"],"lines":["千里莺啼绿映红，","水村山郭酒旗风。","南朝四百八十寺，","多少楼台烟雨中。"],"quote":[0,1],"preface":"","intro":"千里春色里，也有历史留下的楼台。","notes":[{"q":"水村山郭","text":"临水的村庄与依山的城镇。"},{"q":"酒旗","text":"酒家悬挂的招牌。"},{"q":"南朝","text":"建都于建康等地的南方诸朝。"}],"background":"杜牧描绘江南春景的七绝。“四百八十寺”概言寺院众多，不是此诗完成的一次精确统计。","reading":[{"quote":"千里莺啼绿映红","title":"把多处风景织成一幅图","text":"这是概括性的江南全景，不必假定人在一个位置同时听见千里莺声。色彩与声音交织出春意。"},{"quote":"多少楼台烟雨中","title":"从当下走入历史深处","text":"烟雨使楼台显隐，也让眼前风物带上时间感；对历史的感慨可从景中体会，不必定成单一讽刺。"}],"thought":"欣赏江南明丽与迷蒙并存的风景，同时感受遗迹中的历史回声。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_33cbdb2cf9b3.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%89%A7","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"wanghaichao","reason":"同写江南，比较记忆里的春色、历史中的烟雨与城市生活的繁华。"},{"id":"yijiangnan","reason":"同写江南，比较记忆里的春色、历史中的烟雨与城市生活的繁华。"}],"extra":{"places":"江南｜题中与正文描绘的广阔区域，约为长江下游以南的水乡。“南朝”所联系的历史文化以建康（今南京）为中心，但“千里”“四百八十寺”是概括铺陈，非一城寺院清单。"}},{"id":"feng-46","title":"蜂","author":"luoyin","form":"七言绝句","stage":["小学"],"scene":"flower","tags":["flower","labor","compassion","object","question"],"lines":["不论平地与山尖，","无限风光尽被占。","采得百花成蜜后，","为谁辛苦为谁甜？"],"quote":[1,2],"preface":"","intro":"蜜蜂酿出的甜，最后留给了谁。","notes":[{"q":"尽","text":"全，都。"},{"q":"占","text":"占据、享有，语境中也有反讽意味。"},{"q":"甜","text":"蜜的甘甜，也可联想到成果。"}],"background":"罗隐的咏物诗，以蜜蜂采花酿蜜的活动引出对劳作与所得的思考，具有借物议论的意味。","reading":[{"quote":"无限风光尽被占","title":"先写忙碌所到之处","text":"平地与山尖都能见到蜂，表面像享尽风光，后面的辛苦却会改变这一印象。"},{"quote":"为谁辛苦为谁甜","title":"两个“为谁”打开问题","text":"诗没有替读者直接作答，劳动与收益之间的关系从疑问中显出来，咏物因此具有社会关怀。"}],"thought":"赞叹勤劳，同时追问辛苦与收获是否相称，寄托对劳作者处境的思考。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_0cf974c0b70a.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%BD%97%E9%9A%90","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jiangshangyuzhe","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"},{"id":"minnong-42","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"}],"extra":{}},{"id":"jiangshangyuzhe","title":"江上渔者","author":"fanzhongyan","form":"五言绝句","stage":["小学"],"scene":"water","tags":["water","labor","compassion","contrast"],"lines":["江上往来人，","但爱鲈鱼美。","君看一叶舟，","出没风波里。"],"quote":[1,2],"preface":"","intro":"盘中的鲜美，连着风浪里的一条船。","notes":[{"q":"但","text":"只。"},{"q":"鲈鱼","text":"一种味道鲜美的鱼。"},{"q":"一叶舟","text":"像叶子般轻小的船。"}],"background":"范仲淹的五言绝句，通过食鱼人与捕鱼人的不同处境形成对照。题材虽小，目光落在劳作的风险上。","reading":[{"quote":"但爱鲈鱼美","title":"一句“只爱”暴露视角的局限","text":"岸上人关注滋味，容易忘记鱼从何来，“但”把这种选择性的看见点出来。"},{"quote":"出没风波里","title":"请把目光移到江面","text":"“君看”直接邀请读者换位置，小舟在风浪中时隐时现，鲜美背后的危险于是可见。"}],"thought":"呼吁看见劳动者的艰辛与风险，不让消费的舒适遮蔽他人的处境。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4b21381d3a76.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8C%83%E4%BB%B2%E6%B7%B9","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"sishitianyuanzaxing","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"},{"id":"feng-46","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"}],"extra":{}},{"id":"yuanri","title":"元日","author":"wanganshi","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["festival","spring","wind","joy","timepassing"],"lines":["爆竹声中一岁除，","春风送暖入屠苏。","千门万户曈曈日，","总把新桃换旧符。"],"quote":[1,2],"preface":"","intro":"爆竹之后，门上的桃符换了新。","notes":[{"q":"屠苏","text":"这里指新年饮用的屠苏酒。"},{"q":"曈曈","text":"读 tóng tóng，日出时光亮的样子。"},{"q":"桃符","text":"旧时门上避邪祈福的桃木板，后来与春联习俗相联系。"}],"background":"王安石写农历新年习俗的诗。可联系他的进取精神理解，但诗中直接呈现的是饮屠苏、迎日、换桃符等节日场景。","reading":[{"quote":"春风送暖入屠苏","title":"新年有声音也有温度","text":"爆竹、春风与酒相继出现，让时间更替成为可听、可感的生活经验。"},{"quote":"总把新桃换旧符","title":"以一个动作写辞旧迎新","text":"门上物件的更换使抽象的更新可见，“千门万户”又将一家习俗展开为共同生活。"}],"thought":"表现岁首的喜悦与更新的愿望，节日气氛来自人们共同的日常动作。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_a167901c9c90.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E5%AE%89%E7%9F%B3","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"qiqiao","reason":"循节日读日常：风俗相近，人的心境却可能十分不同。"},{"id":"qingming","reason":"循节日读日常：风俗相近，人的心境却可能十分不同。"}],"extra":{}},{"id":"pochuanguazhou","title":"泊船瓜洲","author":"wanganshi","form":"七言绝句","stage":["小学"],"scene":"moon","tags":["homesick","water","moon","spring","wind","question","geo_zhenjiang","geo_yangzhou","geo_nanjing"],"lines":["京口瓜洲一水间，","钟山只隔数重山。","春风又绿江南岸，","明月何时照我还。"],"quote":[2,3],"preface":"","intro":"春风先到了江南，人还在归期里徘徊。","notes":[{"q":"间","text":"隔着、相隔。"},{"q":"绿","text":"使江岸变绿，形容词活用。"},{"q":"还","text":"回去。"}],"background":"王安石写泊船瓜洲时的思归。“京口”在长江南岸，“瓜洲”在北岸，钟山在今南京一带，与诗人的居处有关。","reading":[{"quote":"春风又绿江南岸","title":"颜色也是一个动作","text":"“绿”把春风带来的变化写得集中，“又”说明季节重来，也反衬人未能如愿归去。"},{"quote":"明月何时照我还","title":"把归期交给月亮来问","text":"前半交代不算遥远的地理距离，结尾却仍问何时能回，空间近与归期未定形成张力。"}],"thought":"写思归之情，季节更新与个人行止之间的落差使牵念更深。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_df14e6fd217b.aspx","对照页所列异文或通假：又绿 一作：自绿。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E5%AE%89%E7%9F%B3","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"wenwangchanglingzuoqianlongbiaoyaoyouciji","reason":"沿着月光读下去，看同一意象怎样容纳童心、乡思与祝愿。"},{"id":"gulangyuexing","reason":"沿着月光读下去，看同一意象怎样容纳童心、乡思与祝愿。"}],"extra":{"places":"京口 → 镇江｜长江南岸的地点；瓜洲 → 扬州南部的古渡，在江北。两地隔江相望。\n\n钟山 → 南京紫金山｜诗人惦念的居处方向。“江南岸”与“何时照我还”使地理距离成为归心的尺度。"}},{"id":"shuhuyinxianshengbi","title":"书湖阴先生壁·其一","author":"wanganshi","form":"七言绝句","stage":["小学"],"scene":"water","tags":["water","mountain","plants","quiet","personification","geo_nanjing"],"lines":["茅檐长扫净无苔，","花木成畦手自栽。","一水护田将绿绕，","两山排闼送青来。"],"quote":[1,2],"preface":"","intro":"山水像来做客，停在主人门前。","notes":[{"q":"茅檐","text":"茅屋檐下，也代指庭院居所。"},{"q":"成畦","text":"整齐地种成一块块田畦。"},{"q":"排闼","text":"推门而入。"}],"background":"王安石《书湖阴先生壁二首》其一，写给邻人杨德逢，号湖阴先生。题壁诗借居处表现主人的生活情趣。","reading":[{"quote":"花木成畦手自栽","title":"先见庭院，再认识主人","text":"清扫、栽种都靠亲手完成，洁净有序的院落使人的勤劳与雅趣自然显现。"},{"quote":"两山排闼送青来","title":"山水像有了待客的心","text":"“护”“绕”“送”赋予山水人的动作，远景成了与主人亲近相伴的朋友。"}],"thought":"赞美清洁朴素的生活与亲近自然的心境，居处和人格相互映照。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_3d787de04152.aspx","对照页所列异文或通假：长 一作： 常；一水 一作：一手。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E5%AE%89%E7%9F%B3","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"youshanxicun","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"},{"id":"yugezi","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"}],"extra":{"places":"金陵 → 南京｜湖阴先生杨德逢是王安石退居金陵时的邻友，这是写作背景的地理线索。诗中只写庭院、田水与青山，没有逐一交代它们的地名。"}},{"id":"liuyueershiqiriwanghulouzuishu","title":"六月二十七日望湖楼醉书·其一","author":"sushi","form":"七言绝句","stage":["小学"],"scene":"rain","tags":["rain","wind","water","summer","motion","metaphor","joy","geo_hangzhou"],"lines":["黑云翻墨未遮山，","白雨跳珠乱入船。","卷地风来忽吹散，","望湖楼下水如天。"],"quote":[0,1],"preface":"","intro":"看一场骤雨，怎样在四句里来去。","notes":[{"q":"翻墨","text":"像打翻了墨汁，形容乌云翻滚"},{"q":"跳珠","text":"雨点如跳动的珠子"},{"q":"水如天","text":"雨后水面开阔澄明，与天空相接"}],"background":"写于苏轼任杭州通判期间。诗组记录西湖夏日见闻，此为第一首，取暴雨骤至又骤散的一瞬。","reading":[{"quote":"黑云翻墨未遮山","title":"一黑一白的急雨","text":"黑云、白雨先以颜色相撞；“翻”“跳”“乱”又让景物迅速动起来，读来像站在摇晃的船上。"},{"quote":"卷地风来忽吹散","title":"一个“忽”字转晴","text":"风将拥挤的画面骤然打开，末句不再密集写动作，只留下湖天一色的舒展。"}],"thought":"雨的猛烈与晴的澄明同样值得观看。诗人的兴味落在变化本身，短暂天气也能成为鲜活的记忆。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_0eda7b78250a.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8B%8F%E8%BD%BC","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yinhu","reason":"同一场雨可以是欣喜、骤变、怀念或等待，看看人的处境怎样进入景色。"},{"id":"chunyu","reason":"同一场雨可以是欣喜、骤变、怀念或等待，看看人的处境怎样进入景色。"}],"extra":{"places":"望湖楼、西湖｜地点在今浙江杭州。“望湖楼下水如天”是骤雨过后的西湖景象，题中的楼是望向湖面的视点。"}},{"id":"huichongchunjiangwanjing","title":"惠崇春江晚景·其一","author":"sushi","form":"七言绝句","stage":["小学"],"scene":"water","tags":["spring","bamboo","flower","water","animal","nature","imagination"],"lines":["竹外桃花三两枝，","春江水暖鸭先知。","蒌蒿满地芦芽短，","正是河豚欲上时。"],"quote":[1,2],"preface":"","intro":"画里看得到桃花，画外还能想到水温。","notes":[{"q":"惠崇","text":"北宋僧人、画家"},{"q":"蒌蒿","text":"生于水边的草本植物"},{"q":"芦芽","text":"芦苇新生的嫩芽"},{"q":"河豚欲上","text":"河豚将溯江而上，点明春季物候"}],"background":"此为苏轼题惠崇画作的诗。原画已不可见；诗把画面中的春江景物与观画者的生活经验联在一起。","reading":[{"quote":"春江水暖鸭先知","title":"把看见变成感到","text":"画不能直接表现水温，诗借鸭子的活动写出春水的暖意，让视觉延伸到身体感受。"},{"quote":"正是河豚欲上时","title":"画面之外的春天","text":"由芦芽、蒌蒿联想到河豚，诗意越出画框；这句是想象，并非断言画中已有河豚。"}],"thought":"春天不仅在鲜艳处，也藏在动物的感受和植物细小的生长里。诗邀人凭经验读懂自然的消息。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_cd140bf494da.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8B%8F%E8%BD%BC","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"sanqudaozhong","reason":"同读春夏的鸟声与暖意，留意景物怎样表现明快的心情。"},{"id":"jueju-27","reason":"同读春夏的鸟声与暖意，留意景物怎样表现明快的心情。"}],"extra":{}},{"id":"tixilinbi","title":"题西林壁","author":"sushi","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["mountain","reflection","contrast","space","geo_lushan"],"lines":["横看成岭侧成峰，","远近高低各不同。","不识庐山真面目，","只缘身在此山中。"],"quote":[0,1],"preface":"","intro":"同一座山，换个位置就换了模样。","notes":[{"q":"横看","text":"从正面横向观看山势"},{"q":"侧","text":"从侧面观看"},{"q":"只缘","text":"只是因为"},{"q":"真面目","text":"山的整体形貌，也引出认识事物的意味"}],"background":"苏轼游庐山时题于西林寺。诗由观看山形转向对认识局限的思考，写景和议论紧密相连。","reading":[{"quote":"横看成岭侧成峰","title":"移动中的观察","text":"横侧、远近、高低列出多种视角，山并没有改变，改变的是人与山的关系。"},{"quote":"只缘身在此山中","title":"给自己的目光留余地","text":"结句回看观察者的位置：身处其中所见可能只是局部。它没有否定经验，而是提醒人补充视角。"}],"thought":"认识世界需要走近，也需要转换位置。诗把一种温和的自我提醒，安放在可以亲身体验的山景里。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_f2f5469a6044.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8B%8F%E8%BD%BC","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"wangyue","reason":"沿着仰望、登临与换位观看，体会山怎样打开人的视野。"},{"id":"dengguanquelou","reason":"沿着仰望、登临与换位观看，体会山怎样打开人的视野。"}],"extra":{"places":"庐山、西林寺｜诗人在今江西九江庐山游览的背景。标题“西林”指西林寺；同一座庐山从横侧远近观看各有面貌，地理上的视点变化引出认识上的思考。"}},{"id":"xiarijueju","title":"夏日绝句","author":"liqingzhao","form":"五言绝句","stage":["小学"],"scene":"mountain","tags":["history","resolve","allusion","boldstyle","geo_jiangdong","geo_wujiang"],"lines":["生当作人杰，","死亦为鬼雄。","至今思项羽，","不肯过江东。"],"quote":[0,1],"preface":"","intro":"二十个字，写出不肯折损的尊严。","notes":[{"q":"人杰","text":"人中的豪杰"},{"q":"鬼雄","text":"鬼中的英雄"},{"q":"江东","text":"项羽起兵之地，位于长江下游南岸一带"}],"background":"借项羽兵败后不渡乌江的故事立意。常联系南宋初年的时局阅读，但具体写作情境不宜仅凭后世故事坐实。","reading":[{"quote":"生当作人杰","title":"把判断放在开头","text":"生与死相对，人杰与鬼雄相应，整齐有力的句式让价值选择十分鲜明。"},{"quote":"至今思项羽","title":"历史成为当下的回声","text":"末两句不复述楚汉战争，只取“不肯”二字，让人物在最后抉择中的气概成为焦点。"}],"thought":"这首诗赞许人在败局中仍珍惜人格与尊严。阅读时可以理解其激烈情感，也不必将悲剧结局当作唯一的人生选择。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_e4cd80aceb52.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E6%B8%85%E7%85%A7","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"qiuyejiangxiaochulimenyingliangyougan","reason":"把历史、风雨与个人处境相联，比较坚持中的昂扬和沉痛。"},{"id":"manjianghong","reason":"把历史、风雨与个人处境相联，比较坚持中的昂扬和沉痛。"}],"extra":{"places":"江东｜项羽所牵挂而未再回的区域，通常指长江下游以南的古吴地，不等于今天单一省份。\n\n乌江｜项羽典故联系今安徽马鞍山和县一带。这里是历史典故的地点，不能据此断定本诗的实际写作位置。"}},{"id":"sanqudaozhong","title":"三衢道中","author":"zengji","form":"七言绝句","stage":["小学"],"scene":"water","tags":["summer","mountain","water","sound","joy","nature","geo_quzhou"],"lines":["梅子黄时日日晴，","小溪泛尽却山行。","绿阴不减来时路，","添得黄鹂四五声。"],"quote":[1,2],"preface":"","intro":"走完水路，再进山听几声黄鹂。","notes":[{"q":"三衢","text":"今浙江衢州一带"},{"q":"却","text":"再、又"},{"q":"绿阴","text":"绿树浓荫"},{"q":"不减","text":"并不减少，不逊于"}],"background":"记录曾几行经三衢一带的旅途见闻。梅子成熟时节难得连晴，诗人的出游兴致贯穿全篇。","reading":[{"quote":"小溪泛尽却山行","title":"路途在句间延续","text":"“尽”本可结束旅程，“却”又把人带入山路，画面随脚步转换，没有疲倦的停顿。"},{"quote":"添得黄鹂四五声","title":"用声音添一层风景","text":"眼前绿阴与来时相似，鸟声却带来新鲜感。“四五声”轻巧具体，留下山间的余响。"}],"thought":"熟悉的道路也有新的馈赠。诗人的快乐来自愿意继续走、继续听的心情。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_fbbd80710c5e.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9B%BE%E5%87%A0","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chunxiao","reason":"同读春夏的鸟声与暖意，留意景物怎样表现明快的心情。"},{"id":"huichongchunjiangwanjing","reason":"同读春夏的鸟声与暖意，留意景物怎样表现明快的心情。"}],"extra":{"places":"三衢 → 衢州｜题中的行旅区域，在今浙江衢州。“小溪泛尽却山行”给出水路转山路的体验，并未标明可以完全复原的具体路线。"}},{"id":"shier","title":"示儿","author":"luyou","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["patriotism","family","sadness","resolve","geo_shaoxing"],"lines":["死去元知万事空，","但悲不见九州同。","王师北定中原日，","家祭无忘告乃翁。"],"quote":[0,1],"preface":"","intro":"一封短短的家书，把未竟的牵挂留给后来人。","notes":[{"q":"元","text":"本来，同“原”"},{"q":"九州同","text":"天下统一"},{"q":"王师","text":"指南宋军队"},{"q":"乃翁","text":"你们的父亲"}],"background":"陆游晚年所作，通常视为绝笔。南北分裂是其一生的深切关怀，诗以对儿子的嘱咐收束这份愿望。","reading":[{"quote":"死去元知万事空","title":"坦然里仍有一件放不下","text":"首句似已放下万事，次句“但悲”立即收拢到一个遗憾，感情因此集中而深重。"},{"quote":"家祭无忘告乃翁","title":"让未来走进家常","text":"诗不铺陈宏大场景，而想象子孙祭告的一刻。国家愿望与家庭语言自然相连。"}],"thought":"临终的牵挂使统一之愿获得了个人生命的重量。希望未必由自己见证，仍可以诚恳地托付给未来。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_966c8a76211f.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%99%86%E6%B8%B8","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yueyeyishedi","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"},{"id":"youziyin","reason":"把远行、回乡与照护放在一起，读亲情怎样进入具体生活。"}],"extra":{"places":"山阴 → 绍兴｜临终写作背景通常系于陆游在山阴的居处，即今浙江绍兴。“中原”是诗人盼望收复的北方广大地区，不是一个现代行政区。"}},{"id":"qiuyejiangxiaochulimenyingliangyougan","title":"秋夜将晓出篱门迎凉有感·其二","author":"luyou","form":"七言绝句","stage":["小学"],"scene":"water","tags":["patriotism","mountain","water","sadness","hyperbole","geo_shaoxing","geo_yellowriver","geo_huashan"],"lines":["三万里河东入海，","五千仞岳上摩天。","遗民泪尽胡尘里，","南望王师又一年。"],"quote":[0,1],"preface":"","intro":"壮阔山河之后，是一声迟迟等不到回应的叹息。","notes":[{"q":"河","text":"黄河"},{"q":"岳","text":"通常指华山"},{"q":"仞","text":"古代长度单位，此处极言山高"},{"q":"遗民","text":"沦陷地区的百姓"},{"q":"胡尘","text":"借指金统治下的战乱环境"}],"background":"陆游居山阴时作，时值南宋。此为组诗第二首，借北方山河与遗民的想象表达对恢复失地的期盼。","reading":[{"quote":"三万里河东入海","title":"先把山河写得极大","text":"数字与“入海”“摩天”共同构成壮阔气势，不是测量数据，而是对山河的深情凝视。"},{"quote":"南望王师又一年","title":"希望在一个字里变沉","text":"“又”让此前无数等待同时浮现。大景突然转到人的泪眼，赞叹也随之变成忧思。"}],"thought":"诗把山河之美与百姓之苦并置。最深的牵挂不是抽象疆土，而是长期等待中的具体的人。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_dbabcfab1a1b.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%99%86%E6%B8%B8","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shiyiyuesirifengyudazuo","reason":"把历史、风雨与个人处境相联，比较坚持中的昂扬和沉痛。"},{"id":"xiarijueju","reason":"把历史、风雨与个人处境相联，比较坚持中的昂扬和沉痛。"}],"extra":{"places":"山阴 → 绍兴｜写作背景中的居处。\n\n河、岳｜“三万里河”通常指黄河，“五千仞岳”通常指华山（今陕西华阴）。这两处是诗人心中未收复的山河，不能误作站在家门口直接看到的风景。"}},{"id":"sishitianyuanzaxing","title":"四时田园杂兴·其三十一","author":"fanchengda","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["labor","child","family","nature","summer","geo_suzhou"],"lines":["昼出耘田夜绩麻，","村庄儿女各当家。","童孙未解供耕织，","也傍桑阴学种瓜。"],"quote":[0,1],"preface":"","intro":"大人忙着耕织，孩子也有自己的小小农事。","notes":[{"q":"耘田","text":"除去田间杂草"},{"q":"绩麻","text":"把麻搓成线"},{"q":"各当家","text":"各自承担劳动事务"},{"q":"供耕织","text":"从事耕田、织作"}],"background":"范成大《四时田园杂兴》六十首之一，通行次序为第三十一首，属夏日田园诗组。以日常劳动写乡村生活。","reading":[{"quote":"昼出耘田夜绩麻","title":"一天的两种忙碌","text":"昼与夜相对，田间和家中相接，用一句呈现劳动贯穿整日的节奏。"},{"quote":"也傍桑阴学种瓜","title":"一个“也”字的认真","text":"孩子还不会正式参与耕织，却模仿大人种瓜。诗没有评说，动作本身已经可亲。"}],"thought":"乡村生活既有劳作的辛苦，也有经验在日常中传递的温暖。孩子的游戏与大人的生活并不隔绝。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_9d5e3f5ee21f.aspx","篇次采用《四时田园杂兴》六十首的通行次序，为夏日组第七首、总第三十一首。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8C%83%E6%88%90%E5%A4%A7","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"xiangcunsiyue","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"},{"id":"jiangshangyuzhe","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"}],"extra":{"places":"石湖 → 苏州｜《四时田园杂兴》的写作背景联系范成大退居石湖的生活，石湖在今江苏苏州。此首正文没有专名，地点依据组诗背景，而非由诗人籍贯推定。"}},{"id":"zhizinongbing","title":"稚子弄冰","author":"yangwanli","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["child","winter","sound","joy","motion","metaphor"],"lines":["稚子金盆脱晓冰，","彩丝穿取当银钲。","敲成玉磬穿林响，","忽作玻璃碎地声。"],"quote":[1,2],"preface":"","intro":"一块晨冰，先是一件乐器，忽然又碎成了惊讶。","notes":[{"q":"稚子","text":"幼小的孩子"},{"q":"脱晓冰","text":"清晨从盆中取出结成的冰"},{"q":"钲","text":"古代打击乐器"},{"q":"磬","text":"石制打击乐器"},{"q":"玻璃","text":"此处借晶亮易碎之物形容冰声，不必等同现代窗玻璃"}],"background":"杨万里善于捕捉日常细节。此诗写儿童取冰敲玩的过程，让读者跟着声音经历一场短暂游戏。","reading":[{"quote":"彩丝穿取当银钲","title":"孩子眼里的变身","text":"冰本是水的凝结，穿上彩丝就成为乐器。“当”字写出儿童自己赋予物件的用途。"},{"quote":"忽作玻璃碎地声","title":"不说明也能听懂的结尾","text":"由清脆悠长变为坠地碎响，诗只写声音，不直说孩子的神情，让惊愕与惋惜留给读者想象。"}],"thought":"游戏的快乐很小，也很完整。诗保存了儿童把寻常之物变成新世界的能力。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4bb194abd528.aspx","对照页所列异文或通假：银钲 一作：银铮；玻璃 一作：玻瓈。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%A8%E4%B8%87%E9%87%8C","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"suojian","reason":"留意孩子与动物的动作，看看几笔白描怎样写出生活的趣味。"},{"id":"xiaoerchuidiao","reason":"留意孩子与动物的动作，看看几笔白描怎样写出生活的趣味。"}],"extra":{}},{"id":"xiaochujingcisisonglinzifang","title":"晓出净慈寺送林子方·其二","author":"yangwanli","form":"七言绝句","stage":["小学"],"scene":"water","tags":["water","flower","lotusleaf","summer","joy","space","geo_hangzhou"],"lines":["毕竟西湖六月中，","风光不与四时同。","接天莲叶无穷碧，","映日荷花别样红。"],"quote":[0,1],"preface":"","intro":"一片接天的碧绿，托起六月的荷花红。","notes":[{"q":"净慈寺","text":"杭州西湖附近寺院"},{"q":"毕竟","text":"到底，带有赞叹语气"},{"q":"四时","text":"其他时节，与六月相对而言"},{"q":"别样","text":"格外、不同寻常"}],"background":"写西湖六月荷景，题中记明送别林子方。诗把重心放在眼前盛景，没有直接铺写离愁。","reading":[{"quote":"毕竟西湖六月中","title":"先让赞叹响起来","text":"开头先说六月景色不同，暂不解释原因，读者的目光便顺着后两句展开。"},{"quote":"接天莲叶无穷碧","title":"颜色也有空间感","text":"“接天”把绿铺向远方，“映日”又使红更明亮；两种颜色与天、日相连，构成开阔明快的画面。"}],"thought":"相送的时刻未必只有悲伤，也能被一片共同看过的风景照亮。诗让盛夏的生命力留在记忆里。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_3ab4125fd0f1.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%A8%E4%B8%87%E9%87%8C","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"xiaochi","reason":"同看一池荷叶：从游鱼与小艇，读到荷花和尖角上的蜻蜓。"},{"id":"chishang","reason":"同看一池荷叶：从游鱼与小艇，读到荷花和尖角上的蜻蜓。"}],"extra":{"places":"净慈寺、西湖｜今浙江杭州。题目点明从净慈寺送友人出发，正文铺开西湖六月的荷叶与荷花，地名让送别与盛夏湖景连在一起。"}},{"id":"xiangcunsiyue","title":"乡村四月","author":"wengjuan","form":"七言绝句","stage":["小学"],"scene":"rain","tags":["rain","water","labor","sound","nature","spring"],"lines":["绿遍山原白满川，","子规声里雨如烟。","乡村四月闲人少，","才了蚕桑又插田。"],"quote":[0,1],"preface":"","intro":"细雨如烟，田野里的脚步却一点也不慢。","notes":[{"q":"山原","text":"山陵与原野"},{"q":"川","text":"平地，此处与水田景象相关"},{"q":"子规","text":"杜鹃鸟"},{"q":"了","text":"结束、完成"},{"q":"插田","text":"插秧"}],"background":"翁卷写江南乡村暮春初夏的景象。四月按农历计，蚕桑与插秧衔接，风景和农事在同一首诗里展开。","reading":[{"quote":"绿遍山原白满川","title":"铺开两种田野颜色","text":"“遍”“满”将绿与水色推向整个视野，鸟声和烟雨又给远景增添层次。"},{"quote":"才了蚕桑又插田","title":"忙碌藏在连接词里","text":"“才”“又”紧紧衔接两项农事，读者能从语速里感觉到农人的忙，没有空泛地说辛苦。"}],"thought":"欣赏田园，也看见维系田园的人。诗的清润景色与劳动节奏彼此照应。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_07f5e3403665.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%BF%81%E5%8D%B7","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"maitanweng","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"},{"id":"sishitianyuanzaxing","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"}],"extra":{}},{"id":"momei","title":"墨梅","author":"wangmian","form":"七言绝句","stage":["小学"],"scene":"flower","tags":["flower","resolve","object","aspiration","art"],"lines":["我家洗砚池头树，","朵朵花开淡墨痕。","不要人夸好颜色，","只留清气满乾坤。"],"quote":[1,2],"preface":"","intro":"不靠鲜艳取悦人，也可以留下清香。","notes":[{"q":"墨梅","text":"用水墨绘出的梅花"},{"q":"洗砚池","text":"与书画生活相关，也令人联想到王羲之洗砚典故"},{"q":"清气","text":"梅的清香，又寄寓清正气质"},{"q":"乾坤","text":"天地之间"}],"background":"王冕的题画诗，借水墨梅花表达品格取向。传本有“我家／吾家”等异文，本篇采用所列来源正文。","reading":[{"quote":"朵朵花开淡墨痕","title":"把画法写成气质","text":"淡墨是画中颜色，也让花显得素净。诗从真实的画面出发，为后面的自许作铺垫。"},{"quote":"只留清气满乾坤","title":"由颜色转向不可见之物","text":"“不要”与“只留”明确取舍：可见的好颜色退后，无形的清香获得宽广空间。"}],"thought":"梅花成为不依赖外在夸赞的自我表达。重视内在品格，是这幅墨色小画向读者发出的邀请。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_82fd6027caf3.aspx","对照页所列异文或通假：我家 一作：吾家；朵朵 一作：个个；好颜色 一作：颜色好。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E5%86%95","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shihuiyin","reason":"同读托物言志，看看梅、石灰、竹与莲怎样成为品格的语言。"},{"id":"ailianshuo","reason":"同读托物言志，看看梅、石灰、竹与莲怎样成为品格的语言。"}],"extra":{}},{"id":"shihuiyin","title":"石灰吟","author":"yuqian","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["resolve","object","aspiration","mountain","fire"],"lines":["千锤万凿出深山，","烈火焚烧若等闲。","粉骨碎身浑不怕，","要留清白在人间。"],"quote":[0,1],"preface":"","intro":"从山石到石灰，读一段经受锤炼的生命想象。","notes":[{"q":"等闲","text":"寻常、平常"},{"q":"浑","text":"全、完全"},{"q":"清白","text":"石灰的白色，也指清正的品格"}],"background":"诗借石灰开采、烧制与使用的过程言志。后世常结合于谦的生平阅读，但不宜把少年即席作诗的传说当作确证。","reading":[{"quote":"千锤万凿出深山","title":"把制作过程变成考验","text":"锤凿与烈火都是石灰形成中的环节，诗赋予物以人的承受力，让过程成为品格的试炼。"},{"quote":"要留清白在人间","title":"双关落在最后一词","text":"“清白”同时连接物性与人格，结尾由石灰转向人的志愿，却不脱离所咏之物。"}],"thought":"诗写对清正品格的珍惜与坚持。它的力量来自价值选择，不需要把苦难本身视为值得追求的事物。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_c6c93895df0a.aspx","对照页所列异文或通假：万凿 一作：万击；浑不怕 一作：全不怕。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E4%BA%8E%E8%B0%A6","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zhushi","reason":"同读托物言志，看看梅、石灰、竹与莲怎样成为品格的语言。"},{"id":"momei","reason":"同读托物言志，看看梅、石灰、竹与莲怎样成为品格的语言。"}],"extra":{}},{"id":"suojian","title":"所见","author":"yuanmei","form":"五言绝句","stage":["小学"],"scene":"mountain","tags":["child","animal","sound","motion","joy"],"lines":["牧童骑黄牛，","歌声振林樾。","意欲捕鸣蝉，","忽然闭口立。"],"quote":[1,2],"preface":"","intro":"歌声忽然停了，原来树上还有一个小目标。","notes":[{"q":"林樾","text":"林间成荫处"},{"q":"意欲","text":"心里想要"},{"q":"鸣蝉","text":"正在鸣叫的蝉"},{"q":"立","text":"站住、停住"}],"background":"袁枚以简短白描写牧童生活的一瞬。诗没有交代确切地点，趣味落在歌唱到捕蝉的动作变化。","reading":[{"quote":"歌声振林樾","title":"先听见一个自在的人","text":"“振”写歌声响亮，骑牛与唱歌相合，牧童的轻松无需额外说明。"},{"quote":"忽然闭口立","title":"静止比动作更有戏","text":"前句点出捕蝉意图，末句立刻收住声音和动作。由动到静的急转把专注神态写活。"}],"thought":"童趣往往在兴致的突然转移中出现。诗让一个不起眼的停顿成为值得细看的生活片刻。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_58699ebb5e93.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%A2%81%E6%9E%9A","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"cunju","reason":"留意孩子与动物的动作，看看几笔白描怎样写出生活的趣味。"},{"id":"zhizinongbing","reason":"留意孩子与动物的动作，看看几笔白描怎样写出生活的趣味。"}],"extra":{}},{"id":"cunju","title":"村居","author":"gaoding","form":"七言绝句","stage":["小学"],"scene":"mountain","tags":["spring","willow","wind","child","joy","personification"],"lines":["草长莺飞二月天，","拂堤杨柳醉春烟。","儿童散学归来早，","忙趁东风放纸鸢。"],"quote":[1,2],"preface":"","intro":"春风经过堤岸，也牵起孩子手中的风筝。","notes":[{"q":"春烟","text":"春日水泽草木间的烟霭"},{"q":"散学","text":"放学"},{"q":"纸鸢","text":"风筝，鸢读yuān"}],"background":"高鼎写乡村春景。草木、鸟鸣与放风筝的儿童共同构成二月生活，具体创作时地未作确定。","reading":[{"quote":"拂堤杨柳醉春烟","title":"柳枝像有了春意","text":"“拂”写轻柔摆动，“醉”把朦胧烟霭中的杨柳人格化，春天显得柔软而亲近。"},{"quote":"忙趁东风放纸鸢","title":"一个“忙”字的快乐","text":"这份忙碌来自盼望。前两句的东风春景在儿童的行动里得到回应，景与人自然相融。"}],"thought":"季节的到来不仅被眼睛看见，也被游戏感受到。春天由草木的生长延伸成孩子向外奔跑的兴致。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_425fb837c387.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%AB%98%E9%BC%8E","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yonge","reason":"留意孩子与动物的动作，看看几笔白描怎样写出生活的趣味。"},{"id":"suojian","reason":"留意孩子与动物的动作，看看几笔白描怎样写出生活的趣味。"}],"extra":{}},{"id":"jihaizashi","title":"己亥杂诗·其五","author":"gongzizhen","form":"七言绝句","stage":["小学","初中"],"scene":"flower","tags":["flower","farewell","sadness","hope","aspiration","spring","geo_beijing_city"],"lines":["浩荡离愁白日斜，","吟鞭东指即天涯。","落红不是无情物，","化作春泥更护花。"],"quote":[0,1],"preface":"","intro":"离开枝头的花，还能为下一次开放做些什么。","notes":[{"q":"浩荡","text":"广大深重，这里形容离愁"},{"q":"吟鞭","text":"诗人的马鞭，借写行旅"},{"q":"落红","text":"落花"},{"q":"春泥","text":"春日泥土"}],"background":"龚自珍辞官离京南归期间所作《己亥杂诗》之一，通行编号第五首。诗由离京感受转入对自身价值的表达。","reading":[{"quote":"浩荡离愁白日斜","title":"把离情放进远行的暮色","text":"离愁、斜日和东去的马鞭构成出发场景，“即天涯”写心理距离骤然拉远。"},{"quote":"化作春泥更护花","title":"凋落之后还有联系","text":"诗不把落花视为终结，而想象它转为养分。借物表达心志，改变了前半首低回的情绪。"}],"thought":"离开原来的位置，并不意味着关怀终止。诗以落花的转化寄寓仍愿有所贡献的心意。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_d78d2dc95f06.aspx","候选清单两处同篇合并；“小学、初中”仅为清单来源阶段标签，不构成逐版教材或必背认定。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%BE%9A%E8%87%AA%E7%8F%8D","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"fudeguyuancaosongbie","reason":"从草木的枯荣到秋叶与落花，读自然变化怎样引出希望。"},{"id":"shanxing","reason":"从草木的枯荣到秋叶与落花，读自然变化怎样引出希望。"}],"extra":{"places":"京城 → 北京｜辞官离京南归的创作背景。“吟鞭东指”写启程方向，诗中未列出南归的完整路线。此篇与《九州生气恃风雷》是不同一首《己亥杂诗》。"}},{"id":"caiwei","title":"采薇（节选）","author":"shijing","form":"四言诗","stage":["小学"],"scene":"snow","tags":["snow","willow","war","homesick","sadness","contrast"],"lines":["昔我往矣，","杨柳依依。","今我来思，","雨雪霏霏。","行道迟迟，","载渴载饥。","我心伤悲，","莫知我哀！"],"quote":[0,1],"preface":"","intro":"出发时的柳枝，还在归途的雪中摇动。","notes":[{"q":"往","text":"当初出征"},{"q":"依依","text":"柳枝轻柔摇曳的样子"},{"q":"思","text":"句末语气词，无实义"},{"q":"雨雪","text":"下雪，雨读yù"},{"q":"霏霏","text":"雪纷飞貌"},{"q":"载","text":"又、且"}],"background":"选自《诗经·小雅·采薇》末章，写久役之人的归途。本篇只收这一章，并非全诗。","reading":[{"quote":"昔我往矣","title":"用两个时刻丈量离别","text":"“昔”与“今”、杨柳与雨雪相对，时间不靠年月说明，而被两幅景象感知。"},{"quote":"莫知我哀","title":"归来并不自动消除痛苦","text":"饥渴、迟缓的脚步之后，结尾落在无人理解的悲哀，使回乡故事保留了战争的创伤。"}],"thought":"归途应有期待，却也可能满载疲惫。诗让远行者的复杂感受留下声音，不用欢喜覆盖他的伤痛。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_fa087546c81b.aspx","节选范围：《小雅·采薇》第六章，自“昔我往矣”至“莫知我哀”。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"xingjunjiurisichanganguyuan","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"},{"id":"shiwucongjunzheng","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"}],"extra":{}},{"id":"songdushaofuzhirenshuzhou","title":"送杜少府之任蜀州","author":"wangbo","form":"五言律诗","stage":["小学"],"scene":"mountain","tags":["friendship","farewell","hope","space","geo_xian","geo_sanqin","geo_bashu"],"lines":["城阙辅三秦，","风烟望五津。","与君离别意，","同是宦游人。","海内存知己，","天涯若比邻。","无为在歧路，","儿女共沾巾。"],"quote":[2,3],"preface":"","intro":"真正的相知，会让遥远的路短一些。","notes":[{"q":"城阙","text":"这里指长安"},{"q":"三秦","text":"关中地区"},{"q":"五津","text":"岷江一带渡口，代指蜀地"},{"q":"宦游","text":"在外任职"},{"q":"歧路","text":"分手的路口"}],"background":"王勃送友人赴蜀任职之作。题名有“蜀州／蜀川”异文；诗从长安望向蜀地，以开阔口吻宽慰离人。","reading":[{"quote":"与君离别意","title":"先承认彼此的难过","text":"诗不是一味劝人振作，而先说同为宦游者，懂得朋友的不舍，安慰因此有了根基。"},{"quote":"天涯若比邻","title":"让友情重新安排距离","text":"“天涯”与“比邻”形成强烈反差，表达相知可以超越地理阻隔，是情感判断而非距离消失。"}],"thought":"离别有伤感，相知也有支撑人的力量。诗的明朗来自彼此理解，而不是要求人不许悲伤。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_5775c79bcd34.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E5%8B%83","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"songyouren","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"},{"id":"biedongda","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"}],"extra":{"places":"城阙、三秦｜送别者所在的长安及周围关中区域，约今陕西西安一带。\n\n蜀州、五津｜友人的任职方向与蜀地岷江渡口群，联系今四川。题名有“蜀州”“蜀川”异文，任所的具体考订也有讨论；这里保留蜀地这一层范围，不强行定位到一座现代城市。"}},{"id":"chunxue","title":"春雪","author":"hanyu","form":"七言绝句","stage":["小学"],"scene":"snow","tags":["snow","spring","flower","joy","personification"],"lines":["新年都未有芳华，","二月初惊见草芽。","白雪却嫌春色晚，","故穿庭树作飞花。"],"quote":[1,2],"preface":"","intro":"雪也等不及春天，先替树枝开了花。","notes":[{"q":"芳华","text":"芬芳的花，这里指春花"},{"q":"初","text":"才、刚刚"},{"q":"嫌","text":"觉得不满足"},{"q":"故","text":"故意"}],"background":"韩愈的咏春诗，题为《春雪》，首句“新年都未有芳华”。同题作品较多，阅读时须凭首句区分。","reading":[{"quote":"二月初惊见草芽","title":"惊喜从一个芽开始","text":"“都未”先写等待，“初惊”再写发现。细小草芽因迟来的春意而格外动人。"},{"quote":"故穿庭树作飞花","title":"让雪主动参加春天","text":"“嫌”“故”赋予雪人的心情，把可能令人觉得寒冷的景象改写成迎春的热闹。"}],"thought":"愿意寻找的人，能从迟迟未开的春色中发现生机。诗用轻盈想象把等待变成了欣喜。","sources":["原文对照：https://zh.wikisource.org/wiki/%E5%85%A8%E5%94%90%E8%A9%A9/%E5%8D%B7343#卷343_38","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"wanchun","reason":"风雪与草木也像有了性情，循着拟人与想象读春天。"},{"id":"yongliu","reason":"风雪与草木也像有了性情，循着拟人与想象读春天。"}],"extra":{}},{"id":"wanchun","title":"晚春","author":"hanyu","form":"七言绝句","stage":["小学"],"scene":"flower","tags":["spring","flower","willow","joy","personification"],"lines":["草树知春不久归，","百般红紫斗芳菲。","杨花榆荚无才思，","惟解漫天作雪飞。"],"quote":[1,2],"preface":"","intro":"春将归去，连不起眼的杨花榆荚也想热闹一场。","notes":[{"q":"芳菲","text":"花草芳香美盛的样子"},{"q":"杨花","text":"柳絮"},{"q":"榆荚","text":"榆树果实，形圆而薄"},{"q":"惟解","text":"只知道"}],"background":"韩愈《晚春》诗之一，写暮春草木繁盛。对结尾语气有不同理解，可兼读作诙谐调侃与对自然生机的欣赏。","reading":[{"quote":"百般红紫斗芳菲","title":"花草知道时间不多了","text":"“知”“斗”让草木有了心思，繁花不是静态陈列，而像抓紧春光的共同表演。"},{"quote":"惟解漫天作雪飞","title":"没有艳色，也有自己的方式","text":"杨花榆荚不能以红紫争胜，却能漫天飞舞。雪只是比喻，不是诗中真的下雪。"}],"thought":"自然的热闹并不只属于最鲜艳的花。诗以幽默眼光看待各自不同的生命姿态。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_9aadcdc29984.aspx","对照页所列异文或通假：草树 一作：草木。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%9F%A9%E6%84%88","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"feng","reason":"风雪与草木也像有了性情，循着拟人与想象读春天。"},{"id":"chunxue","reason":"风雪与草木也像有了性情，循着拟人与想象读春天。"}],"extra":{}},{"id":"duzuojingtingshan","title":"独坐敬亭山","author":"libai","form":"五言绝句","stage":["小学"],"scene":"mountain","tags":["mountain","cloud","solitude","quiet","personification","geo_xuancheng"],"lines":["众鸟高飞尽，","孤云独去闲。","相看两不厌，","只有敬亭山。"],"quote":[0,1],"preface":"","intro":"鸟与云都走远了，还有一座山陪你坐着。","notes":[{"q":"尽","text":"全都消失"},{"q":"闲","text":"悠闲自在"},{"q":"厌","text":"满足，也有厌倦之意，此处指看不厌"}],"background":"李白独对敬亭山之作，确切作年有不同说法。敬亭山在今安徽宣城，诗把孤坐体验写成与山相亲。","reading":[{"quote":"众鸟高飞尽","title":"让画面慢慢空下来","text":"鸟群飞去，孤云也离开，先后两个离去的动作将读者带到安静而孤单的处境。"},{"quote":"相看两不厌","title":"山也有了目光","text":"“相看”使人与山成为彼此回应的两方；孤独没有被说明，却在想象的陪伴里得到安放。"}],"thought":"独处中既可能有寂寞，也可能生出深厚的亲近感。诗把自然写成不必言语的知己。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_1da5349ad9e4.aspx","对照页所列异文或通假：只有 一作：唯有。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zhuliguan","reason":"走进山林的不同深处，比较独处、寻找与自然相伴的心境。"},{"id":"xunyinzhebuyu","reason":"走进山林的不同深处，比较独处、寻找与自然相伴的心境。"}],"extra":{"places":"敬亭山｜今安徽宣城。诗人以相看不厌写与山为伴；地名是真实的，山的“凝望”则属于拟人。"}},{"id":"mashi","title":"马诗·大漠沙如雪","author":"lihe","form":"五言绝句","stage":["小学"],"scene":"moon","tags":["moon","frontier","resolve","object","aspiration","autumn","geo_yanshan"],"lines":["大漠沙如雪，","燕山月似钩。","何当金络脑，","快走踏清秋。"],"quote":[0,1],"preface":"","intro":"月像弯钩，马在等待一次真正的奔跑。","notes":[{"q":"燕山","text":"北方山地名，此处营造边塞气氛"},{"q":"金络脑","text":"金饰的马笼头，借指受到重用"},{"q":"何当","text":"何时能够"},{"q":"快走","text":"迅速奔跑"}],"background":"李贺《马诗》组诗之一，通行次序第五首。以马的处境寄寓施展才能的愿望。","reading":[{"quote":"大漠沙如雪","title":"清冷的舞台先出现","text":"沙像雪、月似钩，两重比喻构成明亮冷峻的边塞夜景；这里的雪属于比喻。"},{"quote":"快走踏清秋","title":"愿望终于有了动作","text":"前两句静观，后两句想象驰骋。“踏”使期待变得有力，马的愿望也成为人的自许。"}],"thought":"诗写才能渴望被看见、力量渴望有去处的心情。短短四句让沉静与蓄势并存。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_55174e6ebe20.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E8%B4%BA","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"dengyouzhoutaige","reason":"同写抱负与处境的距离，比较期待任用、怀古与梦中驰骋。"},{"id":"pozhenzi","reason":"同写抱负与处境的距离，比较期待任用、怀古与梦中驰骋。"}],"extra":{"places":"燕山｜诗中的边地山名，有今河北燕山山脉说，也有指燕然山（今蒙古国杭爱山）的解释。保留两说，不据此给“大漠”安排唯一坐标；整首以战马寄托建功的愿望。"}},{"id":"qiqiao","title":"乞巧","author":"linjie","form":"七言绝句","stage":["小学"],"scene":"moon","tags":["festival","moon","autumn","folk","imagination"],"lines":["七夕今宵看碧霄，","牵牛织女渡河桥。","家家乞巧望秋月，","穿尽红丝几万条。"],"quote":[1,2],"preface":"","intro":"看向同一片星空，家家都有小小的愿望。","notes":[{"q":"乞巧","text":"七夕向织女祈求巧艺的风俗"},{"q":"碧霄","text":"碧蓝天空"},{"q":"牵牛","text":"牵牛星，传说中的牛郎"},{"q":"几万条","text":"夸张写参与者多"}],"background":"林杰写七夕乞巧风俗，借牛郎织女传说引出人间穿针乞巧的场景。","reading":[{"quote":"牵牛织女渡河桥","title":"星空中的故事先开场","text":"诗以传说把遥远星辰变得可亲，再让目光转回家家户户，天地在节日中相接。"},{"quote":"穿尽红丝几万条","title":"用一抹颜色写共同心愿","text":"不逐户描写，只将无数红丝集中到一句里，热闹气氛与祈愿之心便一同呈现。"}],"thought":"节日让日常生活与共同想象相遇。诗保存的是人们仰望星空时，对灵巧和美好生活的期待。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_e152d043be94.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9E%97%E6%9D%B0","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"qingming","reason":"循节日读日常：风俗相近，人的心境却可能十分不同。"},{"id":"yuanri","reason":"循节日读日常：风俗相近，人的心境却可能十分不同。"}],"extra":{}},{"id":"lunyushierzhang","title":"《论语》十二章","author":"lunyu","form":"古文·语录","stage":["初中"],"scene":"mountain","tags":["reflection","resolve","friendship","learning","contrast"],"lines":["子曰：“学而时习之，不亦说乎？","有朋自远方来，不亦乐乎？","人不知而不愠，不亦君子乎？”","《学而》","曾子曰：“吾日三省吾身：为人谋而不忠乎？","与朋友交而不信乎？","传不习乎？”","《学而》","子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”","《为政》","子曰：“温故而知新，可以为师矣。”","《为政》","子曰：“学而不思则罔，思而不学则殆。”","《为政》","子曰：“贤哉，回也！","一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。","贤哉，回也！”","《雍也》","子曰：“知之者不如好之者，好之者不如乐之者。”","《雍也》","子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。","不义而富且贵，于我如浮云。”","《述而》","子曰：“三人行，必有我师焉。","择其善者而从之，其不善者而改之。”","《述而》","子在川上曰：“逝者如斯夫，不舍昼夜。”","《子罕》","子曰：“三军可夺帅也，匹夫不可夺志也。”","《子罕》","子夏曰：“博学而笃志，切问而近思，仁在其中矣。”","《子张》"],"quote":[12],"preface":"","intro":"读几句旧日谈话，想想我们怎样与自己和别人相处。","notes":[{"q":"说","text":"同“悦”，喜悦"},{"q":"愠","text":"恼怒"},{"q":"三省","text":"多次反省，省读xǐng"},{"q":"罔","text":"迷惑"},{"q":"殆","text":"疑惑、困惑"},{"q":"笃志","text":"坚定志向"},{"q":"逾矩","text":"超越规矩"}],"background":"本篇从《论语》选取十二章，涉及学习、交友、志向与自省。各章原分属不同篇，合选次序不等于一次完整对话。","reading":[{"quote":"学而不思则罔","title":"两种努力互相照亮","text":"学习与思考分别可能走入困境，对举句式强调二者配合，提醒人既吸收经验又保留自己的追问。"},{"quote":"人不知而不愠","title":"与外界评价保持一点距离","text":"别人不理解自己时仍不怨怒，重心在修养自身，而不是立刻争取认同；这与章中交友之乐并不冲突。"}],"thought":"这些短章并非一套机械口号，而是关于求知、关系与自我成长的持续谈话。可以带着自己的经历，与每句话重新相遇。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_d6640103678f.aspx","选章为《学而》《为政》《雍也》《述而》《子罕》《子张》中的十二则，与其他同名“十二章”选本区分。章末篇名按对照页保留。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jiezishu","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"},{"id":"zhanggexing","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"}],"extra":{}},{"id":"jiezishu","title":"诫子书","author":"zhugeliang","form":"古文·书","stage":["初中"],"scene":"mountain","tags":["family","reflection","resolve","learning","contrast"],"lines":["夫君子之行，静以修身，俭以养德。","非淡泊无以明志，非宁静无以致远。","夫学须静也，才须学也，非学无以广才，非志无以成学。","淫慢则不能励精，险躁则不能治性。","年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！"],"quote":[0],"preface":"","intro":"安静下来，并不是停住，而是找到想去的方向。","notes":[{"q":"淡泊","text":"不沉溺于名利"},{"q":"致远","text":"达到长远目标"},{"q":"淫慢","text":"过度懈怠"},{"q":"险躁","text":"浮躁轻率"},{"q":"接世","text":"与社会相接、有所作为"}],"background":"传为诸葛亮写给儿子的家书，收入相关文集。文章把修身、学习、立志与惜时连在一起，以家人的关切劝勉后辈。","reading":[{"quote":"静以修身，俭以养德","title":"从日常习惯谈起","text":"“静”“俭”不是空洞赞语，而分别联系修养与品德，后文再将它们展开为学习和志向。"},{"quote":"年与时驰","title":"把抽象时间写成疾行","text":"“驰”“去”赋予岁月和意志以动作，收尾语气转急，显出父辈担心光阴虚度的心情。"}],"thought":"文章珍惜专注与内在方向，也包含亲人对成长的忧念。宁静不是排斥生活，而是为选择留出清醒的空间。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_c0509bfa84a1.aspx","对照页所列异文或通假：淡泊 一作：澹泊；淫慢 一作：慆慢；治性 一作：冶性。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%AF%B8%E8%91%9B%E4%BA%AE","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"quanxue","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"},{"id":"lunyushierzhang","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"}],"extra":{}},{"id":"lang","title":"狼·其二","author":"pusongling","form":"古文·笔记小说","stage":["初中"],"scene":"mountain","tags":["animal","narrative","contrast","action"],"lines":["一屠晚归，担中肉尽，止有剩骨。","途中两狼，缀行甚远。","屠惧，投以骨。","一狼得骨止，一狼仍从。","复投之，后狼止而前狼又至。","骨已尽矣，而两狼之并驱如故。","屠大窘，恐前后受其敌。","顾野有麦场，场主积薪其中，苫蔽成丘。","屠乃奔倚其下，弛担持刀。","狼不敢前，眈眈相向。","少时，一狼径去，其一犬坐于前。","久之，目似瞑，意暇甚。","屠暴起，以刀劈狼首，又数刀毙之。","方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。","身已半入，止露尻尾。","屠自后断其股，亦毙之。","乃悟前狼假寐，盖以诱敌。","狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？","止增笑耳。"],"quote":[5],"preface":"","intro":"盯住眼前那只狼，还要留意身后的动静。","notes":[{"q":"缀行","text":"紧跟着走"},{"q":"并驱","text":"一起追赶"},{"q":"苫蔽","text":"覆盖遮蔽"},{"q":"犬坐","text":"像狗一样蹲坐"},{"q":"洞其中","text":"在柴堆中打洞"},{"q":"黠","text":"狡猾"}],"background":"选自蒲松龄《聊斋志异·狼三则》第二则，以屠户与两狼周旋的小故事，写危险中的观察与应变。","reading":[{"quote":"骨已尽矣","title":"退让到尽头，行动才转折","text":"投骨暂时改变狼的先后，却没有解除追逐。重复情节使压力逐步上升，也推动屠户寻找依靠。"},{"quote":"乃悟前狼假寐","title":"后来发现改写此前所见","text":"另一只狼的行动揭开假寐之谜，读者随屠户回头理解先前场景，悬念在结尾得到回收。"}],"thought":"故事赞赏人在困境中的清醒与果断。寓意来自叙事中的较量，不宜把动物行为直接当作自然知识。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_1eeb1373f910.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%92%B2%E6%9D%BE%E9%BE%84","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"hezhouji","reason":"留意叙事中的观察：转身、细看和追问怎样改变对事情的判断。"},{"id":"zoujifengqiwangnajian","reason":"留意叙事中的观察：转身、细看和追问怎样改变对事情的判断。"}],"extra":{}},{"id":"guancanghai","title":"观沧海","author":"caocao","form":"四言乐府诗","stage":["初中"],"scene":"water","tags":["water","wind","autumn","space","imagination","boldstyle","geo_jieshi"],"lines":["东临碣石，","以观沧海。","水何澹澹，","山岛竦峙。","树木丛生，","百草丰茂。","秋风萧瑟，","洪波涌起。","日月之行，","若出其中；","星汉灿烂，","若出其里。","幸甚至哉，","歌以咏志。"],"quote":[6,7],"preface":"","intro":"站在海边，看天地怎样在心中展开。","notes":[{"q":"碣石","text":"古山名，具体位置历来有讨论"},{"q":"澹澹","text":"水波荡漾貌"},{"q":"竦峙","text":"高高耸立"},{"q":"星汉","text":"银河"}],"background":"曹操《步出夏门行》组诗的首章，通常联系建安十二年北征乌桓归途。末二句是乐府歌辞常用的配乐套语。","reading":[{"quote":"秋风萧瑟，洪波涌起","title":"静物之间突然起浪","text":"山岛草木先勾勒海边实景，风与波再使画面运动，视野由岸边推向广阔海面。"},{"quote":"若出其中","title":"从所见走向胸中天地","text":"两个“若”标明想象：日月星河仿佛出入大海。海的容量也写出了观海者的开阔胸襟。"}],"thought":"自然的壮阔激发人的想象与抱负。诗中的大海既是眼前风景，也是心灵能够容纳的宽广世界。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_630c04c81858.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9B%B9%E6%93%8D","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"tongguan","reason":"同样面对辽阔天地，比较民歌的亲切、观海的雄心与山河的奔放。"},{"id":"chileige","reason":"同样面对辽阔天地，比较民歌的亲切、观海的雄心与山河的奔放。"}],"extra":{"places":"碣石｜登临观海的地点，通行注释多联系今河北秦皇岛昌黎碣石山；历史地望还有其他讨论。诗中海天吞吐日月的画面也包含想象，不能按现代旅游景区边界理解全诗。"}},{"id":"wenwangchanglingzuoqianlongbiaoyaoyouciji","title":"闻王昌龄左迁龙标遥有此寄","author":"libai","form":"七言绝句","stage":["初中"],"scene":"moon","tags":["moon","willow","friendship","sadness","personification","geo_longbiao"],"lines":["杨花落尽子规啼，","闻道龙标过五溪。","我寄愁心与明月，","随君直到夜郎西。"],"quote":[0,1],"preface":"","intro":"无法同行，就请月光替我再送一程。","notes":[{"q":"左迁","text":"贬官"},{"q":"龙标","text":"唐县名，今湖南黔阳一带，此处也借指王昌龄"},{"q":"杨花","text":"柳絮"},{"q":"子规","text":"杜鹃"},{"q":"五溪","text":"湘西一带水系的泛称"}],"background":"李白闻友人王昌龄被贬龙标后作。诗以遥寄形式表达牵挂，具体作年存在不同考订。","reading":[{"quote":"杨花落尽子规啼","title":"消息到来时的季节","text":"飘零柳絮与杜鹃啼声给贬谪消息染上凄清色彩，景物与友人的处境互相映照。"},{"quote":"我寄愁心与明月","title":"让无形牵挂获得路途","text":"“寄”“随”把月亮写成信使，朋友走多远，想象中的关心就跟到多远。"}],"thought":"友情不因相隔遥远而失效。诗以浪漫方式表达朴素愿望：愿受挫的人知道，仍有人惦念着他。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_62280919c9c5.aspx","对照页所列异文或通假：随君 一作：随风。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"emeishanyuege","reason":"沿着月光读下去，看同一意象怎样容纳童心、乡思与祝愿。"},{"id":"pochuanguazhou","reason":"沿着月光读下去，看同一意象怎样容纳童心、乡思与祝愿。"}],"extra":{"places":"龙标｜王昌龄被贬赴任之地，通常对应今湖南怀化洪江黔阳一带。\n\n五溪、夜郎西｜五溪泛指湘西一带的溪流与区域；“夜郎”所指古县、地域及诗中方位有不同解释，不宜直接等同贵州某处。它们写出友人行路之远，不是作者亲历的旅行记录。"}},{"id":"cibeigushanxia","title":"次北固山下","author":"wangwan","form":"五言律诗","stage":["初中"],"scene":"water","tags":["water","wind","spring","travel","homesick","contrast","geo_zhenjiang","geo_luoyang"],"lines":["客路青山外，","行舟绿水前。","潮平两岸阔，","风正一帆悬。","海日生残夜，","江春入旧年。","乡书何处达，","归雁洛阳边。"],"quote":[2,3],"preface":"","intro":"旧年还没有走完，江上的春天已经来了。","notes":[{"q":"次","text":"停宿、停泊"},{"q":"客路","text":"旅途"},{"q":"风正","text":"风顺而不猛烈"},{"q":"残夜","text":"将尽的夜"},{"q":"乡书","text":"寄往家乡的书信"}],"background":"王湾舟行长江一带之作，北固山在今江苏镇江。诗写停泊途中所见，也写旅人的乡思。","reading":[{"quote":"潮平两岸阔","title":"江面因涨潮而舒展","text":"“平”“阔”“悬”将水面、两岸和风帆组织成开朗平稳的画面，为后来的时间感铺底。"},{"quote":"海日生残夜","title":"新旧在同一刻交接","text":"日从未尽的夜里升起，春进入尚未结束的旧年。对偶中有动态，让人在变化里感到生机。"}],"thought":"旅途既有眼前的开阔，也有回望故乡的牵挂。向前流动的季节与向后牵引的乡情共同存在。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_720b46d38537.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E6%B9%BE","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"fengrujingshi","reason":"同在远行途中，比较江上乡书、马上口信与雪中送别如何表达牵挂。"},{"id":"baixuegesongwupanguanguijing","reason":"同在远行途中，比较江上乡书、马上口信与雪中送别如何表达牵挂。"}],"extra":{"places":"北固山｜题中的行旅地点，在今江苏镇江，临长江。\n\n洛阳｜家书要寄往的故乡，今河南洛阳。眼前江南早春与远方故乡，通过“归雁”连在一起。"}},{"id":"emeishanyuege","title":"峨眉山月歌","author":"libai","form":"七言绝句","stage":["初中"],"scene":"moon","tags":["moon","water","mountain","travel","homesick","autumn","geo_emei","geo_qingyi","geo_qianwei","geo_threegorges","geo_chongqing_city"],"lines":["峨眉山月半轮秋，","影入平羌江水流。","夜发清溪向三峡，","思君不见下渝州。"],"quote":[1,2],"preface":"","intro":"沿着江水出发，让故乡的月亮同行。","notes":[{"q":"半轮","text":"半圆的月"},{"q":"平羌","text":"平羌江，即今青衣江"},{"q":"发","text":"出发"},{"q":"下","text":"顺流而下"},{"q":"君","text":"所思之人，具体指代有不同解读"}],"background":"通常认为写于李白青年离蜀远游时。诗连续点出峨眉、平羌、清溪、三峡、渝州，组成一条富于动感的行旅路线。","reading":[{"quote":"影入平羌江水流","title":"月影也在旅行","text":"月本在天，倒影却随江水进入诗人的行程。水的流动使静态月色具有陪伴感。"},{"quote":"思君不见下渝州","title":"地名之间穿过一条情线","text":"密集地名并未成为地图清单，因为“思君”将沿途风景串成怀人的过程。"}],"thought":"远行带来新景，也使熟悉的人与地方更加珍贵。诗借月影保存出发时尚未远去的依恋。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_f13ab2fe8afd.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shuidiaogetou","reason":"沿着月光读下去，看同一意象怎样容纳童心、乡思与祝愿。"},{"id":"wenwangchanglingzuoqianlongbiaoyaoyouciji","reason":"沿着月光读下去，看同一意象怎样容纳童心、乡思与祝愿。"}],"extra":{"places":"峨眉山、平羌江｜峨眉山在今四川乐山；平羌江通常指今青衣江。山月的影子随江水进入旅途。\n\n清溪、三峡、渝州｜清溪通常指今四川犍为清溪一带，三峡跨今重庆与湖北，渝州约当今重庆主城一带。诗以少量地名压缩行程，不能按文字先后机械拼成逐站路线。"}},{"id":"jiangnanfengliguinian","title":"江南逢李龟年","author":"dufu","form":"七言绝句","stage":["初中"],"scene":"flower","tags":["friendship","history","flower","sadness","contrast","geo_jiangnan","geo_changsha","geo_xian"],"lines":["岐王宅里寻常见，","崔九堂前几度闻。","正是江南好风景，","落花时节又逢君。"],"quote":[0,1],"preface":"","intro":"再次相见时，熟悉的歌声已隔着漫长岁月。","notes":[{"q":"岐王","text":"唐玄宗之弟李范"},{"q":"崔九","text":"一般指崔涤"},{"q":"寻常","text":"经常"},{"q":"几度","text":"多次"},{"q":"落花时节","text":"暮春，也引发衰落与飘零的联想"}],"background":"杜甫晚年流寓江南，与乐人李龟年重逢。诗回忆开元时期王公宅第中的相见，今昔之间横隔战乱与流离。","reading":[{"quote":"岐王宅里寻常见","title":"盛时只以两个地点写出","text":"不铺陈昔日繁华，宅第与堂前已经提示当年的生活世界，“寻常”更显往昔从容。"},{"quote":"落花时节又逢君","title":"重逢的喜悦带着岁月阴影","text":"“又”连接旧日与今日，落花既是眼前季节，也让人与时代的飘零进入画面。"}],"thought":"旧友相逢可以承载一整个时代的记忆。诗不明说痛楚，却让回忆与现实之间的落差自然发声。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_514b8bc0ee4f.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"tiposhansihouchanyuan","reason":"从重逢、清游与款待读人与环境的关系，热闹和安静各有情味。"},{"id":"kezhi","reason":"从重逢、清游与款待读人与环境的关系，热闹和安静各有情味。"}],"extra":{"places":"江南、潭州｜通常系于杜甫晚年在潭州（今湖南长沙）重逢李龟年的背景。这里的“江南”是广义地域称呼。\n\n岐王宅、崔九堂｜对长安（今陕西西安）旧日宴游的回忆；昔日都城与当下漂泊构成时间、空间的对照。"}},{"id":"xingjunjiurisichanganguyuan","title":"行军九日思长安故园","author":"cencan","form":"五言绝句","stage":["初中"],"scene":"flower","tags":["flower","festival","homesick","war","sadness","imagination","frontier_school","geo_xian"],"lines":["强欲登高去，","无人送酒来。","遥怜故园菊，","应傍战场开。"],"quote":[1,2],"preface":"","intro":"想到故园的菊花，才更觉得战乱遥远又切近。","notes":[{"q":"九日","text":"农历九月初九重阳节"},{"q":"强欲","text":"勉强想要，强读qiǎng"},{"q":"送酒","text":"暗用陶渊明重阳得酒的故事"},{"q":"遥怜","text":"在远方怜惜"}],"background":"作于安史之乱期间行军途中，长安一度陷于战乱。诗借重阳登高与菊酒习俗，表达对故园的牵挂。","reading":[{"quote":"无人送酒来","title":"借旧故事写眼前冷清","text":"重阳本可登高饮酒，典故里的馈赠却没有到来，行军中的孤单便显出来。"},{"quote":"应傍战场开","title":"想象中的花突然变沉重","text":"“应”表推想。菊花仍开，但旁边已是战场，个人思乡与对战乱的忧虑相接。"}],"thought":"故乡的花不仅唤起思念，也让人想到生活如何被战争改变。诗的关切由一朵菊花伸向失去安宁的人间。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_1a98a1d6bae1.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%B2%91%E5%8F%82","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"mulanshi","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"},{"id":"caiwei","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"}],"extra":{"places":"长安 → 西安｜题中与“故园”共同指向的地方，属于战乱中的怀想。诗人并非已回到园中，“应傍战场开”是对故园菊花处境的设想。"}},{"id":"yeshangshouxiangchengwendi","title":"夜上受降城闻笛","author":"liyi","form":"七言绝句","stage":["初中"],"scene":"moon","tags":["moon","sound","frontier","homesick","night","metaphor","frontier_school","geo_shouxiang"],"lines":["回乐烽前沙似雪，","受降城外月如霜。","不知何处吹芦管，","一夜征人尽望乡。"],"quote":[1,2],"preface":"","intro":"一声笛响，把整座边城带回各自的故乡。","notes":[{"q":"芦管","text":"芦制管乐器"},{"q":"征人","text":"戍边军士"},{"q":"尽","text":"全都"},{"q":"沙似雪","text":"比喻沙地在月光下明亮清冷，不是实写降雪"}],"background":"李益写边塞夜闻笛声。受降城与回乐地望存在考订差异，阅读重点是月下沙地与征人的共同乡思。","reading":[{"quote":"受降城外月如霜","title":"用颜色与触感写月夜","text":"雪与霜的比喻让沙地和月光连成清冷空间，为笛声引起的思念准备气氛。"},{"quote":"一夜征人尽望乡","title":"由无名声音抵达共同感受","text":"笛声来自何处并不重要，末句把个体听觉扩展为众多军士的牵挂。"}],"thought":"诗让边地军旅中的人保有柔软的内心。无论身处何处，对家的思念都是可以互相理解的感受。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_d89eb1125b6d.aspx","对照页所列异文或通假：回乐烽 一作：回乐峰。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%9B%8A","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yujiaao","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"},{"id":"saixiaqu","reason":"同在边塞，既听见壮声，也听见普通征人的乡思。"}],"extra":{"places":"受降城、回乐烽｜诗中的边城与烽燧。回乐烽常联系今宁夏灵武一带，也有“回乐峰”异文；受降城有灵武说与唐代受降城等不同考订。这里保留历史边地线索，不强定同一城址。"}},{"id":"qiuci","title":"秋词·其一","author":"liuyuxi","form":"七言绝句","stage":["初中"],"scene":"mountain","tags":["autumn","cloud","animal","hope","contrast"],"lines":["自古逢秋悲寂寥，","我言秋日胜春朝。","晴空一鹤排云上，","便引诗情到碧霄。"],"quote":[1,2],"preface":"","intro":"秋天也可以向上飞，飞得比春天更明亮。","notes":[{"q":"寂寥","text":"冷落萧条"},{"q":"春朝","text":"春天"},{"q":"排云","text":"冲开云层"},{"q":"碧霄","text":"青天"}],"background":"刘禹锡《秋词》二首中的第一首，通常系于贬居朗州时期。诗有意回应文学中常见的悲秋传统。","reading":[{"quote":"我言秋日胜春朝","title":"先把自己的声音说出来","text":"“自古”对“我言”，形成传统感受与个人判断的相遇，诗人不必随众人一同悲秋。"},{"quote":"晴空一鹤排云上","title":"让主张变成可见的力量","text":"一鹤向上冲开云层，随后诗情也被引向高空，情绪与动作同向提升。"}],"thought":"外在季节并不决定内心的全部颜色。诗珍惜主动观看、重新感受世界的能力。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4995f2f0581b.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%88%98%E7%A6%B9%E9%94%A1","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chouletianyangzhouchufengxishangjianzeng","reason":"一起读受挫之后的舒展：轻舟、飞鹤与新生草木各有回应。"},{"id":"zaofabaidicheng","reason":"一起读受挫之后的舒展：轻舟、飞鹤与新生草木各有回应。"}],"extra":{}},{"id":"yeyujibei","title":"夜雨寄北","author":"lishangyin","form":"七言绝句","stage":["初中"],"scene":"rain","tags":["rain","night","homesick","love","imagination","autumn","geo_bashu"],"lines":["君问归期未有期，","巴山夜雨涨秋池。","何当共剪西窗烛，","却话巴山夜雨时。"],"quote":[0,1],"preface":"","intro":"把今夜的雨，留到重逢时慢慢说。","notes":[{"q":"未有期","text":"尚无确定日期"},{"q":"何当","text":"什么时候能够"},{"q":"共剪西窗烛","text":"想象重聚长谈、修剪烛芯的情景"},{"q":"却话","text":"回过头来谈说"}],"background":"写羁留巴蜀时对北方亲近之人的思念。题名有《夜雨寄内》，收信对象与确切作年有争议，不将“君”固定为唯一人选。","reading":[{"quote":"君问归期未有期","title":"回答里藏着无奈","text":"两个“期”紧邻，问与答几乎重叠，读者能听到想回应却无法许诺的迟疑。"},{"quote":"却话巴山夜雨时","title":"把现在想成未来的回忆","text":"诗先跳到重聚的将来，再从将来回望今夜；同一场雨在想象中由孤单变得温暖。"}],"thought":"思念不只凝望距离，也会为未来安排一次相见。想象中的谈话，成为当下漫长雨夜的慰藉。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_e46c43d13b97.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E5%95%86%E9%9A%90","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"yueke","reason":"同一场雨可以是欣喜、骤变、怀念或等待，看看人的处境怎样进入景色。"},{"id":"yinhu","reason":"同一场雨可以是欣喜、骤变、怀念或等待，看看人的处境怎样进入景色。"}],"extra":{"places":"巴山｜正文中的夜雨之地，通常理解为巴蜀一带山地；具体写作地点与编年尚有讨论。诗中的“北”和“西窗”也不提供足够信息来确定收信者的现代地址。"}},{"id":"shiyiyuesirifengyudazuo","title":"十一月四日风雨大作·其二","author":"luyou","form":"七言绝句","stage":["初中"],"scene":"rain","tags":["rain","wind","war","patriotism","night","imagination","geo_shaoxing","geo_luntai"],"lines":["僵卧孤村不自哀，","尚思为国戍轮台。","夜阑卧听风吹雨，","铁马冰河入梦来。"],"quote":[0,1],"preface":"","intro":"窗外的风雨，走进梦里成了铁马冰河。","notes":[{"q":"僵卧","text":"卧病不起、身体僵困"},{"q":"戍","text":"守卫边疆"},{"q":"轮台","text":"借指边关，并非实写此时驻守地点"},{"q":"夜阑","text":"夜深"},{"q":"铁马","text":"披甲的战马"}],"background":"陆游退居山阴时作，此为两首组诗的第二首。年老多病的现实与仍愿守边的心志形成张力。","reading":[{"quote":"僵卧孤村不自哀","title":"先承认处境，再写心志","text":"“僵卧”“孤村”写出衰病与寂寞，“不自哀”把情绪转向仍未熄灭的愿望。"},{"quote":"铁马冰河入梦来","title":"声音把现实接入梦境","text":"风雨声成为战马与冰河的想象入口，白日不能实现的志愿在梦中获得奔赴。"}],"thought":"生命处境会改变，深藏的愿望却可能继续燃烧。诗写身体衰弱与心志强烈之间的动人反差。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_beab5faf1894.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%99%86%E6%B8%B8","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zuoqianzhilanguanshizhisunxiang","reason":"把历史、风雨与个人处境相联，比较坚持中的昂扬和沉痛。"},{"id":"qiuyejiangxiaochulimenyingliangyougan","reason":"把历史、风雨与个人处境相联，比较坚持中的昂扬和沉痛。"}],"extra":{"places":"山阴 → 绍兴｜陆游闲居时的创作背景。\n\n轮台｜“尚思为国戍轮台”借汉唐西域边塞表达守边志愿，并非陆游实际赴新疆驻守的记录。古代轮台有不同所指，这里按边塞用典理解，不等同一个确定的现代县址。"}},{"id":"tongguan","title":"潼关","author":"tansitong","form":"七言绝句","stage":["初中"],"scene":"water","tags":["mountain","water","wind","resolve","boldstyle","personification","geo_tongguan","geo_yellowriver"],"lines":["终古高云簇此城，","秋风吹散马蹄声。","河流大野犹嫌束，","山入潼关不解平。"],"quote":[1,2],"preface":"","intro":"连奔流的大河，也嫌天地还不够宽。","notes":[{"q":"终古","text":"自古以来"},{"q":"簇","text":"围聚"},{"q":"大野","text":"广阔原野"},{"q":"束","text":"拘束"},{"q":"不解平","text":"不愿或不懂得平缓下来，拟人说法"}],"background":"谭嗣同青年过潼关时所作。诗写关中山河的雄奇，常被读作其开拓精神与不愿受拘束的自我投射。","reading":[{"quote":"秋风吹散马蹄声","title":"旅人的速度进入关城","text":"高云与古城先造成凝重背景，马蹄声被秋风吹散，使静景带上行进的力量。"},{"quote":"河流大野犹嫌束","title":"把心气交给山河","text":"河“嫌束”、山“不解平”，自然被赋予不肯受限的性格，地貌描写因此转成精神表达。"}],"thought":"诗中的壮阔不仅来自高山大河，也来自看待它们的人。向往自由舒展的心，使风景充满力量。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_2093a1259999.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%B0%AD%E5%97%A3%E5%90%8C","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"chileige","reason":"同样面对辽阔天地，比较民歌的亲切、观海的雄心与山河的奔放。"},{"id":"guancanghai","reason":"同样面对辽阔天地，比较民歌的亲切、观海的雄心与山河的奔放。"}],"extra":{"places":"潼关｜今陕西渭南潼关，地处黄河与秦岭之间的关隘。诗中河流、群山的运动感与这处山河交会的地势相应。"}},{"id":"mulanshi","title":"木兰诗","author":"beichaominge","form":"乐府民歌","stage":["初中"],"scene":"mountain","tags":["family","war","resolve","narrative","repetition","contrast","geo_yellowriver","geo_yanshan"],"lines":["唧唧复唧唧，","木兰当户织。","不闻机杼声，","唯闻女叹息。","问女何所思，","问女何所忆。","女亦无所思，","女亦无所忆。","昨夜见军帖，","可汗大点兵，","军书十二卷，","卷卷有爷名。","阿爷无大儿，","木兰无长兄，","愿为市鞍马，","从此替爷征。","东市买骏马，","西市买鞍鞯，","南市买辔头，","北市买长鞭。","旦辞爷娘去，","暮宿黄河边，","不闻爷娘唤女声，","但闻黄河流水鸣溅溅。","旦辞黄河去，","暮至黑山头，","不闻爷娘唤女声，","但闻燕山胡骑鸣啾啾。","万里赴戎机，","关山度若飞。","朔气传金柝，","寒光照铁衣。","将军百战死，","壮士十年归。","归来见天子，","天子坐明堂。","策勋十二转，","赏赐百千强。","可汗问所欲，","木兰不用尚书郎，","愿驰千里足，","送儿还故乡。","爷娘闻女来，","出郭相扶将；","阿姊闻妹来，","当户理红妆；","小弟闻姊来，","磨刀霍霍向猪羊。","开我东阁门，","坐我西阁床。","脱我战时袍，","著我旧时裳。","当窗理云鬓，","对镜帖花黄。","出门看火伴，","火伴皆惊忙：同行十二年，","不知木兰是女郎。","雄兔脚扑朔，","雌兔眼迷离；","双兔傍地走，","安能辨我是雄雌？"],"quote":[16,17],"preface":"","intro":"从织机旁出发，穿过战争，再回到自己的生活。","notes":[{"q":"机杼","text":"织布机"},{"q":"市","text":"买"},{"q":"鞍鞯","text":"马鞍及其下的垫子"},{"q":"朔气","text":"北方寒气"},{"q":"金柝","text":"军中夜间敲击报更的器具"},{"q":"策勋","text":"记功"},{"q":"帖花黄","text":"贴上额饰"},{"q":"扑朔","text":"动弹的样子"}],"background":"北朝乐府民歌，后收入《乐府诗集》。木兰代父从军的故事经长期传唱流传，历史人物原型与具体年代不能据诗确定。","reading":[{"quote":"东市买骏马","title":"反复铺陈出发前的忙碌","text":"四方市场并非要求木兰逐处实走，排比互文集中呈现准备军需的紧迫，节奏也像匆忙的脚步。"},{"quote":"将军百战死，壮士十年归","title":"漫长战争被压进一句","text":"互文写将士共同经历死生战斗，随后归家细节却铺得很开，篇幅取舍突出对和平日常的珍惜。"}],"thought":"木兰的勇气来自对家人的担当，也包含选择自己生活的愿望。结尾兔喻以机智口吻打破旁人对性别与能力的简单判断。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_2d6b0c83a500.aspx","对照页所列异文或通假：唯 一作：惟。正文与旁注分开呈现，异文不混入原文。","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shiwucongjunzheng","reason":"同读古代征役歌辞，比较共同出发的昂扬与归家后的不同遭际。"},{"id":"wuyi","reason":"同读古代征役歌辞，比较共同出发的昂扬与归家后的不同遭际。"},{"id":"shihaoli","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"},{"id":"xingjunjiurisichanganguyuan","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"}],"extra":{"places":"黄河｜木兰行军叙述中的渡越与夜宿之地，是现实河流。\n\n黑山、燕山｜民歌中的边塞地名，具体地望有不同解释，也带有叙事中的概括性。故事经历长期传唱，不宜据这些名字绘制一条已确定的历史行军路线。"}},{"id":"chunyeluochengwendi","title":"春夜洛城闻笛","author":"libai","form":"七言绝句","stage":["初中"],"scene":"mountain","tags":["sound","wind","spring","homesick","night","geo_luoyang"],"lines":["谁家玉笛暗飞声，","散入春风满洛城。","此夜曲中闻折柳，","何人不起故园情。"],"quote":[1,2],"preface":"","intro":"一支看不见的笛子，让整座城想起故园。","notes":[{"q":"洛城","text":"洛阳"},{"q":"暗飞声","text":"笛声不知从何处传来"},{"q":"折柳","text":"指《折杨柳》曲，也关联送别习俗"},{"q":"故园","text":"故乡"}],"background":"李白旅居洛阳时闻笛而作。古曲《折杨柳》常与送别相连，诗借曲名唤起旅人的乡思。","reading":[{"quote":"散入春风满洛城","title":"声音有了空间","text":"“飞”“散”“满”把无形笛声写成遍布城市的流动，听者虽在一处，感受却扩向远方。"},{"quote":"何人不起故园情","title":"从我想到所有听见的人","text":"反问不求逐一回答，而将个人乡愁写成可以共有的经验，诗情因此格外亲近。"}],"thought":"音乐能越过眼前街巷，触到心里熟悉的地方。一次偶然聆听，便可能让漂泊的人彼此相认。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_be1894114330.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shangshanzaoxing","reason":"循着夜里的钟声、笛声与清晨铃声，看旅途怎样触动故园之思。"},{"id":"fengqiaoyepo","reason":"循着夜里的钟声、笛声与清晨铃声，看旅途怎样触动故园之思。"}],"extra":{"places":"洛城 → 洛阳｜今河南洛阳，题目点明听笛的城市。“满洛城”把一处笛声扩展到全城，也把个人乡愁写成许多旅人的共同感受。"}},{"id":"fengrujingshi","title":"逢入京使","author":"cencan","form":"七言绝句","stage":["初中"],"scene":"mountain","tags":["travel","homesick","family","friendship","action","frontier_school","geo_xian"],"lines":["故园东望路漫漫，","双袖龙钟泪不干。","马上相逢无纸笔，","凭君传语报平安。"],"quote":[1,2],"preface":"","intro":"来不及写信，就托你带一句平安。","notes":[{"q":"入京使","text":"返回京城的使者"},{"q":"故园","text":"长安家园"},{"q":"龙钟","text":"这里形容泪流纵横的样子"},{"q":"凭","text":"请、托"}],"background":"岑参赴西域途中遇到返回京城的使者，写下托人传信的情景。诗抓住旅途中短促而真切的相逢。","reading":[{"quote":"双袖龙钟泪不干","title":"不修饰的思念","text":"诗直接写湿透双袖的泪，情感没有被英雄式行旅遮住，远行者也有对家的柔软牵挂。"},{"quote":"凭君传语报平安","title":"一句家常话收住千言万语","text":"无纸笔是路途中的实际限制，托语则迅速作出回应。越简短的叮嘱，越能见出深情。"}],"thought":"远行的勇气与思家并不矛盾。诗珍惜人与人偶然相遇时，能够为彼此传递的那一点安心。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_10d21c96ba71.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%B2%91%E5%8F%82","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"baixuegesongwupanguanguijing","reason":"同在远行途中，比较江上乡书、马上口信与雪中送别如何表达牵挂。"},{"id":"cibeigushanxia","reason":"同在远行途中，比较江上乡书、马上口信与雪中送别如何表达牵挂。"}],"extra":{"places":"京 → 长安｜入京使者前往的唐都，今陕西西安。诗人西行途中遇到东归使者，借他报平安；相逢的确切位置未由诗句交代。"}},{"id":"ailianshuo","title":"爱莲说","author":"zhoudunyi","form":"古文·说","stage":["初中"],"scene":"water","tags":["flower","water","resolve","object","aspiration","contrast"],"lines":["水陆草木之花，可爱者甚蕃。","晋陶渊明独爱菊。","自李唐来，世人甚爱牡丹。","予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。","予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。","噫！","菊之爱，陶后鲜有闻。","莲之爱，同予者何人？","牡丹之爱，宜乎众矣。"],"quote":[3],"preface":"","intro":"欣赏一朵莲，也是在选择与世界相处的方式。","notes":[{"q":"蕃","text":"多"},{"q":"濯","text":"洗涤"},{"q":"清涟","text":"清水"},{"q":"妖","text":"过分艳丽"},{"q":"亭亭净植","text":"洁净挺立"},{"q":"亵玩","text":"轻慢地玩弄"},{"q":"鲜","text":"少，读xiǎn"}],"background":"周敦颐借菊、牡丹与莲谈人格理想，文章属于“说”体。常有具体建池作记的传说，本文不据此确定作年。","reading":[{"quote":"出淤泥而不染","title":"环境与自身的关系","text":"莲生于淤泥却洁净，先呈现可感的植物特征，再赋予品格意味，托物言志有了具体依托。"},{"quote":"同予者何人","title":"选择之后仍有孤独","text":"以三种花对应三种人生取向，结尾反问使自许中带出少有同道的感叹，不只是单向赞美。"}],"thought":"文章珍重清正、通达与自守。莲的形态成为思考人格的语言，而花的美不必因此被固定为唯一价值排序。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_6d2dcbe80f96.aspx","对照页所列异文或通假：甚爱 一作：盛爱。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%91%A8%E6%95%A6%E9%A2%90","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"momei","reason":"同读托物言志，看看梅、石灰、竹与莲怎样成为品格的语言。"},{"id":"zhushi","reason":"同读托物言志，看看梅、石灰、竹与莲怎样成为品格的语言。"}],"extra":{}},{"id":"dengyouzhoutaige","title":"登幽州台歌","author":"chenziang","form":"五言绝句","stage":["初中"],"scene":"mountain","tags":["solitude","sadness","history","space","timepassing","geo_beijing_city"],"lines":["前不见古人，","后不见来者。","念天地之悠悠，","独怆然而涕下！"],"quote":[0,1],"preface":"","intro":"天地那么辽阔，为什么此刻仍觉得无人相知。","notes":[{"q":"古人","text":"过去可相知或能礼贤的人"},{"q":"来者","text":"未来的知音或贤者"},{"q":"悠悠","text":"辽远无尽"},{"q":"怆然","text":"悲伤貌"},{"q":"涕","text":"眼泪"}],"background":"陈子昂随军到幽州一带期间所作，常与其政治抱负受挫相联系。登台怀古的场景使个人孤独获得历史纵深。","reading":[{"quote":"前不见古人","title":"先把时间展开","text":"前与后指向过去未来，两次“不见”使孤独不只属于当下的人群，也延伸到历史两端。"},{"quote":"念天地之悠悠","title":"辽阔反衬一个人的处境","text":"天地的无穷与“独”的有限相照，最后的落泪因此不是细碎感伤，而含有强烈存在感。"}],"thought":"人渴望自己的心志被理解。诗将一人的失落写入时间与天地，也给后来同样孤独的读者留下共鸣。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4083a01ac833.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%99%88%E5%AD%90%E6%98%82","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"changshaguojiayizhai","reason":"同写抱负与处境的距离，比较期待任用、怀古与梦中驰骋。"},{"id":"mashi","reason":"同写抱负与处境的距离，比较期待任用、怀古与梦中驰骋。"}],"extra":{"places":"幽州台｜登临与怀古的地点，联系今北京一带的古燕国故地，常与燕昭王招贤的黄金台相联系。古台的具体地点有讨论，不将现存景观直接视为诗中原址。"}},{"id":"wangyue","title":"望岳·岱宗夫如何","author":"dufu","form":"五言律诗","stage":["初中"],"scene":"mountain","tags":["mountain","cloud","resolve","space","hyperbole","geo_taishan","geo_qilu"],"lines":["岱宗夫如何？","齐鲁青未了。","造化钟神秀，","阴阳割昏晓。","荡胸生曾云，","决眦入归鸟。","会当凌绝顶，","一览众山小。"],"quote":[3,4],"preface":"","intro":"还没有登顶，心已经向最高处走去。","notes":[{"q":"岱宗","text":"泰山尊称"},{"q":"造化","text":"自然"},{"q":"钟","text":"聚集"},{"q":"阴阳","text":"山北与山南"},{"q":"决眦","text":"张大眼睛，眦读zì"},{"q":"会当","text":"一定要"}],"background":"杜甫青年游齐鲁时所作《望岳》，所望为泰山。与晚年沉郁诗篇相比，此诗更显蓬勃的胸襟。","reading":[{"quote":"阴阳割昏晓","title":"一个动词写出山的力量","text":"“割”将山两侧的明暗差异写得鲜明，泰山像能分开晨昏，自然高度也具有震撼感。"},{"quote":"会当凌绝顶","title":"从仰望转向将来","text":"末联表达登临的愿望，并非说已经站在峰顶。视线向上推动心志，写景自然转入抱负。"}],"thought":"高山唤起人向上探索的愿望。诗中的昂扬来自面对未知时愿意攀登的心情。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_efec283b31e0.aspx","对照页所列异文或通假： 曾 同：层。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"dengfeilaifeng","reason":"沿着仰望、登临与换位观看，体会山怎样打开人的视野。"},{"id":"tixilinbi","reason":"沿着仰望、登临与换位观看，体会山怎样打开人的视野。"}],"extra":{"places":"岱宗 → 泰山｜今山东泰安。“岱宗”是泰山的尊称。\n\n齐、鲁｜泰山南北的历史文化地域，与今天山东省有关，但古国边界不等于现代省界。由“齐鲁青未了”到“一览众山小”，视线由远望走向登顶的想象。"}},{"id":"dengfeilaifeng","title":"登飞来峰","author":"wanganshi","form":"七言绝句","stage":["初中"],"scene":"mountain","tags":["mountain","cloud","resolve","reflection","space","geo_feilai"],"lines":["飞来山上千寻塔，","闻说鸡鸣见日升。","不畏浮云遮望眼，","自缘身在最高层。"],"quote":[1,2],"preface":"","intro":"站得更高一些，眼前的遮挡也会改变。","notes":[{"q":"寻","text":"古代长度单位"},{"q":"千寻","text":"夸张形容塔高"},{"q":"闻说","text":"听说"},{"q":"自缘","text":"自然是因为"}],"background":"王安石登飞来峰塔时所作，通常系于其青年时期。飞来峰具体地望有不同考订，诗意重在登高远望。","reading":[{"quote":"闻说鸡鸣见日升","title":"传闻让高塔接近天空","text":"千寻塔先写其高，再借鸡鸣见日的传说扩展想象，造成迎向光明的开阔感。"},{"quote":"不畏浮云遮望眼","title":"把位置写成认识的条件","text":"浮云既是景物，也可引出遮蔽视野的事物。“最高层”使自信有了空间依据。"}],"thought":"诗表达不被暂时遮挡困住的信心。它也提醒人，改变观看的位置，可能比反复盯着障碍更有帮助。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4a272f472fee.aspx","对照页所列异文或通假：飞来山 一作：飞来峰。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%8E%8B%E5%AE%89%E7%9F%B3","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"dengtaishanji","reason":"沿着仰望、登临与换位观看，体会山怎样打开人的视野。"},{"id":"wangyue","reason":"沿着仰望、登临与换位观看，体会山怎样打开人的视野。"}],"extra":{"places":"飞来峰｜题中登临的山峰。注释中有今浙江绍兴山峰说，也有杭州灵隐寺前飞来峰说，不能只因今天景点知名度便断定其一。诗以高塔、浮云展开视野与胸襟的思考。"}},{"id":"youshanxicun","title":"游山西村","author":"luyou","form":"七言律诗","stage":["初中"],"scene":"moon","tags":["nature","friendship","flower","willow","moon","hope","travel","geo_shaoxing"],"lines":["莫笑农家腊酒浑，","丰年留客足鸡豚。","山重水复疑无路，","柳暗花明又一村。","箫鼓追随春社近，","衣冠简朴古风存。","从今若许闲乘月，","拄杖无时夜叩门。"],"quote":[2,3],"preface":"","intro":"转过一重山水，遇见热情留客的人家。","notes":[{"q":"腊酒","text":"腊月酿的酒"},{"q":"鸡豚","text":"鸡和猪，泛指丰盛饭菜"},{"q":"春社","text":"春季祭土地神的节日"},{"q":"无时","text":"随时，没有一定时候"}],"background":"陆游退居山阴时游近村所作。山路、村俗与农家的款待相连，写出对淳朴生活的亲近。","reading":[{"quote":"山重水复疑无路","title":"转折发生在行走之中","text":"“疑”是人在途中一时的判断，“又”让新村忽然出现。实际山路经验因而也能触动人生感受。"},{"quote":"拄杖无时夜叩门","title":"最好的赞美是还想再来","text":"结尾不抽象夸奖乡村，而想象乘月再访，主人待客的温暖由回访愿望自然显出。"}],"thought":"风景的惊喜与人的善意共同构成旅途。诗的明朗不只在柳暗花明，也在愿意为来客打开的一扇门。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_09294abb5f67.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%99%86%E6%B8%B8","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"xingxiangzi","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"},{"id":"shuhuyinxianshengbi","reason":"从花木、水路与家居读田园，比较亲近自然的不同生活选择。"}],"extra":{"places":"山西村｜通行解释联系陆游山阴故乡一带的村落，今属浙江绍兴。“山西”在这里是村名、方位语境，不是今天的山西省；诗句不足以复原全部游村路线。"}},{"id":"taohuayuanji","title":"桃花源记","author":"taoyuanming","form":"古文·记","stage":["初中"],"scene":"water","tags":["flower","water","nature","hope","narrative","imagination","geo_wuling","geo_taoyuan","geo_nanyang"],"lines":["晋太元中，武陵人捕鱼为业。","缘溪行，忘路之远近。","忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。","渔人甚异之，复前行，欲穷其林。","林尽水源，便得一山，山有小口，仿佛若有光。","便舍船，从口入。","初极狭，才通人。","复行数十步，豁然开朗。","土地平旷，屋舍俨然，有良田、美池、桑竹之属。","阡陌交通，鸡犬相闻。","其中往来种作，男女衣着，悉如外人。","黄发垂髫，并怡然自乐。","见渔人，乃大惊，问所从来。","具答之。","便要还家，设酒杀鸡作食。","村中闻有此人，咸来问讯。","自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。","问今是何世，乃不知有汉，无论魏晋。","此人一一为具言所闻，皆叹惋。","余人各复延至其家，皆出酒食。","停数日，辞去。","此中人语云：“不足为外人道也。”","既出，得其船，便扶向路，处处志之。","及郡下，诣太守，说如此。","太守即遣人随其往，寻向所志，遂迷，不复得路。","南阳刘子骥，高尚士也，闻之，欣然规往。","未果，寻病终。","后遂无问津者。"],"quote":[11],"preface":"","intro":"顺着一条溪流，走进人们曾经向往的生活。","notes":[{"q":"缘","text":"沿着"},{"q":"鲜美","text":"鲜艳美丽"},{"q":"交通","text":"交错相通"},{"q":"妻子","text":"妻子和儿女"},{"q":"绝境","text":"与外界隔绝的地方"},{"q":"无论","text":"更不必说"},{"q":"志","text":"做记号"},{"q":"问津","text":"探问渡口，后指寻访"}],"background":"陶渊明《桃花源诗并记》中的“记”，通常系于东晋末至刘宋初。借渔人偶遇、离开与再寻的故事，构想远离战乱的社会。","reading":[{"quote":"黄发垂髫，并怡然自乐","title":"理想先落在人的生活里","text":"良田美池之后，文章写老人孩子的神情。桃源之好不只在风景，更在普通人能够安稳生活。"},{"quote":"遂迷，不复得路","title":"一处越想抓住越难找到的地方","text":"渔人处处标记，却无法重返；刘子骥也未能成行。结尾让桃源停留在愿望与现实的边界。"}],"thought":"故事珍惜和平、互助与自足的生活。桃源并非可按路线寻找的旅游地点，而是对现实不安的一次温柔而深刻的回应。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_73add8822103.aspx","对照页所列异文或通假：间隔 一作：隔绝。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%99%B6%E6%B8%8A%E6%98%8E","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"xiaoshitanji","reason":"同写居处与山水，比较自得、理想生活与幽寂中的身世感。"},{"id":"loushiming","reason":"同写居处与山水，比较自得、理想生活与幽寂中的身世感。"}],"extra":{"places":"武陵｜故事开始时的郡名，范围涉及今湖南常德等地，不能与今日单一城区完全重合。\n\n桃花源｜文学叙事中的理想世界。现实中有多处相关地名与景区，作品却以“不复得路”保留其不可寻访性。\n\n南阳｜刘子骥所属的古郡，范围与今天河南南阳市并不完全相同。"}},{"id":"xiaoshitanji","title":"小石潭记","author":"liuzongyuan","form":"古文·记","stage":["初中"],"scene":"water","tags":["water","bamboo","animal","quiet","solitude","motion","geo_yongzhou"],"lines":["从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。","伐竹取道，下见小潭，水尤清冽。","全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。","青树翠蔓，蒙络摇缀，参差披拂。","潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。","佁然不动，俶尔远逝，往来翕忽，似与游者相乐。","潭西南而望，斗折蛇行，明灭可见。","其岸势犬牙差互，不可知其源。","坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。","以其境过清，不可久居，乃记之而去。","同游者：吴武陵，龚古，余弟宗玄。","隶而从者，崔氏二小生，曰恕己，曰奉壹。"],"quote":[4],"preface":"","intro":"水清得像没有水，心却在停坐后慢慢变凉。","notes":[{"q":"篁竹","text":"竹林"},{"q":"清冽","text":"清澈而凉"},{"q":"可百许头","text":"大约一百条"},{"q":"佁然","text":"静止的样子"},{"q":"俶尔","text":"忽然"},{"q":"斗折蛇行","text":"像北斗星那样曲折，像蛇那样蜿蜒"},{"q":"悄怆","text":"忧伤貌"}],"background":"柳宗元贬居永州时所作，为“永州八记”之一。游踪从闻水寻潭推进到临潭静坐，心情也由欣喜转向幽寂。","reading":[{"quote":"皆若空游无所依","title":"不直说水，也能见水清","text":"以游鱼悬空般的状态和石上的鱼影衬托潭水透明，读者从物与影之间感到水的存在。"},{"quote":"以其境过清","title":"同一种清静有两种感受","text":"开始的清冽令人欢喜，久坐后的清寂却触动孤独。景物未必大变，人的处境改变了感受。"}],"thought":"山水能带来短暂欢悦，也会唤醒心底的寂寞。文章诚实保留情绪的转变，让美景与忧思同时成立。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_1ab58966cf83.aspx","对照页所列异文或通假：珮 一作：佩；下澈 一作：下彻。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9F%B3%E5%AE%97%E5%85%83","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"loushiming","reason":"同写居处与山水，比较自得、理想生活与幽寂中的身世感。"},{"id":"taohuayuanji","reason":"同写居处与山水，比较自得、理想生活与幽寂中的身世感。"}],"extra":{"places":"小石潭、永州｜柳宗元《永州八记》中的游览地点，在今湖南永州一带。作者从小丘向西走到潭边，水声、竹林、游鱼构成一条细小而鲜明的发现路径。"}},{"id":"hezhouji","title":"核舟记","author":"weixueyi","form":"古文·记","stage":["初中"],"scene":"mountain","tags":["art","narrative","space","action","reflection","geo_huangzhou","geo_changshu"],"lines":["明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。","尝贻余核舟一，盖大苏泛赤壁云。","舟首尾长约八分有奇，高可二黍许。","中轩敞者为舱，箬篷覆之。","旁开小窗，左右各四，共八扇。","启窗而观，雕栏相望焉。","闭之，则右刻“山高月小，水落石出”，左刻“清风徐来，水波不兴”，石青糁之。","船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。","苏、黄共阅一手卷。","东坡右手执卷端，左手抚鲁直背。","鲁直左手执卷末，右手指卷，如有所语。","东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。","佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。","卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。","舟尾横卧一楫。","楫左右舟子各一人。","居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。","居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。","其船背稍夷，则题名其上，文曰“天启壬戌秋日，虞山王毅叔远甫刻”，细若蚊足，钩画了了，其色墨。","又用篆章一，文曰“初平山人”，其色丹。","通计一舟，为人五；为窗八；为箬篷，为楫，为炉，为壶，为手卷，为念珠各一；对联、题名并篆文，为字共三十有四。","而计其长曾不盈寸。","盖简桃核修狭者为之。","嘻，技亦灵怪矣哉！"],"quote":[0],"preface":"","intro":"一枚桃核里，竟能容下一船人的神情。","notes":[{"q":"有奇","text":"有余，奇读jī"},{"q":"黍","text":"黍粒，用来比量微小尺度"},{"q":"糁","text":"涂染"},{"q":"不属","text":"不相类似"},{"q":"诎","text":"同“屈”"},{"q":"了了","text":"清楚"},{"q":"简","text":"挑选"}],"background":"魏学洢记述王叔远所雕核舟，后收入张潮编《虞初新志》。核舟表现“大苏泛赤壁”的艺术想象，不是现场纪实。","reading":[{"quote":"罔不因势象形","title":"先看见材料，也看见匠心","text":"文章从顺应木材形状说起，再逐处展示微雕，使精巧不仅意味着小，还意味着设计得当。"},{"quote":"若听茶声然","title":"静止雕像里生出声音","text":"作者由姿势神情想象舟子听茶，读者也因此看见人物的生活状态，而非只清点雕刻数量。"}],"thought":"精湛手艺能够把微小材料变成丰富世界。文章既赞工匠，也示范了耐心观看如何使艺术细节重新活起来。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_6acca7d24158.aspx","对照页所列异文或通假：箬篷 一作：篛篷。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%AD%8F%E5%AD%A6%E6%B4%A2","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"caoguilunzhan","reason":"留意叙事中的观察：转身、细看和追问怎样改变对事情的判断。"},{"id":"lang","reason":"留意叙事中的观察：转身、细看和追问怎样改变对事情的判断。"}],"extra":{"places":"赤壁｜核舟上表现的是苏轼泛舟游赤壁的题材，联系今湖北黄冈黄州赤壁；这是雕刻中的场景，不是本文作者现场游览的记录。\n\n虞山 → 常熟｜船背题款“虞山王毅叔远甫”标示雕刻者的籍贯关联，虞山在今江苏常熟，应与船上表现的赤壁分开理解。"}},{"id":"guanju","title":"关雎","author":"shijing","form":"四言诗","stage":["初中"],"scene":"water","tags":["water","love","folk","repetition","imagination"],"lines":["关关雎鸠，","在河之洲。","窈窕淑女，","君子好逑。","参差荇菜，","左右流之。","窈窕淑女，","寤寐求之。","求之不得，","寤寐思服。","悠哉悠哉，","辗转反侧。","参差荇菜，","左右采之。","窈窕淑女，","琴瑟友之。","参差荇菜，","左右芼之。","窈窕淑女，","钟鼓乐之。"],"quote":[0,1],"preface":"","intro":"一声水鸟的呼唤，牵出求而未得的心事。","notes":[{"q":"雎鸠","text":"一种水鸟"},{"q":"窈窕","text":"美好的样子"},{"q":"好逑","text":"好的配偶，逑读qiú"},{"q":"荇菜","text":"水生植物"},{"q":"寤寐","text":"醒着和睡着"},{"q":"思服","text":"思念"},{"q":"芼","text":"择取"}],"background":"《诗经·周南》首篇。围绕追求淑女展开，从求而不得到琴瑟钟鼓的想象；历代礼乐阐释很多，此处先从诗中情感读起。","reading":[{"quote":"关关雎鸠","title":"先听自然，再听人心","text":"以鸟鸣起兴，声音和成双意象引向人的爱慕，不必把每一景物都机械对应某个人。"},{"quote":"辗转反侧","title":"抽象思念有了身体姿态","text":"重章反复形成回环节奏，翻身难眠使追求未得的焦灼可感；后面的乐声则展开愿望。"}],"thought":"诗写倾慕、期待与难眠的心情。琴瑟钟鼓可以读作理想相会的想象，不必认定叙事已经实现圆满结局。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_4c5705b99143.aspx","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jianjia","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"},{"id":"yulinling","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"}],"extra":{}},{"id":"jianjia","title":"蒹葭","author":"shijing","form":"四言诗","stage":["初中"],"scene":"water","tags":["water","grass","love","solitude","repetition","autumn"],"lines":["蒹葭苍苍，","白露为霜。","所谓伊人，","在水一方。","溯洄从之，","道阻且长。","溯游从之，","宛在水中央。","蒹葭萋萋，","白露未晞。","所谓伊人，","在水之湄。","溯洄从之，","道阻且跻。","溯游从之，","宛在水中坻。","蒹葭采采，","白露未已。","所谓伊人，","在水之涘。","溯洄从之，","道阻且右。","溯游从之，","宛在水中沚。"],"quote":[1,2],"preface":"","intro":"那个人仿佛就在水边，却总隔着一步之遥。","notes":[{"q":"蒹葭","text":"芦苇"},{"q":"伊人","text":"那个人"},{"q":"溯洄","text":"逆流而上"},{"q":"溯游","text":"顺流而下"},{"q":"晞","text":"干"},{"q":"湄","text":"水岸"},{"q":"跻","text":"高、升高"},{"q":"沚","text":"水中小洲"}],"background":"《诗经·秦风》中的篇章。伊人的具体身份并未说明，后世形成爱情、求贤等多种读法，开放性正是其魅力之一。","reading":[{"quote":"白露为霜","title":"让追寻从朦胧中开始","text":"芦苇与露霜构成清冷水岸，景物不是精确地图，而为若近若远的追寻营造气息。"},{"quote":"宛在水中央","title":"重复却始终未能抵达","text":"三章只更换少数字词，路越走越多，伊人仍仿佛可见。反复使渴望延长，也使距离变得难以丈量。"}],"thought":"有些向往越追近越显遥远。诗让“未得”保持未得，读者可以把不同的人生牵念带入这片水光。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_15cd220102d6.aspx","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"wuti","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"},{"id":"guanju","reason":"循着相悦、追寻与离别读爱情，留意叙述者的选择和未说尽的心事。"}],"extra":{}},{"id":"shihaoli","title":"石壕吏","author":"dufu","form":"五言古诗","stage":["初中"],"scene":"mountain","tags":["war","family","sadness","compassion","narrative","contrast","geo_shihao","geo_yecheng","geo_heyang"],"lines":["暮投石壕村，","有吏夜捉人。","老翁逾墙走，","老妇出门看。","吏呼一何怒！","妇啼一何苦！","听妇前致词：三男邺城戍。","一男附书至，","二男新战死。","存者且偷生，","死者长已矣！","室中更无人，","惟有乳下孙。","有孙母未去，","出入无完裙。","老妪力虽衰，","请从吏夜归。","急应河阳役，","犹得备晨炊。","夜久语声绝，","如闻泣幽咽。","天明登前途，","独与老翁别。"],"quote":[4,5],"preface":"","intro":"一个夜晚的敲门声，揭开一家人的创伤。","notes":[{"q":"投","text":"投宿"},{"q":"逾","text":"越过"},{"q":"戍","text":"防守"},{"q":"新","text":"最近"},{"q":"乳下孙","text":"还在吃奶的孙子"},{"q":"老妪","text":"老妇"},{"q":"幽咽","text":"低微断续的哭声"}],"background":"杜甫安史之乱期间所作“三吏”之一。以投宿者的见闻写地方差役夜间征人，集中呈现战争对百姓的伤害。","reading":[{"quote":"吏呼一何怒","title":"对立的声音代替长篇评说","text":"怒呼与苦啼直接并置，权力与无助的反差即刻可闻。后文少写差役问话，更突出老妇被迫应答。"},{"quote":"独与老翁别","title":"用缺席交代结局","text":"老妇已被带走，诗不再明说；一个“独”字让天明后的空缺成为最沉重的证据。"}],"thought":"诗把战争中的家庭损失放在读者面前。老妇的承担既令人动容，更应让人看见使她别无选择的困境。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_93ac46de573f.aspx","对照页所列异文或通假：出门看 一作：出看门。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"maowuweiqiufengsuopoge","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"},{"id":"mulanshi","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"}],"extra":{"places":"石壕｜投宿与征役发生的村落，通常对应今河南三门峡陕州一带。\n\n邺城｜老妪说儿子从军的战场，在今河北临漳及河南安阳相邻区域的古城一带。\n\n河阳｜她打算随军去服役的地方，在今河南孟州一带。几处地名把一家人的遭遇连向战争前线。"}},{"id":"maowuweiqiufengsuopoge","title":"茅屋为秋风所破歌","author":"dufu","form":"七言古诗","stage":["初中"],"scene":"rain","tags":["wind","rain","autumn","family","compassion","narrative","geo_chengdu"],"lines":["八月秋高风怒号，","卷我屋上三重茅。","茅飞渡江洒江郊，","高者挂罥长林梢，","下者飘转沉塘坳。","南村群童欺我老无力，","忍能对面为盗贼。","公然抱茅入竹去，","唇焦口燥呼不得，","归来倚杖自叹息。","俄顷风定云墨色，","秋天漠漠向昏黑。","布衾多年冷似铁，","娇儿恶卧踏里裂。","床头屋漏无干处，","雨脚如麻未断绝。","自经丧乱少睡眠，","长夜沾湿何由彻！","安得广厦千万间，","大庇天下寒士俱欢颜！","风雨不动安如山。","呜呼！","何时眼前突兀见此屋，","吾庐独破受冻死亦足！"],"quote":[12,13],"preface":"","intro":"自己的屋顶漏雨时，仍想到天下受寒的人。","notes":[{"q":"挂罥","text":"挂住，罥读juàn"},{"q":"塘坳","text":"低洼水塘"},{"q":"俄顷","text":"一会儿"},{"q":"布衾","text":"布被"},{"q":"何由彻","text":"如何挨到天明"},{"q":"大庇","text":"广泛庇护"},{"q":"寒士","text":"贫寒读书人，此处关切可延伸至贫困者"}],"background":"杜甫成都草堂生活期间所作。诗从秋风卷茅、夜雨漏屋的具体困境，转向为贫寒之人寻求安居的愿望。","reading":[{"quote":"布衾多年冷似铁","title":"苦难从触觉进入","text":"旧被的硬冷、孩子踢破的里子与不断滴漏的雨连在一起，让贫困具有可以触摸的细节。"},{"quote":"安得广厦千万间","title":"由一间破屋想到众人的屋檐","text":"语气从叙事变为呼告，空间从个人草堂扩大到天下；愿望的宏大正由前文的切身痛楚生出。"}],"thought":"诗的胸怀不在于没有自己的苦，而在于经历苦后仍能想到别人。个人遭际因此通向对普遍安居的期待。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_8e9ecc95d6a4.aspx","对照页所列异文或通假：亦足 一作：意足。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%9C%E7%94%AB","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"shiwucongjunzheng","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"},{"id":"shihaoli","reason":"从归途、家庭和屋檐下看战争，留意大事件中的普通生活。"}],"extra":{"places":"成都草堂｜写作背景中的居处，在今四川成都浣花溪一带。正文未直接写城名；从自己茅屋漏雨想到天下寒士，是由一处居所向众人处境的展开。"}},{"id":"maitanweng","title":"卖炭翁","author":"baijuyi","form":"七言古诗","stage":["初中"],"scene":"snow","tags":["labor","compassion","snow","contrast","narrative","winter","newyuefu","geo_xian","geo_qinling"],"lines":["卖炭翁，","伐薪烧炭南山中。","满面尘灰烟火色，","两鬓苍苍十指黑。","卖炭得钱何所营？","身上衣裳口中食。","可怜身上衣正单，","心忧炭贱愿天寒。","夜来城外一尺雪，","晓驾炭车辗冰辙。","牛困人饥日已高，","市南门外泥中歇。","翩翩两骑来是谁？","黄衣使者白衫儿。","手把文书口称敕，","回车叱牛牵向北。","一车炭，","千余斤，","宫使驱将惜不得。","半匹红纱一丈绫，","系向牛头充炭直。"],"quote":[7,8],"preface":"","intro":"他希望天再冷些，只因为一车炭要换来温饱。","notes":[{"q":"何所营","text":"用来谋求什么"},{"q":"辗","text":"同“碾”，车轮压过"},{"q":"敕","text":"皇帝的命令"},{"q":"驱将","text":"赶着走"},{"q":"惜不得","text":"舍不得却无可奈何"},{"q":"直","text":"同“值”，价钱"}],"background":"白居易《新乐府》之一，题下注意旨为“苦宫市也”。通过卖炭老人的遭遇揭示借宫廷采购名义进行的掠夺。","reading":[{"quote":"心忧炭贱愿天寒","title":"一个反常愿望显出困境","text":"衣单本应盼暖，生计却迫使老人盼冷。诗不抽象讲贫苦，而让矛盾愿望说明处境。"},{"quote":"系向牛头充炭直","title":"结尾停在不公平的交换","text":"千余斤炭与少量纱绫相对，宫使的轻巧动作和老人一天的辛劳形成刺目反差。"}],"thought":"诗让容易被忽视的劳动者成为叙事中心。读者看见的不只是一位可怜老人，还有造成其无力处境的权力关系。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_2716dfb4d439.aspx","对照页所列异文或通假：红纱 一作：红绡。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E7%99%BD%E5%B1%85%E6%98%93","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"minnong","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"},{"id":"xiangcunsiyue","reason":"让目光从食物与田野回到劳作者，比较童趣、忙碌与现实关怀。"}],"extra":{"places":"南山、长安｜南山通常指长安以南的终南山，属今陕西秦岭；卖炭翁从山中把炭运往唐都长安，即今西安。“市南门外”是城中交易场景，不宜凭诗句直接套用今天的城门格局。"}},{"id":"songdongyangmashengxu","title":"送东阳马生序","author":"songlian","form":"古文·赠序","stage":["初中"],"scene":"mountain","tags":["learning","resolve","reflection","narrative","contrast","geo_dongyang","geo_nanjing"],"lines":["余幼时即嗜学。","家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。","天大寒，砚冰坚，手指不可屈伸，弗之怠。","录毕，走送之，不敢稍逾约。","以是人多以书假余，余因得遍观群书。","既加冠，益慕圣贤之道。","又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。","先达德隆望尊，门人弟子填其室，未尝稍降辞色。","余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。","故余虽愚，卒获有所闻。","当余之从师也，负箧曳屣行深山巨谷中。","穷冬烈风，大雪深数尺，足肤皲裂而不知。","至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。","寓逆旅，主人日再食，无鲜肥滋味之享。","同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。","盖余之勤且艰若此。","今虽耄老，未有所成，犹幸预君子之列，而承天子之宠光，缀公卿之后，日侍坐备顾问，四海亦谬称其氏名，况才之过于余者乎？","今诸生学于太学，","县官日有廪稍之供，","父母岁有裘葛之遗，","无冻馁之患矣；","坐大厦之下而诵诗书，","无奔走之劳矣；","有司业、博士为之师，","未有问而不告、求而不得者也；","凡所宜有之书，","皆集于此，","不必若余之手录，","假诸人而后见也。","其业有不精、德有不成者，非天质之卑，则心不若余之专耳，岂他人之过哉？","东阳马生君则，在太学已二年，流辈甚称其贤。","余朝京师，生以乡人子谒余，撰长书以为贽，辞甚畅达。","与之论辨，言和而色夷。","自谓少时用心于学甚劳，是可谓善学者矣。","其将归见其亲也，余故道为学之难以告之。","谓余勉乡人以学者，余之志也；诋我夸际遇之盛而骄乡人者，岂知予者哉？"],"quote":[14],"preface":"","intro":"翻书的快乐，曾让贫寒求学的路亮起来。","notes":[{"q":"假借","text":"借取"},{"q":"加冠","text":"古代男子成年行冠礼"},{"q":"叩问","text":"请教"},{"q":"俟","text":"等待"},{"q":"负箧曳屣","text":"背书箱、拖着鞋走"},{"q":"逆旅","text":"旅店"},{"q":"容臭","text":"香囊，臭读xiù"},{"q":"贽","text":"初见时所赠礼物"}],"background":"宋濂为东阳后学马君则所写赠序。先回忆自己借书、求师和旅居的艰苦，再对照太学条件，表达劝勉之意。","reading":[{"quote":"以中有足乐者","title":"精神兴趣改变比较的尺度","text":"衣着饮食不如同舍生，作者却由读书获得满足。内在所乐说明坚持的动力，不等于说贫困值得赞美。"},{"quote":"余故道为学之难以告之","title":"结尾说明回忆为何而写","text":"前面漫长的自述最终落到受赠者身上，使个人经历成为交流与鼓励，而非单纯陈列成就。"}],"thought":"文章珍惜主动求知与守信，也保留古代师生关系的时代印记。今天可理解其勤勉，同时不必照搬羞辱式教导或艰苦条件。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_6fb0a58e157c.aspx","对照页所列异文或通假：予 一作：余。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%AE%8B%E6%BF%82","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zhanggexing","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"},{"id":"shishuo","reason":"从不同年代的文字里，比较求知、思考与自我成长的关系。"}],"extra":{"places":"东阳｜马生的家乡，在今浙江金华东阳。\n\n京师、太学｜文章写于明初，所说京师是今江苏南京；太学为当时最高学府的称谓。这里不能把“京师”一概理解为北京。"}},{"id":"tiposhansihouchanyuan","title":"题破山寺后禅院","author":"changjian","form":"五言律诗","stage":["初中"],"scene":"water","tags":["mountain","flower","water","sound","quiet","motion","geo_changshu"],"lines":["清晨入古寺，","初日照高林。","竹径通幽处，","禅房花木深。","山光悦鸟性，","潭影空人心。","万籁此都寂，","但余钟磬音。"],"quote":[5,6],"preface":"","intro":"沿着小径走深一点，连心里的喧闹也安静了。","notes":[{"q":"禅房","text":"僧人修行居处"},{"q":"悦","text":"使愉悦"},{"q":"空","text":"使杂念消散"},{"q":"万籁","text":"各种声响"},{"q":"磬","text":"寺中打击乐器"}],"background":"常建游破山寺后禅院所作，破山寺在今江苏常熟。诗依游踪写清晨入寺到心境澄静的过程，传本有“竹径／曲径”等异文。","reading":[{"quote":"潭影空人心","title":"观看也改变观看者","text":"山光使鸟自在，潭影使人澄静，对偶将自然与心灵相连，写出由环境而来的感受变化。"},{"quote":"但余钟磬音","title":"一声响让寂静更深","text":"全诗并非走向绝对无声，悠远钟磬反而成为背景安静的尺度，余音留出沉思空间。"}],"thought":"诗写的是一段放下纷扰的体验。安静不是空白，而是能重新听见微小声音、感到心境变化。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_e2890c61279c.aspx","对照页所列异文或通假：竹 一作：曲；都寂 一作：俱寂；但余 一作：惟余。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E5%B8%B8%E5%BB%BA","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"zuiwengtingji","reason":"从重逢、清游与款待读人与环境的关系，热闹和安静各有情味。"},{"id":"jiangnanfengliguinian","reason":"从重逢、清游与款待读人与环境的关系，热闹和安静各有情味。"}],"extra":{"places":"破山寺｜今江苏常熟兴福寺，地近虞山。诗从清晨入寺写到后禅院，题中的古寺名为幽深的空间提供了现实依托。"}},{"id":"songyouren","title":"送友人","author":"libai","form":"五言律诗","stage":["初中"],"scene":"water","tags":["mountain","water","friendship","farewell","cloud","metaphor"],"lines":["青山横北郭，","白水绕东城。","此地一为别，","孤蓬万里征。","浮云游子意，","落日故人情。","挥手自兹去，","萧萧班马鸣。"],"quote":[4,5],"preface":"","intro":"挥手之后，连马的嘶鸣也像舍不得。","notes":[{"q":"郭","text":"外城"},{"q":"孤蓬","text":"离根飘飞的蓬草，比喻远行者"},{"q":"兹","text":"此、这里"},{"q":"班马","text":"离群的马"}],"background":"李白送友人远行之作，确切写作时地说法不一。诗由城外景色转到离别心意，最终落在挥手与马鸣。","reading":[{"quote":"浮云游子意","title":"两幅景象对应两种心情","text":"浮云漂泊像游子的行踪，落日迟留像故人的依依。对偶把难以说尽的情意化成可见风景。"},{"quote":"萧萧班马鸣","title":"不说难舍，让声音收尾","text":"诗到挥手即可结束，却再留一阵马鸣，人的不舍仿佛由动物回应，余情因而更长。"}],"thought":"祝愿朋友远行与舍不得朋友离开，可以同时存在。诗用开阔景色包容深厚而克制的离情。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_c348339f28fd.aspx","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E6%9D%8E%E7%99%BD","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"furonglousongxinjian","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"},{"id":"songdushaofuzhirenshuzhou","reason":"都是送朋友远行，比较劝酒、凝望与开口宽慰的不同方式。"}],"extra":{}},{"id":"bosuanzi","title":"卜算子·黄州定慧院寓居作","author":"sushi","form":"词","stage":["初中"],"scene":"moon","tags":["moon","animal","solitude","resolve","night","aspiration","geo_huangzhou"],"lines":["缺月挂疏桐，漏断人初静。","谁见幽人独往来，缥缈孤鸿影。","惊起却回头，有恨无人省。","拣尽寒枝不肯栖，寂寞沙洲冷。"],"quote":[1],"preface":"","intro":"夜里无处安栖的孤鸿，像一个不愿将就的人。","notes":[{"q":"漏断","text":"漏壶计时已深，指夜深"},{"q":"幽人","text":"幽居之人"},{"q":"缥缈","text":"若隐若现"},{"q":"省","text":"理解，读xǐng"},{"q":"栖","text":"停息、栖居"}],"background":"苏轼贬居黄州初期寓居定慧院时所作，题中保留其处境。词把幽人与孤鸿互相映照，不必将每句都一一坐实为传记事件。","reading":[{"quote":"谁见幽人独往来","title":"人影与鸟影相叠","text":"缺月疏桐先铺冷寂背景，孤独的人随即化入孤鸿般的影子，咏物与自况边界变得柔和。"},{"quote":"拣尽寒枝不肯栖","title":"孤独也包含自己的选择","text":"“拣尽”写寻找，“不肯”写坚持，冷清处境中仍保有不愿随意安身的主动性。"}],"thought":"词写失意者的孤独与自守。理解其中的清高，也可以看见一个人渴望被理解、却难寻归处的脆弱。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_c1a07129a6d3.aspx","对照页所列异文或通假：谁见 一作：时见。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E8%8B%8F%E8%BD%BC","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"bosuanzi-114","reason":"同读孤清景象中的自守，留意渔翁、孤鸿和梅花各自的姿态。"},{"id":"jiangxue","reason":"同读孤清景象中的自守，留意渔翁、孤鸿和梅花各自的姿态。"}],"extra":{"places":"黄州、定慧院｜词题直接交代寓居地点，在今湖北黄冈黄州。词中的孤鸿并非另一处地名，而是与寓居者处境互相映照的形象。"}},{"id":"bosuanzi-114","title":"卜算子·咏梅","author":"luyou","form":"词","stage":["初中"],"scene":"rain","tags":["flower","wind","rain","solitude","resolve","aspiration"],"lines":["驿外断桥边，寂寞开无主。","已是黄昏独自愁，更着风和雨。","无意苦争春，一任群芳妒。","零落成泥碾作尘，只有香如故。"],"quote":[1],"preface":"","intro":"花落成泥，香气仍是它自己的。","notes":[{"q":"驿","text":"古代传递公文者途中休息的处所"},{"q":"无主","text":"无人照管"},{"q":"更着","text":"又遭受"},{"q":"一任","text":"任凭"},{"q":"如故","text":"与从前一样"}],"background":"陆游借梅花自况的咏物词。与毛泽东同调同题的作品不同，本篇首句为“驿外断桥边”。","reading":[{"quote":"已是黄昏独自愁","title":"层层加深花的处境","text":"地点偏僻、无人照料、时近黄昏，又遭风雨，困境逐层叠加，使后半阕的坚持更有分量。"},{"quote":"只有香如故","title":"把最重要的留到最后","text":"零落、成泥、作尘不断压低形体，香气却未改变。物性成为人格象征，结尾简短而坚定。"}],"thought":"词珍惜不因处境变化而放弃的内在品格。梅的孤独并不轻松，正因如此，保持自我的愿望才显得动人。","sources":["原文对照：https://www.gushiwen.cn/shiwenv_2523dc7baa84.aspx","对照页所列异文或通假：着 同：著。正文与旁注分开呈现，异文不混入原文。","作者资料参阅：https://www.gushiwen.cn/authorv.aspx?name=%E9%99%86%E6%B8%B8","文字整理：原文按所列公开文本核对，标点、繁简与分行作阅读整理；注释、导读与赏析为山月编写。2026-11-16。"],"related":[{"id":"jiangxue","reason":"同读孤清景象中的自守，留意渔翁、孤鸿和梅花各自的姿态。"},{"id":"bosuanzi","reason":"同读孤清景象中的自守，留意渔翁、孤鸿和梅花各自的
